[metadata]
tier = "standard"
name = "source-control"
version = "1.22.0"
description = "Source control management - Gitea lightweight Git server"
vendor = "gitea"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://dl.gitea.io/gitea/1.22.0/gitea-1.22.0-linux-amd64.xz"

[runtime]
entrypoint = ["/usr/local/bin/gitea"]
cmd = ["web", "-c", "/etc/gitea/app.ini"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "Source control management - Gitea lightweight Git server"
"org.opencontainers.image.source" = "https://about.gitea.com/"
"org.opencontainers.image.title" = "source-control"
"org.opencontainers.image.vendor" = "Gitea"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.wolfi" = "true"
"evergreen.health.type" = "http"
"evergreen.image.category" = "scm"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
