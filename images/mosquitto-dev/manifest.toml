[metadata]
tier = "standard"
name = "mosquitto-dev"
version = "unknown"
description = "Eclipse Mosquitto MQTT broker - development mode"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["mosquitto"]
cmd = ["-c", "/app/mosquitto.conf", "-v"]

[ports]
expose = [1883, 9101]

[labels]
"org.opencontainers.image.description" = "Eclipse Mosquitto MQTT broker - development mode"
"org.opencontainers.image.source" = "https://github.com/eclipse/mosquitto"
"org.opencontainers.image.title" = "mosquitto-dev"
"org.opencontainers.image.vendor" = "Eclipse"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
