[metadata]
name = "gitea"
version = "1.21.10"
description = "Gitea - lightweight self-hosted Git service"
vendor = "Gitea"
source = "https://github.com/go-gitea/gitea"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "git"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/gitea/gitea/releases/download/v1.21.10/gitea-1.21.10-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/gitea"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.title" = "gitea"
"org.opencontainers.image.vendor" = "Gitea"
"org.opencontainers.image.version" = "1.21.10"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.wolfi" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

