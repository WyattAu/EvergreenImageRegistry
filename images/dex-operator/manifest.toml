[metadata]
name = "dex-operator"
version = "0.18.0"
description = "dex-operator container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/dexidp/dex-operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/dex-operator"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/dexidp/dex-operator"
"org.opencontainers.image.title" = "dex-operator"
"org.opencontainers.image.vendor" = "DexIDP"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "identity"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

