[metadata]
name = "kanidm"
version = "latest"
description = "kanidm container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/kanidm/kanidm:${VERSION}"

[runtime]
entrypoint = ["/kanidm"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/kanidm/kanidm"
"org.opencontainers.image.title" = "kanidm"
"org.opencontainers.image.vendor" = "Kanidm"
"org.opencontainers.image.version" = "1.9.2"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "identity"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

