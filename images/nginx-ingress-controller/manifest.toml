[metadata]
tier = "standard"
name = "nginx-ingress-controller"
version = "1.10.1"
description = "nginx-ingress-controller container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"
multiarch = false

[source]
type = "package-manager"

[runtime]
entrypoint = ["/nginx-ingress-controller"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/kubernetes/ingress-nginx"
"org.opencontainers.image.title" = "nginx-ingress-controller"
"org.opencontainers.image.vendor" = "Kubernetes"
"org.opencontainers.image.version" = "1.10.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "5000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
