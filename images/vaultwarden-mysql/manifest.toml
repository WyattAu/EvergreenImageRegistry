[metadata]
tier = "standard"
name = "vaultwarden-mysql"
version = "1.35.8"
description = "vaultwarden-mysql container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "vaultwarden/server:1.35.8"

[runtime]
entrypoint = ["/usr/local/bin/vaultwarden"]
cmd = ["--database-url", "mysql://user:pass@host/db"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/dani-garcia/vaultwarden"
"org.opencontainers.image.title" = "vaultwarden-mysql"
"org.opencontainers.image.vendor" = "dani-garcia"
"org.opencontainers.image.version" = "1.35.8"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "secrets"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
