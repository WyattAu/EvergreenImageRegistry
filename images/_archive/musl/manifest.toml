[metadata]
tier = "standard"
name = "musl"
version = "unknown"
description = "Evergreen musl-based static base for C/C++ compilation targets"

[build]
base = "cgr.dev/chainguard/static:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "base-image"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen musl-based static base for C/C++ compilation targets"
"org.opencontainers.image.title" = "musl"
"evergreen.base.image" = "wolfi"
"evergreen.health.type" = "none"
"evergreen.image.category" = "base"
"evergreen.image.note" = "Musl libc base for static binary builds. Use for Rust/C++ static targets."
"evergreen.image.status" = "reference"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
