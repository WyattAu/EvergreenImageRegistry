[metadata]
name = "rust-static"
version = "1.78.0"
description = "Rust static compilation base image with Rust toolchain for x86_64"
vendor = "rust-lang"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://static.rust-lang.org/dist/rust-1.78.0-x86_64-unknown-linux-gnu.tar.xz"

[runtime]
entrypoint = ["/opt/rust/bin/rustc"]
cmd = ["--version"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened rust-static - Rust static compilation base"
"org.opencontainers.image.source" = "https://www.rust-lang.org/"
"org.opencontainers.image.title" = "rust-static"
"org.opencontainers.image.vendor" = "Rust"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.category" = "build-tool"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

