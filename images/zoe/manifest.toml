[metadata]
tier = "standard"
name = "zoe"
version = "unknown"
description = "zoe container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/cgr.dev/chainguard/wolfi-base"
[ports]
expose = [9101]

[labels]
"evergreen.base.image" = "wolfi"
"evergreen.health.type" = "exec"
"evergreen.metrics.native" = "ztunnel"

"evergreen.image.tier" = "standard"