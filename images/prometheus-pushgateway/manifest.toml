[metadata]
name = "prometheus-pushgateway"
version = "1.8.0"
description = "Prometheus Pushgateway - intermediary service for metrics push"
vendor = "Prometheus"
source = "https://github.com/prometheus/pushgateway"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/prometheus-pushgateway/prometheus-pushgateway/releases/download/v1.8.0/prometheus-pushgateway-1.8.0-linux-amd64.tar.gz"
binary_name = "prometheus-pushgateway"
filename = "prometheus-pushgateway-1.8.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9091
metrics = 9101

[labels]
"org.opencontainers.image.title" = "prometheus-pushgateway"
"org.opencontainers.image.description" = "Prometheus Pushgateway - intermediary service for metrics push"
"org.opencontainers.image.version" = "1.8.0"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.source" = "https://github.com/prometheus/pushgateway"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
