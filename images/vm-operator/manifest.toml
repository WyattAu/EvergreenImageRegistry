[metadata]
name = "vm-operator"
version = "0.45.0"
description = "Sovereign hardened VictoriaMetrics Operator - Kubernetes operator for VictoriaMetrics"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/victoriametrics/operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/vm-operator"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened VictoriaMetrics Operator - Kubernetes operator for VictoriaMetrics"
"org.opencontainers.image.title" = "vm-operator"
"org.opencontainers.image.vendor" = "VictoriaMetrics"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "monitoring"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

