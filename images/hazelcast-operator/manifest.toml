[metadata]
name = "hazelcast-operator"
version = "5.15.0"
description = "Sovereign hardened Hazelcast Platform Operator - Kubernetes operator for Hazelcast"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/hazelcast/hazelcast-platform-operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/hazelcast-platform-operator"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Hazelcast Platform Operator - Kubernetes operator for Hazelcast"
"org.opencontainers.image.title" = "hazelcast-operator"
"org.opencontainers.image.vendor" = "Hazelcast"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

