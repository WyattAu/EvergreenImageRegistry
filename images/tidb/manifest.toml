[metadata]
name = "tidb"
version = "8.4.0"
description = "TiDB - distributed NewSQL database compatible with MySQL"
vendor = "PingCAP"
source = "https://github.com/pingcap/tidb"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "pingcap/tidb:${VERSION}"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/tidb/tidb/releases/download/v8.4.0/tidb-8.4.0-linux-amd64.tar.gz"
binary_name = "tidb"
filename = "tidb-8.4.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 4000
metrics = 9101

[labels]
"org.opencontainers.image.title" = "tidb"
"org.opencontainers.image.description" = "TiDB - distributed NewSQL database compatible with MySQL"
"org.opencontainers.image.version" = "8.4.0"
"org.opencontainers.image.vendor" = "PingCAP"
"org.opencontainers.image.source" = "https://github.com/pingcap/tidb"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
