[metadata]
tier = "standard"
name = "virtuoso"
version = "7.2.12"
description = "Evergreen hardened Virtuoso - universal RDF/graph database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/tenforce/virtuoso"
[runtime]
entrypoint = ["virtuoso-t", "-f", "-c", "/etc/virtuoso/virtuoso.ini"]

[ports]
expose = [1111, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Virtuoso - universal RDF/graph database"
"org.opencontainers.image.title" = "virtuoso"
"org.opencontainers.image.vendor" = "OpenLink Software"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
