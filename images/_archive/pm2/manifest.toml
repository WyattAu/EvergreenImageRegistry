[metadata]
tier = "standard"
name = "pm2"
version = "5.4.0"
description = "pm2 container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]

[ports]
expose = [0, 9101]

[labels]
"org.opencontainers.image.title" = "pm2"
"org.opencontainers.image.vendor" = "PM2"
"org.opencontainers.image.version" = "5.4.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
