[metadata]
tier = "standard"
name = "x86_64-unknown-linux-musl"
version = "unknown"
description = "Evergreen Rust static build base for x86_64-unknown-linux-musl target"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen Rust static build base for x86_64-unknown-linux-musl target"
"org.opencontainers.image.title" = "x86_64-unknown-linux-musl"
"evergreen.base.image" = "wolfi"
"evergreen.health.type" = "none"
"evergreen.image.category" = "base"
"evergreen.image.note" = "Rust static compilation base. Use for cargo build --target x86_64-unknown-linux-musl."
"evergreen.image.status" = "reference"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
