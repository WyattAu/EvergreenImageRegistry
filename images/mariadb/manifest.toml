[metadata]
name = "mariadb"
version = "11.4.2"
description = "MariaDB - community-developed fork of MySQL"
vendor = "MariaDB Foundation"
source = "https://github.com/MariaDB/server"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/mariadb/mariadb/releases/download/v11.4.2/mariadb-11.4.2-linux-amd64.tar.gz"
binary_name = "mariadb"
filename = "mariadb-11.4.2-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 3306
metrics = 9101

[labels]
"org.opencontainers.image.title" = "mariadb"
"org.opencontainers.image.description" = "MariaDB - community-developed fork of MySQL"
"org.opencontainers.image.version" = "11.4.2"
"org.opencontainers.image.vendor" = "MariaDB Foundation"
"org.opencontainers.image.source" = "https://github.com/MariaDB/server"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "true"
"sovereign.health.type" = "http"
