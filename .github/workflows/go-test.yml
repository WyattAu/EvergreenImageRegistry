name: Go Tests
on:
  push:
    branches: [main]
    paths:
      - 'images/health-shim/**'
  pull_request:
    paths:
      - 'images/health-shim/**'

concurrency:
  group: go-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/health-shim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -race -count=1 ./...
      - name: Build (static)
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o /dev/null .
