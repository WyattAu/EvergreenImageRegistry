[metadata]
name = "collabora-online-code"
version = "24.04.10.2"
description = "collabora-online-code container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/bin/loolwsd"]

[ports]
expose = [9980, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/CollaboraOnline/online"
"org.opencontainers.image.title" = "collabora-online-code"
"org.opencontainers.image.vendor" = "Collabora"
"org.opencontainers.image.version" = "24.04.10.2"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "30s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "60000ms"
"sovereign.image.category" = "document-management"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

