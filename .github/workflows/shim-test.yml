# =============================================================================
# SHIM FUNCTIONALITY TESTS
# =============================================================================
# Builds 3 sample images and validates shim health check + metrics endpoints.
# Triggers on push to main when images/ or crates/ change.
# =============================================================================

name: Shim Functionality Tests

on:
  push:
    branches: [main]
    paths:
      - 'images/health-shim/**'
      - 'images/tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'images/health-shim/**'
      - 'images/tests/**'
  workflow_dispatch:

concurrency:
  group: shim-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io/wyattau/evergreenimageregistry

jobs:
  # ---------------------------------------------------------------------------
  # Build and test 3 sample images
  # ---------------------------------------------------------------------------
  shim-test:
    name: Shim Functionality Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nginx
            port: 80
          - image: redis
            port: 6379
          - image: grafana
            port: 3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build shim images locally
        run: |
          # Read shim version from .shim-version
          SHIM_VERSION=$(cat .shim-version | tr -d '[:space:]')
          echo "Building shim version: ${SHIM_VERSION}"

          # Build health-shim and tag as the remote reference consumers expect
          docker build -t ghcr.io/wyattau/evergreenshim/health-shim:${SHIM_VERSION} \
            images/health-shim/
          # Also tag as cache-shim for redis (same binary, different config)
          docker tag ghcr.io/wyattau/evergreenshim/health-shim:${SHIM_VERSION} \
            ghcr.io/wyattau/evergreenshim/cache-shim:${SHIM_VERSION}
          # Also tag as latest for backward compat
          docker tag ghcr.io/wyattau/evergreenshim/health-shim:${SHIM_VERSION} \
            ghcr.io/wyattau/evergreenshim/health-shim:latest

      - name: Build image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ matrix.image }}:test \
            images/${{ matrix.image }}/

      - name: Start container
        run: |
          docker run -d \
            --name test-${{ matrix.image }} \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            -p 9101:9101 \
            ${{ env.REGISTRY }}/${{ matrix.image }}:test
          sleep 10

      - name: Verify container is running
        run: |
          docker ps --format '{{.Names}}' | grep -q "test-${{ matrix.image }}"
          echo "Container test-${{ matrix.image }} is running"

      - name: Test healthcheck
        run: |
          docker exec test-${{ matrix.image }} /shim healthcheck \
            --tcp 127.0.0.1:${{ matrix.port }} && echo "Healthcheck PASSED" || \
          docker exec test-${{ matrix.image }} /usr/local/bin/shim healthcheck \
            --tcp 127.0.0.1:${{ matrix.port }} && echo "Healthcheck PASSED"

      - name: Test metrics endpoint
        run: |
          RESPONSE=$(curl -sf http://localhost:9101/metrics 2>/dev/null || echo "")
          if [ -n "${RESPONSE}" ]; then
            echo "Metrics endpoint PASSED"
            echo "${RESPONSE}" | head -20
          else
            echo "Metrics endpoint FAILED"
            exit 1
          fi

      - name: Test liveness endpoint
        run: |
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:9101/livez 2>/dev/null || echo "000")
          if [ "${STATUS}" = "200" ]; then
            echo "Liveness endpoint PASSED (HTTP ${STATUS})"
          else
            echo "Liveness endpoint FAILED (HTTP ${STATUS})"
            exit 1
          fi

      - name: Collect logs on failure
        if: failure()
        run: docker logs test-${{ matrix.image }} 2>&1 | tail -50

      - name: Cleanup
        if: always()
        run: docker rm -f test-${{ matrix.image }} 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Aggregate result
  # ---------------------------------------------------------------------------
  all-pass:
    name: All Shim Tests Passed
    needs: shim-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.shim-test.result }}" = "success" ]; then
            echo "All shim functionality tests passed"
          else
            echo "Some shim tests failed"
            exit 1
          fi
