name: Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/smoke_test.sh'
  pull_request:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/smoke_test.sh'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [critical]
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      
      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh --tier ${{ matrix.tier }}
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-results-${{ matrix.tier }}
          path: smoke-test-results/
          retention-days: 7

  static-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Validate all Dockerfiles
        run: |
          echo "Validating all Dockerfiles..."
          PASS=0
          FAIL=0
          
          for df in images/*/Dockerfile; do
            [[ -f "$df" ]] || continue
            [[ "$df" == *"_wip"* || "$df" == *"_archive"* ]] && continue
            
            name=$(basename $(dirname "$df"))
            content=$(cat "$df")
            errors=""
            
            # Check FROM
            if ! echo "$content" | grep -q "^FROM "; then
              errors="$errors No FROM"
            fi
            
            # Check USER
            if ! echo "$content" | grep -q "USER 65532\|USER 65534\|USER nobody"; then
              errors="$errors No USER"
            fi
            
            # Check HEALTHCHECK (skip scratch)
            if ! echo "$content" | grep -q "FROM scratch" && ! echo "$content" | grep -q "HEALTHCHECK"; then
              errors="$errors No HEALTHCHECK"
            fi
            
            # Check ENTRYPOINT/CMD
            if ! echo "$content" | grep -q "ENTRYPOINT\|CMD "; then
              errors="$errors No ENTRYPOINT/CMD"
            fi
            
            if [[ -n "$errors" ]]; then
              echo "FAIL: $name -$errors"
              FAIL=$((FAIL + 1))
            else
              PASS=$((PASS + 1))
            fi
          done
          
          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          
          if [[ $FAIL -gt 0 ]]; then
            exit 1
          fi

  constraint-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
      
      - name: Run constraint validation
        run: |
          cargo run --manifest-path evergreenctl/Cargo.toml -- validate images
      
      - name: Verify C003 compliance
        run: |
          python3 -c "
          from pathlib import Path
          passed = 0
          failed = 0
          for df in Path('images').glob('*/Dockerfile'):
              if '_wip' in str(df) or '_archive' in str(df):
                  continue
              content = df.read_text()
              if any(u in content for u in ['USER 65532', 'USER 65534', 'USER nobody']):
                  passed += 1
              else:
                  failed += 1
                  print(f'FAIL: {df.parent.name}')
          print(f'C003: {passed}/{passed+failed} PASS')
          if failed > 0:
              exit(1)
          "
      
      - name: Validate wolfi variants
        run: |
          echo "Validating all wolfi variants..."
          PASS=0
          FAIL=0
          
          for df in images/*/Dockerfile.wolfi; do
            [[ -f "$df" ]] || continue
            name=$(basename $(dirname "$df"))
            content=$(cat "$df")
            errors=""
            
            if ! echo "$content" | grep -q "^FROM "; then
              errors="$errors No FROM"
            fi
            if ! echo "$content" | grep -q "USER 65532\|USER 65534\|USER nobody"; then
              errors="$errors No USER"
            fi
            if ! echo "$content" | grep -q "HEALTHCHECK"; then
              errors="$errors No HEALTHCHECK"
            fi
            if ! echo "$content" | grep -q "ENTRYPOINT\|CMD "; then
              errors="$errors No ENTRYPOINT/CMD"
            fi
            
            if [[ -n "$errors" ]]; then
              echo "FAIL: $name -$errors"
              FAIL=$((FAIL + 1))
            else
              PASS=$((PASS + 1))
            fi
          done
          
          echo "Wolfi variants: $PASS passed, $FAIL failed"
          if [[ $FAIL -gt 0 ]]; then
            exit 1
          fi
