[metadata]
name = "mosquitto"
version = "2.0.20"
description = "Mosquitto - lightweight MQTT message broker"
vendor = "Eclipse"
source = "https://github.com/eclipse-mosquitto/mosquitto"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/mosquitto/mosquitto/releases/download/v2.0.20/mosquitto-2.0.20-linux-amd64.tar.gz"

[runtime]
entrypoint = ["mosquitto"]
cmd = ["-c", "/app/mosquitto.conf"]

[ports]
expose = [1883, 9101]

[labels]
"org.opencontainers.image.description" = "Eclipse Mosquitto MQTT broker"
"org.opencontainers.image.source" = "https://github.com/eclipse/mosquitto"
"org.opencontainers.image.title" = "mosquitto"
"org.opencontainers.image.vendor" = "Eclipse"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

