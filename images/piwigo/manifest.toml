[metadata]
tier = "standard"
name = "piwigo"
version = "14.5.0"
description = "piwigo container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "www-data"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.title" = "piwigo"
"org.opencontainers.image.vendor" = "Piwigo"
"org.opencontainers.image.version" = "14.5.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
