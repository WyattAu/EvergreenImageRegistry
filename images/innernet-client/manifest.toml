[metadata]
name = "innernet-client"
version = "latest"
description = "innernet peer/client daemon (WireGuard-based)"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/innernet-rs/innernet:${VERSION}"

[runtime]
entrypoint = ["/innernet"]
cmd = ["up", "--daemon"]

[ports]
expose = [51820/udp, 9101]

[labels]
"org.opencontainers.image.description" = "innernet peer/client daemon (WireGuard-based)"
"org.opencontainers.image.source" = "https://github.com/innernet-rs/innernet"
"org.opencontainers.image.title" = "innernet-client"
"org.opencontainers.image.vendor" = "innernet-rs"
"org.opencontainers.image.version" = "0.16.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "networking"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

