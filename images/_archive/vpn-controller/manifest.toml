[metadata]
tier = "standard"
name = "vpn-controller"
version = "1.0.20210914"
description = "WireGuard-based VPN management controller"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/app/vpn-controller"]

[ports]
expose = [51820, 9101]

[labels]
"org.opencontainers.image.description" = "WireGuard-based VPN management controller"
"org.opencontainers.image.source" = "https://git.zx2c4.com/wireguard-tools/"
"org.opencontainers.image.title" = "vpn-controller"
"org.opencontainers.image.vendor" = "WireGuard"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
