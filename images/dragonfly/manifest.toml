[metadata]
name = "dragonfly"
version = "1.18.0"
description = "Dragonfly - in-memory data store compatible with Redis and Memcached"
vendor = "Dragonfly"
source = "https://github.com/dragonflydb/dragonfly"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/dragonfly/dragonfly/releases/download/v1.18.0/dragonfly-1.18.0-linux-amd64.tar.gz"
binary_name = "dragonfly"
filename = "dragonfly-1.18.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 6379
metrics = 9101

[labels]
"org.opencontainers.image.title" = "dragonfly"
"org.opencontainers.image.description" = "Dragonfly - in-memory data store compatible with Redis and Memcached"
"org.opencontainers.image.version" = "1.18.0"
"org.opencontainers.image.vendor" = "Dragonfly"
"org.opencontainers.image.source" = "https://github.com/dragonflydb/dragonfly"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
