[metadata]
tier = "standard"
name = "openvpn"
version = "2.6.10"
description = "openvpn container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "appuser"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/openvpn"]

[ports]
expose = [1194, 9101]

[labels]
"org.opencontainers.image.title" = "openvpn"
"org.opencontainers.image.vendor" = "OpenVPN"
"org.opencontainers.image.version" = "2.6.10"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.wolfi" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
