[metadata]
name = "druid"
version = "37.0.0"
description = "Evergreen hardened Apache Druid - real-time analytics database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "apache/druid:${VERSION}"

[runtime]
entrypoint = ["/opt/druid/bin/start-druid"]

[ports]
expose = [8088, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Apache Druid - real-time analytics database"
"org.opencontainers.image.title" = "druid"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "29.0.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

