[metadata]
name = "jellyfin"
version = "10.11.8"
description = "Jellyfin - free software media system"
vendor = "Jellyfin"
source = "https://github.com/jellyfin/jellyfin"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/jellyfin/jellyfin/releases/download/v10.11.8/jellyfin-10.11.8-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/app/jellyfin"]

[ports]
expose = [8096, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/jellyfin/jellyfin"
"org.opencontainers.image.title" = "jellyfin"
"org.opencontainers.image.vendor" = "Jellyfin"
"org.opencontainers.image.version" = "10.11.8"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.official" = "true"
"evergreen.health.type" = "none"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
