[metadata]
name = "libreoffice"
version = "24.8.2"
description = "libreoffice container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["libreoffice"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://www.libreoffice.org/"
"org.opencontainers.image.title" = "libreoffice"
"org.opencontainers.image.vendor" = "LibreOffice"
"org.opencontainers.image.version" = "24.8.2"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "10s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "30000ms"
"sovereign.image.category" = "document-management"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

