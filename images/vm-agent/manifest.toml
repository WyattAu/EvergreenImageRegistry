[metadata]
tier = "standard"
name = "vm-agent"
version = "1.140.0"
description = "vm-agent container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/victoriametrics/vmagent"
[runtime]
entrypoint = ["/vmagent"]

[ports]
expose = [8429, 9101]

[labels]
"org.opencontainers.image.title" = "vm-agent"
"org.opencontainers.image.vendor" = "VictoriaMetrics"
"org.opencontainers.image.version" = "1.140.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
