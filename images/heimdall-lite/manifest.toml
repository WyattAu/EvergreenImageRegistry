[metadata]
name = "heimdall-lite"
version = "unknown"
description = "Heimdall - lite mode"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]
cmd = ["/app/src/server.js", "--lite"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "Heimdall - lite mode"
"org.opencontainers.image.source" = "https://github.com/linuxserver/Heimdall"
"org.opencontainers.image.title" = "heimdall-lite"
"org.opencontainers.image.vendor" = "LinuxServer.io"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

