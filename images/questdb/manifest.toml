[metadata]
name = "questdb"
version = "7.3.10"
description = "QuestDB - time-series SQL database"
vendor = "QuestDB"
source = "https://github.com/questdb/questdb"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/questdb/questdb/releases/download/v7.3.10/questdb-7.3.10-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/questdb/bin/questdb.sh", "start", "-d"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened QuestDB - high-performance time-series database"
"org.opencontainers.image.title" = "questdb"
"org.opencontainers.image.vendor" = "QuestDB"
"org.opencontainers.image.version" = "7.3.10"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
