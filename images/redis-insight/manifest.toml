[metadata]
name = "redis-insight"
version = "2.54.0"
description = "RedisInsight - visualization and management tool for Redis"
vendor = "Redis"
source = "https://github.com/RedisInsight/RedisInsight"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/redis-insight/redis-insight/releases/download/v2.54.0/redis-insight-2.54.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/redisinsight/redisinsight"]

[ports]
expose = [8001, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened RedisInsight - visual Redis management and monitoring tool"
"org.opencontainers.image.title" = "redis-insight"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "observability"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

