[metadata]
name = "langserve"
version = "0.3.0"
description = "langserve container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/langchain-ai/langserve"
"org.opencontainers.image.title" = "langserve"
"org.opencontainers.image.vendor" = "LangServe"
"org.opencontainers.image.version" = "0.3.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

