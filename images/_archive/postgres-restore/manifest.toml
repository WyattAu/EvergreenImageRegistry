[metadata]
tier = "standard"
name = "postgres-restore"
version = "17"
description = "PostgreSQL Restore Container with pg_restore + xz support"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/app/restore.sh"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "PostgreSQL Restore Container with pg_restore + xz support"
"org.opencontainers.image.title" = "postgres-restore"
"org.opencontainers.image.vendor" = "PostgreSQL"
"org.opencontainers.image.version" = "17"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
