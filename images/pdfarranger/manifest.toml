[metadata]
name = "pdfarranger"
version = "1.12.2"
description = "pdfarranger container image"

[build]
base = "debian:bookworm-slim"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python", "-m", "pdfarranger"]
cmd = ["--help"]

[ports]
expose = [9101]

