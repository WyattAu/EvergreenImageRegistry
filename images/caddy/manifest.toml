[metadata]
name = "caddy"
version = "2.7.6"
description = "Caddy - powerful enterprise-ready open source web server"
vendor = "Caddy"
source = "https://github.com/caddyserver/caddy"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/caddy/caddy/releases/download/v2.7.6/caddy-2.7.6-linux-amd64.tar.gz"
binary_name = "caddy"
filename = "caddy-2.7.6-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 80
metrics = 9101

[labels]
"org.opencontainers.image.title" = "caddy"
"org.opencontainers.image.description" = "Caddy - powerful enterprise-ready open source web server"
"org.opencontainers.image.version" = "2.7.6"
"org.opencontainers.image.vendor" = "Caddy"
"org.opencontainers.image.source" = "https://github.com/caddyserver/caddy"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
