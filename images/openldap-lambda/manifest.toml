[metadata]
tier = "standard"
name = "openldap-lambda"
version = "unknown"
description = "OpenLDAP client tools for lambda-compatible environments"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/bin/ldapsearch"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "OpenLDAP client tools for lambda-compatible environments"
"org.opencontainers.image.source" = "https://www.openldap.org"
"org.opencontainers.image.title" = "openldap-lambda"
"org.opencontainers.image.vendor" = "OpenLDAP"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "identity"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
