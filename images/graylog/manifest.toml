[metadata]
name = "graylog"
version = "5.1.5"
description = "Sovereign hardened Graylog - centralized log management platform"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/graylog/bin/graylogctl"]
cmd = ["run"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Graylog - centralized log management platform"
"org.opencontainers.image.title" = "graylog"
"org.opencontainers.image.vendor" = "Graylog"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "15s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "60000ms"
"sovereign.image.category" = "observability"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

