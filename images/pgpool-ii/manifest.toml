[metadata]
tier = "standard"
name = "pgpool-ii"
version = "4.5.1"
description = "pgpool-ii container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "pgpool"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["pgpool"]

[ports]
expose = [9999, 9101]

[labels]
"org.opencontainers.image.title" = "pgpool-II"
"org.opencontainers.image.vendor" = "PgPool"
"org.opencontainers.image.version" = "4.5.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
