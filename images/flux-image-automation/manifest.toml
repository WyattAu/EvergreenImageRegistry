[image]
name = "flux-image-automation"
type = "container-image"
tier = 2
version = "1.1.2"
description = "Flux Image Automation Controller - automated container image updates for GitOps"
vendor = "fluxcd"
source_url = "https://github.com/fluxcd/image-automation-controller"
category = "gitops"

[source]
url = "ghcr.io/fluxcd/image-automation-controller:v1.1.2"
fallback_urls = []
checksum = { algorithm = "sha256", expected = "PENDING", source = "" }
strategy = "copy-from"
github_repo = "fluxcd/image-automation-controller"

[build]
base = { image = "ghcr.io/fluxcd/image-automation-controller:v1.1.2", purpose = "upstream" }
builder_packages = []
runtime_packages = []
build_commands = []
artifacts = [
  { source = "/image-automation-controller", destination = "/usr/local/bin/image-automation-controller" },
]

[runtime]
user = "65532:65532"
workdir = "/app"
entrypoint = ["/usr/local/bin/image-automation-controller"]
cmd = []
ports = [8080]
volumes = []
stop_signal = "SIGTERM"

[health]
type = "http"
path = "/healthz"
port = 8080
interval_seconds = 30
timeout_seconds = 5
retries = 3

[observability]
metrics_port = 9101
metrics_path = "/metrics"

[compliance]
standards = []
labels = {}
