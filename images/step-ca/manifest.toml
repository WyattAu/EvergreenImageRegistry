[metadata]
name = "step-ca"
version = "0.30.2"
description = "Step CA - private certificate authority for automated PKI"
vendor = "Smallstep"
source = "https://github.com/smallstep/certificates"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/smallstep/certificates/releases/download/v0.30.2/step-ca_0.30.2_linux_amd64.tar.gz"
binary_name = "step-ca"
filename = "step-ca_0.30.2_linux_amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9000
metrics = 9101

[labels]
"org.opencontainers.image.title" = "step-ca"
"org.opencontainers.image.description" = "Step CA - private certificate authority for automated PKI"
"org.opencontainers.image.version" = "0.30.2"
"org.opencontainers.image.vendor" = "Smallstep"
"org.opencontainers.image.source" = "https://github.com/smallstep/certificates"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
