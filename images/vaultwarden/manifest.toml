[metadata]
name = "vaultwarden"
version = "1.35.8"
description = "Vaultwarden - lightweight Bitwarden-compatible password manager"
vendor = "Vaultwarden"
source = "https://github.com/dani-garcia/vaultwarden"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "vaultwarden/server:1.35.8"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/vaultwarden/vaultwarden/releases/download/v1.35.8/vaultwarden-1.35.8-linux-amd64.tar.gz"
binary_name = "vaultwarden"
filename = "vaultwarden-1.35.8-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 8080
metrics = 9101

[labels]
"org.opencontainers.image.title" = "vaultwarden"
"org.opencontainers.image.description" = "Vaultwarden - lightweight Bitwarden-compatible password manager"
"org.opencontainers.image.version" = "1.35.8"
"org.opencontainers.image.vendor" = "Vaultwarden"
"org.opencontainers.image.source" = "https://github.com/dani-garcia/vaultwarden"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
