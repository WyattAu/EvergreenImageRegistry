[metadata]
tier = "standard"
name = "valkey-exporter"
version = "1.58.0"
description = "Valkey/Redis Prometheus Exporter"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/valkey-exporter"]

[ports]
expose = [9121, 9101]

[labels]
"org.opencontainers.image.description" = "Valkey/Redis Prometheus Exporter"
"org.opencontainers.image.source" = "https://github.com/oliver006/redis_exporter"
"org.opencontainers.image.title" = "valkey-exporter"
"org.opencontainers.image.vendor" = "oliver006"
"org.opencontainers.image.version" = "1.58.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
