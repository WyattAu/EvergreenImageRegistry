[metadata]
name = "kafka"
version = "3.6.1"
description = "Apache Kafka - distributed event streaming platform"
vendor = "Apache"
source = "https://github.com/apache/kafka"
license = "Apache-2.0"
tier = "1"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/kafka/kafka/releases/download/v3.6.1/kafka-3.6.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["sh", "-c", "/opt/kafka/bin/kafka-server-start.sh"]

[ports]
expose = [9092, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Apache Kafka - distributed event streaming platform"
"org.opencontainers.image.title" = "kafka"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.health.type" = "http"
"evergreen.image.category" = "messaging"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "true"

