[metadata]
tier = "standard"
name = "openjdk-alpine"
version = "21-slim"
description = "Evergreen hardened openjdk-alpine - JRE runtime (no Alpine, debian-slim)"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["java"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened openjdk-alpine - JRE runtime (no Alpine, debian-slim)"
"org.opencontainers.image.title" = "openjdk-alpine"
"org.opencontainers.image.vendor" = "Eclipse Adoptium"
"org.opencontainers.image.version" = "21"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "30s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

