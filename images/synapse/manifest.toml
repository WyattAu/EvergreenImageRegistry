[metadata]
name = "synapse"
version = "latest"
description = "Synapse - Matrix homeserver"
vendor = "Matrix.org Foundation"
source = "https://github.com/element-hq/synapse"
license = "AGPL-3.0-only"
tier = "standard"
upstream_version = "latest"

[build]
base = "wolfi-base"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "docker.io/matrixdotorg/synapse:latest"

[runtime]
entrypoint = ["/usr/local/bin/shim", "run"]

[ports]
expose = [8008, 9101]

[labels]
"org.opencontainers.image.title" = "synapse"
"org.opencontainers.image.vendor" = "Matrix.org Foundation"
"org.opencontainers.image.version" = "latest"
"org.opencontainers.image.source" = "https://github.com/element-hq/synapse"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.base" = "wolfi"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "30s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "messaging"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
