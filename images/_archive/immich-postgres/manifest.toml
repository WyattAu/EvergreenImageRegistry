[metadata]
name = "immich-postgres"
version = "16.6"
description = "PostgreSQL 16 with pgvector extension for Immich"
vendor = "Immich"
source = "https://github.com/pgvector/pgvector"
license = "PostgreSQL"
tier = "critical"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "source-build"
url = "https://github.com/pgvector/pgvector/archive/refs/tags/v0.8.0.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/shim", "run", "-c", "postgres"]
cmd = ["-D", "/var/lib/postgresql/data"]

[ports]
expose = [5432, 9101]

[labels]
"org.opencontainers.image.title" = "immich-postgres"
"org.opencontainers.image.description" = "PostgreSQL 16 with pgvector extension for Immich"
"org.opencontainers.image.vendor" = "Immich"
"org.opencontainers.image.version" = "16.6"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
