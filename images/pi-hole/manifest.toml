[metadata]
name = "pi-hole"
version = "5.18.2"
description = "Pi-hole - network-level ad blocking via your own Linux hardware"
vendor = "Pi-hole"
source = "https://github.com/pi-hole/pi-hole"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/pi-hole/pi-hole/releases/download/v5.18.2/pi-hole-5.18.2-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/pihole"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.description" = "Network-level ad blocking via DNS"
"org.opencontainers.image.source" = "https://github.com/pi-hole/pi-hole"
"org.opencontainers.image.title" = "pi-hole"
"org.opencontainers.image.vendor" = "Pi-hole"
"org.opencontainers.image.version" = "bookworm"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "15000ms"
"sovereign.image.category" = "dns"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

