[image]
name = "dotdns"
version = "0.1.0"
description = "DotDNS - DNS-over-TLS proxy server (stub - upstream repo not found)"
vendor = "nicich"
homepage = "https://github.com/nicich/dotdns"
category = "dns"
tier = 1

[source]
type = "inline-stub"
url = ""
upstream = ""

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
target_base = "scratch"

[constraints]
nonroot = true
scratch = true

[hft]
signal-handling = "native"
shutdown-timeout = "3s"

[ports]
dns = 53
web = 8053
metrics = 9101

[health]
type = "exec"
