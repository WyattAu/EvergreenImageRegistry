[metadata]
name = "ntfy"
version = "2.11.0"
description = "ntfy - push notification service"
vendor = "binwiederhier"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/binwiederhier/ntfy/releases/download/v2.11.0/ntfy_2.11.0_linux_amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/ntfy"]
cmd = ["serve"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "ntfy - push notification service"
"org.opencontainers.image.source" = "https://github.com/binwiederhier/ntfy"
"org.opencontainers.image.title" = "ntfy"
"org.opencontainers.image.vendor" = "ntfy"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "http"
"sovereign.image.category" = "notifications"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

