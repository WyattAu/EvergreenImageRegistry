[metadata]
name = "opensearch"
version = "2.12.0"
description = "OpenSearch - community-driven search and analytics engine"
vendor = "AWS"
source = "https://github.com/opensearch-project/opensearch"
license = "Apache-2.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/opensearch/opensearch/releases/download/v2.12.0/opensearch-2.12.0-linux-amd64.tar.gz"
binary_name = "opensearch"
filename = "opensearch-2.12.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 9200
metrics = 9101

[labels]
"org.opencontainers.image.title" = "opensearch"
"org.opencontainers.image.description" = "OpenSearch - community-driven search and analytics engine"
"org.opencontainers.image.version" = "2.12.0"
"org.opencontainers.image.vendor" = "AWS"
"org.opencontainers.image.source" = "https://github.com/opensearch-project/opensearch"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "true"
"sovereign.health.type" = "http"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "30s"
