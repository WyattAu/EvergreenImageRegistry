[metadata]
tier = "standard"
name = "clamav"
version = "unknown"
description = "ClamAV - open source antivirus engine"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["clamd"]
cmd = ["--foreground"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "ClamAV - open source antivirus engine"
"org.opencontainers.image.title" = "clamav"
"org.opencontainers.image.vendor" = "Cisco"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
