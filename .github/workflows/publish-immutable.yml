name: Publish Immutable Tags
on:
  push:
    tags:
      - 'v*'
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual push)'
        required: false
        default: 'false'

concurrency:
  group: publish-immutable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Build and push immutable tag
        run: |
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/${{ github.repository }}:${{ env.VERSION }} \
            --tag ghcr.io/${{ github.repository }}:latest \
            --cache-from type=gha \
            .
      - name: Sign immutable tag
        if: ${{ !inputs.dry_run }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign with keyless OIDC
        if: ${{ !inputs.dry_run }}
        run: |
          cosign sign --yes \
            --certificate-identity="${{ github.repository_owner }}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
        env:
          COSIGN_EXPERIMENTAL: '1'

  latest-ttl:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Delete :latest tag (enforce rebuild)
        run: |
          echo "WARNING: This removes the :latest tag to ensure it gets rebuilt"
          curl -s -X DELETE \
            "https://api.github.com/user/packages/container/${{ github.event.repository.name }}/versions/latest" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" || echo "Could not delete :latest"
