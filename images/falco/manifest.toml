[metadata]
name = "falco"
version = "0.38.3"
description = "Falco - cloud-native runtime security monitoring"
vendor = "CNCFSys"
source = "https://github.com/falcosecurity/falco"
license = "Apache-2.0"
tier = "1"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/falcosecurity/falco/releases/download/v0.38.3/falco-0.38.3-x86_64.tar.gz"

[runtime]
entrypoint = ["falco"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Falco - Cloud native runtime security"
"org.opencontainers.image.source" = "https://github.com/falcosecurity/falco"
"org.opencontainers.image.title" = "falco"
"org.opencontainers.image.vendor" = "Sysdig"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

