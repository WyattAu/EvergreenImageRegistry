[metadata]
name = "graylog-sidecar"
version = "RUN"
description = "Sovereign hardened Graylog Sidecar - log collector management agent"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/sidecar/collector_sidecar"]

[ports]
expose = [8989, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Graylog Sidecar - log collector management agent"
"org.opencontainers.image.title" = "graylog-sidecar"
"org.opencontainers.image.vendor" = "Graylog"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "observability"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

