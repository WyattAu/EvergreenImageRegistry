[metadata]
tier = "standard"
name = "chkrootkit"
version = "unknown"
description = "chkrootkit - rootkit detector"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/chkrootkit/chkrootkit"
[runtime]
entrypoint = ["chkrootkit"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "chkrootkit - rootkit detector"
"org.opencontainers.image.title" = "chkrootkit"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
