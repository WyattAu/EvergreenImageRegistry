[metadata]
tier = "standard"
name = "newsblur"
version = "0.1.0"
description = "WIP - Django/Python app requiring PostgreSQL, Redis, MongoDB"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "github"

[runtime]
entrypoint = ["true"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "WIP - Django/Python app requiring PostgreSQL, Redis, MongoDB. Too complex for single Dockerfile."
"org.opencontainers.image.title" = "newsblur"
"org.opencontainers.image.vendor" = "NewsBlur"
"org.opencontainers.image.version" = "0.1.0"
"org.opencontainers.image.source" = "https://github.com/samuelclay/NewsBlur"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"


status = "wip"
