name: SBOM Attestation
on:
  workflow_run:
    workflows: ['Build Hardened Images']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  attestations: write
  packages: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download image references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: built-image-references
          path: /tmp/references/
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true
      - name: Attest SBOMs
        run: |
          if [ ! -f /tmp/references/images.txt ]; then
            echo "No image references found, skipping attestation"
            exit 0
          fi
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            echo "Attesting SBOM for ${ref}..."
            cosign attest --yes \
              --predicate sbom.spdx.json \
              --type spdxjson \
              "${ref}" 2>&1 || echo "WARN: SBOM attestation failed for ${ref}"
          done < /tmp/references/images.txt
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
