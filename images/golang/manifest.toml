[metadata]
tier = "standard"
name = "golang"
version = "1.22.3"
description = "golang container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["go"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "go-1.23"
"org.opencontainers.image.vendor" = "Go"
"org.opencontainers.image.version" = "1.22.3"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
