# =============================================================================
# SOVEREIGN HARDENED IMAGE REGISTRY - NIGHTLY SECURITY & FRESHNESS SCAN
# =============================================================================
# Scheduled pipeline for nightly security and freshness monitoring.
# Complements daily-security-scan.yml with additional checks:
#   - Base image freshness verification
#   - Sovereign checksum verification
#   - Wolfi base image digest tracking
#
# Schedule: Daily at 03:00 UTC (before daily-security-scan at 06:00 UTC)
# Manual:   workflow_dispatch for on-demand execution
# =============================================================================

name: Nightly Security & Freshness Scan

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-scan-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  version-check:
    name: Version & CVE Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install sovereignctl
        run: |
          cd sovereignctl && cargo build --release && sudo ln -sf $(pwd)/target/release/sovereignctl /usr/local/bin/

      - name: Check for outdated images
        run: |
          echo "=== Checking for outdated images ==="
          sovereignctl outdated --all
          echo "=== Version freshness check complete ==="

      - name: Check for new CVEs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  checksum-freshness:
    name: Sovereign Checksum Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install sovereignctl
        run: |
          cd sovereignctl && cargo build --release && sudo ln -sf $(pwd)/target/release/sovereignctl /usr/local/bin/

      - name: Verify all checksums
        run: |
          echo "=== Sovereign Checksum Verification ==="
          sovereignctl verify-all || true
          echo "=== Checksum verification complete ==="

  base-image-refresh:
    name: Base Image Digest Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check wolfi base image digest
        run: |
          echo "Checking current wolfi base image digest..."
          DIGEST=$(skopeo inspect docker://cgr.dev/chainguard/wolfi-base:latest --format '{{.Digest}}' 2>/dev/null || echo "skopeo not available")
          echo "Current wolfi-base digest: ${DIGEST}"
          echo "To auto-refresh: update FROM lines in affected Dockerfiles"
