[metadata]
tier = "standard"
name = "milvus-etcd"
version = "3.5.17"
description = "Milvus etcd sidecar - delegates to etcd"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["etcd"]

[ports]
expose = [2379, 9101]

[labels]
"org.opencontainers.image.description" = "Milvus etcd sidecar - delegates to etcd"
"org.opencontainers.image.title" = "milvus-etcd"
"org.opencontainers.image.vendor" = "etcd"
"org.opencontainers.image.version" = "3.5.17"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.status" = "reference"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
