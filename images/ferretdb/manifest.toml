[metadata]
tier = "standard"
name = "ferretdb"
version = "2.7.0"
description = "Evergreen hardened FerretDB - MongoDB-compatible database"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/ferretdb"]

[ports]
expose = [27017, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened FerretDB - MongoDB-compatible database"
"org.opencontainers.image.title" = "ferretdb"
"org.opencontainers.image.vendor" = "FerretDB"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
