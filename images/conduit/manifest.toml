[metadata]
name = "conduit"
version = "0.4.0"
description = "Conduit - lightweight Matrix homeserver written in Rust"
vendor = "Famedly"
source = "https://gitlab.com/famedly/conduit"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://gitlab.com/api/v4/projects/famedly%2Fconduit/packages/generic/conduit-v0.9.x/v0.9.5/conduit-x86_64-unknown-linux-musl"

[runtime]
entrypoint = ["/usr/local/bin/conduit"]

[ports]
expose = [6167, 9101]

[labels]
"org.opencontainers.image.description" = "Conduit - lightweight Matrix homeserver written in Rust"
"org.opencontainers.image.source" = "https://gitlab.com/famedly/conduit"
"org.opencontainers.image.title" = "conduit"
"org.opencontainers.image.vendor" = "Famedly"
"org.opencontainers.image.version" = "0.9.5"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

