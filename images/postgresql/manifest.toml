[metadata]
name = "postgresql"
version = "17.4"
description = "PostgreSQL - advanced open source relational database"
vendor = "PostgreSQL"
source = "https://github.com/postgres/postgres"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/postgresql/postgresql/releases/download/v17.4/postgresql-17.4-linux-amd64.tar.gz"
binary_name = "postgresql"
filename = "postgresql-17.4-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 5432
metrics = 9101

[labels]
"org.opencontainers.image.title" = "postgresql"
"org.opencontainers.image.description" = "PostgreSQL - advanced open source relational database"
"org.opencontainers.image.version" = "17.4"
"org.opencontainers.image.vendor" = "PostgreSQL"
"org.opencontainers.image.source" = "https://github.com/postgres/postgres"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "true"
"sovereign.health.type" = "http"
