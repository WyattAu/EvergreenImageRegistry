[metadata]
name = "immich"
version = "1.106.0"
description = "Immich - self-hosted photo and video backup solution"
vendor = "Immich"
source = "https://github.com/immich-app/immich"
license = "Apache-2.0"
tier = "critical"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "immich"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/immich/immich/releases/download/v1.106.0/immich-1.106.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["node"]

[ports]
expose = [2283, 9101]

[labels]
"org.opencontainers.image.title" = "immich"
"org.opencontainers.image.vendor" = "Immich"
"org.opencontainers.image.version" = "1.106.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
