[metadata]
name = "jellyseer"
version = "3.2.0"
description = "jellyseer container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "fallenbagel/jellyseerr:3.2.0"

[runtime]
entrypoint = ["/jellyseerr"]

[ports]
expose = [5055, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/Fallenbagel/jellyseerr"
"org.opencontainers.image.title" = "jellyseer"
"org.opencontainers.image.vendor" = "Jellyseerr"
"org.opencontainers.image.version" = "v3.2.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.base" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "10000ms"
"evergreen.image.category" = "media-streaming"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

