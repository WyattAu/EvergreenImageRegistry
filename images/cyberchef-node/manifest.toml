[metadata]
tier = "standard"
name = "cyberchef-node"
version = "unknown"
description = "CyberChef - Node.js variant"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/node"
[runtime]
entrypoint = ["node", "CyberChef.js"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "CyberChef - Node.js variant"
"org.opencontainers.image.source" = "https://github.com/gchq/CyberChef"
"org.opencontainers.image.title" = "cyberchef-node"
"org.opencontainers.image.vendor" = "GCHQ"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
