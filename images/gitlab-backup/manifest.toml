[metadata]
name = "gitlab-backup"
version = "4.6.0"
description = "GitLab Backup - backup tooling for GitLab instances"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/backup"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "GitLab Backup - backup tooling for GitLab instances"
"org.opencontainers.image.source" = "https://github.com/satoru-tsuji/gitlab-backup-cli"
"org.opencontainers.image.title" = "gitlab-backup"
"org.opencontainers.image.vendor" = "Community"
"org.opencontainers.image.version" = "4.6.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.debian-slim" = "true"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

