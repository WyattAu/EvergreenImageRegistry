[metadata]
name = "kube-bench"
version = "0.8.0"
description = "Kube-bench - checks whether Kubernetes is deployed securely"
vendor = "Aqua Security"
source = "https://github.com/aquasecurity/kube-bench"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/kube-bench/kube-bench/releases/download/v0.8.0/kube-bench-0.8.0-linux-amd64.tar.gz"
binary_name = "kube-bench"
filename = "kube-bench-0.8.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
metrics = 9101

[labels]
"org.opencontainers.image.title" = "kube-bench"
"org.opencontainers.image.description" = "Kube-bench - checks whether Kubernetes is deployed securely"
"org.opencontainers.image.version" = "0.8.0"
"org.opencontainers.image.vendor" = "Aqua Security"
"org.opencontainers.image.source" = "https://github.com/aquasecurity/kube-bench"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
