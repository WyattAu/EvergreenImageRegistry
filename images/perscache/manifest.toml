[metadata]
name = "perscache"
version = "1.0.0"
description = "Sovereign hardened PersCache - persistent cache library binary"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/perscache"]

[ports]
expose = [8429, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened PersCache - persistent cache library binary"
"org.opencontainers.image.title" = "perscache"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

