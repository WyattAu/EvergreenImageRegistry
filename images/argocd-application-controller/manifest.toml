[metadata]
name = "argocd-application-controller"
version = "2.12.6"
description = "ArgoCD Application Controller - manages application lifecycle and synchronization"
vendor = "Argo Project"
source = "https://github.com/argoproj/argo-cd"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/argoproj/argo-cd/releases/download/v2.12.6/argocd-linux-amd64"
binary_name = "argocd-application-controller"
filename = "argocd-linux-amd64"
checksum = "efecedeb09f07b09ad4457467ceb103e1269004f34f7420a531372b13122fd2b"

[constraints]
nonroot = true
scratch = true

[ports]
application = 8082
metrics = 9101

[labels]
"org.opencontainers.image.title" = "argocd-application-controller"
"org.opencontainers.image.description" = "ArgoCD Application Controller - manages application lifecycle"
"org.opencontainers.image.version" = "2.12.6"
"org.opencontainers.image.vendor" = "Argo Project"
"org.opencontainers.image.source" = "https://github.com/argoproj/argo-cd"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
