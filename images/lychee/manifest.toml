[metadata]
tier = "standard"
name = "lychee"
version = "4.17.0"
description = "lychee container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/lscr.io/linuxserver/lychee"
[runtime]
entrypoint = ["php"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/LycheeOrg/Lychee/releases"
"org.opencontainers.image.title" = "lychee"
"org.opencontainers.image.vendor" = "LycheeOrg/Lychee"
"org.opencontainers.image.version" = "4.17.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
