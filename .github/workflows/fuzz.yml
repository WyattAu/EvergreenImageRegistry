name: Fuzz
on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'images/health-shim/**'
  pull_request:
    branches: [main]
    paths:
      - 'images/health-shim/**'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22'
      - name: Install Go fuzzing tools
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/google/go-fuzz/cmd/go-fuzz@latest
      - name: Fuzz health-shim
        working-directory: images/health-shim
        run: |
          go test -fuzz=Fuzz -fuzztime=60s ./...
        continue-on-error: true
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-crashes
          path: images/health-shim/testdata/fuzz/
