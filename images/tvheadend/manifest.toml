[metadata]
name = "tvheadend"
version = "4.3"
description = "tvheadend container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["tvheadend"]

[ports]
expose = [9981, 9101]

[labels]
"org.opencontainers.image.title" = "tvheadend"
"org.opencontainers.image.vendor" = "TVHeadend"
"org.opencontainers.image.version" = "4.3"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

