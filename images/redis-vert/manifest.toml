[metadata]
tier = "standard"
name = "redis-vert"
version = "7.4.2"
description = "Redis with vector search (RediSearch) on Wolfi"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["redis-stack-server"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.description" = "Redis with vector search (RediSearch) on Wolfi"
"org.opencontainers.image.title" = "redis-vert"
"org.opencontainers.image.vendor" = "Redis"
"org.opencontainers.image.version" = "7.4.2"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

