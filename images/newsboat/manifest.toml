[metadata]
name = "newsboat"
version = "2.30"
description = "newsboat container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["newsboat"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "newsboat"
"org.opencontainers.image.vendor" = "Newsboat"
"org.opencontainers.image.version" = "2.30"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

