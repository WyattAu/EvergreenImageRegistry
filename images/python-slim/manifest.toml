[metadata]
name = "python-slim"
version = "3.12"
description = "python-slim container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["sleep", "infinity"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "python-slim"
"evergreen.base.image" = "wolfi"

