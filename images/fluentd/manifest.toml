[metadata]
tier = "standard"
name = "fluentd"
version = "1.17.1"
description = "Fluentd - unified logging layer (CNCF graduated project)"
vendor = "CNCF"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://rubygems.org/gems/fluentd-1.17.1.gem"

[runtime]
entrypoint = ["/usr/local/bin/fluentd", "-c", "/fluentd/etc/fluent.conf"]

[ports]
expose = [24224, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Fluentd - unified logging layer with Ruby runtime"
"org.opencontainers.image.source" = "https://github.com/fluent/fluentd"
"org.opencontainers.image.title" = "fluentd"
"org.opencontainers.image.vendor" = "CNCF"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "logging"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
