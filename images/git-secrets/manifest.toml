[metadata]
name = "git-secrets"
version = "unknown"
description = "AWS Git Secrets - prevent secret commits"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["git-secrets"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "AWS Git Secrets - prevent secret commits"
"org.opencontainers.image.source" = "https://github.com/awslabs/git-secrets"
"org.opencontainers.image.title" = "git-secrets"
"org.opencontainers.image.vendor" = "AWS Labs"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

