[metadata]
name = "redis-sentinel"
version = "7.4.1"
description = "Redis Sentinel - high availability for Redis"
vendor = "Redis"
source = "https://github.com/redis/redis"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/redis-sentinel/redis-sentinel/releases/download/v7.4.1/redis-sentinel-7.4.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/redis", "--sentinel"]

[ports]
expose = [26379, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Redis Sentinel - Redis high availability sentinel mode"
"org.opencontainers.image.title" = "redis-sentinel"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
