[metadata]
tier = "standard"
name = "piper"
version = "1.2.0"
description = "piper container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/piper"]

[ports]
expose = [6666, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/rhasspy/piper/releases"
"org.opencontainers.image.title" = "piper"
"org.opencontainers.image.vendor" = "rhasspy/piper"
"org.opencontainers.image.version" = "1.2.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
