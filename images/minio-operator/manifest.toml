[metadata]
name = "minio-operator"
version = "v6.0.4"
description = "MinIO Operator - Kubernetes operator for MinIO"
vendor = "MinIO"
source = "https://github.com/minio/operator"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/minio-operator/minio-operator/releases/download/v6.0.4/minio-operator-6.0.4-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/minio-operator"]

[ports]
expose = [4455, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/minio/operator"
"org.opencontainers.image.title" = "minio-operator"
"org.opencontainers.image.vendor" = "MinIO"
"org.opencontainers.image.version" = "v6.0.4"
"evergreen.base.image" = "scratch"
"evergreen.constraint.base" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "10000ms"
"evergreen.image.category" = "cloud-storage"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

