[metadata]
name = "vector"
version = "0.39.0"
description = "Vector - high-performance observability data pipeline"
vendor = "Datadog"
source = "https://github.com/vectordotdev/vector"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/vectordotdev/vector/releases/download/v0.39.0/vector-x86_64-unknown-linux-gnu.tar.gz"
binary_name = "vector"
filename = "vector-x86_64-unknown-linux-gnu.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9001
metrics = 9101

[labels]
"org.opencontainers.image.title" = "vector"
"org.opencontainers.image.description" = "Vector - high-performance observability data pipeline"
"org.opencontainers.image.version" = "0.39.0"
"org.opencontainers.image.vendor" = "Datadog"
"org.opencontainers.image.source" = "https://github.com/vectordotdev/vector"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
