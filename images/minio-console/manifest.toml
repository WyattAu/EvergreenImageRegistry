[metadata]
name = "minio-console"
version = "RELEASE.2025-10-15T17-29-55Z"
description = "MinIO Console - web-based administration UI for MinIO"
vendor = "MinIO"
source = "https://github.com/minio/console"
license = "Apache-2.0"
tier = "2"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "minio/minio:RELEASE.2025-10-15T17-29-55Z"

[runtime]
entrypoint = ["/minio"]
cmd = ["console", "server"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/minio/minio"
"org.opencontainers.image.title" = "minio-console"
"org.opencontainers.image.vendor" = "MinIO"
"org.opencontainers.image.version" = "RELEASE.2025-10-15T17-29-55Z"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "10000ms"
"sovereign.image.category" = "cloud-storage"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

