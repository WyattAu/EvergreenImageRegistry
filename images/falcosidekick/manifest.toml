[metadata]
name = "falcosidekick"
version = "2.28.0"
description = "Falco Sidekick - event forwarder for Falco alerts"
vendor = "Falco"
source = "https://github.com/falcosecurity/falcosidekick"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/falcosidekick/falcosidekick/releases/download/v2.28.0/falcosidekick-2.28.0-linux-amd64.tar.gz"
binary_name = "falcosidekick"
filename = "falcosidekick-2.28.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
metrics = 9101

[labels]
"org.opencontainers.image.title" = "falcosidekick"
"org.opencontainers.image.description" = "Falco Sidekick - event forwarder for Falco alerts"
"org.opencontainers.image.version" = "2.28.0"
"org.opencontainers.image.vendor" = "Falco"
"org.opencontainers.image.source" = "https://github.com/falcosecurity/falcosidekick"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
