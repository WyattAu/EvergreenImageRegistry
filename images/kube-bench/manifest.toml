[metadata]
name = "kube-bench"
version = "0.8.0"
description = "Kube-bench - checks whether Kubernetes is deployed securely"
vendor = "Aqua Security"
source = "https://github.com/aquasecurity/kube-bench"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/kube-bench/kube-bench/releases/download/v0.8.0/kube-bench-0.8.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/kube-bench"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Kubernetes CIS benchmark"
"org.opencontainers.image.source" = "https://github.com/aquasecurity/kube-bench"
"org.opencontainers.image.title" = "kube-bench"
"org.opencontainers.image.vendor" = "aquasecurity"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
