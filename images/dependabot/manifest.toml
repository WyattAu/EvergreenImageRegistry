[image]
name = "dependabot"
version = "0.10.0"
description = "GitHub Dependabot - automated dependency updates for your codebase"
vendor = "GitHub"
homepage = "https://github.com/github/dependabot-cli"
category = "devops"
tier = 3

[source]
type = "rubygem"
url = "https://rubygems.org/gems/dependabot-omnibus"
upstream = "https://github.com/dependabot/dependabot-core"

[build]
base = "ruby:3.2-slim"
target_base = "cgr.dev/chainguard/wolfi-base:latest"

[constraints]
nonroot = true
base = "wolfi"

[hft]
signal-handling = "native"
shutdown-timeout = "10s"

[ports]
metrics = 9101

[health]
type = "exec"
