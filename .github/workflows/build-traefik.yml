name: Build traefik (melange/apko)
on:
  push:
    paths:
      - images/traefik/**
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'traefik version (e.g. v3.7.1)'
        required: false

permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: traefik
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/traefik

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || $(grep 'version:' images/traefik/melange.yaml | head -1 | sed 's/.*version: //') }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build APK package with melange
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            cgr.dev/chainguard/melange build \
            images/traefik/melange.yaml \
            --arch x86_64 --arch aarch64 \
            --out-dir /work/packages \
            --sbom-path /work/sbom

      - name: Build OCI image with apko
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            cgr.dev/chainguard/apko build \
            images/traefik/apko.yaml \
            "ghcr.io/${{ github.repository_owner }}/traefik:${{ steps.version.outputs.version }}" \
            traefik-image.tar \
            --repository-append /work/packages \
            --sbom-path /work/sbom

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Load and push image
        id: push
        run: |
          docker load -i traefik-image.tar
          FULL_TAG="ghcr.io/${{ github.repository_owner }}/traefik:${{ steps.version.outputs.version }}"
          docker tag "ghcr.io/${{ github.repository_owner }}/traefik:${{ steps.version.outputs.version }}" "$FULL_TAG"
          docker push "$FULL_TAG"

          docker tag "$FULL_TAG" "ghcr.io/${{ github.repository_owner }}/traefik:latest"
          docker push "ghcr.io/${{ github.repository_owner }}/traefik:latest"

          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$FULL_TAG")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed: $FULL_TAG ($DIGEST)"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign version tag
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/traefik:${{ steps.version.outputs.version }}"

      - name: Sign latest tag
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/traefik:latest"

      - name: Upload melange SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-traefik
          path: sbom/
          retention-days: 90
