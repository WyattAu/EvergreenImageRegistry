[metadata]
name = "freshrss"
version = "1.24.1"
description = "freshrss container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "www-data"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.title" = "freshrss"
"org.opencontainers.image.vendor" = "FreshRSS"
"org.opencontainers.image.version" = "1.24.1"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

