[metadata]
name = "minio-operator"
version = "6.0.4"
description = "MinIO Operator - Kubernetes operator for MinIO"
vendor = "MinIO"
source = "https://github.com/minio/operator"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/minio-operator/minio-operator/releases/download/v6.0.4/minio-operator-6.0.4-linux-amd64.tar.gz"
binary_name = "minio-operator"
filename = "minio-operator-6.0.4-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 4455
metrics = 9101

[labels]
"org.opencontainers.image.title" = "minio-operator"
"org.opencontainers.image.description" = "MinIO Operator - Kubernetes operator for MinIO"
"org.opencontainers.image.version" = "6.0.4"
"org.opencontainers.image.vendor" = "MinIO"
"org.opencontainers.image.source" = "https://github.com/minio/operator"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "5s"
