name: Compliance Metrics Collection

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force metrics collection'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: read

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e7d77527bb7777412b8d711c9c0070744

      - name: Run validation baseline
        run: |
          cd evergreenctl
          cargo build --release 2>&1 | tail -3
          cd ..
          ./evergreenctl/target/release/evergreenctl validate-parallel --images-dir images/ --format json 2>&1 | grep -v '^2026-' > /tmp/validation_baseline.json

      - name: Generate metrics
        run: |
          python3 scripts/export_metrics.py --output /tmp/eir_metrics.prom
          echo "=== Metrics Summary ==="
          grep -E "^eir_" /tmp/eir_metrics.prom | grep -v "^#" | head -20

      - name: Extract key metrics
        id: metrics
        run: |
          TOTAL=$(grep "^eir_images_total" /tmp/eir_metrics.prom | awk '{print $2')
          PASSED=$(grep "^eir_validation_images_passed" /tmp/eir_metrics.prom | awk '{print $2')
          BLOCK=$(grep "^eir_validation_block_violations" /tmp/eir_metrics.prom | awk '{print $2')
          WARN=$(grep "^eir_validation_warn_violations" /tmp/eir_metrics.prom | awk '{print $2')
          SBOM=$(grep "^eir_sboms_with_packages" /tmp/eir_metrics.prom | awk '{print $2')
          VEX=$(grep "^eir_vex_documents_total" /tmp/eir_metrics.prom | awk '{print $2')
          WORKFLOWS=$(grep "^eir_workflows_total" /tmp/eir_metrics.prom | awk '{print $2')

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "block=$BLOCK" >> "$GITHUB_OUTPUT"
          echo "warn=$WARN" >> "$GITHUB_OUTPUT"
          echo "sbom=$SBOM" >> "$GITHUB_OUTPUT"
          echo "vex=$VEX" >> "$GITHUB_OUTPUT"
          echo "workflows=$WORKFLOWS" >> "$GITHUB_OUTPUT"

          if [ "$TOTAL" -gt 0 ]; then
            RATE=$(echo "scale=1; $PASSED * 100 / $TOTAL" | bc)
          else
            RATE="0"
          fi
          echo "pass_rate=$RATE" >> "$GITHUB_OUTPUT"

      - name: Post metrics to PR (if any)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7f6b444a71f35a3481b65e35a369cd588
        with:
          script: |
            const metrics = {
              total: '${{ steps.metrics.outputs.total ',
              passed: '${{ steps.metrics.outputs.passed ',
              passRate: '${{ steps.metrics.outputs.pass_rate ',
              block: '${{ steps.metrics.outputs.block ',
              warn: '${{ steps.metrics.outputs.warn ',
              sbom: '${{ steps.metrics.outputs.sbom ',
              vex: '${{ steps.metrics.outputs.vex ',
              workflows: '${{ steps.metrics.outputs.workflows '
            ;

            const body = `## 📊 Compliance Metrics

            | Metric | Value |
            |--------|-------|
            | Total Images | ${metrics.total |
            | Passing | ${metrics.passed (${metrics.passRate%) |
            | BLOCK Violations | ${metrics.block |
            | WARN Violations | ${metrics.warn |
            | SBOM Coverage | ${metrics.sbom/${metrics.total |
            | VEX Documents | ${metrics.vex |
            | CI Workflows | ${metrics.workflows |

            *Generated by compliance-metrics.yml*`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            );

            const existing = comments.data.find(c =>
              c.body.includes('Compliance Metrics') &&
              c.user.login === 'github-actions[bot]'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              );
             else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              );
            

      - name: Upload metrics artifact
        uses: actions/upload-artifact@043fb46d27f0d68c20c1e9e7f49eb5b2c7a49204
        with:
          name: compliance-metrics-${{ github.run_id 
          path: |
            /tmp/validation_baseline.json
            /tmp/eir_metrics.prom
          retention-days: 90

      - name: Summary
        run: |
          echo "## 📊 Compliance Metrics Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total Images | ${{ steps.metrics.outputs.total  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Passing | ${{ steps.metrics.outputs.passed  (${{ steps.metrics.outputs.pass_rate %) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| BLOCK Violations | ${{ steps.metrics.outputs.block  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| WARN Violations | ${{ steps.metrics.outputs.warn  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SBOM Coverage | ${{ steps.metrics.outputs.sbom /${{ steps.metrics.outputs.total  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| VEX Documents | ${{ steps.metrics.outputs.vex  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CI Workflows | ${{ steps.metrics.outputs.workflows  |" >> "$GITHUB_STEP_SUMMARY"
