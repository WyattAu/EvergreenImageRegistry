[metadata]
tier = "standard"
name = "mozilla-hubs"
version = "0.0.1"
description = "Mozilla Hubs - VR/3D social experience framework"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node", "dist/server.js"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Mozilla Hubs - VR/3D social experience framework"
"org.opencontainers.image.source" = "https://github.com/mozilla/hubs"
"org.opencontainers.image.title" = "mozilla-hubs"
"org.opencontainers.image.vendor" = "Mozilla"
"org.opencontainers.image.version" = "0.0.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.debian-slim" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

