[metadata]
name = "whisper"
version = "20240930"
description = "whisper container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/openai/whisper"
"org.opencontainers.image.title" = "whisper"
"org.opencontainers.image.vendor" = "OpenAI"
"org.opencontainers.image.version" = "20240930"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

