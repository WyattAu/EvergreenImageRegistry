[metadata]
name = "prometheus-consul-exporter"
version = "0.13.0"
description = "Consul Exporter - Prometheus exporter for Consul"
vendor = "Prometheus"
source = "https://github.com/prometheus/consul_exporter"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/prometheus-consul-exporter/prometheus-consul-exporter/releases/download/v0.13.0/prometheus-consul-exporter-0.13.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/consul_exporter"]

[ports]
expose = [9107, 9101]

[labels]
"org.opencontainers.image.description" = "Prometheus exporter for HashiCorp Consul health checks"
"org.opencontainers.image.title" = "Prometheus Consul Exporter"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.version" = "0.13.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-5"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-stateful"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
