[metadata]
tier = "standard"
name = "homeassistant-supervisor"
version = "unknown"
description = "homeassistant-supervisor container image"
deprecated = true
upstream_note = "Home Assistant Supervisor is NOT pip-installable. Distributed only as a container image from home-assistant/supervisor."

[build]
base = "debian:bookworm-slim"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python", "-m", "homeassistant-assistant"]
cmd = ["--help"]

[ports]
expose = [9101]
