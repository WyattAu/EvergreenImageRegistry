[metadata]
name = "openldap"
version = "2.6.8"
description = "openldap container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "ldap"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["slapd"]

[ports]
expose = [389, 9101]

[labels]
"org.opencontainers.image.title" = "openldap"
"org.opencontainers.image.vendor" = "OpenLDAP"
"org.opencontainers.image.version" = "2.6.8"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

