[metadata]
name = "chkrootkit"
version = "unknown"
description = "chkrootkit - rootkit detector"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["chkrootkit"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "chkrootkit - rootkit detector"
"org.opencontainers.image.title" = "chkrootkit"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

