[metadata]
name = "authentik-proxy"
version = "2026.2.2"
description = "authentik-proxy container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/goauthentik/authentik:${VERSION}"

[runtime]
entrypoint = ["python3", "-m", "authentik"]
cmd = ["proxy"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/goauthentik/authentik"
"org.opencontainers.image.title" = "authentik-proxy"
"org.opencontainers.image.vendor" = "goauthentik"
"org.opencontainers.image.version" = "2026.2.2"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "30s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "identity"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

