[metadata]
tier = "standard"
name = "qdrant-cpu"
version = "1.17.1"
description = "qdrant-cpu container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/qdrant"]

[ports]
expose = [6333, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/qdrant/qdrant/releases/download/v1.17.1"
"org.opencontainers.image.title" = "qdrant-cpu"
"org.opencontainers.image.vendor" = "qdrant/qdrant"
"org.opencontainers.image.version" = "1.17.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
