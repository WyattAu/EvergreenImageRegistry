[metadata]
tier = "standard"
name = "focalboard-server"
version = "7.11.3"
description = "focalboard-server container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/focalboard/bin/focalboard-server"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/mattermost/focalboard"
"org.opencontainers.image.title" = "focalboard-server"
"org.opencontainers.image.vendor" = "Mattermost"
"org.opencontainers.image.version" = "7.11.3"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "project-management"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
