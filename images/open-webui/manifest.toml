[metadata]
tier = "standard"
name = "open-webui"
version = "0.6.4"
description = "open-webui container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/open-webui/open-webui"
[runtime]
entrypoint = ["node"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/open-webui/open-webui/releases"
"org.opencontainers.image.title" = "open-webui"
"org.opencontainers.image.vendor" = "open-webui/open-webui"
"org.opencontainers.image.version" = "0.6.4"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
