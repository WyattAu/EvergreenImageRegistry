[metadata]
name = "rabbitmq-exporter"
version = "1.1.0"
description = "RabbitMQ Exporter - Prometheus exporter for RabbitMQ"
vendor = "Prometheus"
source = "https://github.com/kbudde/rabbitmq_exporter"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/rabbitmq-exporter/rabbitmq-exporter/releases/download/v1.1.0/rabbitmq-exporter-1.1.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/rabbitmq_exporter"]

[ports]
expose = [9090, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened RabbitMQ Exporter - Prometheus exporter for RabbitMQ"
"org.opencontainers.image.title" = "rabbitmq-exporter"
"org.opencontainers.image.vendor" = "kbudde"
"org.opencontainers.image.version" = "1.1.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.connection-drain" = "false"
"sovereign.hft.cpu-pins" = "6-7"
"sovereign.hft.cpu-pins-mode" = "shared"
"sovereign.hft.deploy-strategy" = "standard-rolling"
"sovereign.hft.init-system" = "none"
"sovereign.hft.pre-stop-hook" = "false"
"sovereign.hft.sched-policy" = "SCHED_OTHER"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "messaging"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

