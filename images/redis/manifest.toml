[metadata]
name = "redis"
version = "8.6"
description = "Redis - in-memory data structure store and cache"
vendor = "Redis"
source = "https://github.com/redis/redis"
license = "BSD-3-Clause"
tier = "critical"
upstream_version = "7.4.8"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/redis/redis/archive/refs/tags/7.4.8.tar.gz"

[runtime]
entrypoint = ["sh", "-c", "redis"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.title" = "redis"
"org.opencontainers.image.vendor" = "Redis"
"org.opencontainers.image.version" = "7.4.8"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "http"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "true"
