[metadata]
name = "falcosidekick"
version = "2.28.0"
description = "Falco Sidekick - event forwarder for Falco alerts"
vendor = "Falco"
source = "https://github.com/falcosecurity/falcosidekick"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/falcosidekick/falcosidekick/releases/download/v2.28.0/falcosidekick-2.28.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/falcosidekick"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Falcosidekick - Falco webhook"
"org.opencontainers.image.source" = "https://github.com/falcosecurity/falcosidekick"
"org.opencontainers.image.title" = "falcosidekick"
"org.opencontainers.image.vendor" = "falcosecurity"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

