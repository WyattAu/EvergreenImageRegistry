# =============================================================================
# EVERGREEN - SBOM ATTESTATION
# =============================================================================
# Attaches SPDX SBOMs to published container images as cosign attestations.
# Triggered after successful build completions (push and nightly).
# Uses keyless signing via Sigstore OIDC (no private key needed).
# =============================================================================

name: SBOM Attestation

on:
  workflow_run:
    workflows: ['Build on Push', 'Nightly Full Rebuild']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  attest:
    name: Attest SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built image references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: built-list-*-batch-*
          path: /tmp/batches
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true
        continue-on-error: true

      - name: Attest SBOMs to images
        run: |
          # Collect all built image references
          REFS=$(cat /tmp/batches/built-images.txt 2>/dev/null | sort -u || true)
          if [ -z "$REFS" ]; then
            echo "No image references found, skipping attestation"
            exit 0
          fi

          TOTAL=0
          OK=0
          FAIL=0

          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            TOTAL=$((TOTAL + 1))

            # Extract image name from ref (ghcr.io/owner/image:tag -> image)
            IMAGE=$(echo "$ref" | sed 's|.*\/||; s|:.*||')
            SBOM="images/${IMAGE}/sbom.spdx.json"

            if [ ! -f "$SBOM" ]; then
              echo "::warning::No SBOM found for ${IMAGE} at ${SBOM}"
              FAIL=$((FAIL + 1))
              continue
            fi

            echo "::group::Attest ${IMAGE}"
            if cosign attest --yes \
                --predicate "$SBOM" \
                --type spdxjson \
                "${ref}" 2>&1; then
              OK=$((OK + 1))
            else
              echo "::warning::SBOM attestation failed for ${ref}"
              FAIL=$((FAIL + 1))
            fi
            echo "::endgroup::"
          done <<< "$REFS"

          echo "SBOM Attestation: ${OK}/${TOTAL} succeeded, ${FAIL} failed"
          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi
