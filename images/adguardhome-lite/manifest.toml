[metadata]
name = "adguardhome-lite"
version = "0.107.50"
description = "AdGuard Home with lite/minimal config entrypoint"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/AdGuardHome"]
cmd = ["-c", "/opt/AdGuardHome/data/AdGuardHome.yaml", "--no-check-update"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.description" = "AdGuard Home with lite/minimal config entrypoint"
"org.opencontainers.image.source" = "https://github.com/AdguardTeam/AdGuardHome"
"org.opencontainers.image.title" = "adguardhome-lite"
"org.opencontainers.image.vendor" = "AdGuard"
"org.opencontainers.image.version" = "0.107.50"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "5000ms"
"sovereign.image.category" = "dns"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

