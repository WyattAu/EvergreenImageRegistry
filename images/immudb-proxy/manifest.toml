[metadata]
name = "immudb-proxy"
version = "latest"
description = "Sovereign hardened immudb-proxy - proxy mode for immudb"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/codenotary/immudb:${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/immudb-proxy"]

[ports]
expose = [3323, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened immudb-proxy - proxy mode for immudb"
"org.opencontainers.image.title" = "immudb-proxy"
"org.opencontainers.image.vendor" = "Codenotary"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "security"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

