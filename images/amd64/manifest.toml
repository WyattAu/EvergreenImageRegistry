[metadata]
name = "amd64"
version = "unknown"
description = "Evergreen hardened amd64 - AMD64 architecture base image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "base-image"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened amd64 - AMD64 architecture base image"
"org.opencontainers.image.title" = "amd64"
"evergreen.base.image" = "scratch"
"evergreen.health.type" = "none"
"evergreen.image.note" = "Placeholder base image for AMD64 architecture. Extend with application binaries."
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

