[metadata]
tier = "critical"
name = "kanidm-server"
version = "1.9.4"
description = "kanidm-server container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "docker.io/kanidm/server:${VERSION}"

[runtime]
entrypoint = ["/kanidmd"]

[ports]
expose = [8443, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/kanidm/kanidm"
"org.opencontainers.image.title" = "kanidm-server"
"org.opencontainers.image.vendor" = "Kanidm"
"org.opencontainers.image.version" = "1.9.4"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "identity"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
