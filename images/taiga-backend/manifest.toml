[metadata]
name = "taiga-backend"
version = "6.9.0"
upstream_version = "6.9.0"
description = "Taiga Backend - Django backend for Taiga project management"
vendor = "Taiga"
license = "AGPL-3.0-or-later"
tier = "critical"
source = "https://github.com/taigaio/taiga-back"

[build]
base = "cgr.dev/chainguard/wolfi-base"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/taigaio-taiga-back-latest"
[runtime]
entrypoint = ["python", "-m", "taiga"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.description" = "Taiga Backend - Django backend for Taiga project management"
"org.opencontainers.image.source" = "https://github.com/taigaio/taiga-back"
"org.opencontainers.image.title" = "taiga-backend"
"org.opencontainers.image.vendor" = "Taiga"
"org.opencontainers.image.version" = "6.9.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "project-management"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
"evergreen.security.cap-drop" = "ALL"
"evergreen.security.no-new-privileges" = "true"
"evergreen.security.read-only-rootfs" = "true"
"evergreen.security.seccomp" = "runtime-default"
