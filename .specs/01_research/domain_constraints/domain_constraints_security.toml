# Domain Constraints - Security Hardening

[metadata]
domain = "Security Hardening"
derivation_date = "2026-04-19"
confidence = 0.98
sources = ["NIST SP 800-190", "CIS Docker Benchmark", "Industry Best Practices"]

[constraints.numerical]
[[constraints.numerical.item]]
id = "NC-SEC-001"
name = "Maximum CVE tolerance"
description = "Maximum allowed CVEs by severity"
value = 0
unit = "count"
type = "hard"
source = "NIST SP 800-190"
derivation = "Zero tolerance for critical/high per evergreen requirements"
validation_method = "Trivy scan"

[[constraints.numerical.item]]
id = "NC-SEC-002"
name = "Non-root UID"
description = "UID for non-root execution"
value = 65534
unit = "uid"
type = "hard"
source = "Evergreen requirements"
derivation = "Standard nobody user UID"
validation_method = "id command in container"

[[constraints.numerical.item]]
id = "NC-SEC-003"
name = "Maximum image size (Tier 1)"
description = "Maximum image size for Tier 1 (scratch/distroless) images"
value = 50
unit = "MB"
type = "soft"
source = "Performance requirements"
derivation = "Typical hardened image size"
validation_method = "docker image size"

[[constraints.numerical.item]]
id = "NC-SEC-004"
name = "Maximum image size (Tier 2)"
description = "Maximum image size for Tier 2 images"
value = 200
unit = "MB"
type = "soft"
source = "Performance requirements"
derivation = "Acceptable for enterprise images"
validation_method = "docker image size"

[[constraints.numerical.item]]
id = "NC-SEC-005"
name = "Maximum startup latency"
description = "Maximum container startup time"
value = 2000
unit = "ms"
type = "soft"
source = "Performance requirements"
derivation = "Target for enterprise deployment"
validation_method = "Benchmark"

[constraints.timing]
[[constraints.timing.item]]
id = "TC-SEC-001"
name = "CVE scan timeout"
description = "Maximum time for vulnerability scan"
value = 60
unit = "seconds"
type = "soft"
source = "CI/CD requirements"
derivation = "Reasonable scan duration"
margin_percent = 20

[constraints.memory]
[[constraints.memory.item]]
id = "MC-SEC-001"
name = "Default memory limit"
description = "Default container memory limit"
value = 512
unit = "MB"
type = "soft"
source = "Runtime requirements"
derivation = "Typical application memory"
validation_method = "docker stats"

[[constraints.memory.item]]
id = "MC-SEC-002"
name = "Default CPU limit"
description = "Default container CPU limit"
value = 1.0
unit = "cores"
type = "soft"
source = "Runtime requirements"
derivation = "Single core default"
validation_method = "docker stats"

[constraints.hardware]
[[constraints.hardware.item]]
id = "HC-SEC-001"
name = "Architecture support"
description = "Supported CPU architectures"
value = "amd64,arm64"
unit = "arch"
type = "hard"
source = "OCI standard"
derivation = "Standard multi-arch support"
validation_method = "docker manifest"

# Verification rules

[conflicts]
[[conflicts.item]]
id = "CONF-001"
constraint_1 = "NC-SEC-003"
constraint_2 = "NC-SEC-004"
description = "Tier 1 vs Tier 2 size requirements"
impact = "Different limits based on image tier"
resolution = "Separate constraints per tier - not a conflict"
adr_reference = "N/A"
