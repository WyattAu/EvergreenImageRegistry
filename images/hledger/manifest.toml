[metadata]
tier = "standard"
name = "hledger"
version = "1.52"
description = "hledger container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/hledger"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/simonmichael/hledger"
"org.opencontainers.image.title" = "hledger"
"org.opencontainers.image.vendor" = "hledger"
"org.opencontainers.image.version" = "1.52"
"evergreen.base.image" = "scratch"
"evergreen.constraint.base" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "5000ms"
"evergreen.image.category" = "business-finance"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
