[metadata]
name = "paperless-ngx"
version = "2.14.4"
description = "paperless-ngx container image"

[build]
base = "debian:bookworm-slim"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python", "-m", "paperless-ngx"]
cmd = ["--help"]

[ports]
expose = [9101]

