[metadata]
tier = "standard"
name = "truffelsh"
version = "3.82.2"
description = "TruffleHog - secret scanner (alias)"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/trufflehog"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "TruffleHog - secret scanner (alias)"
"org.opencontainers.image.source" = "https://github.com/trufflesecurity/trufflehog"
"org.opencontainers.image.title" = "truffelsh"
"org.opencontainers.image.vendor" = "trufflesecurity"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
