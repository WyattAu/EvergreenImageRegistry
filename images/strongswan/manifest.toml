[metadata]
name = "strongswan"
version = "5.9.16"
description = "strongSwan - IPsec-based VPN (IKEv1/IKEv2) with PKI and plugins"
vendor = "strongSwan Project"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://download.strongswan.org/strongswan-5.9.16.tar.bz2"

[runtime]
entrypoint = ["/usr/sbin/charon"]

[ports]
expose = [500, 9101]

[labels]
"org.opencontainers.image.description" = "IPsec-based VPN (IKEv1/IKEv2) with PKI and plugins"
"org.opencontainers.image.source" = "https://github.com/strongswan/strongswan"
"org.opencontainers.image.title" = "strongswan"
"org.opencontainers.image.vendor" = "strongSwan Project"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "5000ms"
"sovereign.image.category" = "security"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

