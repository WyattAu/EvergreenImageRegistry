[metadata]
name = "tt-rss"
version = "24.5"
description = "tt-rss container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/rr-/tt-rss/releases"
"org.opencontainers.image.title" = "tt-rss"
"org.opencontainers.image.vendor" = "tt-rss"
"org.opencontainers.image.version" = "24.5"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

