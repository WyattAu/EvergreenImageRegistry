[metadata]
name = "gitlab-operator"
version = "0.8.0"
description = "GitLab Operator - Kubernetes operator for GitLab"
vendor = "GitLab"
source = "https://gitlab.com/gitlab-org/cloud-native/gitlab-operator"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://gitlab.com/api/v4/projects/gitlab-org%2Fcloud-native%2Fgitlab-operator/packages/generic/gitlab-operator/0.8.0/gitlab-operator-linux-amd64"
binary_name = "gitlab-operator"
filename = "gitlab-operator-linux-amd64"

[constraints]
nonroot = true
scratch = true

[ports]
application = 8080
metrics = 9101

[labels]
"org.opencontainers.image.title" = "gitlab-operator"
"org.opencontainers.image.description" = "GitLab Operator - Kubernetes operator for GitLab"
"org.opencontainers.image.version" = "0.8.0"
"org.opencontainers.image.vendor" = "GitLab"
"org.opencontainers.image.source" = "https://gitlab.com/gitlab-org/cloud-native/gitlab-operator"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
