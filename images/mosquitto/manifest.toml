[metadata]
name = "mosquitto"
version = "2.0.20"
description = "Mosquitto - lightweight MQTT message broker"
vendor = "Eclipse"
source = "https://github.com/eclipse-mosquitto/mosquitto"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/mosquitto/mosquitto/releases/download/v2.0.20/mosquitto-2.0.20-linux-amd64.tar.gz"
binary_name = "mosquitto"
filename = "mosquitto-2.0.20-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 1883
metrics = 9101

[labels]
"org.opencontainers.image.title" = "mosquitto"
"org.opencontainers.image.description" = "Mosquitto - lightweight MQTT message broker"
"org.opencontainers.image.version" = "2.0.20"
"org.opencontainers.image.vendor" = "Eclipse"
"org.opencontainers.image.source" = "https://github.com/eclipse-mosquitto/mosquitto"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
