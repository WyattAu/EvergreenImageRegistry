[metadata]
name = "minio"
version = "RELEASE.2025-10-15T17-29-55Z"
description = "MinIO - high-performance object storage compatible with S3"
vendor = "MinIO"
source = "https://github.com/minio/minio"
license = "AGPL-3.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://dl.min.io/server/minio/release/linux-amd64/minio"

[runtime]
entrypoint = ["/minio"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.title" = "minio"
"org.opencontainers.image.vendor" = "MinIO"
"org.opencontainers.image.version" = "RELEASE.2025-10-15T17-29-55Z"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

