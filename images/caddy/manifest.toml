[metadata]
name = "caddy"
version = "2.7.6"
description = "Caddy - powerful enterprise-ready open source web server"
vendor = "Caddy"
source = "https://github.com/caddyserver/caddy"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/caddy/caddy/releases/download/v2.7.6/caddy-2.7.6-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/caddy"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.title" = "caddy"
"org.opencontainers.image.vendor" = "Caddy"
"org.opencontainers.image.version" = "2.7.6"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.connection-drain" = "true"
"sovereign.hft.cpu-pins" = "0-1"
"sovereign.hft.cpu-pins-mode" = "exclusive"
"sovereign.hft.deploy-strategy" = "hft-rolling"
"sovereign.hft.init-system" = "none"
"sovereign.hft.pre-stop-delay" = "5s"
"sovereign.hft.pre-stop-hook" = "true"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.hft.xdp-capable" = "false"
"sovereign.hft.xdp-notes" = "Not supported"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

