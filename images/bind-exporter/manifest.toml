[metadata]
name = "bind-exporter"
version = "latest"
description = "BIND exporter for Prometheus"
vendor = "Evergreen"
source = "https://github.com/prometheus-community/bind_exporter"
license = "Apache-2.0"
tier = "standard"

[build]
base = "upstream"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "binary-download"
url = "https://github.com/prometheus-community/bind_exporter"

[runtime]
entrypoint = []

[ports]
expose = [9119, 9101]

[labels]
"evergreen.image.tier" = "standard"
