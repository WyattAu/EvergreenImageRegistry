[metadata]
tier = "standard"
name = "paperless-ngx-gotenberg"
version = "2.14.4"
description = "paperless-ngx-gotenberg container image"

[build]
base = "debian:bookworm-slim"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/gotenberg-gotenberg-latest"
[runtime]
entrypoint = ["python", "-m", "paperless-ngx"]
cmd = ["--help"]

[ports]
expose = [9101]
