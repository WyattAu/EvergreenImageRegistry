[metadata]
tier = "standard"
name = "ggshield"
version = "unknown"
description = "ggshield - GitGuardian CLI"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["ggshield"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "ggshield - GitGuardian CLI"
"org.opencontainers.image.source" = "https://github.com/GitGuardian/ggshield"
"org.opencontainers.image.title" = "ggshield"
"org.opencontainers.image.vendor" = "GitGuardian"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
