[metadata]
name = "mosquito"
version = "unknown"
description = "Mosquitto MQTT client tools"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["mosquitto_pub"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Mosquitto MQTT client tools"
"org.opencontainers.image.title" = "mosquito"
"org.opencontainers.image.vendor" = "Eclipse"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

