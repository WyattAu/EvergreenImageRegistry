[metadata]
name = "age"
version = "1.1.1"
description = "Simple, modern file encryption tool"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/age"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Simple, modern file encryption tool"
"org.opencontainers.image.source" = "https://github.com/FiloSottile/age"
"org.opencontainers.image.title" = "age"
"org.opencontainers.image.vendor" = "FiloSottile"
"org.opencontainers.image.version" = "1.1.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "1000ms"
"sovereign.image.category" = "security"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

