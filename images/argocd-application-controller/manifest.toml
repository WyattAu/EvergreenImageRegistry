[metadata]
name = "argocd-application-controller"
version = "2.12.6"
description = "ArgoCD Application Controller - manages application lifecycle and synchronization"
vendor = "Argo Project"
source = "https://github.com/argoproj/argo-cd"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/argoproj/argo-cd/releases/download/v2.12.6/argocd-linux-amd64"

[runtime]
entrypoint = ["argocd-application-controller"]

[ports]
expose = [8082, 9101]

[labels]
"org.opencontainers.image.description" = "ArgoCD Application Controller - manages application lifecycle"
"org.opencontainers.image.source" = "https://github.com/argoproj/argo-cd"
"org.opencontainers.image.title" = "argocd-application-controller"
"org.opencontainers.image.vendor" = "Argo Project"
"org.opencontainers.image.version" = "2.12.6"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
