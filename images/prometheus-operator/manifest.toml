[metadata]
name = "prometheus-operator"
version = "0.90.1"
description = "Prometheus Operator - manages Prometheus monitoring instances"
vendor = "Prometheus"
source = "https://github.com/prometheus-operator/prometheus-operator"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "quay.io/prometheus-operator/prometheus-operator:v${VERSION}"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.90.1/prometheus-operator-0.90.1-linux-amd64.tar.gz"
binary_name = "prometheus-operator"
filename = "prometheus-operator-0.90.1-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
metrics = 9101

[labels]
"org.opencontainers.image.title" = "prometheus-operator"
"org.opencontainers.image.description" = "Prometheus Operator - manages Prometheus monitoring instances"
"org.opencontainers.image.version" = "0.90.1"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.source" = "https://github.com/prometheus-operator/prometheus-operator"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "10s"
