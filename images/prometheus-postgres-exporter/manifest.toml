[metadata]
name = "prometheus-postgres-exporter"
version = "0.19.1"
description = "Postgres Exporter - Prometheus exporter for PostgreSQL"
vendor = "Prometheus"
source = "https://github.com/prometheus-community/postgres_exporter"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/prometheus-postgres-exporter/prometheus-postgres-exporter/releases/download/v0.19.1/prometheus-postgres-exporter-0.19.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/postgres_exporter"]

[ports]
expose = [9187, 9101]

[labels]
"org.opencontainers.image.description" = "Prometheus exporter for PostgreSQL server metrics"
"org.opencontainers.image.title" = "prometheus-postgres-exporter"
"org.opencontainers.image.vendor" = "Prometheus Community"
"org.opencontainers.image.version" = "0.19.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-5"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-stateful"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
