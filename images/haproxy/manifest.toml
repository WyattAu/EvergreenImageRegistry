[metadata]
name = "haproxy"
version = "2.8.5"
description = "HAProxy - reliable high-performance TCP/HTTP load balancer"
vendor = "HAProxy"
source = "https://github.com/haproxy/haproxy"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "cgr.dev/chainguard/wolfi-base:latest"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/haproxy/haproxy/releases/download/v2.8.5/haproxy-2.8.5-linux-amd64.tar.gz"
binary_name = "haproxy"
filename = "haproxy-2.8.5-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 8404
metrics = 9101

[labels]
"org.opencontainers.image.title" = "haproxy"
"org.opencontainers.image.description" = "HAProxy - reliable high-performance TCP/HTTP load balancer"
"org.opencontainers.image.version" = "2.8.5"
"org.opencontainers.image.vendor" = "HAProxy"
"org.opencontainers.image.source" = "https://github.com/haproxy/haproxy"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
