[metadata]
name = "cadvisor"
version = "v0.57.0"
description = "cAdvisor - container resource usage and performance analysis"
vendor = "Google"
source = "https://github.com/google/cadvisor"
license = "Apache-2.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/cadvisor/cadvisor/releases/download/v0.49.1/cadvisor-0.49.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/cadvisor"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened cAdvisor - container resource usage analysis and metrics"
"org.opencontainers.image.title" = "cadvisor"
"org.opencontainers.image.vendor" = "Google"
"org.opencontainers.image.version" = "0.49.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "false"
"evergreen.hft.cpu-pins" = "6-7"
"evergreen.hft.cpu-pins-mode" = "shared"
"evergreen.hft.deploy-strategy" = "standard-rolling"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-hook" = "false"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "observability"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
