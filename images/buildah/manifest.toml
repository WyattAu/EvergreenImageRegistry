[metadata]
tier = "standard"
name = "buildah"
version = "latest"
description = "Evergreen hardened buildah - OCI image builder"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["buildah"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened buildah - OCI image builder"
"org.opencontainers.image.title" = "buildah"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
