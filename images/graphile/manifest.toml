[metadata]
name = "graphile"
version = "4.14.0"
description = "Sovereign hardened PostGraphile - instant GraphQL API for PostgreSQL"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node", "/opt/graphile/cli.js"]

[ports]
expose = [5000, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened PostGraphile - instant GraphQL API for PostgreSQL"
"org.opencontainers.image.title" = "graphile"
"org.opencontainers.image.vendor" = "Graphile"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

