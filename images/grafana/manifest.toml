[metadata]
name = "grafana"
version = "11.0.0"
description = "Grafana - observability dashboard and visualization"
vendor = "Grafana Labs"
source = "https://github.com/grafana/grafana"
license = "AGPL-3.0"
tier = "1"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://dl.grafana.com/oss/release/grafana-11.0.0.linux-amd64.tar.gz"

[runtime]
entrypoint = ["grafana-server"]
cmd = ["--homepath=/opt/grafana", "--config=/etc/grafana/grafana.ini"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/grafana/grafana"
"org.opencontainers.image.title" = "grafana"
"org.opencontainers.image.vendor" = "Grafana Labs"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "observability"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

