[metadata]
name = "hedgedoc-legacy"
version = "1.9.9"
description = "HedgeDoc Legacy - collaborative markdown notes v1.9.x"
vendor = "HedgeDoc"
source = "https://github.com/hedgedoc/hedgedoc"
tier = "2"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/hedgedoc/hedgedoc/releases/download/v1.9.9/hedgedoc-v1.9.9.tar.gz"

[runtime]
entrypoint = ["node", "app.js"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "HedgeDoc Legacy - collaborative markdown notes v1.9.x"
"org.opencontainers.image.source" = "https://github.com/hedgedoc/hedgedoc"
"org.opencontainers.image.title" = "hedgedoc-legacy"
"org.opencontainers.image.vendor" = "HedgeDoc"
"org.opencontainers.image.version" = "1.9.9"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

