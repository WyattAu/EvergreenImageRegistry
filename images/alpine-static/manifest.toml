[metadata]
tier = "standard"
name = "alpine-static"
version = "unknown"
description = "Evergreen reference for static base (chainguard/static). Alpine is banned for application images."

[build]
base = "cgr.dev/chainguard/static:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "base-image"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen reference for static base (chainguard/static). Alpine is banned for application images."
"org.opencontainers.image.title" = "alpine-static"
"evergreen.base.image" = "wolfi"
"evergreen.health.type" = "none"
"evergreen.image.category" = "base"
"evergreen.image.note" = "Alpine is banned for application images. Use chainguard/static for static builds."
"evergreen.image.status" = "reference"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

