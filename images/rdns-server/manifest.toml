[metadata]
name = "rdns-server"
version = "0.12.0"
description = "Sovereign hardened RDNS - recursive DNS server"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/rdns-server"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened RDNS - recursive DNS server"
"org.opencontainers.image.title" = "rdns-server"
"org.opencontainers.image.vendor" = "folbricht"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.category" = "dns"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

