[metadata]
tier = "standard"
name = "vm-operator"
version = "0.70.0"
description = "Evergreen hardened VictoriaMetrics Operator - Kubernetes operator for VictoriaMetrics"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "docker.io/victoriametrics/operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/vm-operator"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened VictoriaMetrics Operator - Kubernetes operator for VictoriaMetrics"
"org.opencontainers.image.title" = "vm-operator"
"org.opencontainers.image.vendor" = "VictoriaMetrics"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "monitoring"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

