[metadata]
name = "rate-limiter"
version = "latest"
description = "rate-limiter container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/ratelimiter"]

[ports]
expose = [9090, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/kuqoi/ratelimiter"
"org.opencontainers.image.title" = "rate-limiter"
"org.opencontainers.image.vendor" = "kuqoi"
"org.opencontainers.image.version" = "latest"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "networking"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

