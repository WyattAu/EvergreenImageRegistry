[metadata]
tier = "standard"
name = "cyberchef"
version = "unknown"
description = "CyberChef - Swiss Army knife of cryptography"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node", "server.js"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "CyberChef - Swiss Army knife of cryptography"
"org.opencontainers.image.source" = "https://github.com/gchq/CyberChef"
"org.opencontainers.image.title" = "cyberchef"
"org.opencontainers.image.vendor" = "GCHQ"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
