[metadata]
name = "jellyseer"
version = "2.7.3"
description = "jellyseer container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "fallenbagel/jellyseerr:${VERSION}"

[runtime]
entrypoint = ["/jellyseerr"]

[ports]
expose = [5055, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/Fallenbagel/jellyseerr"
"org.opencontainers.image.title" = "jellyseer"
"org.opencontainers.image.vendor" = "Jellyseerr"
"org.opencontainers.image.version" = "v3.2.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "10000ms"
"sovereign.image.category" = "media-streaming"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

