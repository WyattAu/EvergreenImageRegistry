[metadata]
name = "gitlab-runner"
version = "16.11.0"
description = "GitLab Runner - CI/CD runner for GitLab"
vendor = "GitLab"
source = "https://gitlab.com/gitlab-org/gitlab-runner"
license = "MIT"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://gitlab-runner-downloads.s3.amazonaws.com/v16.11.0/binaries/gitlab-runner-linux-amd64"
binary_name = "gitlab-runner"
filename = "gitlab-runner-linux-amd64"

[constraints]
nonroot = true
scratch = true

[ports]
application = 8093
metrics = 9101

[labels]
"org.opencontainers.image.title" = "gitlab-runner"
"org.opencontainers.image.description" = "GitLab Runner - CI/CD runner for GitLab"
"org.opencontainers.image.version" = "16.11.0"
"org.opencontainers.image.vendor" = "GitLab"
"org.opencontainers.image.source" = "https://gitlab.com/gitlab-org/gitlab-runner"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
