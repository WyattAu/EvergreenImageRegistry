[metadata]
name = "dovecot-pop3"
version = "2.3.21"
description = "Dovecot POP3 - Dovecot in POP3 mode"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["dovecot", "-F"]

[ports]
expose = [110, 9101]

[labels]
"org.opencontainers.image.description" = "Dovecot POP3 - Dovecot in POP3 mode"
"org.opencontainers.image.source" = "https://www.dovecot.org"
"org.opencontainers.image.title" = "dovecot-pop3"
"org.opencontainers.image.vendor" = "Dovecot"
"org.opencontainers.image.version" = "2.3.21"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.debian-slim" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.image.variant" = "pop3"
"evergreen.metrics.native" = "ztunnel"

