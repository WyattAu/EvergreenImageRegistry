[metadata]
name = "haproxy"
version = "2.8.5"
description = "HAProxy - reliable high-performance TCP/HTTP load balancer"
vendor = "HAProxy"
source = "https://github.com/haproxy/haproxy"
license = "Apache-2.0"
tier = "community"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/haproxy/haproxy/releases/download/v2.8.5/haproxy-2.8.5-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/sbin/haproxy"]

[ports]
expose = [8404, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened HAProxy - reliable high-performance TCP/HTTP load balancer"
"org.opencontainers.image.title" = "haproxy"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "proxy"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

