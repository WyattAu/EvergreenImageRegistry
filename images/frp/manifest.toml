[metadata]
name = "frp"
version = "0.70.0"
description = "frp - Evergreen hardened image"
vendor = "Evergreen"
source = "https://github.com/fatedier/frp"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "upstream-repack"
url = "https://github.com/fatedier/frp"

[runtime]
entrypoint = []

[ports]
expose = [7000, 9101]
