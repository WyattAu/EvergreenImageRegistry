[metadata]
tier = "standard"
name = "maxbot"
version = "0.3.0b2"
description = "Maxbot - open source framework for creating conversational apps"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://pypi.org/project/maxbot/"

[runtime]
entrypoint = ["maxbot"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Maxbot - open source framework for creating conversational apps"
"org.opencontainers.image.title" = "maxbot"
"org.opencontainers.image.vendor" = "Maxbot team"
"org.opencontainers.image.version" = "0.3.0b2"
"org.opencontainers.image.source" = "https://github.com/maxbot-ai/maxbot"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.image.status" = "functional"
"evergreen.metrics.native" = "ztunnel"
