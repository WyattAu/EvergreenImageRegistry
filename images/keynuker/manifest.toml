[metadata]
name = "keynuker"
version = "latest"
description = "KeyNuker - key detection"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/clonezilla/keynuker:${VERSION}"

[runtime]
entrypoint = ["/keynuker"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "KeyNuker - key detection"
"org.opencontainers.image.source" = "https://github.com/clonezilla/keynuker"
"org.opencontainers.image.title" = "keynuker"
"org.opencontainers.image.vendor" = "clonezilla"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

