name: Provenance Verification
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run evergreenctl verify-all
        run: |
          cd evergreenctl && cargo build --release && \
          ./target/release/evergreenctl verify-all images/
      - name: Verify SLSA provenance for sample images
        run: |
          SAMPLE_IMAGES="redis nginx postgres vault grafana prometheus"
          for img in $SAMPLE_IMAGES; do
            FULL_REF="ghcr.io/${{ github.repository }}/$img:latest"
            echo "Verifying provenance for $FULL_REF..."
            cosign verify --certificate-identity https://github.com/ \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --rekor-url https://rekor.sigstore.dev \
              "$FULL_REF" || echo "WARNING: Could not verify $img" >&2
          done
