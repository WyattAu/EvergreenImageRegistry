[metadata]
name = "rathole"
version = "latest"
description = "rathole - Evergreen hardened image"
vendor = "Evergreen"
source = "https://github.com/rapiz1/rathole"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "upstream-repack"
url = "https://github.com/rapiz1/rathole"

[runtime]
entrypoint = []

[ports]
expose = [7000 9101]
