[metadata]
tier = "standard"
name = "kdb-plus"
version = "unknown"
description = "Placeholder for KX Systems KDB+ Plus edition. Requires license."

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/cgr.dev/chainguard/wolfi-base"
[ports]
expose = [5000, 9101]

[labels]
"org.opencontainers.image.description" = "Placeholder for KX Systems KDB+ Plus edition. Requires license."
"org.opencontainers.image.title" = "kdb-plus"
"org.opencontainers.image.vendor" = "KX Systems"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "none"
"evergreen.image.category" = "database"
"evergreen.image.note" = "KDB+ Plus is proprietary. Copy licensed q binary to /opt/kdb/q before use."
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"


status = "wip"
