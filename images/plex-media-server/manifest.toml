[metadata]
name = "plex-media-server"
version = "1.41.3.9292"
description = "plex-media-server container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "plexinc/pms-docker:latest"

[runtime]
entrypoint = ["/usr/lib/plexmediaserver/Plex Media Server"]

[ports]
expose = [32400, 9101]

[labels]
"org.opencontainers.image.source" = "https://www.plex.tv/"
"org.opencontainers.image.title" = "plex-media-server"
"org.opencontainers.image.vendor" = "Plex"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "10s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "30000ms"
"sovereign.image.category" = "media-streaming"
"sovereign.image.note" = "Extracted from plexinc/pms-docker official image. Requires Plex account for activation."
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

