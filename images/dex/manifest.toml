[metadata]
name = "dex"
version = "2.45.1"
description = "Dex - federated OpenID Connect provider"
vendor = "Dex"
source = "https://github.com/dexidp/dex"
license = "Apache-2.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"
multiarch = false

[source]
type = "package-manager"
url = "https://github.com/dex/dex/releases/download/v2.45.1/dex-2.45.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/dex"]

[ports]
expose = [5556, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/dexidp/dex"
"org.opencontainers.image.title" = "dex"
"org.opencontainers.image.vendor" = "DexIDP"
"org.opencontainers.image.version" = "2.45.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "identity"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical""evergreen.metrics.native" = "ztunnel"
