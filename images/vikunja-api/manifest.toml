[metadata]
tier = "standard"
name = "vikunja-api"
version = "2.3.0"
description = "vikunja-api container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/vikunja"]

[ports]
expose = [3456, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/go-vikunja/vikunja"
"org.opencontainers.image.title" = "vikunja-api"
"org.opencontainers.image.vendor" = "Vikunja"
"org.opencontainers.image.version" = "v0.24.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.base" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "10000ms"
"evergreen.image.category" = "project-management"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

