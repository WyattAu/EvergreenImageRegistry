[metadata]
name = "gitea-secure"
version = "1.26.1"
description = "Gitea Secure - Hardened Git hosting with enhanced security defaults"
vendor = "Gitea"
source = "https://github.com/go-gitea/gitea"
license = "MIT"
tier = "2"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/go-gitea/gitea/releases/download/v1.26.1/gitea-1.26.1-linux-amd64"

[runtime]
entrypoint = ["gitea"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "Gitea Secure - Hardened Git hosting with enhanced security defaults"
"org.opencontainers.image.source" = "https://github.com/go-gitea/gitea"
"org.opencontainers.image.title" = "gitea-secure"
"org.opencontainers.image.vendor" = "Gitea"
"org.opencontainers.image.version" = "1.26.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

