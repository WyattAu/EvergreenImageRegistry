[metadata]
tier = "standard"
name = "hashicorp-vault"
version = "1.18.1"
description = "hashicorp-vault container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/vault"]

[ports]
expose = [8200, 9101]

[labels]
"org.opencontainers.image.title" = "hashicorp-vault"
"org.opencontainers.image.vendor" = "HashiCorp"
"org.opencontainers.image.version" = "1.18.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.cap-drop" = "ALL"
"evergreen.hft.cap-required" = "CAP_SYS_NICE"
"evergreen.hft.fips-required" = "true"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "5000ms"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
