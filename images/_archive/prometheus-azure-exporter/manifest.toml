[metadata]
tier = "critical"
name = "prometheus-azure-exporter"
version = "latest"
description = "Prometheus exporter for Azure Monitor metrics"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/robustperception/azure_metrics_exporter:${VERSION}"

[runtime]
entrypoint = ["/azure_metrics_exporter"]

[ports]
expose = [9276, 9101]

[labels]
"org.opencontainers.image.description" = "Prometheus exporter for Azure Monitor metrics"
"org.opencontainers.image.title" = "prometheus-azure-exporter"
"org.opencontainers.image.vendor" = "Robust Perception"
"org.opencontainers.image.version" = "1.4.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-5"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-stateful"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "critical""evergreen.metrics.native" = "ztunnel"


status = "wip"
