[metadata]
tier = "standard"
name = "linguist-go"
version = "9.5.0"
description = "Linguist - Go variant"
deprecated = true
upstream_note = "github-linguist/linguist is a Ruby project, not Go. Cannot build as Go binary."

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"
multiarch = false

[source]
type = "package-manager"

[runtime]
entrypoint = ["/linguist"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Linguist - Go variant"
"org.opencontainers.image.source" = "https://github.com/github/linguist"
"org.opencontainers.image.title" = "linguist-go"
"org.opencontainers.image.vendor" = "GitHub"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
