[metadata]
tier = "standard"
name = "redisearch"
version = "2.8.13"
description = "Evergreen hardened RediSearch - full-text search module for Redis"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/redislabs/redisearch"
[runtime]
entrypoint = ["redis-server", "--loadmodule", "/opt/redis/modules/redisearch.so"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened RediSearch - full-text search module for Redis"
"org.opencontainers.image.title" = "redisearch"
"org.opencontainers.image.vendor" = "Redis"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
