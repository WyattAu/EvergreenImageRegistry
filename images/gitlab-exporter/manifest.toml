[metadata]
name = "gitlab-exporter"
version = "0.8.0"
description = "GitLab Exporter - Prometheus exporter for GitLab metrics"
vendor = "Prometheus Community"
source = "https://github.com/prometheus-community/gitlab-exporter"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/prometheus-community/gitlab-exporter:${VERSION}"

[runtime]
entrypoint = ["gitlab-exporter"]

[ports]
expose = [9171, 9101]

[labels]
"org.opencontainers.image.description" = "GitLab Exporter - Prometheus exporter for GitLab metrics"
"org.opencontainers.image.source" = "https://github.com/prometheus-community/gitlab-exporter"
"org.opencontainers.image.title" = "gitlab-exporter"
"org.opencontainers.image.vendor" = "Prometheus Community"
"org.opencontainers.image.version" = "0.8.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
