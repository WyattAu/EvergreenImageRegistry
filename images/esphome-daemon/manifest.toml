[metadata]
tier = "standard"
name = "esphome-daemon"
version = "unknown"
description = "ESPHome - daemon mode"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["esphome"]
cmd = ["--daemon"]

[ports]
expose = [6053, 9101]

[labels]
"org.opencontainers.image.description" = "ESPHome - daemon mode"
"org.opencontainers.image.source" = "https://github.com/esphome/esphome"
"org.opencontainers.image.title" = "esphome-daemon"
"org.opencontainers.image.vendor" = "ESPHome"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
