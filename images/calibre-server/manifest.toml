[metadata]
name = "calibre-server"
version = "7.22.0"
description = "calibre-server container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["calibre-server"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/kovidgoyal/calibre/releases"
"org.opencontainers.image.title" = "calibre-server"
"org.opencontainers.image.vendor" = "Kovid Goyal"
"org.opencontainers.image.version" = "7.22.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

