# Inherit the default configuration
extends: default

rules:
  # Enforce 2-space indentation.
  indentation:
    spaces: 2

  # Set a reasonable line length for readability.
  line-length:
    max: 120

  # Disallow truthy values like "yes", "no", "on", "off". Enforce "true" or "false".
  truthy:
    allowed-values: ['true', 'false']

  # Forbid duplicate keys in mappings.
  key-duplicates: {}

  # Disable document-start requirement (--- prefix not needed for all YAML)
  document-start: disable

# Files to ignore (e.g., workflow files with complex multiline strings)
ignore: |
  .github/
  .forgejo/
  deploy/
  images/*/docker-compose.yml
  compliance/
  .markdownlint.yml
  .prettierrc
  .prettierignore
  .yamllint.yml
  compliance/fips/fips_image_matrix.yaml
  operator/
  charts/
  evergreenctl/policies/
