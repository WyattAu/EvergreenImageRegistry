[image]
name = "chat-relay"
type = "binary-download"
tier = 2
version = "0.5.0"
description = "Matrix chat relay (complement) - testing tool for Matrix homeservers"
vendor = "matrix-org"
source_url = "https://github.com/matrix-org/complement"
category = "chat"

[source]
url = "https://github.com/matrix-org/complement/releases/download/v0.5.0/complement-linux-amd64"
fallback_urls = []
checksum = { algorithm = "sha256", expected = "PENDING", source = "" }
strategy = "curl"
github_repo = "matrix-org/complement"

[build]
base = { image = "debian:bookworm-slim", purpose = "download" }
builder_packages = ["curl", "ca-certificates"]
runtime_packages = []
build_commands = [
  "curl --retry 3 --retry-delay 5 -fsSL -H \"Authorization: token ${GITHUB_TOKEN}\" https://github.com/matrix-org/complement/releases/download/v0.5.0/complement-linux-amd64 -o /tmp/complement",
  "chmod +x /tmp/complement",
  "strip /tmp/complement",
]
artifacts = [
  { source = "/tmp/complement", destination = "/usr/local/bin/complement" },
]

[runtime]
user = "65532:65532"
workdir = "/app"
entrypoint = ["/usr/local/bin/complement"]
cmd = []
ports = [9004]
volumes = []
stop_signal = "SIGTERM"

[health]
type = "tcp"
path = ""
port = 9004
interval_seconds = 30
timeout_seconds = 5
retries = 3

[observability]
metrics_port = 9101
metrics_path = "/metrics"

[compliance]
standards = []
labels = {}
