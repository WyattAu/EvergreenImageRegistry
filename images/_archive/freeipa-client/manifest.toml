[metadata]
tier = "standard"
name = "freeipa-client"
version = "unknown"
description = "FreeIPA client tools via SSSD (Debian sssd suite provides FreeIPA client functionality)"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/freeipa/freeipa-client"
[runtime]
entrypoint = ["/usr/bin/sssctl"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "FreeIPA client tools via SSSD (Debian sssd suite provides FreeIPA client functionality)"
"org.opencontainers.image.source" = "https://www.freeipa.org"
"org.opencontainers.image.title" = "freeipa-client"
"org.opencontainers.image.vendor" = "FreeIPA"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "identity"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
