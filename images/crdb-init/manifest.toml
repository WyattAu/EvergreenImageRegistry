[metadata]
name = "crdb-init"
version = "23.2.3"
description = "Evergreen hardened CockroachDB init entrypoint"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/cockroach", "init"]

[ports]
expose = [26257, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened CockroachDB init entrypoint"
"org.opencontainers.image.title" = "crdb-init"
"org.opencontainers.image.vendor" = "Cockroach Labs"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

