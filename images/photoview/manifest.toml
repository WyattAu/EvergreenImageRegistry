[metadata]
name = "photoview"
version = "v2.4.0"
description = "photoview container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "viktorstrate/photoview:v2.4.0"

[runtime]
entrypoint = ["/photoview"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/photoview/photoview"
"org.opencontainers.image.title" = "photoview"
"org.opencontainers.image.vendor" = "photoview/photoview"
"org.opencontainers.image.version" = "v2.4.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

