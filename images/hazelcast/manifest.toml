[metadata]
name = "hazelcast"
version = "5.3.6"
description = "Evergreen hardened Hazelcast - distributed in-memory computing platform"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/hazelcast/bin/hazelcast"]

[ports]
expose = [5701, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Hazelcast - distributed in-memory computing platform"
"org.opencontainers.image.title" = "hazelcast"
"org.opencontainers.image.vendor" = "Hazelcast"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

