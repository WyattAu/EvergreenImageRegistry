[metadata]
name = "logseq"
version = "0.10.18"
description = "logseq container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "node"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.title" = "logseq"
"org.opencontainers.image.vendor" = "Logseq"
"org.opencontainers.image.version" = "0.10.18"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

