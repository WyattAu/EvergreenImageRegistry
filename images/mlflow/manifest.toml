[metadata]
name = "mlflow"
version = "2.21.0"
description = "mlflow container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["mlflow"]

[ports]
expose = [5000, 9101]

[labels]
"org.opencontainers.image.title" = "mlflow"
"org.opencontainers.image.vendor" = "MLflow"
"org.opencontainers.image.version" = "2.21.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

