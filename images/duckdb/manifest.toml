[metadata]
name = "duckdb"
version = "1.1.3"
description = "DuckDB - in-process SQL OLAP database management system"
vendor = "DuckDB Labs"
source = "https://github.com/duckdb/duckdb"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-20250113-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip"
binary_name = "duckdb"
filename = "duckdb_cli-linux-amd64.zip"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 5432
metrics = 9101

[labels]
"org.opencontainers.image.title" = "duckdb"
"org.opencontainers.image.description" = "DuckDB - in-process SQL OLAP database management system"
"org.opencontainers.image.version" = "1.1.3"
"org.opencontainers.image.vendor" = "DuckDB Labs"
"org.opencontainers.image.source" = "https://github.com/duckdb/duckdb"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
