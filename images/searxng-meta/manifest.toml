[metadata]
tier = "standard"
name = "searxng-meta"
version = "unknown"
description = "SearXNG - meta variant"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["searxng-meta"]

[ports]
expose = [8888, 9101]

[labels]
"org.opencontainers.image.description" = "SearXNG - meta variant"
"org.opencontainers.image.source" = "https://github.com/searxng/searxng"
"org.opencontainers.image.title" = "searxng-meta"
"org.opencontainers.image.vendor" = "searxng"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

