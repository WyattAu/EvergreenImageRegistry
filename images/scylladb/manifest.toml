[metadata]
name = "scylladb"
version = "5.4.6"
description = "ScyllaDB - high-performance NoSQL columnar database"
vendor = "ScyllaDB"
source = "https://github.com/scylladb/scylladb"
license = "Apache-2.0"
tier = "2"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "scylladb/scylla:latest"

[runtime]
entrypoint = ["/usr/bin/scylla"]

[ports]
expose = [9042, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened ScyllaDB - extracted from official Docker image"
"org.opencontainers.image.source" = "https://github.com/scylladb/scylladb"
"org.opencontainers.image.title" = "scylladb"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.note" = "Extracted from scylladb/scylla:latest. downloads.scylladb.com GPG key URL was wrong (404)."
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

