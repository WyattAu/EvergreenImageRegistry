[metadata]
name = "freshrss"
version = "1.28.1"
description = "freshrss container image"
tier = "critical"
upstream_version = "1.28.1"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.title" = "freshrss"
"org.opencontainers.image.vendor" = "FreshRSS"
"org.opencontainers.image.version" = "1.28.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
