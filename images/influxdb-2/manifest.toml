[metadata]
name = "influxdb-2"
version = "2.7"
description = "InfluxDB 2 - time series database with Flux query engine"
vendor = "InfluxData"
source = "https://github.com/influxdata/influxdb"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "influxdb:2.7"

[runtime]
entrypoint = ["/influxd"]

[ports]
expose = [8086, 9101]

[labels]
"org.opencontainers.image.description" = "InfluxDB v2-only variant for pure v2 API deployments"
"org.opencontainers.image.title" = "influxdb-2"
"org.opencontainers.image.vendor" = "InfluxData"
"org.opencontainers.image.version" = "2.7"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.connection-drain" = "true"
"sovereign.hft.cpu-pins" = "4-5"
"sovereign.hft.cpu-pins-mode" = "exclusive"
"sovereign.hft.deploy-strategy" = "hft-stateful"
"sovereign.hft.init-system" = "none"
"sovereign.hft.pre-stop-delay" = "5s"
"sovereign.hft.pre-stop-hook" = "true"
"sovereign.hft.sched-policy" = "SCHED_OTHER"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "tsdb"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

