[metadata]
tier = "standard"
name = "onlyoffice-controlpanel"
version = "12.5.2"
description = "ONLYOFFICE Control Panel - administrative panel for Community Server and Mail Server"
vendor = "ONLYOFFICE"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/ONLYOFFICE/CommunityServer/releases/download/v12.5.2/onlyoffice-controlpanel-linux-x64.tar.gz"

[runtime]
entrypoint = ["/opt/onlyoffice/controlpanel/start.sh"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened ONLYOFFICE Control Panel"
"org.opencontainers.image.source" = "https://github.com/ONLYOFFICE/CommunityServer"
"org.opencontainers.image.title" = "onlyoffice-controlpanel"
"org.opencontainers.image.vendor" = "ONLYOFFICE"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "30s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "60000ms"
"evergreen.image.category" = "document-management"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
