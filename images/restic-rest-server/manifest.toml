[metadata]
name = "restic-rest-server"
version = "0.14.0"
description = "restic-rest-server - Evergreen hardened image"
vendor = "Evergreen"
source = "https://github.com/restic/rest-server"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "upstream-repack"
url = "https://github.com/restic/rest-server"

[runtime]
entrypoint = []

[ports]
expose = [8000, 9101]
