[metadata]
name = "wireguard"
version = "0.0.20230223"
description = "WireGuard - fast, modern, secure VPN tunnel"
vendor = "WireGuard"
source = "https://github.com/WireGuard/wireguard-go"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "golang:${GO_VERSION}-bookworm"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/wireguard/wireguard/releases/download/v0.0.20230223/wireguard-0.0.20230223-linux-amd64.tar.gz"
binary_name = "wireguard"
filename = "wireguard-0.0.20230223-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 51820/udp
metrics = 9101

[labels]
"org.opencontainers.image.title" = "wireguard"
"org.opencontainers.image.description" = "WireGuard - fast, modern, secure VPN tunnel"
"org.opencontainers.image.version" = "0.0.20230223"
"org.opencontainers.image.vendor" = "WireGuard"
"org.opencontainers.image.source" = "https://github.com/WireGuard/wireguard-go"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
