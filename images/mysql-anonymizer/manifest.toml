[metadata]
tier = "standard"
name = "mysql-anonymizer"
version = "0.10.0"
description = "MySQL Data Anonymization Tool"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3", "/app/anonymize.py"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "MySQL Data Anonymization Tool"
"org.opencontainers.image.title" = "mysql-anonymizer"
"org.opencontainers.image.vendor" = "Evergreen"
"org.opencontainers.image.version" = "0.10.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
