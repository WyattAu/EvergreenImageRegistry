[metadata]
name = "coredns"
version = "1.12.0"
description = "CoreDNS - DNS server and service discovery for Kubernetes"
vendor = "CNCF"
source = "https://github.com/coredns/coredns"
license = "Apache-2.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/coredns/coredns/releases/download/v1.12.0/coredns-1.12.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/coredns"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.title" = "coredns"
"org.opencontainers.image.vendor" = "Coredns"
"org.opencontainers.image.version" = "1.12.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "0-1"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-rolling"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.runtime" = "go"
"evergreen.hft.runtime-hints" = "GOMAXPROCS=<cores>"
"evergreen.hft.sched-policy" = "SCHED_FIFO"
"evergreen.hft.sched-priority" = "65"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "critical""evergreen.metrics.native" = "ztunnel"
