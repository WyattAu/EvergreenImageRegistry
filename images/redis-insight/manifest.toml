[metadata]
name = "redis-insight"
version = "2.54.0"
description = "RedisInsight - visualization and management tool for Redis"
vendor = "Redis"
source = "https://github.com/RedisInsight/RedisInsight"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/redis-insight/redis-insight/releases/download/v2.54.0/redis-insight-2.54.0-linux-amd64.tar.gz"
binary_name = "redis-insight"
filename = "redis-insight-2.54.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 8001
metrics = 9101

[labels]
"org.opencontainers.image.title" = "redis-insight"
"org.opencontainers.image.description" = "RedisInsight - visualization and management tool for Redis"
"org.opencontainers.image.version" = "2.54.0"
"org.opencontainers.image.vendor" = "Redis"
"org.opencontainers.image.source" = "https://github.com/RedisInsight/RedisInsight"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
