[metadata]
name = "mysql-restore"
version = "8.0"
description = "MySQL Restore Container with xz/gz/sql support"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/app/restore.sh"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "MySQL Restore Container with xz/gz/sql support"
"org.opencontainers.image.title" = "mysql-restore"
"org.opencontainers.image.vendor" = "Oracle"
"org.opencontainers.image.version" = "8.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

