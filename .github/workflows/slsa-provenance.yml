name: SLSA v3 Provenance

on:
  workflow_run:
    workflows: ['Build on Push', 'Nightly Full Rebuild']
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  actions: read
  contents: read
  packages: write

concurrency:
  group: provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total: ${{ steps.set-matrix.outputs.total }}
      skipped: ${{ steps.set-matrix.outputs.skipped }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download image references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: built-list-*-batch-*
          path: /tmp/batches/
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true

      - name: Consolidate image references
        run: |
          mkdir -p /tmp/references
          cat /tmp/batches/built-images.txt 2>/dev/null | sort -u > /tmp/references/images.txt || true
          TOTAL=$(wc -l < /tmp/references/images.txt 2>/dev/null || echo "0")
          echo "Found ${TOTAL} image references"
          if [ "${TOTAL}" -eq 0 ]; then
            echo "::warning::No built image references found from upstream workflow"
          fi

      - name: Install crane
        run: |
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz \
            | tar -xzf - crane
          chmod +x crane && mv crane /usr/local/bin/
          crane version

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve digests and create matrix
        id: set-matrix
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os

          with open("/tmp/references/images.txt") as f:
              refs = [line.strip() for line in f if line.strip()]

          if not refs:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("matrix={\"include\":[]}\n")
                  f.write("total=0\n")
                  f.write("skipped=0\n")
              print("No images found to process")
              exit(0)

          items = []
          failed = []
          for ref in refs:
              try:
                  result = subprocess.run(
                      ["crane", "digest", ref],
                      capture_output=True, text=True, timeout=120
                  )
                  digest = result.stdout.strip()
                  if not digest.startswith("sha256:"):
                      failed.append(ref)
                      print(f"WARN: Invalid digest for {ref}: {digest}")
                      continue
                  image_name = ref.split(":")[0] if ":" in ref else ref
                  items.append({"image": image_name, "digest": digest})
                  print(f"  {image_name}@{digest}")
              except Exception as e:
                  failed.append(ref)
                  print(f"WARN: {ref}: {e}")

          MAX_IMAGES = 85
          skipped = max(0, len(items) - MAX_IMAGES)
          items = items[:MAX_IMAGES]

          matrix = json.dumps({"include": items})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix}\n")
              f.write(f"total={len(items)}\n")
              f.write(f"skipped={skipped}\n")

          print(f"\nResolved {len(items)}/{len(refs)} digests")
          if skipped > 0:
              print(f"WARNING: {skipped} images skipped (matrix limit)")
          if failed:
              print(f"WARNING: {len(failed)} images failed digest resolution")
          PYEOF

  generate-provenance:
    name: Generate SLSA Provenance
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.total != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download image references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: built-list-*-batch-*
          path: /tmp/batches
      - name: Generate provenance attestations
        run: |
          TAG="${{ github.sha }}"
          REGISTRY="ghcr.io"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cat /tmp/batches/built-list-*/built-images.txt 2>/dev/null | sort -u | while read -r ref; do
            [ -z "$ref" ] && continue
            echo "::group::Attest ${ref}"
            cosign attest --yes \
              --predicate - \
              --type slsaprovenance \
              "${ref}" <<EOF
          {
            "_type": "https://in-toto.io/Statement/v0.1",
            "predicateType": "https://slsa.dev/provenance/v0.2",
            "predicate": {
              "builder": { "id": "${{ github.repository }}" },
              "buildType": "evergreen-image-registry/build-on-push",
              "invocation": {
                "configSource": {
                  "uri": "${{ github.server_url }}/${{ github.repository }}",
                  "digest": { "sha1": "${{ github.sha }}" },
                  "entryPoint": ".github/workflows/build-on-push.yml"
                }
              },
              "materials": [{ "uri": "${{ github.server_url }}/${{ github.repository }}", "digest": { "sha1": "${{ github.sha }}" } }]
            }
          }
          EOF
            echo "::endgroup::"
          done

  summary:
    name: Provenance Summary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [prepare, generate-provenance]
    if: always()
    steps:
      - run: |
          {
            echo "# SLSA v3 Provenance Summary"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Images processed** | ${{ needs.prepare.outputs.total }} |"
            echo "| **Images skipped** | ${{ needs.prepare.outputs.skipped }} |"
            echo "| **Prepare** | ${{ needs.prepare.result }} |"
            echo "| **Provenance** | ${{ needs.generate-provenance.result }} |"
            echo ""
            echo "SLSA v3 provenance attestations have been attached to images as OCI referrers."
            echo "Verify with: \`cosign verify-attestation --type slsaprovenance <image>\`"
          } >> "$GITHUB_STEP_SUMMARY"
