[metadata]
name = "radarr"
version = "5.14.0"
description = "Radarr - movie collection manager for Usenet and BitTorrent"
vendor = "Radarr"
source = "https://github.com/Radarr/Radarr"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/radarr/radarr/releases/download/v5.14.0/radarr-5.14.0-linux-amd64.tar.gz"
binary_name = "radarr"
filename = "radarr-5.14.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 7878
metrics = 9101

[labels]
"org.opencontainers.image.title" = "radarr"
"org.opencontainers.image.description" = "Radarr - movie collection manager for Usenet and BitTorrent"
"org.opencontainers.image.version" = "5.14.0"
"org.opencontainers.image.vendor" = "Radarr"
"org.opencontainers.image.source" = "https://github.com/Radarr/Radarr"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "none"
