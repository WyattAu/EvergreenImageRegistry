[metadata]
tier = "standard"
name = "meilisearch-python"
version = "3.12"
description = "meilisearch-python container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "python"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python"]

[ports]
expose = [7700, 9101]

[labels]
"org.opencontainers.image.title" = "meilisearch-python"
"org.opencontainers.image.vendor" = "Meilisearch"
"org.opencontainers.image.version" = "3.12"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
