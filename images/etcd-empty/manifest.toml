[metadata]
name = "etcd-empty"
version = "3.6.10"
description = "etcd-empty container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/etcd"]
cmd = ["--data-dir", "/etcd-data", "--listen-client-urls", "http://0.0.0.0:2379", "--advertise-client-urls", "http://localhost:2379"]

[ports]
expose = [2379, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/etcd-io/etcd"
"org.opencontainers.image.title" = "etcd-empty"
"org.opencontainers.image.vendor" = "etcd"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.deploy-strategy" = "hft-stateful"
"sovereign.hft.init-system" = "none"
"sovereign.hft.sched-policy" = "SCHED_OTHER"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "database"
"sovereign.image.note" = "Empty etcd for bootstrapping new clusters. Mount persistent volume at /etcd-data."
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

