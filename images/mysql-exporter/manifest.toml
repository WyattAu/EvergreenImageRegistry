[metadata]
name = "mysql-exporter"
version = "0.15.0"
description = "MySQL Exporter - Prometheus exporter for MySQL server"
vendor = "Prometheus"
source = "https://github.com/prometheus/mysqld_exporter"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/mysql-exporter/mysql-exporter/releases/download/v0.15.0/mysql-exporter-0.15.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/mysqld_exporter"]

[ports]
expose = [9104, 9101]

[labels]
"org.opencontainers.image.title" = "mysql-exporter"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.version" = "0.15.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

