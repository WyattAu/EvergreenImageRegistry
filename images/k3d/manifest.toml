[metadata]
tier = "standard"
name = "k3d"
version = "5.8.3"
description = "Evergreen hardened k3d - K3s in Docker"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/k3d"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened k3d - K3s in Docker"
"org.opencontainers.image.title" = "k3d"
"org.opencontainers.image.vendor" = "k3d"
"org.opencontainers.image.version" = "5.8.3"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
