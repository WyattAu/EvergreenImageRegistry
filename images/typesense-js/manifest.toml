[metadata]
tier = "standard"
name = "typesense-js"
version = "20"
description = "typesense-js container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "node"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]

[ports]
expose = [8108, 9101]

[labels]
"org.opencontainers.image.title" = "typesense-js"
"org.opencontainers.image.vendor" = "Typesense"
"org.opencontainers.image.version" = "20"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
