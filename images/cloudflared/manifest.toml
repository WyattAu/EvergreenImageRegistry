[metadata]
name = "cloudflared"
version = "2026.3.0"
upstream_version = "2026.3.0"
description = "Cloudflared - Cloudflare Tunnel daemon"
vendor = "Cloudflare"
source = "https://github.com/cloudflare/cloudflared"
license = "Apache-2.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "binary-release"
url = "https://github.com/cloudflare/cloudflared/releases/download/2026.3.0/cloudflared-linux-amd64"

[runtime]
entrypoint = ["/cloudflared"]

[ports]
expose = [7844, 9101]

[labels]
"org.opencontainers.image.title" = "cloudflared"
"org.opencontainers.image.vendor" = "Cloudflare"
"org.opencontainers.image.version" = "2026.3.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "0-1"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-rolling"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
