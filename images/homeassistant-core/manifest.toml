[metadata]
tier = "standard"
name = "homeassistant-core"
version = "2024.8.0"
description = "homeassistant-core container image"

[build]
base = "debian:bookworm-slim"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python", "-m", "homeassistant"]
cmd = ["--help"]

[ports]
expose = [9101]

