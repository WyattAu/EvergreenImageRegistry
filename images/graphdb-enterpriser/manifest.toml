[metadata]
name = "graphdb-enterpriser"
version = "latest"
description = "Sovereign hardened GraphDB Enterprise - semantic graph database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ontotext/graphdb:${VERSION}"

[runtime]
entrypoint = ["/opt/graphdb/bin/graphdb"]

[ports]
expose = [7200, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened GraphDB Enterprise - semantic graph database"
"org.opencontainers.image.title" = "graphdb-enterpriser"
"org.opencontainers.image.vendor" = "Ontotext"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

