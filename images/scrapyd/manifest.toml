[metadata]
name = "scrapyd"
version = "1.5.0"
description = "scrapyd container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["scrapyd"]

[ports]
expose = [6800, 9101]

[labels]
"org.opencontainers.image.title" = "scrapyd"
"org.opencontainers.image.vendor" = "Scrapy"
"org.opencontainers.image.version" = "1.5.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

