[metadata]
name = "cassandra-operator"
version = "1.20.0"
description = "Sovereign hardened cass-operator - Kubernetes operator for Apache Cassandra"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/k8ssandra/cass-operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/cass-operator"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened cass-operator - Kubernetes operator for Apache Cassandra"
"org.opencontainers.image.title" = "cassandra-operator"
"org.opencontainers.image.vendor" = "k8ssandra"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

