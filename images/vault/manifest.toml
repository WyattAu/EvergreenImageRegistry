[metadata]
name = "vault"
version = "1.18.1"
description = "Vault - secrets management and data protection by HashiCorp"
vendor = "HashiCorp"
source = "https://github.com/hashicorp/vault"
license = "MPL-2.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://releases.hashicorp.com/vault/1.18.1/vault_1.18.1_linux_amd64.zip"

[runtime]
entrypoint = ["/vault"]

[ports]
expose = [8200, 9101]

[labels]
"org.opencontainers.image.title" = "vault"
"org.opencontainers.image.vendor" = "HashiCorp"
"org.opencontainers.image.version" = "1.18.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.cap-drop" = "ALL"
"evergreen.hft.cap-required" = "CAP_SYS_NICE"
"evergreen.hft.fips-required" = "true"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "5000ms"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
