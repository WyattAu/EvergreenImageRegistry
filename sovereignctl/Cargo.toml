[package]
name = "sovereignctl"
version = "1.0.0"
edition = "2021"
description = "Sovereign image registry management toolchain"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
walkdir = "2"
indicatif = "0.17"
colored = "2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
glob = "0.3"
semver = "1"
chrono = "0.4"

[[bin]]
name = "sovereignctl"
path = "src/main.rs"

[lib]
name = "sovereignctl"
path = "src/lib.rs"
