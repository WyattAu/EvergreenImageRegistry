[metadata]
name = "postgresql"
version = "17.4"
description = "PostgreSQL - advanced open source relational database"
vendor = "PostgreSQL"
source = "https://github.com/postgres/postgres"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/postgresql/postgresql/releases/download/v17.4/postgresql-17.4-linux-amd64.tar.gz"

[runtime]
entrypoint = ["sh", "-c", "postgres"]

[ports]
expose = [5432, 9101]

[labels]
"org.opencontainers.image.title" = "postgresql"
"org.opencontainers.image.vendor" = "PostgreSQL"
"org.opencontainers.image.version" = "17.4"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "http"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "true"

