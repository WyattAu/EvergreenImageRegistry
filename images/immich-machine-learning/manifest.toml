[metadata]
name = "immich-machine-learning"
version = "2.7.5"
description = "immich-machine-learning container image"
tier = "critical"
upstream_version = "2.7.5"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/immich-app/immich-machine-learning"
[runtime]
entrypoint = ["python3"]

[ports]
expose = [3003, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/immich-app/immich/releases"
"org.opencontainers.image.title" = "immich-machine-learning"
"org.opencontainers.image.vendor" = "Immich"
"org.opencontainers.image.version" = "2.7.5"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
