[metadata]
tier = "standard"
name = "comfyui"
version = "latest"
description = "comfyui container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3", "/opt/comfyui/main.py", "--listen", "--port", "8188"]

[ports]
expose = [8188, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/comfyanonymous/ComfyUI.git"
"org.opencontainers.image.title" = "comfyui"
"org.opencontainers.image.vendor" = "ComfyUI"
"org.opencontainers.image.version" = "latest"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

