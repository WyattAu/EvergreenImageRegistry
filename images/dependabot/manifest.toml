[metadata]
name = "dependabot"
version = "0.275.1"
description = "GitHub Dependabot - automated dependency updates for your codebase"
vendor = "GitHub"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/github/dependabot-updater-internal:latest"

[runtime]
entrypoint = ["dependabot"]
cmd = ["scan"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Dependabot - Automated dependency updates"
"org.opencontainers.image.source" = "https://github.com/dependabot/dependabot-core"
"org.opencontainers.image.title" = "dependabot"
"org.opencontainers.image.vendor" = "GitHub"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "devops"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

