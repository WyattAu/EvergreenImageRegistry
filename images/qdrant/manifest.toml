[metadata]
tier = "standard"
name = "qdrant"
version = "1.17.1"
description = "qdrant - vector similarity search engine"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "source-build"
url = "https://github.com/qdrant/qdrant"
language = "rust"
target = "x86_64-unknown-linux-musl"

[runtime]
entrypoint = ["/qdrant"]

[ports]
expose = [6333, 6334, 9101]

[labels]
"org.opencontainers.image.title" = "qdrant"
"org.opencontainers.image.vendor" = "Qdrant"
"org.opencontainers.image.version" = "1.17.1"
"org.opencontainers.image.source" = "https://github.com/qdrant/qdrant"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
