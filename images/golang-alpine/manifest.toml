[metadata]
tier = "standard"
name = "golang-alpine"
version = "1.22.10"
description = "Evergreen hardened go-1.23-alpine - Go build base (no Alpine, scratch)"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/golang-latest"
[runtime]
entrypoint = ["go"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened go-1.23-alpine - Go build base (no Alpine, scratch)"
"org.opencontainers.image.title" = "go-1.23-alpine"
"org.opencontainers.image.vendor" = "Go"
"org.opencontainers.image.version" = "1.22.10"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
