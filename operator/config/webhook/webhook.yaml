apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: evergreen-pod-validation
  labels:
    app.kubernetes.io/name: evergreen-operator
webhooks:
  - name: pods.evergreenimageregistry.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: evergreen-operator-webhook
        namespace: evergreen-system
        path: /validate-pod
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
    namespaceSelector:
      matchLabels:
        evergreenimageregistry.io/validate: "true"
