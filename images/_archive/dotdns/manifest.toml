[metadata]
tier = "standard"
name = "dotdns"
version = "0.1.0"
description = "DotDNS - DNS-over-TLS proxy server (stub - upstream repo not found)"
vendor = "nicich"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/dotdns"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened DotDNS - DNS-over-TLS proxy server"
"org.opencontainers.image.title" = "dotdns"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.category" = "dns"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
