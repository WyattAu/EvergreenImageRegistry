[metadata]
tier = "standard"
name = "memgraph"
version = "3.9.0"
description = "Evergreen hardened Memgraph - in-memory graph database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "memgraph/memgraph:${VERSION}"

[runtime]
entrypoint = ["/opt/memgraph/bin/memgraph", "--data-directory=/var/lib/memgraph"]

[ports]
expose = [7687, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Memgraph - in-memory graph database"
"org.opencontainers.image.title" = "memgraph"
"org.opencontainers.image.vendor" = "Memgraph"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
