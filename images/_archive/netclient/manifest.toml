[metadata]
tier = "standard"
name = "netclient"
version = "v1.5.1"
description = "netclient container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "gravitl/netclient:v1.5.1"

[runtime]
entrypoint = ["/netclient"]

[ports]
expose = [443, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/gravitl/netmaker"
"org.opencontainers.image.title" = "netclient"
"org.opencontainers.image.vendor" = "Gravitl"
"org.opencontainers.image.version" = "v1.5.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
