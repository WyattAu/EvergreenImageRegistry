[metadata]
name = "ocserv"
version = "1.3.0"
description = "OpenConnect VPN server (AnyConnect-compatible)"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/sbin/ocserv"]
cmd = ["-f"]

[ports]
expose = [443, 9101]

[labels]
"org.opencontainers.image.description" = "OpenConnect VPN server (AnyConnect-compatible)"
"org.opencontainers.image.source" = "https://www.infradead.org/ocserv/"
"org.opencontainers.image.title" = "ocserv"
"org.opencontainers.image.vendor" = "OpenConnect"
"org.opencontainers.image.version" = "1.3.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "5000ms"
"sovereign.image.category" = "security"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

