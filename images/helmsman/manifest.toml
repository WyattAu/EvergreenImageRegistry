[metadata]
name = "helmsman"
version = "4.0.5"
description = "Sovereign hardened helmsman - Helm charts as code"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/helmsman"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened helmsman - Helm charts as code"
"org.opencontainers.image.title" = "helmsman"
"org.opencontainers.image.vendor" = "Praqma"
"org.opencontainers.image.version" = "4.0.5"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

