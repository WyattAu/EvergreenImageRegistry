[metadata]
name = "stalwart-bitnami"
version = "0.16.2"
description = "Stalwart Mail Server (Bitnami variant) - all-in-one mail server"
vendor = "stalwartlabs"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/stalwartlabs/stalwart/releases/download/v0.16.2/stalwart-x86_64-unknown-linux-musl.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/stalwart"]
cmd = ["mail"]

[ports]
expose = [25, 9101]

[labels]
"org.opencontainers.image.description" = "Stalwart Mail Server (Bitnami variant) - all-in-one mail server"
"org.opencontainers.image.source" = "https://github.com/stalwartlabs/stalwart"
"org.opencontainers.image.title" = "stalwart-bitnami"
"org.opencontainers.image.vendor" = "stalwartlabs"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "tcp"
"sovereign.image.category" = "email"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

