[metadata]
name = "neptune"
version = "1.2.0"
description = "AWS Neptune local development compatibility - Gremlin/SPARQL graph database for dev environments"
vendor = "AWS"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://aws.amazon.com/neptune/"

[runtime]
entrypoint = ["/app/neptune"]

[ports]
expose = [8182, 9101]

[labels]
"org.opencontainers.image.description" = "AWS Neptune local development compatibility - Gremlin/SPARQL for dev environments"
"org.opencontainers.image.source" = "https://aws.amazon.com/neptune/"
"org.opencontainers.image.title" = "neptune"
"org.opencontainers.image.vendor" = "AWS"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.note" = "AWS Neptune is a fully managed cloud service. This image provides development-only compatibility."
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

