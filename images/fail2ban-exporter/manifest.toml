[metadata]
name = "fail2ban-exporter"
version = "v0.10.0"
description = "fail2ban-exporter container image"
deprecated = true
upstream_gone = "https://github.com/xperimental/fail2ban-exporter deleted; no forks found"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"
multiarch = false

[source]
type = "package-manager"

[runtime]
entrypoint = ["/fail2ban-exporter"]
cmd = ["--web.listen-address=:9191", "--web.telemetry-path=/metrics", "--fail2ban.socket=/tmp/fail2ban.sock"]

[ports]
expose = [9191, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/xperimental/fail2ban-exporter"
"org.opencontainers.image.title" = "fail2ban-exporter"
"org.opencontainers.image.vendor" = "xperimental"
"org.opencontainers.image.version" = "v0.10.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "monitoring"
"evergreen.image.note" = "UPSTREAM GONE: xperimental/fail2ban-exporter repo deleted, no forks found. Cannot build from source."
"evergreen.image.status" = "best-effort"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
