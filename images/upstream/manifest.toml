[metadata]
tier = "standard"
name = "upstream"
version = "unknown"
description = "Meta directory for upstream version tracking. Not a runnable container."

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Meta directory for upstream version tracking. Not a runnable container."
"org.opencontainers.image.title" = "upstream"
"evergreen.base.image" = "wolfi"
"evergreen.health.type" = "none"
"evergreen.image.category" = "meta"
"evergreen.image.note" = "Upstream tracking directory, not a container image."
"evergreen.image.status" = "reference"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
