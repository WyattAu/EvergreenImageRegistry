[metadata]
tier = "standard"
name = "grype-alpine"
version = "0.80.0"
description = "Grype - vulnerability scanner (no Alpine)"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/grype"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Grype - vulnerability scanner (no Alpine)"
"org.opencontainers.image.source" = "https://github.com/anchore/grype"
"org.opencontainers.image.title" = "grype-alpine"
"org.opencontainers.image.vendor" = "Anchore"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
