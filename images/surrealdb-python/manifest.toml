[metadata]
name = "surrealdb-python"
version = "1.0.0"
description = "Evergreen hardened SurrealDB Python - Python SDK for SurrealDB"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3", "-m", "surrealdb"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened SurrealDB Python - Python SDK for SurrealDB"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

