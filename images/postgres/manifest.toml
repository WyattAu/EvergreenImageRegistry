[metadata]
name = "postgres"
version = "17.10"
description = "PostgreSQL - advanced open source relational database"
vendor = "PostgreSQL"
source = "https://github.com/postgres/postgres"
license = "PostgreSQL"
tier = "critical"
upstream_version = "17.10"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/postgres/postgres/releases/download/v17.10/postgres-17.10-linux-amd64.tar.gz"

[runtime]
entrypoint = ["postgres"]

[ports]
expose = [5432, 9101]

[labels]
"org.opencontainers.image.title" = "postgres"
"org.opencontainers.image.vendor" = "PostgreSQL"
"org.opencontainers.image.version" = "17.10"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
