[metadata]
name = "fail2ban"
version = "1.0.2"
description = "fail2ban container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "appuser"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["fail2ban"]

[ports]
expose = [22, 9101]

[labels]
"org.opencontainers.image.title" = "fail2ban"
"org.opencontainers.image.vendor" = "Fail2Ban"
"org.opencontainers.image.version" = "1.0.2"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

