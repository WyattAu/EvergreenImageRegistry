name: Build and Push Images to GHCR

# This workflow is disabled - using build.yml instead for full builds
# Keeping for reference until fully migrated

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.discover.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover Dockerfiles
        id: discover
        run: |
          # List directories with Dockerfiles
          cd images
          IMAGES=$(for d in */; do echo "${d%/}"; done | tr '\n' ',' | sed 's/,$//')
          cd ..
          echo "images=[$IMAGES]" >> $GITHUB_OUTPUT
          echo "Found: $(echo $IMAGES | tr ',' '\n' | wc -l) images"

  build-and-push:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag,pattern={{prefix}}v(.*)
            type=semver,pattern={{prefix}}v(.*)
            type=raw,value=latest,enable={{ is_default_branch }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./images/${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
