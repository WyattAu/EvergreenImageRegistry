[metadata]
name = "kube-controller"
version = "1.30.1"
description = "Kubernetes Controller Manager - control plane component"
vendor = "Kubernetes"
source = "https://github.com/kubernetes/kubernetes"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/kube-controller/kube-controller/releases/download/v1.30.1/kube-controller-1.30.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["kube-controller-manager"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened kube-controller - Kubernetes controller manager"
"org.opencontainers.image.title" = "kube-controller"
"org.opencontainers.image.vendor" = "Kubernetes"
"org.opencontainers.image.version" = "1.30.1"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "15s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

