[metadata]
name = "collabora-online-code"
version = "24.04.10.2"
description = "collabora-online-code container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/bin/loolwsd"]

[ports]
expose = [9980, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/CollaboraOnline/online"
"org.opencontainers.image.title" = "collabora-online-code"
"org.opencontainers.image.vendor" = "Collabora"
"org.opencontainers.image.version" = "24.04.10.2"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "30s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "60000ms"
"evergreen.image.category" = "document-management"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

