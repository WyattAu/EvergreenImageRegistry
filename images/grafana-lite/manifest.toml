[metadata]
name = "grafana-lite"
version = "10.4.1"
description = "Grafana Lite - lightweight Grafana dashboard"
vendor = "Grafana Labs"
source = "https://github.com/grafana/grafana"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/grafana-lite/grafana-lite/releases/download/v10.4.1/grafana-lite-10.4.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/grafana-server"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "Grafana OSS in lite mode - minimal plugins, no analytics"
"org.opencontainers.image.title" = "grafana-lite"
"org.opencontainers.image.vendor" = "Grafana Labs"
"org.opencontainers.image.version" = "10.4.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.connection-drain" = "false"
"sovereign.hft.cpu-pins" = "2-3"
"sovereign.hft.cpu-pins-mode" = "shared"
"sovereign.hft.deploy-strategy" = "standard-rolling"
"sovereign.hft.init-system" = "none"
"sovereign.hft.pre-stop-hook" = "false"
"sovereign.hft.runtime" = "go"
"sovereign.hft.runtime-hints" = "GOMAXPROCS=<cores>"
"sovereign.hft.sched-policy" = "SCHED_OTHER"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "10000ms"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

