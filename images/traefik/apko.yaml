---
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-base
    - ca-certificates-bundle
    - traefik

entrypoint:
  command: /usr/bin/traefik
cmd: []

accounts:
  groups:
    - groupname: traefik
      gid: 65532
  users:
    - username: traefik
      uid: 65532
      gid: 65532
      shell: /usr/sbin/nologin
  run-as: traefik

environment:
  HOME: /home/traefik

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: https://github.com/traefik/traefik
  org.opencontainers.image.title: traefik
  org.opencontainers.image.description: Modern HTTP reverse proxy

stop-signal: SIGTERM
