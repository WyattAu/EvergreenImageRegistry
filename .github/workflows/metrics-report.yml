name: Metrics Report
on:
  schedule:
    - cron: '0 0 * * 0' # Weekly at midnight UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Build evergreenctl
        run: cd evergreenctl && cargo build --release
      - name: Generate metrics
        run: |
          METRICS_JSON=$(cd evergreenctl && ./target/release/evergreenctl report --format json --images-dir ../images)
          echo "$METRICS_JSON" > metrics-snapshot.json

          {
            echo "## Registry Metrics Report"
            echo ""
            echo "$METRICS_JSON"
          } >> "$GITHUB_STEP_SUMMARY"

          # Extract key metrics for summary
          TOTAL=$(echo "$METRICS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total_images',0))")
          REAL=$(echo "$METRICS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('real_images',0))")
          PLACEHOLDER=$(echo "$METRICS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('placeholder_images',0))")
          DEPRECATED=$(echo "$METRICS_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('deprecated_images',0))")

          echo "Total: $TOTAL | Real: $REAL | Placeholder: $PLACEHOLDER | Deprecated: $DEPRECATED" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload metrics artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: metrics-snapshot
          path: metrics-snapshot.json
          retention-days: 90
