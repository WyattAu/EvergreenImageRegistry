[metadata]
name = "envoy"
version = "1.38.0"
description = "Envoy - high-performance edge and service proxy"
vendor = "Envoy Proxy"
source = "https://github.com/envoyproxy/envoy"
license = "Apache-2.0"
tier = "1"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/envoyproxy/envoy/releases/download/v1.38.0/envoy-1.38.0-linux-x86_64"

[runtime]
entrypoint = ["/usr/local/bin/envoy"]

[ports]
expose = [9901, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Envoy - high-performance edge and service proxy"
"org.opencontainers.image.title" = "envoy"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "proxy"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

