[metadata]
name = "tidb"
version = "8.4.0"
description = "TiDB - distributed NewSQL database compatible with MySQL"
vendor = "PingCAP"
source = "https://github.com/pingcap/tidb"
license = "Apache-2.0"
tier = "2"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "pingcap/tidb:${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/tidb-server"]

[ports]
expose = [4000, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened TiDB - distributed NewSQL database"
"org.opencontainers.image.title" = "tidb"
"org.opencontainers.image.vendor" = "PingCAP"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

