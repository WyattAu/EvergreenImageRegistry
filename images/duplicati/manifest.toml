[metadata]
name = "duplicati"
version = "2.1.0.1"
description = "duplicati container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["dotnet", "/opt/duplicati/Duplicati.Server.exe"]

[ports]
expose = [8200, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/duplicati/duplicati"
"org.opencontainers.image.title" = "duplicati"
"org.opencontainers.image.vendor" = "Duplicati"
"org.opencontainers.image.version" = "2.1.0.1"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "10s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "30000ms"
"sovereign.image.category" = "cloud-storage"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

