[metadata]
name = "traefik-v2"
version = "2.11.42"
description = "Traefik v2 - modern HTTP reverse proxy and load balancer"
vendor = "Traefik Labs"
source = "https://github.com/traefik/traefik"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/traefik-v2/traefik-v2/releases/download/v2.11.42/traefik-v2-2.11.42-linux-amd64.tar.gz"
binary_name = "traefik-v2"
filename = "traefik-v2-2.11.42-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 80
metrics = 9101

[labels]
"org.opencontainers.image.title" = "traefik-v2"
"org.opencontainers.image.description" = "Traefik v2 - modern HTTP reverse proxy and load balancer"
"org.opencontainers.image.version" = "2.11.42"
"org.opencontainers.image.vendor" = "Traefik Labs"
"org.opencontainers.image.source" = "https://github.com/traefik/traefik"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
