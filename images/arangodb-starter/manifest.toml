[metadata]
name = "arangodb-starter"
version = "3.11.10.1"
description = "ArangoDB in starter mode for cluster and resilient single-server deployments"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "arangodb/arangodb:${VERSION}"

[runtime]
entrypoint = ["/arangod", "--serverstarter"]

[ports]
expose = [8529, 9101]

[labels]
"org.opencontainers.image.description" = "ArangoDB in starter mode for cluster and resilient single-server deployments"
"org.opencontainers.image.title" = "arangodb-starter"
"org.opencontainers.image.vendor" = "ArangoDB"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-5"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-stateful"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

