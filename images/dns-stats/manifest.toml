[metadata]
tier = "standard"
name = "dns-stats"
version = "0.5.0"
description = "DNS capture and statistics collection tool (dnscap/dnsstats)"
vendor = "PowerDNS"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/dmachard/dns-stats"

[runtime]
entrypoint = ["/usr/local/bin/dns-stats"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened DNS Stats - DNS monitoring and statistics tool"
"org.opencontainers.image.title" = "dns-stats"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.category" = "monitoring"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

