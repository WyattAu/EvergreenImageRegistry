[metadata]
name = "photoshow"
version = "v2"
description = "PhotoShow - PHP gallery for browsing and sharing photos"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "github-release"
url = "https://github.com/thibaud-rohmer/PhotoShow"

[runtime]
entrypoint = ["php", "-S", "0.0.0.0:8080", "-t", "/app"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "PhotoShow - PHP gallery for browsing and sharing photos"
"org.opencontainers.image.title" = "photoshow"
"org.opencontainers.image.vendor" = "thibaud-rohmer"
"org.opencontainers.image.version" = "v2"
"org.opencontainers.image.source" = "https://github.com/thibaud-rohmer/PhotoShow"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.image.status" = "functional"
"evergreen.metrics.native" = "ztunnel"
