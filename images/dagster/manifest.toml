[metadata]
name = "dagster"
version = "1.10.0"
description = "Dagster - data orchestration platform"
vendor = "Dagster"
source = "https://github.com/dagster-io/dagster"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/dagster/dagster/releases/download/v1.10.0/dagster-1.10.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["dagster-webserver"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.title" = "dagster"
"org.opencontainers.image.vendor" = "Dagster"
"org.opencontainers.image.version" = "1.10.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
