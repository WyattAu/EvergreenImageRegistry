[metadata]
name = "firefly-iii"
version = "6.1.8"
description = "firefly-iii container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "www-data"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.title" = "firefly-iii"
"org.opencontainers.image.vendor" = "Firefly III"
"org.opencontainers.image.version" = "6.1.8"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

