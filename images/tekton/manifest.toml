[metadata]
name = "tekton"
version = "0.60.0"
description = "Tekton - cloud-native CI/CD solution for Kubernetes"
vendor = "TektonCD"
source = "https://github.com/tektoncd/pipeline"
license = "Apache-2.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/tektoncd/pipeline/releases/download/0.60.0/tekton-linux-amd64.tar.gz"
binary_name = "tekton"
filename = "tekton-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9090
metrics = 9101

[labels]
"org.opencontainers.image.title" = "tekton"
"org.opencontainers.image.description" = "Tekton - cloud-native CI/CD solution for Kubernetes"
"org.opencontainers.image.version" = "0.60.0"
"org.opencontainers.image.vendor" = "TektonCD"
"org.opencontainers.image.source" = "https://github.com/tektoncd/pipeline"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
