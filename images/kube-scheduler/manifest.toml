[metadata]
name = "kube-scheduler"
version = "1.30.1"
description = "Kubernetes Scheduler - control plane component"
vendor = "Kubernetes"
source = "https://github.com/kubernetes/kubernetes"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/kube-scheduler/kube-scheduler/releases/download/v1.30.1/kube-scheduler-1.30.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["kube-scheduler"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened kube-scheduler - Kubernetes scheduler"
"org.opencontainers.image.title" = "kube-scheduler"
"org.opencontainers.image.vendor" = "Kubernetes"
"org.opencontainers.image.version" = "1.30.1"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "15s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

