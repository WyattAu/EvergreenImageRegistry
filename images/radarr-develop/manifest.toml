[metadata]
tier = "standard"
name = "radarr-develop"
version = "6.3.0"
description = "radarr-develop container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/linuxserver-radarr"
[runtime]
entrypoint = ["/app/Radarr"]

[ports]
expose = [7878, 9101]

[labels]
"org.opencontainers.image.title" = "radarr-develop"
"evergreen.health.type" = "exec"
"evergreen.metrics.native" = "ztunnel"

"evergreen.image.tier" = "standard"