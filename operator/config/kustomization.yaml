apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evergreen-system

resources:
  - manager/namespace.yaml
  - manager/manager.yaml
  - rbac/service_account.yaml
  - rbac/role.yaml
  - rbac/role_binding.yaml
  - webhook/webhook.yaml
  - crd/bases/evergreenimageregistry.io_evergreenimages.yaml
  - crd/bases/evergreenimageregistry.io_evergreenpolicies.yaml
  - crd/bases/evergreenimageregistry.io_evergrendrifts.yaml

images:
  - name: ghcr.io/wyattau/evergreenimageregistry/operator
    newTag: latest

commonLabels:
  app.kubernetes.io/part-of: evergreen-image-registry
