[metadata]
tier = "standard"
name = "maldet"
version = "unknown"
description = "Linux Malware Detect"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/maldet/maldet"]
cmd = ["-a", "/app"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Linux Malware Detect"
"org.opencontainers.image.title" = "maldet"
"org.opencontainers.image.vendor" = "rFXn"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
