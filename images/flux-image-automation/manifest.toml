[image]
name = "flux-image-automation"
type = "binary-download"
tier = 2
version = "0.37.0"
description = "Flux Image Automation Controller - automated container image updates for GitOps"
vendor = "fluxcd"
source_url = "https://github.com/fluxcd/image-automation-controller"
category = "gitops"

[source]
url = "https://github.com/fluxcd/image-automation-controller/releases/download/v0.37.0/image-automation-controller-linux-amd64"
fallback_urls = []
checksum = { algorithm = "sha256", expected = "PENDING", source = "" }
strategy = "curl"
github_repo = "fluxcd/image-automation-controller"

[build]
base = { image = "debian:bookworm-slim", purpose = "download" }
builder_packages = ["curl", "ca-certificates"]
runtime_packages = []
build_commands = [
  "curl --retry 3 --retry-delay 5 -fsSL -H \"Authorization: token ${GITHUB_TOKEN}\" https://github.com/fluxcd/image-automation-controller/releases/download/v0.37.0/image-automation-controller-linux-amd64 -o /tmp/flux-image-automation",
  "chmod +x /tmp/flux-image-automation",
  "strip /tmp/flux-image-automation",
]
artifacts = [
  { source = "/tmp/flux-image-automation", destination = "/usr/local/bin/image-automation-controller" },
]

[runtime]
user = "65532:65532"
workdir = "/app"
entrypoint = ["/usr/local/bin/image-automation-controller"]
cmd = []
ports = [8080]
volumes = []
stop_signal = "SIGTERM"

[health]
type = "http"
path = "/healthz"
port = 8080
interval_seconds = 30
timeout_seconds = 5
retries = 3

[observability]
metrics_port = 9101
metrics_path = "/metrics"

[compliance]
standards = []
labels = {}
