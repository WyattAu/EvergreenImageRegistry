[metadata]
name = "jellyfin"
version = "10.10.0"
description = "Jellyfin - free software media system"
vendor = "Jellyfin"
source = "https://github.com/jellyfin/jellyfin"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/jellyfin/jellyfin/releases/download/v10.10.0/jellyfin-10.10.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/app/jellyfin"]

[ports]
expose = [8096, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/jellyfin/jellyfin"
"org.opencontainers.image.title" = "jellyfin"
"org.opencontainers.image.vendor" = "Jellyfin"
"org.opencontainers.image.version" = "10.10.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.official" = "true"
"sovereign.health.type" = "none"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

