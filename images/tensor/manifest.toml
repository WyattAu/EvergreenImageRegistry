[metadata]
name = "tensor"
version = "2.20.0"
description = "TensorBoard - ML experiment visualization and monitoring tool"
vendor = "tensorflow"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/tensorflow/tensorboard/releases/download/v2.20.0/tensorboard-2.20.0-linux-x86_64.zip"

[runtime]
entrypoint = ["tensorboard"]
cmd = ["--logdir=/app/logs", "--bind_all", "--port=6006"]

[ports]
expose = [6006, 9101]

[labels]
"org.opencontainers.image.description" = "TensorBoard - ML experiment visualization and monitoring tool"
"org.opencontainers.image.source" = "https://github.com/tensorflow/tensorboard"
"org.opencontainers.image.title" = "tensor"
"org.opencontainers.image.vendor" = "TensorFlow"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "http"
"sovereign.image.category" = "ml"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

