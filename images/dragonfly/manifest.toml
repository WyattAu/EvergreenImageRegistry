[metadata]
name = "dragonfly"
version = "1.18.0"
description = "Dragonfly - in-memory data store compatible with Redis and Memcached"
vendor = "Dragonfly"
source = "https://github.com/dragonflydb/dragonfly"
license = "Apache-2.0"
tier = "community"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/dragonfly/dragonfly/releases/download/v1.18.0/dragonfly-1.18.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/dragonfly"]
cmd = ["--bind", "0.0.0.0:6379"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/dragonflydb/dragonfly"
"org.opencontainers.image.title" = "dragonfly"
"org.opencontainers.image.vendor" = "DragonflyDB"
"org.opencontainers.image.version" = "1.18.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

