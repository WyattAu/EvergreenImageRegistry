[metadata]
name = "gitguardian"
version = "unknown"
description = "GitGuardian ggshield - secret detection"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["ggshield"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "GitGuardian ggshield - secret detection"
"org.opencontainers.image.source" = "https://github.com/GitGuardian/ggshield"
"org.opencontainers.image.title" = "gitguardian"
"org.opencontainers.image.vendor" = "GitGuardian"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

