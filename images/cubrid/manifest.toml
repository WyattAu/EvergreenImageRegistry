[metadata]
name = "cubrid"
version = "latest"
description = "Sovereign hardened CUBRID - open source SQL database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "cubrid/cubrid:${VERSION}"

[runtime]
entrypoint = ["/opt/cubrid/bin/cubrid"]

[ports]
expose = [30000, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened CUBRID - open source SQL database"
"org.opencontainers.image.title" = "cubrid"
"org.opencontainers.image.vendor" = "CUBRID"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

