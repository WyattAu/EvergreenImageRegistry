[metadata]
tier = "standard"
name = "derby"
version = "10.17.1.0"
description = "Evergreen hardened Apache Derby - embedded Java database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["java", "-jar", "/opt/derby/lib/derbyrun.jar", "server"]

[ports]
expose = [1527, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Apache Derby - embedded Java database"
"org.opencontainers.image.title" = "derby"
"org.opencontainers.image.vendor" = "Apache Software Foundation"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

