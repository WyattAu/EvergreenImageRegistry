[metadata]
name = "nginx-alpine"
version = "1.27.1"
description = "NGINX web server (alpine variant, built without Alpine)"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/sbin/nginx"]
cmd = ["-g", "daemon off;"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "NGINX web server (alpine variant, built without Alpine)"
"org.opencontainers.image.source" = "https://nginx.org"
"org.opencontainers.image.title" = "nginx-alpine"
"org.opencontainers.image.vendor" = "NGINX Inc"
"org.opencontainers.image.version" = "1.27.1"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "networking"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

