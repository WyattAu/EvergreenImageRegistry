[metadata]
name = "health-shim"
version = "1.0.0"
description = "health-shim container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "go-source"

[runtime]
entrypoint = ["/health-shim"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "health-shim"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.health.type" = "http"
"evergreen.image.category" = "observability"
"evergreen.metrics.native" = "prometheus"

