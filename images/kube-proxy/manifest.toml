[metadata]
name = "kube-proxy"
version = "1.30.1"
description = "Kube-proxy - network proxy on every node"
vendor = "Kubernetes"
source = "https://github.com/kubernetes/kubernetes"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/kube-proxy/kube-proxy/releases/download/v1.30.1/kube-proxy-1.30.1-linux-amd64.tar.gz"
binary_name = "kube-proxy"
filename = "kube-proxy-1.30.1-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
metrics = 9101

[labels]
"org.opencontainers.image.title" = "kube-proxy"
"org.opencontainers.image.description" = "Kube-proxy - network proxy on every node"
"org.opencontainers.image.version" = "1.30.1"
"org.opencontainers.image.vendor" = "Kubernetes"
"org.opencontainers.image.source" = "https://github.com/kubernetes/kubernetes"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "15s"
