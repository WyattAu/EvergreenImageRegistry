[metadata]
tier = "standard"
name = "sqlpage"
version = "0.43.0"
description = "SQL-only web application framework"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/sqlpage/sqlpage"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "SQL-only web application framework"
"org.opencontainers.image.source" = "https://github.com/sqlpage/SQLPage"
"org.opencontainers.image.title" = "sqlpage"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.path" = "/"
"evergreen.health.type" = "http"
"evergreen.image.category" = "web"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "prometheus"
