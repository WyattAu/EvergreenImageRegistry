[metadata]
tier = "standard"
name = "etcd-backup"
version = "3.6.10"
description = "Evergreen hardened etcd backup - etcdctl wrapper for etcd backup and restore operations"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/etcdctl"]

[ports]
expose = [2379, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened etcd backup - etcdctl wrapper for etcd backup and restore operations"
"org.opencontainers.image.title" = "etcd-backup"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "backup"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
