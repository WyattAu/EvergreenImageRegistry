[metadata]
name = "promtail"
version = "2.9.4"
description = "Sovereign hardened Promtail - log collection agent for Grafana Loki"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/bin/promtail"]

[ports]
expose = [9080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Promtail - log collection agent for Grafana Loki"
"org.opencontainers.image.title" = "promtail"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "logging"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

