[metadata]
name = "taiga-front"
version = "6.9.0"
description = "taiga-front container image"
tier = "critical"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["nginx", "-g", "daemon off;"]

[ports]
expose = [80, 443, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/taigaio/taiga-front-dist"
"org.opencontainers.image.title" = "taiga-front"
"org.opencontainers.image.vendor" = "Taiga"
"org.opencontainers.image.version" = "6.8.2"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "project-management"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
