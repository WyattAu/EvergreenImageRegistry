# Evergreen Monitoring Stack
# ----------------------------------------------------------------------------
# Deploys the full Evergreen observability stack using hardened Evergreen images
# (non-root UID 65532, distroless). Designed to run on TrueNAS via docker compose.
#
#   prometheus   - metrics collection + alert rule evaluation
#   alertmanager - alert routing/dedup/dispatch
#   grafana      - dashboards + visualization
#   node-exporter- host (TrueNAS) system metrics
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#
# Images are pulled from GHCR (primary registry). All services run as UID 65532
# and listen on unprivileged ports. Named volumes persist TSDB / Grafana data.
# ----------------------------------------------------------------------------

name: evergreen-monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

services:
  prometheus:
    image: ghcr.io/wyattau/evergreenimageregistry/prometheus:latest
    container_name: evergreen-prometheus
    user: '65532:65532'
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=50GB'
      - '--rules.alert.for-outage-tolerance=1h'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.listen-address=0.0.0.0:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts/evergreen-alerts.yml:/etc/prometheus/rules/evergreen-alerts.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    networks: [monitoring]

  alertmanager:
    image: ghcr.io/wyattau/evergreenimageregistry/alertmanager:latest
    container_name: evergreen-alertmanager
    user: '65532:65532'
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=0.0.0.0:9093'
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - '9093:9093'
    networks: [monitoring]

  grafana:
    image: ghcr.io/wyattau/evergreenimageregistry/grafana:latest
    container_name: evergreen-grafana
    user: '65532:65532'
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-evergreen}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SERVER_HTTP_PORT: '3000'
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_PATHS_DATA: /var/lib/grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    networks: [monitoring]

  node-exporter:
    image: ghcr.io/wyattau/evergreenimageregistry/node-exporter:latest
    container_name: evergreen-node-exporter
    user: '65532:65532'
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=0.0.0.0:9100'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    pid: host
    ports:
      - '9100:9100'
    networks: [monitoring]
