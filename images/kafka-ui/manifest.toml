[metadata]
name = "kafka-ui"
version = "0.7.2"
description = "Kafka UI - open source web UI for Apache Kafka"
vendor = "Kafka UI"
source = "https://github.com/provectus/kafka-ui"
license = "Apache-2.0"
tier = "community"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/kafka-ui/kafka-ui/releases/download/v0.7.2/kafka-ui-0.7.2-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/kafka-ui/kafka-ui"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Kafka UI - web-based Kafka management interface"
"org.opencontainers.image.title" = "kafka-ui"
"org.opencontainers.image.vendor" = "Provectus"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "messaging"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

