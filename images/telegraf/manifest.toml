[metadata]
name = "telegraf"
version = "1.30.3"
description = "Telegraf - metrics collection agent"
vendor = "InfluxData"
source = "https://github.com/influxdata/telegraf"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/telegraf/telegraf/releases/download/v1.30.3/telegraf-1.30.3-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/usr/bin/telegraf"]

[ports]
expose = [8125, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Telegraf - metrics collection agent by InfluxData"
"org.opencontainers.image.title" = "telegraf"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "monitoring"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

