[metadata]
name = "mysql"
version = "8.4.1"
description = "MySQL - open source relational database management system"
vendor = "Oracle"
source = "https://github.com/mysql/mysql-server"
license = "GPL-2.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/mysql/mysql/releases/download/v8.4.1/mysql-8.4.1-linux-amd64.tar.gz"
binary_name = "mysql"
filename = "mysql-8.4.1-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 3306
metrics = 9101

[labels]
"org.opencontainers.image.title" = "mysql"
"org.opencontainers.image.description" = "MySQL - open source relational database management system"
"org.opencontainers.image.version" = "8.4.1"
"org.opencontainers.image.vendor" = "Oracle"
"org.opencontainers.image.source" = "https://github.com/mysql/mysql-server"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "true"
"sovereign.health.type" = "http"
