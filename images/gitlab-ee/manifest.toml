[metadata]
name = "gitlab-ee"
version = "16.11.0"
description = "GitLab EE - self-hosted Git management platform (Enterprise Edition)"
vendor = "GitLab"
source = "https://gitlab.com/gitlab-org/gitlab-ee"
license = "MIT"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://packages.gitlab.com/gitlab/gitlab-ee/packages/ubuntu/jammy/gitlab-ee_16.11.0-ee.0_amd64.deb"

[runtime]
entrypoint = ["/opt/gitlab/bin/gitlab"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "GitLab EE - self-hosted Git management platform (Enterprise)"
"org.opencontainers.image.source" = "https://gitlab.com/gitlab-org/gitlab-ee"
"org.opencontainers.image.title" = "gitlab-ee"
"org.opencontainers.image.vendor" = "GitLab"
"org.opencontainers.image.version" = "16.11.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.debian-slim" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
