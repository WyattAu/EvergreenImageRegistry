# =============================================================================
# EVERGREEN IMAGE REGISTRY — Performance Regression Gate
# =============================================================================
# Blocks image publishing when build time exceeds regression threshold.
# Tracks build time baselines and alerts on >50% increase.
#
# Trigger: On push to images/*/Dockerfile
# =============================================================================

name: Performance Gate

on:
  push:
    paths:
      - 'images/*/Dockerfile'
    branches: [main]
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Regression threshold percentage'
        required: false
        default: '50'
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  performance-gate:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Detect changed images
        id: changes
        run: |
          IMAGES=""
          for f in $(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep 'images/.*Dockerfile' || true); do
            img=$(echo "$f" | grep -oP 'images/\K[^/]+')
            if [ -f "images/$img/Dockerfile" ]; then
              IMAGES="${IMAGES:+$IMAGES }$img"
            fi
          done
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "Changed images: $IMAGES"

      - name: Build timing baseline
        if: steps.changes.outputs.images != ''
        id: timing
        run: |
          THRESHOLD=${{ inputs.threshold || '50' }}
          BASELINE_FILE=".specs/06_5_regression/build_times.json"
          mkdir -p .specs/06_5_regression

          # Load existing baselines
          if [ -f "$BASELINE_FILE" ]; then
            cp "$BASELINE_FILE" /tmp/baselines.json
          else
            echo '{"version":1,"threshold_percent":50,"images":{}}' > /tmp/baselines.json
          fi

          REGRESSIONS=0
          TESTED=0

          for img in ${{ steps.changes.outputs.images }}; do
            dockerfile="images/$img/Dockerfile"
            [ -f "$dockerfile" ] || continue

            echo "::group::Build timing: $img"
            TESTED=$((TESTED + 1))

            START_NS=$(date +%s%N)
            if docker build -t "perf-gate:${img}" "images/${img}" >/dev/null 2>&1; then
              END_NS=$(date +%s%N)
              ELAPSED_MS=$(( (END_NS - START_NS) / 1000000 ))

              # Get baseline
              BASELINE=$(python3 -c "
          import json
          try:
              with open('/tmp/baselines.json') as f:
                  data = json.load(f)
              bt = data.get('images', {}).get('$img', {}).get('build_time_ms', 0)
              print(bt)
          except: print(0)
          ")

              if [ "$BASELINE" -gt 0 ]; then
                INCREASE=$(( (ELAPSED_MS - BASELINE) * 100 / BASELINE ))
                echo "Build time: ${ELAPSED_MS}ms (baseline: ${BASELINE}ms, change: +${INCREASE}%)"

                if [ "$INCREASE" -gt "$THRESHOLD" ]; then
                  echo "::error::REGRESSION DETECTED: $img build time increased by ${INCREASE}% (>${THRESHOLD}% threshold)"
                  REGRESSIONS=$((REGRESSIONS + 1))
                fi
              else
                echo "New baseline: ${ELAPSED_MS}ms"
              fi

              # Update baseline
              python3 -c "
          import json
          from datetime import datetime
          try:
              with open('/tmp/baselines.json') as f:
                  data = json.load(f)
          except:
              data = {'version': 1, 'threshold_percent': $THRESHOLD, 'images': {}}

          if 'images' not in data:
              data['images'] = {}
          data['images']['$img'] = {
              'build_time_ms': $ELAPSED_MS,
              'updated': datetime.utcnow().isoformat() + 'Z'
          }
          with open('/tmp/baselines.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

              docker rmi "perf-gate:${img}" 2>/dev/null || true
            else
              echo "Build failed for $img (skipped)"
            fi
            echo "::endgroup::"
          done

          # Save updated baselines
          cp /tmp/baselines.json "$BASELINE_FILE"

          echo "regressions=$REGRESSIONS" >> "$GITHUB_OUTPUT"
          echo "tested=$TESTED" >> "$GITHUB_OUTPUT"

          if [ "$REGRESSIONS" -gt 0 ]; then
            echo "::error::$REGRESSIONS image(s) have build time regression >${THRESHOLD}%"
            exit 1
          fi

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-baselines
          path: .specs/06_5_regression/build_times.json
          retention-days: 90

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const tested = '${{ steps.timing.outputs.tested }}' || '0';
            const regressions = '${{ steps.timing.outputs.regressions }}' || '0';
            const status = regressions > 0 ? '❌' : '✅';
            const body = `## Performance Gate ${status}\n\n` +
              `**Tested:** ${tested} image(s)\n` +
              `**Regressions:** ${regression} (>50% threshold)\n\n` +
              (regressions > 0
                ? '⚠️ Build time regression detected. Please investigate before merging.'
                : '✅ All build times within acceptable range.');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
