[metadata]
name = "statuspage"
version = "latest"
description = "Static status page generator"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/cstate/cstate:${VERSION}"

[runtime]
entrypoint = ["/cstate"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Static status page generator"
"org.opencontainers.image.source" = "https://github.com/cstate/cstate"
"org.opencontainers.image.title" = "statuspage"
"org.opencontainers.image.vendor" = "cstate"
"org.opencontainers.image.version" = "5.7.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "2000ms"
"sovereign.image.category" = "monitoring"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

