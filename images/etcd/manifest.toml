[metadata]
name = "etcd"
version = "3.6.10"
description = "etcd - distributed reliable key-value store"
vendor = "CNCF"
source = "https://github.com/etcd-io/etcd"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/etcd-io/etcd/releases/download/v3.6.10/etcd-v3.6.10-linux-amd64.tar.gz"
binary_name = "etcd"
filename = "etcd-v3.6.10-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 2379
metrics = 9101

[labels]
"org.opencontainers.image.title" = "etcd"
"org.opencontainers.image.description" = "etcd - distributed reliable key-value store"
"org.opencontainers.image.version" = "3.6.10"
"org.opencontainers.image.vendor" = "CNCF"
"org.opencontainers.image.source" = "https://github.com/etcd-io/etcd"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
