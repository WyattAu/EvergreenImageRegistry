[metadata]
tier = "standard"
name = "erpnext-worker"
version = "15"
description = "erpnext-worker container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/frappe-erpnext-worker-latest"
[runtime]
entrypoint = ["bench"]
cmd = ["worker", "--queue", "default"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/frappe/erpnext"
"org.opencontainers.image.title" = "erpnext-worker"
"org.opencontainers.image.vendor" = "Frappe"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "erp"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
