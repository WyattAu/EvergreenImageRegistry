[metadata]
name = "element-x"
version = "1.0.0-beta.1"
description = "Element X - next-generation Matrix client"
vendor = "Element"
source = "https://github.com/element-hq/element-x"
category = "messaging"
tier = "2"

[build]
base = "wolfi"
arch = "amd64"

[download]
url = "https://github.com/element-hq/element-x/releases/download/v1.0.0-beta.1/element-x-v1.0.0-beta.1.tar.gz"
filename = "element-x-v1.0.0-beta.1.tar.gz"
strip_components = 1
binary_name = ""

[container]
port = 80
metrics_port = 9101
user = "65532:65532"
workdir = "/app"
entrypoint = ["busybox", "httpd", "-f", "-p", "80", "-h", "/app"]
stop_signal = "SIGTERM"
nonroot = true

[labels]
"org.opencontainers.image.title" = "element-x"
"org.opencontainers.image.description" = "Element X - next-generation Matrix client"
"org.opencontainers.image.vendor" = "Element"
"org.opencontainers.image.source" = "https://github.com/element-hq/element-x"
"org.opencontainers.image.version" = "1.0.0-beta.1"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.base.image" = "wolfi"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
