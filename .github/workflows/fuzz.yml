name: Fuzz
on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'images/health-shim/**'
  pull_request:
    branches: [main]
    paths:
      - 'images/health-shim/**'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Go fuzzing tools
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/google/go-fuzz/cmd/go-fuzz@latest
      - name: Fuzz health-shim
        working-directory: images/health-shim
        run: |
          go test -fuzz=Fuzz -fuzztime=60s ./...
        continue-on-error: true
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: images/health-shim/testdata/fuzz/
