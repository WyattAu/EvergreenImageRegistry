---
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-base
    - ca-certificates-bundle
    - forgejo-runner

entrypoint:
  command: /usr/bin/forgejo-runner

accounts:
  groups:
    - groupname: runner
      gid: 1000
  users:
    - username: runner
      uid: 1000
      gid: 1000
      shell: /usr/sbin/nologin
  run-as: runner

environment:
  HOME: /home/runner

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.source: https://code.forgejo.org/forgejo/runner
  org.opencontainers.image.title: forgejo-runner
  org.opencontainers.image.description: Forgejo Actions runner agent

stop-signal: SIGTERM
