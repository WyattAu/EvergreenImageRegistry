[metadata]
name = "mattermost"
version = "unknown"
description = "mattermost container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/mattermost/bin/mattermost"]

[ports]
expose = [8065, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/mattermost/mattermost"
"org.opencontainers.image.title" = "mattermost"
"org.opencontainers.image.vendor" = "Mattermost"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "collaboration"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

