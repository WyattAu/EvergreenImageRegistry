[metadata]
tier = "standard"
name = "chat-server"
version = "2.4.0"
description = "Matrix homeserver (Synapse) - Python-based Matrix server"
vendor = "element-hq"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/element-hq/synapse/releases/download/v2.4.0/synapse-v2.4.0-linux-x86_64.tar.gz"

[runtime]
entrypoint = ["synapse"]
cmd = ["--config-path", "/etc/synapse/homeserver.yaml"]

[ports]
expose = [8008, 9101]

[labels]
"org.opencontainers.image.description" = "Matrix homeserver (Synapse) - Python-based Matrix server"
"org.opencontainers.image.source" = "https://github.com/element-hq/synapse"
"org.opencontainers.image.title" = "chat-server"
"org.opencontainers.image.vendor" = "element-hq"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "http"
"evergreen.image.category" = "chat"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
