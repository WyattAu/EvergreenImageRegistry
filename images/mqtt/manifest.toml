[metadata]
tier = "standard"
name = "mqtt"
version = "2.0.18"
description = "mqtt container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "mosquitto"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/eclipse-mosquitto"
[runtime]
entrypoint = ["mosquitto"]

[ports]
expose = [1883, 9101]

[labels]
"org.opencontainers.image.title" = "mqtt"
"org.opencontainers.image.vendor" = "Eclipse"
"org.opencontainers.image.version" = "2.0.18"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
