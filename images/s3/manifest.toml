[metadata]
name = "s3"
version = "RELEASE.2025-10-15T17-29-55Z"
description = "S3 - AWS S3 compatible object storage client"
vendor = "AWS"
source = "https://github.com/aws/aws-cli"
license = "Apache-2.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/s3/s3/releases/download/vRELEASE.2025-10-15T17-29-55Z/s3-RELEASE.2025-10-15T17-29-55Z-linux-amd64.tar.gz"
binary_name = "s3"
filename = "s3-RELEASE.2025-10-15T17-29-55Z-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9000
metrics = 9101

[labels]
