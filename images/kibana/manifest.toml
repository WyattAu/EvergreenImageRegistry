[metadata]
name = "kibana"
version = "8.12.2"
description = "Kibana - data visualization dashboard for Elasticsearch"
vendor = "Elastic"
source = "https://github.com/elastic/kibana"
license = "Elastic-2.0"
tier = "critical"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/kibana/kibana/releases/download/v8.12.2/kibana-8.12.2-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/kibana/bin/kibana"]

[ports]
expose = [5601, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Kibana - Elastic visualization dashboard"
"org.opencontainers.image.title" = "kibana"
"org.opencontainers.image.vendor" = "Elastic"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "15s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "60000ms"
"evergreen.image.category" = "observability"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
