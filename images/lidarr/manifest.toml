[metadata]
name = "lidarr"
version = "2.4.3"
description = "Lidarr - music collection manager for Usenet and BitTorrent"
vendor = "Lidarr"
source = "https://github.com/Lidarr/Lidarr"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/lidarr/lidarr/releases/download/v2.4.3/lidarr-2.4.3-linux-amd64.tar.gz"
binary_name = "lidarr"
filename = "lidarr-2.4.3-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 8686
metrics = 9101

[labels]
"org.opencontainers.image.title" = "lidarr"
"org.opencontainers.image.description" = "Lidarr - music collection manager for Usenet and BitTorrent"
"org.opencontainers.image.version" = "2.4.3"
"org.opencontainers.image.vendor" = "Lidarr"
"org.opencontainers.image.source" = "https://github.com/Lidarr/Lidarr"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "none"
