name: SBOM Attestation
on:
  workflow_run:
    workflows: ['Build Hardened Images']
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download image references
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: built-image-references
          path: /tmp/references/
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true
      - name: Attest SBOMs
        run: |
          if [ ! -f /tmp/references/images.txt ]; then
            echo "No image references found, skipping attestation"
            exit 0
          fi
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            echo "Attesting SBOM for ${ref}..."
            cosign attest --yes \
              --predicate sbom.spdx.json \
              --type spdxjson \
              "${ref}" 2>&1 || echo "WARN: SBOM attestation failed for ${ref}"
          done < /tmp/references/images.txt
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
