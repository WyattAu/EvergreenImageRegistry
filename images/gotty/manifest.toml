[metadata]
name = "gotty"
version = "1.8.0"
description = "gotty - Evergreen hardened image"
vendor = "Evergreen"
source = "https://github.com/sorenisanerd/gotty"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "upstream-repack"
url = "https://github.com/sorenisanerd/gotty"

[runtime]
entrypoint = []

[ports]
expose = [8080, 9101]
