name: CIS/STIG Daily Scan

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  cis-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [critical]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Run CIS scan
        run: |
          chmod +x compliance/cis/run_cis_scan.sh
          mkdir -p cis-results-${{ matrix.tier }}
          # The script scans ONE image per invocation (CIS 4.x checks via docker run).
          # Scan a sample of critical images; per-image failures are recorded but
          # only a broken pull aborts the job.
          SAMPLE_IMAGES="nginx redis traefik coredns postgres"
          OVERALL=0
          for image in $SAMPLE_IMAGES; do
            REF="ghcr.io/${{ github.repository_owner }}/${image}:latest"
            if ! docker pull "$REF" > /dev/null 2>&1; then
              echo "::warning::Could not pull ${image} - skipping CIS scan"
              continue
            fi
            echo "Scanning ${image}..."
            ./compliance/cis/run_cis_scan.sh --image "$REF" --tier 1 --output-dir "cis-results-${{ matrix.tier }}" || OVERALL=1
          done
          exit $OVERALL

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cis-scan-results-${{ matrix.tier }}
          path: |
            cis-results-*.json
            xccdf-report.xml
          retention-days: 30

      - name: Summarize scores
        run: |
          # Per-image .txt reports carry a 'Score: N%' line; aggregate + report.
          if ls cis-results-${{ matrix.tier }}/*.txt >/dev/null 2>&1; then
            grep -h 'Score:' cis-results-${{ matrix.tier }}/*.txt | grep -oE '[0-9]+%' | tr -d '%' | \
              awk '{s+=$1; n+=1} END {if (n>0) printf "Average CIS score across %d image(s): %.0f%%\n", n, s/n}'
            echo "Reports:" && ls cis-results-${{ matrix.tier }}/
          else
            echo "No CIS reports produced"
          fi
