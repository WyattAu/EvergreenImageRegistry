[metadata]
name = "prometheus"
version = "2.53.0"
description = "Prometheus - monitoring and alerting toolkit"
vendor = "Prometheus"
source = "https://github.com/prometheus/prometheus"
license = "Apache-2.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz"
binary_name = "prometheus"
filename = "prometheus-2.53.0.linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9090
metrics = 9101

[labels]
"org.opencontainers.image.title" = "prometheus"
"org.opencontainers.image.description" = "Prometheus - monitoring and alerting toolkit"
"org.opencontainers.image.version" = "2.53.0"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.source" = "https://github.com/prometheus/prometheus"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
