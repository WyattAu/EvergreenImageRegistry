[metadata]
name = "woodpecker-agent"
version = "2.7.0"
description = "Woodpecker Agent - CI/CD build agent for Woodpecker CI"
vendor = "Woodpecker CI"
source = "https://github.com/woodpecker-ci/woodpecker"
category = "cicd"
tier = "2"

[build]
base = "scratch"
arch = "amd64"

[download]
url = "https://github.com/woodpecker-ci/woodpecker/releases/download/v2.7.0/woodpecker-agent_linux_amd64.tar.gz"
filename = "woodpecker-agent_linux_amd64.tar.gz"
strip_components = 0
binary_name = "woodpecker-agent"

[container]
port = 3000
metrics_port = 9101
user = "65532:65532"
workdir = "/app"
entrypoint = ["/usr/local/bin/woodpecker-agent"]
stop_signal = "SIGTERM"
nonroot = true

[labels]
"org.opencontainers.image.title" = "woodpecker-agent"
"org.opencontainers.image.description" = "Woodpecker Agent - CI/CD build agent for Woodpecker CI"
"org.opencontainers.image.vendor" = "Woodpecker CI"
"org.opencontainers.image.source" = "https://github.com/woodpecker-ci/woodpecker"
"org.opencontainers.image.version" = "2.7.0"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
