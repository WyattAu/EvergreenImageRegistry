[metadata]
name = "hedgedoc"
version = "1.10.0"
description = "HedgeDoc - collaborative markdown notes (formerly CodiMD)"
vendor = "HedgeDoc"
source = "https://github.com/hedgedoc/hedgedoc"
tier = "2"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/hedgedoc/hedgedoc/releases/download/v1.10.0/hedgedoc-v1.10.0.tar.gz"

[runtime]
entrypoint = ["node", "app.js"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "HedgeDoc - collaborative markdown notes (formerly CodiMD)"
"org.opencontainers.image.source" = "https://github.com/hedgedoc/hedgedoc"
"org.opencontainers.image.title" = "hedgedoc"
"org.opencontainers.image.vendor" = "HedgeDoc"
"org.opencontainers.image.version" = "1.10.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

