[metadata]
tier = "standard"
name = "static-c"
version = "1.0.0"
description = "Evergreen hardened static-c - Static C binary compilation base"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened static-c - Static C binary compilation base"
"org.opencontainers.image.title" = "static-c"
"org.opencontainers.image.version" = "1.0.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
