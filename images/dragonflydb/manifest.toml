[metadata]
name = "dragonflydb"
version = "latest"
description = "dragonflydb container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "docker.dragonflydb.io/dragonfly:${VERSION}"

[runtime]
entrypoint = ["/dragonfly"]
cmd = ["--bind", "0.0.0.0:6379"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/dragonflydb/dragonfly"
"org.opencontainers.image.title" = "dragonflydb"
"org.opencontainers.image.vendor" = "DragonflyDB"
"org.opencontainers.image.version" = "1.18.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

