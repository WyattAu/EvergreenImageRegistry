[metadata]
name = "pptpd"
version = "1.10.0"
description = "Point-to-Point Tunneling Protocol server"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/sbin/pptpd"]
cmd = ["--fg"]

[ports]
expose = [1723, 9101]

[labels]
"org.opencontainers.image.description" = "Point-to-Point Tunneling Protocol server"
"org.opencontainers.image.source" = "https://sourceforge.net/projects/poptop/"
"org.opencontainers.image.title" = "pptpd"
"org.opencontainers.image.vendor" = "PPTP Project"
"org.opencontainers.image.version" = "1.10.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

