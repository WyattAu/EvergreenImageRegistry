[image]
name = "dns-stats"
version = "0.5.0"
description = "DNS capture and statistics collection tool (dnscap/dnsstats)"
vendor = "PowerDNS"
homepage = "https://github.com/PowerDNS/dnsdist"
category = "monitoring"
tier = 1

[source]
type = "source-compile"
url = "https://github.com/dmachard/dns-stats"
upstream = "https://github.com/dmachard/dns-stats"

[build]
base = "debian:bookworm-slim"
target_base = "scratch"

[constraints]
nonroot = true
scratch = true

[hft]
signal-handling = "native"
shutdown-timeout = "3s"

[ports]
web = 8080
metrics = 9101

[health]
type = "exec"
