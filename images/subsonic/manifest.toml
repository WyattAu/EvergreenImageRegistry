[metadata]
tier = "standard"
name = "subsonic"
version = "10.6.0"
description = "subsonic container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["java", "-jar", "/app/subsonic.war"]

[ports]
expose = [4040, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/airsonic-advanced/airsonic-advanced/releases"
"org.opencontainers.image.title" = "subsonic"
"org.opencontainers.image.vendor" = "Airsonic-Advanced"
"org.opencontainers.image.version" = "10.6.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

