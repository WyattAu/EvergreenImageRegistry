[metadata]
name = "tidb-lightning"
version = "latest"
description = "Sovereign hardened TiDB Lightning - high-speed TiDB data import tool"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "pingcap/tidb:${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/tidb-lightning"]

[ports]
expose = [8289, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened TiDB Lightning - high-speed TiDB data import tool"
"org.opencontainers.image.title" = "tidb-lightning"
"org.opencontainers.image.vendor" = "PingCAP"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

