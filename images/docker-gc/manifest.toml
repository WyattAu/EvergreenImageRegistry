[metadata]
name = "docker-gc"
version = "0.3.0"
description = "Docker garbage collection - automatic cleanup of unused containers and images"
vendor = "spotify"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "docker.io/spotify/docker-gc:latest"

[runtime]
entrypoint = ["docker-gc"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Docker garbage collection - automatic cleanup of unused containers and images"
"org.opencontainers.image.source" = "https://github.com/spotify/docker-gc"
"org.opencontainers.image.title" = "docker-gc"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "devops"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

