[metadata]
name = "php"
version = "8.3"
description = "php container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "php"
"org.opencontainers.image.vendor" = "PHP"
"org.opencontainers.image.version" = "8.3"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

