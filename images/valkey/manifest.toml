[metadata]
name = "valkey"
version = "7.2.4"
description = "Valkey - open source Redis-compatible in-memory data store"
vendor = "Linux Foundation"
source = "https://github.com/valkey-io/valkey"
license = "Apache-2.0"
tier = "2"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/valkey/valkey/releases/download/v7.2.4/valkey-7.2.4-linux-amd64.tar.gz"

[runtime]
entrypoint = ["sh", "-c", "valkey"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.title" = "valkey"
"org.opencontainers.image.vendor" = "Valkey"
"org.opencontainers.image.version" = "7.2.4"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "http"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "true"

