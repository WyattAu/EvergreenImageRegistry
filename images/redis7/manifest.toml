[metadata]
tier = "standard"
name = "redis7"
version = "7.4.1"
description = "redis7 container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "redis:redis"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/redis-7"
[runtime]
entrypoint = ["redis"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.title" = "redis7"
"org.opencontainers.image.vendor" = "Redis"
"org.opencontainers.image.version" = "7.4.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
