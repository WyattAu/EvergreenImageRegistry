[metadata]
name = "homepage"
version = "v1.5"
description = "Homepage - Application dashboard"
vendor = "benphelps"
license = "MIT"
tier = "critical"
source = "https://github.com/benphelps/homepage"
upstream_version = "v1.5"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/gethomepage/homepage:v1.5"

[runtime]
entrypoint = ["/app/homepage"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "Homepage - Application dashboard"
"org.opencontainers.image.source" = "https://github.com/benphelps/homepage"
"org.opencontainers.image.title" = "homepage"
"org.opencontainers.image.vendor" = "benphelps"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "utility"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
