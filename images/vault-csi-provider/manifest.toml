[metadata]
name = "vault-csi-provider"
version = "1.7.1"
description = "vault-csi-provider container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "hashicorp/vault-csi-provider:${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/vault-csi-provider"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/hashicorp/vault-csi-provider"
"org.opencontainers.image.title" = "vault-csi-provider"
"org.opencontainers.image.vendor" = "HashiCorp"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "secrets"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

