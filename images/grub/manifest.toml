[metadata]
name = "grub"
version = "unknown"
description = "Meta directory for GRUB bootloader configuration. Not a runnable container."

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "base-image"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Meta directory for GRUB bootloader configuration. Not a runnable container."
"org.opencontainers.image.title" = "grub"
"sovereign.base.image" = "scratch"
"sovereign.health.type" = "none"
"sovereign.image.category" = "meta"
"sovereign.image.note" = "Bootloader config directory, not a container image."
"sovereign.image.status" = "reference"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

