name: Update README Image List

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/generate_catalog.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Generate static catalog
        run: python3 scripts/generate_catalog.py

      - name: Generate image list
        id: generate_list
        run: |
          # This script builds a markdown table of all images found in the /images directory.
          # It reads the version from the ARG in each Dockerfile.

          START_MARKER="<!-- AUTO_IMAGE_LIST_START -->"
          END_MARKER="<!-- AUTO_IMAGE_LIST_END -->"
          TABLE_HEADER="| Image | Upstream Version | Documentation |\n| :---- | :--------------- | :------------ |"
          IMAGE_BASE_PATH="images"

          # Start building the new content for the table
          new_table_content="$TABLE_HEADER"

          for image_dir in $(ls -d $IMAGE_BASE_PATH/*/ | sort); do
            image_name=$(basename $image_dir)
            dockerfile_path="${image_dir}Dockerfile"
            readme_path="./${image_dir}README.md"

            # Extract the version from the Dockerfile's ARG. Assumes a format like 'ARG IMAGE_VERSION=...'
            version=$(grep -m 1 'ARG .*_VERSION=' "$dockerfile_path" | awk -F'=' '{print $2}' | tr -d '[:space:]')
            if [ -z "$version" ]; then
              version="N/A"
            fi

            # Format the markdown table row
            table_row="\n| \`$image_name\` | \`$version\` | [View README]($readme_path) |"
            new_table_content="$new_table_content$table_row"
          done

          # Use a heredoc to pass this multiline string to the outputs
          {
            echo "table_content<<EOF"
            echo "$new_table_content"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update README.md file
        env:
          TABLE_CONTENT: ${{ steps.generate_list.outputs.table_content }}
        run: |
          printf '%b\n' "$TABLE_CONTENT" > /tmp/table_content.txt

          cat > /tmp/update_readme.py << 'PYEOF'
          import sys
          START = "<!-- AUTO_IMAGE_LIST_START -->"
          END = "<!-- AUTO_IMAGE_LIST_END -->"
          with open("README.md") as f:
              readme = f.read()
          with open("/tmp/table_content.txt") as f:
              content = f.read().rstrip()
          si = readme.find(START)
          ei = readme.find(END)
          if si == -1 or ei == -1:
              sys.exit("ERROR: Markers not found")
          new_readme = readme[:si + len(START)] + "\n" + content + "\n" + readme[ei:]
          with open("README.md", "w") as f:
              f.write(new_readme)
          print("README updated")
          PYEOF

          # Strip leading whitespace from heredoc (YAML block indent)
          sed -i 's/^          //' /tmp/update_readme.py
          python3 /tmp/update_readme.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
        with:
          commit_message: 'docs: Auto-update image list and catalog'
          file_pattern: |
            README.md
            docs/catalog/index.html
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
