[metadata]
tier = "critical"
name = "prometheus-gcp-exporter"
version = "latest"
description = "Stackdriver Prometheus sidecar for GCP metrics"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "gcr.io/google-containers/prometheus-to-sd:${VERSION}"

[runtime]
entrypoint = ["/stackdriver-prometheus-sidecar"]

[ports]
expose = [9090, 9101]

[labels]
"org.opencontainers.image.description" = "Stackdriver Prometheus sidecar for GCP metrics"
"org.opencontainers.image.title" = "prometheus-gcp-exporter"
"org.opencontainers.image.vendor" = "Google Cloud Platform"
"org.opencontainers.image.version" = "0.10.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-5"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-stateful"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"


status = "wip"
