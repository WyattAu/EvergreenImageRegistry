[metadata]
name = "smartdns"
version = "Release48"
description = "Local DNS server with DoH/DoT support"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/smartdns"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.description" = "Local DNS server with DoH/DoT support"
"org.opencontainers.image.source" = "https://github.com/pymumu/smartdns"
"org.opencontainers.image.title" = "smartdns"
"org.opencontainers.image.vendor" = "pymumu"
"org.opencontainers.image.version" = "Release48"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "dns"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

