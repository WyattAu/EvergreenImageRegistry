[metadata]
name = "questdb-python"
version = "unknown"
description = "Sovereign QuestDB Python client with psycopg2 wire protocol support"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python", "-m", "questdb"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign QuestDB Python client with psycopg2 wire protocol support"
"org.opencontainers.image.source" = "https://github.com/questdb/questdb-python"
"org.opencontainers.image.title" = "questdb-python"
"org.opencontainers.image.vendor" = "QuestDB"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

