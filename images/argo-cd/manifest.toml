[metadata]
name = "argo-cd"
version = "3.4.2"
description = "Argo CD - declarative GitOps continuous delivery for Kubernetes"
vendor = "Argo Project"
source = "https://github.com/argoproj/argo-cd"
license = "Apache-2.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/argoproj/argo-cd/releases/download/v3.4.2/argocd-linux-amd64"

[runtime]
entrypoint = ["/argocd"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened argo-cd - GitOps CD tool"
"org.opencontainers.image.title" = "argo-cd"
"org.opencontainers.image.vendor" = "Argo Project"
"org.opencontainers.image.version" = "3.4.2"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
