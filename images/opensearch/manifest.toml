[metadata]
name = "opensearch"
version = "2.12.0"
description = "OpenSearch - community-driven search and analytics engine"
vendor = "AWS"
source = "https://github.com/opensearch-project/opensearch"
license = "Apache-2.0"
tier = "critical"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/opensearch/opensearch/releases/download/v2.12.0/opensearch-2.12.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["sh", "-c", "/opt/opensearch/bin/opensearch"]

[ports]
expose = [9200, 9101]

[labels]
"org.opencontainers.image.description" = "OpenSearch - distributed search and analytics engine"
"org.opencontainers.image.title" = "opensearch"
"org.opencontainers.image.vendor" = "OpenSearch"
"org.opencontainers.image.version" = "2.12.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "http"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-7"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-stateful"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "30s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.runtime" = "java"
"evergreen.hft.runtime-hints" = "Xms=Xmx,UseG1GC"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "30s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "60000ms"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "true"
