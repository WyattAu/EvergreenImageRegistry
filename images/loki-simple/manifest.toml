[metadata]
name = "loki-simple"
version = "3.1.0"
description = "Evergreen hardened loki-simple - Loki with simple config"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/loki", "-config.file=/etc/loki/simple-config.yaml"]

[ports]
expose = [3100, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened loki-simple - Loki with simple config"
"org.opencontainers.image.title" = "loki-simple"
"org.opencontainers.image.vendor" = "Grafana"
"org.opencontainers.image.version" = "3.1.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

