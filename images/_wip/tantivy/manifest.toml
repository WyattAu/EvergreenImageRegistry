[metadata]
name = "tantivy"
version = "latest"
description = "Full-text search engine CLI"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/quickwit-oss/tantivy:${VERSION}"

[runtime]
entrypoint = ["/tantivy"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Full-text search engine CLI"
"org.opencontainers.image.source" = "https://github.com/quickwit-oss/tantivy-cli"
"org.opencontainers.image.title" = "tantivy"
"org.opencontainers.image.vendor" = "quickwit-oss"
"org.opencontainers.image.version" = "0.22.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.base" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "2000ms"
"evergreen.image.category" = "search"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

