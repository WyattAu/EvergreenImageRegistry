[metadata]
tier = "standard"
name = "milvus-minio"
version = "2024.11.07"
description = "Milvus minio sidecar - delegates to minio"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/minio"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.description" = "Milvus minio sidecar - delegates to minio"
"org.opencontainers.image.title" = "milvus-minio"
"org.opencontainers.image.vendor" = "minio/minio"
"org.opencontainers.image.version" = "2024.11.07"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.status" = "reference"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
