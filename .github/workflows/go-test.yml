name: Go Tests
on:
  push:
    branches: [main]
    paths:
      - 'images/health-shim/**'
  pull_request:
    paths:
      - 'images/health-shim/**'

concurrency:
  group: go-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/health-shim
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.23'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -race -count=1 ./...
      - name: Build (static)
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o /dev/null .
