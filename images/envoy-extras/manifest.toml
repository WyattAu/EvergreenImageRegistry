[metadata]
tier = "standard"
name = "envoy-extras"
version = "1.38.0"
description = "Evergreen hardened Envoy extras - Envoy proxy with extra Lua/WASM extensions enabled"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/envoy"]

[ports]
expose = [9901, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Envoy extras - Envoy proxy with extra Lua/WASM extensions enabled"
"org.opencontainers.image.title" = "envoy-extras"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "proxy"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
