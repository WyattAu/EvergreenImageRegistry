name: Auto Version Bump
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no PR created)'
        required: false
        default: 'false'
        type: boolean
      batch_size:
        description: 'Max images per PR batch'
        required: false
        default: '50'
        type: string
      auto_merge:
        description: 'Auto-merge patch/minor bumps when all gates pass'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Check upstream versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_upstream_versions.py || true

  bump:
    needs: check-upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      outdated_count: ${{ steps.detect.outputs.outdated_count }}
      batch_count: ${{ steps.batch.outputs.batch_count }}
      changed_images: ${{ steps.batch.outputs.changed_images }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache evergreenctl build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: evergreenctl/target
          key: evergreenctl-${{ runner.os }}-${{ hashFiles('evergreenctl/Cargo.lock') }}
          restore-keys: |
            evergreenctl-${{ runner.os }}-

      - name: Build evergreenctl
        run: cd evergreenctl && cargo build --release

      - name: Check rate limit before upstream check
        id: ratelimit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAINING=$(gh api rate_limit --jq '.resources.core.remaining')
          RESET=$(gh api rate_limit --jq '.resources.core.reset')
          NOW=$(date +%s)
          echo "Rate limit remaining: $REMAINING"

          if [ "$REMAINING" -lt 100 ]; then
            WAIT=$((RESET - NOW + 60))
            echo "Rate limit low ($REMAINING). Waiting ${WAIT}s for reset."
            sleep "$WAIT"
            REMAINING=$(gh api rate_limit --jq '.resources.core.remaining')
          fi

          echo "remaining=${REMAINING}" >> "$GITHUB_OUTPUT"

          if [ "$REMAINING" -lt 10 ]; then
            echo "::error::Rate limit critically low ($REMAINING). Aborting."
            exit 1
          fi

      - name: Check for outdated images
        id: detect
        run: |
          ./evergreenctl/target/release/evergreenctl outdated --all images/ > /tmp/outdated.txt 2>&1 || true
          echo "=== Outdated images ==="
          cat /tmp/outdated.txt

          OUTDATED_COUNT=$(grep -c "OUTDATED" /tmp/outdated.txt 2>/dev/null || echo "0")
          echo "outdated_count=${OUTDATED_COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$OUTDATED_COUNT" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No outdated images found, skipping bump"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Found ${OUTDATED_COUNT} outdated images"

      - name: Bump outdated versions
        id: batch
        if: steps.detect.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/bump_versions.sh scripts/bump_all_outdated.sh

          BATCH_SIZE="${{ inputs.batch_size || '50' }}"
          [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]] || { echo "::error::batch_size must be numeric, got: $BATCH_SIZE"; exit 1; }
          ./scripts/bump_all_outdated.sh /tmp/outdated.txt || true

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_ENV"
          else
            echo "has_changes=true" >> "$GITHUB_ENV"
            echo "=== Changed files ==="
            git diff --stat

            CHANGED_IMAGES=$(git diff --name-only | grep -oP '^images/\K[^/]+' | sort -u)
            CHANGED_COUNT=$(echo "$CHANGED_IMAGES" | grep -c . || echo "0")
            echo "changed_count=${CHANGED_COUNT}" >> "$GITHUB_OUTPUT"

            BATCH_COUNT=$(( (CHANGED_COUNT + BATCH_SIZE - 1) / BATCH_SIZE ))
            echo "batch_count=${BATCH_COUNT}" >> "$GITHUB_OUTPUT"
            echo "Will create up to ${BATCH_COUNT} PR batch(es) (batch_size=${BATCH_SIZE})"

            echo "CHANGED_IMAGES<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED_IMAGES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog and SBOM diff
        if: env.has_changes == 'true'
        run: |
          {
            echo "## Automated Version Bumps"
            echo ""
            echo "This PR was created by the daily auto-bump workflow."
            echo ""
            echo "### Version Changes"
            echo ""
            echo '```diff'
            result2=$(git diff)
            for line in $result2; do
              if echo "$line" | grep -q "VERSION" && echo "$line" | grep -q "ARG"; then
                echo "$line"
              fi
            done
            echo '```'
            echo ""
            echo "### Changed Files Summary"
            echo ""
            git diff --stat
            echo ""
            echo "### SBOM Diff"
            echo ""
            SBOM_CHANGED=$(git diff --name-only | grep -c "sbom" || true)
            if [ "$SBOM_CHANGED" -gt 0 ]; then
              echo "SBOM files changed: ${SBOM_CHANGED}"
              echo ""
              echo '<details><summary>SBOM Changes</summary>'
              echo ""
              echo '```diff'
              git diff -- '*/sbom*' | head -200
              echo '```'
              echo ""
              echo "</details>"
            else
              echo "No SBOM changes detected."
            fi
            echo ""
            echo "---"
            echo ""
            echo "_This PR will be auto-merged if all checks pass (patch/minor bumps only). Major version bumps require manual review._"
          } > /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Create Pull Request (single batch or dry run)
        if: env.has_changes == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          title: 'chore: auto-bump outdated image versions'
          body-path: /tmp/changelog.md
          branch: auto-bump/versions
          delete-branch: true
          labels: |
            automated
            dependencies
            do-not-merge-automatically
          reviewers: ${{ github.repository_owner }}
          draft: ${{ inputs.dry_run == 'true' }}
          commit-message: 'chore: auto-bump {image} to {version}'
          signoff: false

  bump-batched:
    needs: bump
    if: needs.bump.outputs.batch_count > 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        batch_index: ${{ fromJson(format('[{0}]', range(fromJson(needs.bump.outputs.batch_count)))) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: auto-bump/versions
          fetch-depth: 0

      - name: 'Check rate limit before batch PR'
        id: ratelimit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAINING=$(gh api rate_limit --jq '.resources.core.remaining')
          echo "Rate limit remaining: $REMAINING"
          if [ "$REMAINING" -lt 10 ]; then
            echo "::error::Rate limit too low ($REMAINING). Skipping batch ${{ matrix.batch_index }}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 'Create batch PR ${{ matrix.batch_index }}'
        if: steps.ratelimit.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BATCH_SIZE="${{ inputs.batch_size || '50' }}"
          INDEX="${{ matrix.batch_index }}"
          CHANGED_IMAGES="${{ needs.bump.outputs.changed_images }}"

          BATCH=$(echo "$CHANGED_IMAGES" | sed -n "$((INDEX * BATCH_SIZE + 1)),$(( (INDEX + 1) * BATCH_SIZE ))p")

          if [ -z "$BATCH" ]; then
            echo "Empty batch ${INDEX}, skipping"
            exit 0
          fi

          echo "Batch ${INDEX} images:"
          echo "$BATCH"

          CHANGED_FILES=""
          for img in $BATCH; do
            FILES=$(git diff --name-only main -- "images/${img}/" 2>/dev/null)
            if [ -n "$FILES" ]; then
              CHANGED_FILES="${CHANGED_FILES} ${FILES}"
            fi
          done

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files for batch ${INDEX}, skipping"
            exit 0
          fi

          IMAGE_LIST=$(echo "$BATCH" | tr '\n' ', ' | sed 's/,$//')

          git checkout -b "auto-bump/batch-${INDEX}" origin/main 2>/dev/null || git checkout -b "auto-bump/batch-${INDEX}"

          for f in $CHANGED_FILES; do
            git checkout auto-bump/versions -- "$f" 2>/dev/null || true
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-bump batch ${INDEX} - ${IMAGE_LIST}" || {
            echo "Nothing to commit for batch ${INDEX}"
            exit 0
          }
          git push -u origin "auto-bump/batch-${INDEX}" -f

          SBOM_DIFF=""
          SBOM_FILES=$(echo "$CHANGED_FILES" | tr ' ' '\n' | grep "sbom" || true)
          if [ -n "$SBOM_FILES" ]; then
            SBOM_DIFF="<details><summary>SBOM Changes</summary>"
            SBOM_DIFF+=$'\n\n```diff\n'
            SBOM_DIFF+=$(for f in $SBOM_FILES; do git diff main -- "$f" 2>/dev/null | head -50; done)
            SBOM_DIFF+=$'\n```\n\n</details>'
          fi

          CHANGELOG=""
          CHANGELOG+="## Automated Version Bumps (Batch ${INDEX})"
          CHANGELOG+=$'\n\n'
          CHANGELOG+="This PR was created by the daily auto-bump workflow."
          CHANGELOG+=$'\n\n'
          CHANGELOG+="**Images in this batch:** ${IMAGE_LIST}"
          CHANGELOG+=$'\n\n'
          CHANGELOG+="**Action:** Review the changes, verify checksums, and merge when ready."
          CHANGELOG+=$'\n\n'
          CHANGELOG+=$'\n### Version Changes\n\n```diff\n'
          for img in $BATCH; do
            DIFF=$(git diff main -- "images/${img}/Dockerfile" 2>/dev/null | grep "ARG VERSION" || true)
            if [ -n "$DIFF" ]; then
              echo "$DIFF"
            fi
          done
          CHANGELOG+=$'\n```\n\n'
          if [ -n "$SBOM_DIFF" ]; then
            CHANGELOG+=$'\n### SBOM Diff\n\n'
            CHANGELOG+="$SBOM_DIFF"
            CHANGELOG+=$'\n'
          fi
          CHANGELOG+=$'\n---\n\n'
          CHANGELOG+="_Patch/minor bumps will be auto-merged if all checks pass. Major bumps require manual review._"

          gh pr create \
            --title "chore: auto-bump batch ${INDEX} - ${IMAGE_LIST}" \
            --body "$CHANGELOG" \
            --label "automated,dependencies,do-not-merge-automatically" \
            --reviewer "${{ github.repository_owner }}"

  auto-merge:
    needs: bump
    if: needs.bump.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Auto-merge eligible PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTO_MERGE="${{ inputs.auto_merge || 'true' }}"
          if [ "$AUTO_MERGE" != "true" ]; then
            echo "Auto-merge disabled by input"
            exit 0
          fi

          PRS=$(gh pr list --head "auto-bump/versions" --json number,title,mergeable,statusCheckRollup --jq '.[]')

          if [ -z "$PRS" ]; then
            echo "No auto-bump PRs found"
            exit 0
          fi

          echo "$PRS" | jq -r '.number' | while read -r PR_NUM; do
            PR_TITLE=$(gh pr view "$PR_NUM" --json title --jq '.title')
            MERGEABLE=$(gh pr view "$PR_NUM" --json mergeable --jq '.mergeable')
            CHECKS=$(gh pr view "$PR_NUM" --json statusCheckRollup --jq '.statusCheckRollup[]')

            echo "Checking PR #${PR_NUM}: ${PR_TITLE}"

            if [ "$MERGEABLE" != "true" ]; then
              echo "  PR not mergeable, skipping"
              continue
            fi

            ALL_PASS=true
            if [ -n "$CHECKS" ] && [ "$CHECKS" != "null" ]; then
              FAILING=$(echo "$CHECKS" | jq -r '[.[] | select(.status == "COMPLETED" and .conclusion != "SUCCESS" and .conclusion != "NEUTRAL")] | length')
              PENDING=$(echo "$CHECKS" | jq -r '[.[] | select(.status == "IN_PROGRESS" or .status == "QUEUED")] | length')
              if [ "$FAILING" -gt 0 ] || [ "$PENDING" -gt 0 ]; then
                ALL_PASS=false
                echo "  Checks not all passing (failing=$FAILING, pending=$PENDING)"
              fi
            fi

            if [ "$ALL_PASS" = "true" ]; then
              HAS_MAJOR=false
              CHANGED=$(gh pr diff "$PR_NUM" --name-only 2>/dev/null)
              for f in $CHANGED; do
                if echo "$f" | grep -q "Dockerfile"; then
                  DIFF=$(gh pr diff "$PR_NUM" -- "images/*/Dockerfile" 2>/dev/null)
                  if echo "$DIFF" | grep -qP '^\-\s*ARG\s+VERSION\s*='; then
                    OLD_VER=$(echo "$DIFF" | grep -oP '^\-\s*ARG\s+VERSION\s*=\s*\K\S+' | head -1)
                    NEW_VER=$(echo "$DIFF" | grep -oP '^\+\s*ARG\s+VERSION\s*=\s*\K\S+' | head -1)
                    OLD_MAJOR=$(echo "$OLD_VER" | grep -oP '^\d+' || echo "0")
                    NEW_MAJOR=$(echo "$NEW_VER" | grep -oP '^\d+' || echo "0")
                    if [ "$OLD_MAJOR" != "$NEW_MAJOR" ] && [ -n "$OLD_MAJOR" ] && [ -n "$NEW_MAJOR" ]; then
                      echo "  Major version bump detected: ${OLD_VER} -> ${NEW_VER}"
                      HAS_MAJOR=true
                    fi
                  fi
                fi
              done

              if [ "$HAS_MAJOR" = "true" ]; then
                echo "  Skipping auto-merge: major version bump detected"
                echo "  Adding label: requires-manual-review"
                gh pr edit "$PR_NUM" --add-label "requires-manual-review" --remove-label "do-not-merge-automatically" 2>/dev/null || true
                continue
              fi

              echo "  All checks pass. Auto-merging PR #${PR_NUM}"
              gh pr merge "$PR_NUM" --merge --auto || true
            else
              echo "  Waiting for checks to complete"
            fi
          done
