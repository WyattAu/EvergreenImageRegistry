[metadata]
tier = "standard"
name = "homepage-config"
version = "v1.13.0"
description = "Homepage - config mode"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/gethomepage/homepage:${VERSION}"

[runtime]
entrypoint = ["homepage"]
cmd = ["--config", "/app/config"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "Homepage - config mode"
"org.opencontainers.image.source" = "https://github.com/benphelps/homepage"
"org.opencontainers.image.title" = "homepage-config"
"org.opencontainers.image.vendor" = "benphelps"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
