[metadata]
name = "postgrey"
version = "1.37"
description = "postgrey container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["postgrey"]
cmd = ["--inet", "--listen=0.0.0.0:10023"]

[ports]
expose = [10023, 9101]

[labels]
"evergreen.base.image" = "wolfi"
"evergreen.health.type" = "exec"
"evergreen.metrics.native" = "ztunnel"

