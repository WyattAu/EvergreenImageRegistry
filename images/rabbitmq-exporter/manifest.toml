[metadata]
name = "rabbitmq-exporter"
version = "1.1.0"
description = "RabbitMQ Exporter - Prometheus exporter for RabbitMQ"
vendor = "Prometheus"
source = "https://github.com/kbudde/rabbitmq_exporter"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/rabbitmq-exporter/rabbitmq-exporter/releases/download/v1.1.0/rabbitmq-exporter-1.1.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/rabbitmq_exporter"]

[ports]
expose = [9090, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened RabbitMQ Exporter - Prometheus exporter for RabbitMQ"
"org.opencontainers.image.title" = "rabbitmq-exporter"
"org.opencontainers.image.vendor" = "kbudde"
"org.opencontainers.image.version" = "1.1.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "false"
"evergreen.hft.cpu-pins" = "6-7"
"evergreen.hft.cpu-pins-mode" = "shared"
"evergreen.hft.deploy-strategy" = "standard-rolling"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-hook" = "false"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "messaging"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
