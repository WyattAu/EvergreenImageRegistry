[metadata]
tier = "critical"
name = "portainer-agent"
version = "2.39.2"
description = "Portainer Agent for Docker"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "portainer/agent:${VERSION}"

[runtime]
entrypoint = ["/portainer-agent"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Portainer Agent for Docker"
"org.opencontainers.image.source" = "https://github.com/portainer/agent"
"org.opencontainers.image.title" = "portainer-agent"
"org.opencontainers.image.vendor" = "Portainer"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "critical""evergreen.metrics.native" = "ztunnel"
