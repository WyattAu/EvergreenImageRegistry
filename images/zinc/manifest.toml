[metadata]
name = "zinc"
version = "latest"
description = "Sovereign hardened ZincSearch - lightweight alternative to Elasticsearch"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "zincsearch/zincsearch:${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/zincsearch"]

[ports]
expose = [4080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened ZincSearch - lightweight alternative to Elasticsearch"
"org.opencontainers.image.title" = "zinc"
"org.opencontainers.image.vendor" = "ZincSearch"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

