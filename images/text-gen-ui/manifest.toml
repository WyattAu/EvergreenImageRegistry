[metadata]
name = "text-gen-ui"
version = "1.8"
description = "text-gen-ui container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]

[ports]
expose = [7860, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/oobabooga/text-generation-webui"
"org.opencontainers.image.title" = "text-gen-ui"
"org.opencontainers.image.vendor" = "oobabooga/text-generation-webui"
"org.opencontainers.image.version" = "1.8"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.hardened" = "true"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

