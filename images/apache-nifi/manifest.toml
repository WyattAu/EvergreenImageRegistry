[metadata]
tier = "standard"
name = "apache-nifi"
version = "1.26.0"
description = "Evergreen hardened Apache NiFi - data integration and flow management platform"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/nifi/bin/nifi.sh", "run"]

[ports]
expose = [8443, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Apache NiFi - data integration and flow management platform"
"org.opencontainers.image.title" = "apache-nifi"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "1.26.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "data-flow"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

