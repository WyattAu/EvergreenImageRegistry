[package]
name = "evergreenctl"
version = "1.0.0"
edition = "2021"
description = "Evergreen image registry management toolchain"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
sha2 = "0.10"
hex = "0.4"
regex = "1"
walkdir = "2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
semver = "1"
chrono = "0.4"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }

[[bin]]
name = "evergreenctl"
path = "src/main.rs"

[lib]
name = "evergreenctl"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.5"
assert_cmd = "2"
predicates = "3"

# Fleet-standard production release profile. evergreenctl is a CLI shipped
# via cargo-install; panic = "abort" is fine here (no unwinding-based
# recovery, no panic-capture telemetry).
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
