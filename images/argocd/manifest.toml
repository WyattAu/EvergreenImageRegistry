[metadata]
name = "argocd"
version = "2.12.6"
description = "ArgoCD CLI - declarative GitOps continuous delivery for Kubernetes"
vendor = "Argo Project"
source = "https://github.com/argoproj/argo-cd"
license = "Apache-2.0"
tier = "2"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/argoproj/argo-cd/releases/download/v2.12.6/argocd-linux-amd64"

[runtime]
entrypoint = ["argocd"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "ArgoCD CLI - declarative GitOps continuous delivery for Kubernetes"
"org.opencontainers.image.source" = "https://github.com/argoproj/argo-cd"
"org.opencontainers.image.title" = "argocd"
"org.opencontainers.image.vendor" = "Argo Project"
"org.opencontainers.image.version" = "2.12.6"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

