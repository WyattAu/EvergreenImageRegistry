[metadata]
name = "php-apache"
version = "8.3"
description = "php-apache container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["apache2ctl"]
cmd = ["-DFOREGROUND"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.title" = "php-apache"
"org.opencontainers.image.vendor" = "PHP/Apache"
"org.opencontainers.image.version" = "8.3"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

