[metadata]
name = "badger"
version = "4.2.0"
description = "Sovereign hardened Badger - embedded key-value store (Dgraph)"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/badger"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Badger - embedded key-value store (Dgraph)"
"org.opencontainers.image.title" = "badger"
"org.opencontainers.image.vendor" = "Dgraph Labs"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

