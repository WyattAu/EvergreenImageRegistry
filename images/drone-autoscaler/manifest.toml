[metadata]
name = "drone-autoscaler"
version = "1.5.0"
description = "Drone Autoscaler - automatic scaling for Drone runners"
vendor = "Harness"
source = "https://github.com/harness/drone"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/harness/drone/releases/download/v1.5.0/drone_autoscaler_linux_amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/drone-autoscaler"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Drone Autoscaler - automatic scaling for Drone runners"
"org.opencontainers.image.source" = "https://github.com/harness/drone"
"org.opencontainers.image.title" = "drone-autoscaler"
"org.opencontainers.image.vendor" = "Harness"
"org.opencontainers.image.version" = "1.5.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
