[metadata]
name = "gitlab-geo"
version = "16.11.0"
description = "GitLab Geo - geo-replication node for GitLab"
vendor = "GitLab"
source = "https://gitlab.com/gitlab-org/gitlab-ce"
license = "MIT"
tier = "2"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://packages.gitlab.com/gitlab/gitlab-ce/packages/ubuntu/jammy/gitlab-ce_16.11.0-ce.0_amd64.deb"

[runtime]
entrypoint = ["/opt/gitlab/bin/gitlab-geo"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "GitLab Geo - geo-replication node for GitLab"
"org.opencontainers.image.source" = "https://gitlab.com/gitlab-org/gitlab-ce"
"org.opencontainers.image.title" = "gitlab-geo"
"org.opencontainers.image.vendor" = "GitLab"
"org.opencontainers.image.version" = "16.11.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.debian-slim" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.image.variant" = "geo"
"evergreen.metrics.native" = "ztunnel"

