[metadata]
tier = "standard"
name = "transmission"
version = "4.0.6"
description = "transmission container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "transmission"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["transmission-daemon"]

[ports]
expose = [9091, 9101]

[labels]
"org.opencontainers.image.title" = "transmission"
"org.opencontainers.image.vendor" = "Transmission"
"org.opencontainers.image.version" = "4.0.6"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
