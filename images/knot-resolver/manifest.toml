[metadata]
tier = "standard"
name = "knot-resolver"
version = "5.7.6"
description = "Full-featured DNS recursive resolver"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["kresd"]
cmd = ["-c", "/etc/knot-resolver/knot.conf"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.description" = "Full-featured DNS recursive resolver"
"org.opencontainers.image.source" = "https://github.com/CZ-NIC/knot-resolver"
"org.opencontainers.image.title" = "knot-resolver"
"org.opencontainers.image.vendor" = "CZ.NIC"
"org.opencontainers.image.version" = "5.7.6"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "dns"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
