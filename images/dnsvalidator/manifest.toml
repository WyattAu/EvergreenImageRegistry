[metadata]
tier = "standard"
name = "dnsvalidator"
version = "1.0.0"
description = "Evergreen hardened DNSValidator - DNS validation and testing tool"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/venv/bin/dnsvalidator"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened DNSValidator - DNS validation and testing tool"
"org.opencontainers.image.title" = "dnsvalidator"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "security"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
