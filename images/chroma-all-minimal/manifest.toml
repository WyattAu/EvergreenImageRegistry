[metadata]
name = "chroma-all-minimal"
version = "0.5.23"
description = "chroma-all-minimal container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/chroma-core/chroma"
"org.opencontainers.image.title" = "chroma-all-minimal"
"org.opencontainers.image.vendor" = "Chroma"
"org.opencontainers.image.version" = "0.5.23"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

