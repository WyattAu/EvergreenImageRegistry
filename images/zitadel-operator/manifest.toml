[metadata]
tier = "standard"
name = "zitadel-operator"
version = "0.5.0"
description = "zitadel-operator container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/zitadel/zitadel-operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/zitadel-operator"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/zitadel/zitadel-operator"
"org.opencontainers.image.title" = "zitadel-operator"
"org.opencontainers.image.vendor" = "ZITADEL"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "identity"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"


status = "wip"
