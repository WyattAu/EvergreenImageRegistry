[metadata]
name = "prometheus-elasticsearch-exporter"
version = "1.10.0"
description = "Elasticsearch Exporter - Prometheus exporter for Elasticsearch"
vendor = "Prometheus"
source = "https://github.com/prometheus-community/elasticsearch_exporter"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/prometheus-elasticsearch-exporter/prometheus-elasticsearch-exporter/releases/download/v1.10.0/prometheus-elasticsearch-exporter-1.10.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/elasticsearch_exporter"]

[ports]
expose = [9214, 9101]

[labels]
"org.opencontainers.image.description" = "Prometheus exporter for Elasticsearch metrics"
"org.opencontainers.image.title" = "Prometheus Elasticsearch Exporter"
"org.opencontainers.image.vendor" = "Prometheus Community"
"org.opencontainers.image.version" = "1.10.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-5"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-stateful"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

