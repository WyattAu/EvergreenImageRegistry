[metadata]
name = "trivy"
version = "0.70.0"
description = "Trivy - security scanner for containers and dependencies"
vendor = "Aqua Security"
source = "https://github.com/aquasecurity/trivy"
license = "Apache-2.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz"
binary_name = "trivy"
filename = "trivy_0.70.0_Linux-64bit.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
metrics = 9101

[labels]
"org.opencontainers.image.title" = "trivy"
"org.opencontainers.image.description" = "Trivy - security scanner for containers and dependencies"
"org.opencontainers.image.version" = "0.70.0"
"org.opencontainers.image.vendor" = "Aqua Security"
"org.opencontainers.image.source" = "https://github.com/aquasecurity/trivy"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
