name: Policy Eval (Weekly)

# Weekly scheduled evaluation of the built-in Rego policy bundles
# (evergreenctl `policy eval`, regorus-backed, rego-eval feature) against a
# bounded SAMPLE of Dockerfiles from images/.
#
# Exit-code semantics (evergreenctl 1.1.x, fail-closed):
#   0 = compliant, 1 = eval error (the evaluator itself broke), 2 = violations.
#
# Violations are EXPECTED for legacy images (e.g. SC-002 digest-pinning fires
# registry-wide on the evergreen floating-tag model), so exit 2 is recorded,
# never fatal. The job hard-fails ONLY on eval errors (exit 1 or any
# unexpected exit code), i.e. when the evaluator itself is broken.

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (defaults, matches repo-wide pin)

      - name: Build evergreenctl (rego-eval)
        run: |
          cargo build --release --manifest-path evergreenctl/Cargo.toml --features rego-eval

      - name: Run policy eval over sample Dockerfiles
        # ~20 diverse images, one Dockerfile each — no builds, bounded runtime.
        # NOTE: evergreenctl rejects path args containing '..' (traversal
        # guard), so run from the repo root with relative paths.
        env:
          SAMPLE_IMAGES: >-
            nginx redis postgres caddy busybox
            grafana prometheus traefik rabbitmq argo-cd
            vault nextcloud authelia node-exporter blackbox-exporter
            haproxy consul etcd mosquitto forgejo
        run: |
          set -u
          BIN="evergreenctl/target/release/evergreenctl"
          OUTDIR="policy-eval-results"
          mkdir -p "$OUTDIR"

          COMPLIANT=0
          VIOLATIONS=0
          EVAL_ERRORS=0

          : > "$OUTDIR/summary.tsv"
          printf 'image\tresult\tviolations\teval_errors\texit_code\n' >> "$OUTDIR/summary.tsv"

          for image in $SAMPLE_IMAGES; do
            df="images/${image}/Dockerfile"
            if [ ! -f "$df" ]; then
              echo "::warning::Sample image '$image' has no Dockerfile at $df — skipping"
              printf '%s\tskipped\t0\t0\t-1\n' "$image" >> "$OUTDIR/summary.tsv"
              continue
            fi

            out="$OUTDIR/${image}.json"
            set +e
            "$BIN" policy eval --dockerfile "$df" --format json > "$out" 2> "$OUTDIR/${image}.stderr"
            rc=$?
            set -e

            case "$rc" in
              0)
                COMPLIANT=$((COMPLIANT + 1))
                result="compliant"
                ;;
              2)
                VIOLATIONS=$((VIOLATIONS + 1))
                result="violations"
                ;;
              *)
                # Exit 1 (fail-closed eval error) or anything unexpected:
                # the evaluator itself is broken -> fatal.
                EVAL_ERRORS=$((EVAL_ERRORS + 1))
                result="eval-error"
                echo "::error::policy eval failed for $image (exit $rc)"
                cat "$OUTDIR/${image}.stderr" || true
                ;;
            esac

            # Count individual rule violations across bundles from the JSON
            # ([bundle_id, verdict] pairs; verdict is "Compliant",
            # {"Violations": [...]} or {"EvalError": "..."}). The `?` keeps
            # string verdicts ("Compliant") from raising jq type errors.
            if [ -s "$out" ] && command -v jq >/dev/null 2>&1; then
              vcount=$(jq '[.[] | (.[1].Violations? // []) | length] | add // 0' "$out" 2>/dev/null || echo '?')
            else
              vcount=0
            fi

            printf '%s\t%s\t%s\t0\t%s\n' "$image" "$result" "$vcount" "$rc" >> "$OUTDIR/summary.tsv"
            echo "image=$image result=$result violations=$vcount exit=$rc"
          done

          {
            echo "## Policy Eval Summary"
            echo ""
            echo "| Image | Result | Rule violations |"
            echo "|-------|--------|-----------------|"
            tail -n +2 "$OUTDIR/summary.tsv" | while IFS=$'\t' read -r img res vcount _; do
              echo "| $img | $res | $vcount |"
            done
            echo ""
            echo "**Totals:** compliant=$COMPLIANT, violations=$VIOLATIONS (expected for legacy images), eval-errors=$EVAL_ERRORS"
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "=== Policy Eval Summary ==="
          echo "compliant=$COMPLIANT violations=$VIOLATIONS eval-errors=$EVAL_ERRORS"

          # Fatal ONLY on evaluator breakage (eval errors), never on policy
          # violations (exit 2), which are expected for legacy images.
          if [ "$EVAL_ERRORS" -gt 0 ]; then
            echo "::error::$EVAL_ERRORS eval error(s) — policy evaluator is broken (fail-closed)"
            exit 1
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: policy-eval-results
          path: policy-eval-results/
          retention-days: 30
