[metadata]
tier = "standard"
name = "sigal"
version = "2.3.0"
description = "sigal container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/saimn/sigal"
"org.opencontainers.image.title" = "sigal"
"org.opencontainers.image.vendor" = "Sigal"
"org.opencontainers.image.version" = "2.3.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
