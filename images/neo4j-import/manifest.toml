[metadata]
tier = "standard"
name = "neo4j-import"
version = "5.17.0"
description = "Neo4j data import tool for bulk CSV/graph data loading"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/neo4j/bin/neo4j-admin", "import"]

[ports]
expose = [7474, 9101]

[labels]
"org.opencontainers.image.description" = "Neo4j data import tool for bulk CSV/graph data loading"
"org.opencontainers.image.title" = "neo4j-import"
"org.opencontainers.image.vendor" = "Neo4j"
"org.opencontainers.image.version" = "5.17.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "database-admin"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
