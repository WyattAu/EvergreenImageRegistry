[metadata]
name = "rqlite"
version = "8.10.0"
description = "Sovereign hardened rqlite - distributed SQLite database"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/rqlited"]

[ports]
expose = [4001, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened rqlite - distributed SQLite database"
"org.opencontainers.image.title" = "rqlite"
"org.opencontainers.image.vendor" = "rqlite"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

