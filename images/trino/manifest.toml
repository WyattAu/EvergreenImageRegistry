[metadata]
tier = "standard"
name = "trino"
version = "435"
description = "Evergreen hardened Trino - distributed SQL query engine"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/trino/bin/launcher", "run"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Trino - distributed SQL query engine"
"org.opencontainers.image.title" = "trino"
"org.opencontainers.image.vendor" = "Trino Software Foundation"
"org.opencontainers.image.version" = "435"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
