[metadata]
name = "dns-stats"
version = "0.5.0"
description = "DNS capture and statistics collection tool (dnscap/dnsstats)"
vendor = "PowerDNS"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/dmachard/dns-stats"

[runtime]
entrypoint = ["/usr/local/bin/dns-stats"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened DNS Stats - DNS monitoring and statistics tool"
"org.opencontainers.image.title" = "dns-stats"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.category" = "monitoring"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

