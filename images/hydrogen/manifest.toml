[metadata]
tier = "standard"
name = "hydrogen"
version = "0.5.1"
description = "Hydrogen - lightweight Matrix web client"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["busybox", "httpd", "-f", "-p", "8080", "-h", "/app"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Hydrogen - lightweight Matrix web client"
"org.opencontainers.image.source" = "https://github.com/element-hq/hydrogen-web"
"org.opencontainers.image.title" = "hydrogen"
"org.opencontainers.image.vendor" = "Element"
"org.opencontainers.image.version" = "0.5.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
