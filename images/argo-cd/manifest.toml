[metadata]
name = "argo-cd"
version = "3.3.8"
description = "Argo CD - declarative GitOps continuous delivery for Kubernetes"
vendor = "Argo Project"
source = "https://github.com/argoproj/argo-cd"
license = "Apache-2.0"
tier = "1"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/argoproj/argo-cd/releases/download/v3.3.8/argocd-linux-amd64"

[runtime]
entrypoint = ["/argocd"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened argo-cd - GitOps CD tool"
"org.opencontainers.image.title" = "argo-cd"
"org.opencontainers.image.vendor" = "Argo Project"
"org.opencontainers.image.version" = "3.3.8"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "10s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

