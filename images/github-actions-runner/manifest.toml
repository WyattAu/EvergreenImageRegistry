[metadata]
tier = "standard"
name = "github-actions-runner"
version = "2.316.1"
description = "github-actions-runner container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "runner"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/github/actions-runner"
[runtime]
entrypoint = ["run.sh"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "github-actions-runner"
"org.opencontainers.image.vendor" = "GitHub"
"org.opencontainers.image.version" = "2.316.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
