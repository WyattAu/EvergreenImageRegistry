[metadata]
name = "k3s"
version = "1.33.6+k3s1"
description = "K3s - lightweight Kubernetes distribution"
vendor = "SUSE"
source = "https://github.com/k3s-io/k3s"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/k3s/k3s/releases/download/v1.33.6+k3s1/k3s-1.33.6+k3s1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/k3s"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened k3s - lightweight Kubernetes"
"org.opencontainers.image.title" = "k3s"
"org.opencontainers.image.vendor" = "SUSE"
"org.opencontainers.image.version" = "1.33.6+k3s1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "15s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
