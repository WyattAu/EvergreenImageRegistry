[metadata]
name = "traefik"
version = "3.7.3"
upstream_version = "3.7.3"
description = "Traefik - modern HTTP reverse proxy and load balancer"
vendor = "Traefik Labs"
source = "https://github.com/traefik/traefik"
license = "MIT"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "binary-release"
url = "https://github.com/traefik/traefik/releases/download/v3.7.3/traefik_v3.7.3_linux_amd64.tar.gz"

[runtime]
entrypoint = ["/traefik"]

[ports]
expose = [80, 443, 8080, 9101]

[labels]
"org.opencontainers.image.title" = "traefik"
"org.opencontainers.image.vendor" = "Traefik Labs"
"org.opencontainers.image.version" = "v3.7.3"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "0-1"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-rolling"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.hft.xdp-capable" = "false"
"evergreen.hft.xdp-notes" = "Not supported; use envoy for XDP workloads"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
