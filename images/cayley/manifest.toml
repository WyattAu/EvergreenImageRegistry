[metadata]
name = "cayley"
version = "0.7.7"
deprecated = true
description = "Evergreen hardened Cayley - graph database with query language"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"
multiarch = false

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/cayley"]

[ports]
expose = [64210, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Cayley - graph database with query language"
"org.opencontainers.image.title" = "cayley"
"org.opencontainers.image.vendor" = "CayleyGraph"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
