[metadata]
name = "rowy"
version = "2.0.0"
description = "rowy container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/rowyio/rowy/releases"
"org.opencontainers.image.title" = "rowy"
"org.opencontainers.image.vendor" = "rowyio/rowy"
"org.opencontainers.image.version" = "2.0.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.hardened" = "true"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

