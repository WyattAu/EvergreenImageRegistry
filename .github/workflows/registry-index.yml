# =============================================================================
# EVERGREEN REGISTRY INDEX
# =============================================================================
# Builds and maintains a SQLite-backed registry index for fast queries
# across 5,000+ images.
#
# Triggers:
#   - After build-on-push completes (incremental update)
#   - Daily at 05:00 UTC (full rebuild after auto-version at 04:00)
#   - Manual dispatch for on-demand rebuild
#
# Output:
#   - .registry.db uploaded as artifact
#   - Index statistics in GitHub Step Summary
# =============================================================================

name: Registry Index

on:
  workflow_run:
    workflows: ["Build on Push"]
    types: [completed]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: registry-index
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build-index:
    name: Build Registry Index
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            evergreenctl/target
          key: cargo-${{ runner.os }}-${{ hashFiles('evergreenctl/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build evergreenctl
        run: cargo build --release --manifest-path evergreenctl/Cargo.toml

      - name: Build registry index
        run: |
          cargo run --release --manifest-path evergreenctl/Cargo.toml -- \
            index --images-dir images --db-path .registry.db

      - name: Query index statistics
        id: stats
        run: |
          cargo run --release --manifest-path evergreenctl/Cargo.toml -- \
            index-stats --db-path .registry.db --format json \
            > /tmp/index-stats.json

          # Extract key metrics
          TOTAL=$(python3 -c "import json; print(json.load(open('/tmp/index-stats.json'))['total_images'])")
          SBOM=$(python3 -c "import json; print(json.load(open('/tmp/index-stats.json'))['with_sbom'])")
          HC=$(python3 -c "import json; print(json.load(open('/tmp/index-stats.json'))['with_healthcheck'])")
          PINNED=$(python3 -c "import json; print(json.load(open('/tmp/index-stats.json'))['digest_pinned_pct'])")

          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "sbom=${SBOM}" >> "$GITHUB_OUTPUT"
          echo "healthcheck=${HC}" >> "$GITHUB_OUTPUT"
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"

      - name: Generate summary
        if: always()
        run: |
          TOTAL=${{ steps.stats.outputs.total || '0' }}
          SBOM=${{ steps.stats.outputs.sbom || '0' }}
          HC=${{ steps.stats.outputs.healthcheck || '0' }}
          PINNED=${{ steps.stats.outputs.pinned || '0' }}

          {
            echo "# Registry Index Report"
            echo ""
            echo "## Statistics"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Total Images** | ${TOTAL} |"
            echo "| **SBOM Coverage** | ${SBOM} |"
            echo "| **Healthcheck** | ${HC} |"
            echo "| **Digest Pinned** | ${PINNED}% |"
            echo ""
            echo "## Index Files"
            echo ""
            echo "- `.registry.db` - SQLite database"
            echo ""
            echo "_Generated at $(date -u +%Y-%m-%dT%H:%M:%SZ)_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload index database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-index
          path: .registry.db
          retention-days: 30

      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-index-stats
          path: /tmp/index-stats.json
          retention-days: 30

  query-demos:
    name: Demo Queries
    needs: build-index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download index
        uses: actions/download-artifact@v4
        with:
          name: registry-index

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build evergreenctl
        run: cargo build --release --manifest-path evergreenctl/Cargo.toml

      - name: Query tier 1 images
        run: |
          echo "## Tier 1 Images" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo run --release --manifest-path evergreenctl/Cargo.toml -- \
            index-query --db-path .registry.db --tier 1 --format text \
            >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "Query failed"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Query by source type
        run: |
          echo "## Binary Download Images" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo run --release --manifest-path evergreenctl/Cargo.toml -- \
            index-query --db-path .registry.db --source-type binary-download --format text \
            >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "Query failed"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
