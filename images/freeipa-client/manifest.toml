[metadata]
name = "freeipa-client"
version = "unknown"
description = "FreeIPA client tools via SSSD (Debian sssd suite provides FreeIPA client functionality)"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/bin/sssctl"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "FreeIPA client tools via SSSD (Debian sssd suite provides FreeIPA client functionality)"
"org.opencontainers.image.source" = "https://www.freeipa.org"
"org.opencontainers.image.title" = "freeipa-client"
"org.opencontainers.image.vendor" = "FreeIPA"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "identity"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

