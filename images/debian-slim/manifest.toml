[metadata]
tier = "standard"
name = "debian-slim"
version = "unknown"
description = "Evergreen hardened debian:bookworm-slim base image with ca-certificates, tzdata, dumb-init"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened debian:bookworm-slim base image with ca-certificates, tzdata, dumb-init"
"org.opencontainers.image.title" = "debian-slim"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "none"
"evergreen.image.category" = "base"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

