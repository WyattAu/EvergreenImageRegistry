[metadata]
tier = "standard"
name = "pydio-cells"
version = "4.4.17"
description = "pydio-cells container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "pydio/cells:${VERSION}"

[runtime]
entrypoint = ["/cells"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/pydio/cells"
"org.opencontainers.image.title" = "pydio-cells"
"org.opencontainers.image.vendor" = "Pydio"
"org.opencontainers.image.version" = "v4.4.17"
"evergreen.base.image" = "scratch"
"evergreen.constraint.base" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "10000ms"
"evergreen.image.category" = "cloud-storage"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

