[metadata]
tier = "standard"
name = "hive-metastore"
version = "4.0.0"
description = "Evergreen hardened Hive Metastore - metadata service for Apache Hive"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/hive/bin/hive", "--service", "metastore"]

[ports]
expose = [9083, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Hive Metastore - metadata service for Apache Hive"
"org.opencontainers.image.title" = "hive-metastore"
"org.opencontainers.image.vendor" = "Apache Software Foundation"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
