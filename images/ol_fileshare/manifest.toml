[metadata]
tier = "standard"
name = "ol_fileshare"
version = "unknown"
description = "Evergreen file sharing service (SMB/Samba)"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[ports]
expose = [445, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen file sharing service (SMB/Samba)"
"org.opencontainers.image.title" = "ol_fileshare"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "none"
"evergreen.image.category" = "storage"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
