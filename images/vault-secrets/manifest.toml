[metadata]
name = "vault-secrets"
version = "latest"
description = "vault-secrets container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "hashicorp/vault-secrets-operator:${VERSION}"

[runtime]
entrypoint = ["/vault-secrets-operator"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/hashicorp/vault-secrets-operator"
"org.opencontainers.image.title" = "vault-secrets"
"org.opencontainers.image.vendor" = "HashiCorp"
"org.opencontainers.image.version" = "1.4.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "security"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

