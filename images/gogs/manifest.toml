[metadata]
name = "gogs"
version = "0.13.0"
description = "Gogs - lightweight self-hosted Git service"
vendor = "Gogs"
source = "https://github.com/gogs/gogs"
license = "MIT"
tier = "2"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/gogs/gogs/releases/download/v0.13.0/gogs_0.13.0_linux_amd64.tar.gz"

[runtime]
entrypoint = ["gogs"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "Gogs - lightweight self-hosted Git service"
"org.opencontainers.image.source" = "https://github.com/gogs/gogs"
"org.opencontainers.image.title" = "gogs"
"org.opencontainers.image.vendor" = "Gogs"
"org.opencontainers.image.version" = "0.13.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

