[metadata]
name = "kibana-oss"
version = "8.12.2"
description = "Sovereign hardened Kibana OSS - open-source visualization dashboard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/kibana/bin/kibana"]

[ports]
expose = [5601, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Kibana OSS - open-source visualization dashboard"
"org.opencontainers.image.title" = "kibana-oss"
"org.opencontainers.image.vendor" = "Elastic"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "15s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "60000ms"
"sovereign.image.category" = "observability"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

