[metadata]
name = "heimdall"
version = "2.6.1"
description = "Heimdall - application dashboard and launcher"
vendor = "Heimdall"
source = "https://github.com/linuxserver/heimdall"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/heimdall/heimdall/releases/download/v2.6.1/heimdall-2.6.1-linux-amd64.tar.gz"
binary_name = "heimdall"
filename = "heimdall-2.6.1-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 80
metrics = 9101

[labels]
"org.opencontainers.image.title" = "heimdall"
"org.opencontainers.image.description" = "Heimdall - application dashboard and launcher"
"org.opencontainers.image.version" = "2.6.1"
"org.opencontainers.image.vendor" = "Heimdall"
"org.opencontainers.image.source" = "https://github.com/linuxserver/heimdall"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
