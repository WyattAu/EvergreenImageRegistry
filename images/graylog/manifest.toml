[metadata]
tier = "standard"
name = "graylog"
version = "5.1.5"
description = "Evergreen hardened Graylog - centralized log management platform"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/graylog/bin/graylogctl"]
cmd = ["run"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Graylog - centralized log management platform"
"org.opencontainers.image.title" = "graylog"
"org.opencontainers.image.vendor" = "Graylog"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "15s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "60000ms"
"evergreen.image.category" = "observability"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

