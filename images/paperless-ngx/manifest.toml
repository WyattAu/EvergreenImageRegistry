[metadata]
name = "paperless-ngx"
version = "2.20.14"
upstream_version = "2.20.14"
description = "Paperless-ngx - document management system"
vendor = "Paperless-ngx"
source = "https://github.com/paperless-ngx/paperless-ngx"
license = "GPL-3.0"
tier = "critical"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://pypi.org/pypi/paperless-ngx/2.20.14"

[runtime]
entrypoint = ["paperless"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/paperless-ngx/paperless-ngx"
"org.opencontainers.image.title" = "paperless-ngx"
"org.opencontainers.image.vendor" = "Paperless-ngx"
"org.opencontainers.image.version" = "2.20.14"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "document-management"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
