[metadata]
name = "rekor"
version = "1.5.1"
description = "Rekor - transparency log for supply chain security"
vendor = "Sigstore"
source = "https://github.com/sigstore/rekor"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/sigstore/rekor/releases/download/v1.5.1/rekor-linux-amd64"

[runtime]
entrypoint = ["/rekor-server"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/sigstore/rekor"
"org.opencontainers.image.title" = "rekor"
"org.opencontainers.image.vendor" = "sigstore"
"org.opencontainers.image.version" = "1.5.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "security"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
