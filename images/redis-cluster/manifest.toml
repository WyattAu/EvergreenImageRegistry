[metadata]
name = "redis-cluster"
version = "7.4.1"
description = "Redis Cluster - distributed Redis implementation"
vendor = "Redis"
source = "https://github.com/redis/redis"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/redis-cluster/redis-cluster/releases/download/v7.4.1/redis-cluster-7.4.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/redis", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Redis Cluster - Redis with cluster mode pre-enabled"
"org.opencontainers.image.title" = "redis-cluster"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

