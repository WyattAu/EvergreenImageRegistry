[metadata]
name = "h2"
version = "2.2.224"
description = "Sovereign hardened H2 Database - embedded Java SQL database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["java", "-cp", "/opt/h2/h2.jar", "org.h2.tools.Server"]

[ports]
expose = [8082, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened H2 Database - embedded Java SQL database"
"org.opencontainers.image.title" = "h2"
"org.opencontainers.image.vendor" = "H2 Group"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

