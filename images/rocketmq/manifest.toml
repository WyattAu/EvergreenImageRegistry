[metadata]
name = "rocketmq"
version = "5.1.4"
description = "rocketmq container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/rocketmq/bin/mqnamesrv"]

[ports]
expose = [9876, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/apache/rocketmq"
"org.opencontainers.image.title" = "rocketmq"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "5.1.4"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.distrole" = "debian-slim"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "30000ms"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

