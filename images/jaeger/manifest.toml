[metadata]
name = "jaeger"
version = "1.62.0"
description = "Jaeger - end-to-end distributed tracing"
vendor = "Jaeger"
source = "https://github.com/jaegertracing/jaeger"
license = "Apache-2.0"
tier = "1"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/jaegertracing/jaeger/releases/download/v1.62.0/jaeger-1.62.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/jaeger-agent"]

[ports]
expose = [5775, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/jaegertracing/jaeger"
"org.opencontainers.image.title" = "jaeger"
"org.opencontainers.image.vendor" = "JaegerTracing"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "observability"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

