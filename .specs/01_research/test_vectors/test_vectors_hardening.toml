# Test Vector Specification - Security Hardening
# Tests for container security hardening requirements

[metadata]
algorithm_id = "ALG-HARDEN-001"
algorithm_version = "1.0.0"
generation_date = "2026-04-19"
generator = "manual"
verification_status = "verified"

[precision_requirements]
floating_point_type = "integer"
absolute_tolerance = 0
relative_tolerance = 0
ulp_tolerance = 0

# Test Vector 001: Non-root execution verification
[[test_vector]]
id = "TV-HARD-001"
name = "Non-root user execution"
category = "nominal"
priority = "critical"
description = "Verify container runs as non-root user (UID 65534)"

[test_vector.input]
image = { type = "string", value = "test-image:latest" }

[test_vector.expected_output]
user_id = { type = "integer", value = 65534, tolerance = 0 }
user_name = { type = "string", value = "nobody" }

[test_vector.verification]
source = "Dockerfile USER directive"
method = "Analytical"
confidence = 1.0
verifier = "Nexus"
verification_date = "2026-04-19"

# Test Vector 002: Read-only root filesystem
[[test_vector]]
id = "TV-HARD-002"
name = "Read-only root filesystem verification"
category = "nominal"
priority = "critical"
description = "Verify root filesystem is read-only"

[test_vector.input]
image = { type = "string", value = "test-image:latest" }

[test_vector.expected_output]
