[metadata]
tier = "critical"
name = "statuspage"
version = "latest"
description = "Static status page generator"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/cstate/cstate:${VERSION}"

[runtime]
entrypoint = ["/cstate"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Static status page generator"
"org.opencontainers.image.source" = "https://github.com/cstate/cstate"
"org.opencontainers.image.title" = "statuspage"
"org.opencontainers.image.vendor" = "cstate"
"org.opencontainers.image.version" = "v6.0.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.base" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "2000ms"
"evergreen.image.category" = "monitoring"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
