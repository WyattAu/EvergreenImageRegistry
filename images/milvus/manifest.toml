[metadata]
tier = "standard"
name = "milvus"
version = "2.4.0"
description = "milvus container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "milvusdb/milvus:${VERSION}"

[runtime]
entrypoint = ["/opt/milvus/bin/milvus"]

[ports]
expose = [19530, 9101]

[labels]
"org.opencontainers.image.title" = "milvus"
"org.opencontainers.image.vendor" = "Milvus"
"org.opencontainers.image.version" = "2.4.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
