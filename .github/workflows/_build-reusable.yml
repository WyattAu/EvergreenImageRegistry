# =============================================================================
# EVERGREEN BUILD PIPELINE - REUSABLE BUILD JOB
# =============================================================================
# This is a reusable workflow that provides the actual build, test, and push
# logic. It is called by build-on-push.yml, build-nightly.yml, and
# build-on-demand.yml with different image matrices.
# =============================================================================

name: _Build Images (reusable)

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON matrix of image batches'
        required: true
        type: string
      tag:
        description: 'Image tag to use'
        required: false
        type: string
        default: ''
      push:
        description: 'Whether to push to registry'
        required: false
        type: boolean
        default: true
      sign:
        description: 'Whether to sign images with Cosign'
        required: false
        type: boolean
        default: false
      multiarch:
        description: 'Build multi-arch (amd64+arm64) or amd64 only'
        required: false
        type: boolean
        default: true
      tier:
        description: 'Build tier for reporting'
        required: false
        type: string
        default: 'standard'
    secrets:
      DOCKERHUB_USERNAME:
        description: 'Docker Hub username'
        required: false
      DOCKERHUB_TOKEN:
        description: 'Docker Hub token'
        required: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository }}

permissions: {}

jobs:
  build:
    name: 'Build ${{ inputs.tier }} Batch ${{ matrix.batch }} (${{ matrix.count }} images)'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Resolve tag
        id: resolve-tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.0
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=10

      - name: Cache BuildKit layers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: /tmp/.buildkit-cache
          key: buildkit-${{ inputs.tier }}-${{ github.sha }}
          restore-keys: |
            buildkit-${{ inputs.tier }}-

      - name: Lowercase registry owner
        run: echo "OWNER=$(echo '${{ env.OWNER }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to Registry
        if: inputs.push
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: inputs.push
        continue-on-error: true
        id: dockerhub-login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images (multi-arch or amd64 tarballs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve-tag.outputs.TAG }}"
          mkdir -p /tmp/images
          IFS=',' read -ra IMAGE_LIST <<< "${{ matrix.images }}"
          BUILT=0; FAILED=0; SKIPPED=0
          # No buildx needed — using plain docker build
          build_image() {
            local image="$1"
            local REF="${REGISTRY}/${OWNER}/${image}:${TAG}"
            local DOCKERHUB_REF="docker.io/wyattau/${image}"
            local SAFE="${image//\//-}"
            echo "::group::Build ${image}"
            local REF="${REGISTRY}/${OWNER}/${image}:${TAG}"
            local LATEST_REF="${REGISTRY}/${OWNER}/${image}:latest"
            local DOCKERHUB_REF="docker.io/wyattau/${image}"
            local TAG_FLAGS="-t ${REF} -t ${LATEST_REF}"
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              TAG_FLAGS="${TAG_FLAGS} -t ${DOCKERHUB_REF}:${TAG} -t ${DOCKERHUB_REF}:latest"
            fi
            # Use plain docker build (inherits host credentials, no buildx driver issues)
            if timeout 900 docker build \
                ${TAG_FLAGS} \
                --build-arg "BUILD_DATE=${TAG}" \
                --build-arg "VCS_REF=${TAG}" \
                --build-arg "SHIM_VERSION=v1.2.0" \
                --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                --label "org.opencontainers.image.revision=${{ github.sha }}" \
                "./images/${image}"; then
              echo "${REF}" >> /tmp/built-images.txt
              return 0
            else
              return 1
            fi
          }
          for image in "${IMAGE_LIST[@]}"; do
            [ -z "$image" ] && continue
            [ ! -f "./images/${image}/Dockerfile" ] && { echo "::warning::${image}: no Dockerfile"; SKIPPED=$((SKIPPED+1)); continue; }
            if [ $((BUILT + FAILED)) -gt 0 ] && [ $(( (BUILT + FAILED) % 5 )) -eq 0 ]; then
              docker image prune -f 2>/dev/null || true
            fi
            if build_image "${image}"; then
              BUILT=$((BUILT+1)); sleep 1
              # Smoke test: verify shim binary exists in the built image
              SAFE="${image//\//-}"
              TAR="/tmp/images/${SAFE}.tar"
              if [ "${{ inputs.multiarch }}" != "true" ] && [ -f "$TAR" ]; then
                echo "::group::Smoke test ${image}"
                docker load -i "$TAR" 2>/dev/null || true
                CONTAINER_ID=$(docker create "${REGISTRY}/${OWNER}/${image}:${TAG}" 2>/dev/null || echo "")
                if [ -n "$CONTAINER_ID" ]; then
                  if docker cp "${CONTAINER_ID}:/usr/local/bin/shim" /dev/null 2>/dev/null; then
                    echo "Smoke: PASS — /usr/local/bin/shim exists"
                  else
                    echo "::error::${image}: smoke test FAILED — /usr/local/bin/shim not found in image"
                    FAILED=$((FAILED+1))
                    BUILT=$((BUILT-1))
                  fi
                  docker rm "$CONTAINER_ID" 2>/dev/null || true
                fi
                echo "::endgroup::"
              fi
            else
              echo "::warning::${image}: build failed, retrying..."
              sleep 5
              if build_image "${image}"; then
                BUILT=$((BUILT+1)); sleep 1
              else
                echo "::error::${image}: build failed after 2 attempts"
                FAILED=$((FAILED+1)); sleep 3
              fi
            fi
            echo "::endgroup::"
          done
          echo "Batch ${{ matrix.batch }}: ${BUILT} built, ${FAILED} failed, ${SKIPPED} skipped"
          echo "BUILDER_NAME=${CURRENT_BUILDER}" >> "$GITHUB_ENV"
          if [ "${FAILED}" -gt 0 ]; then
            echo "::warning::${FAILED} image(s) failed to build in batch ${{ matrix.batch }}"
          fi
          # Fail the step if NO images were built (all failed)
          if [ "${BUILT}" -eq 0 ] && [ "${FAILED}" -gt 0 ]; then
            echo "::error::All ${FAILED} images failed to build in batch ${{ matrix.batch }}"
            exit 1
          fi

      - name: Cleanup secret file
        if: always()
        run: rm -f /tmp/github-token

      - name: Update BuildKit cache
        if: always()
        run: |
          if [ -d /tmp/.buildkit-cache-new ]; then
            rm -rf /tmp/.buildkit-cache
            mv /tmp/.buildkit-cache-new /tmp/.buildkit-cache
          fi

      - name: Enforce image size limit
        if: always()
        continue-on-error: true
        run: |
          LIMIT_MB=${IMAGE_SIZE_LIMIT:-2048}
          EXCEEDED=0
          for tar in /tmp/images/*.tar; do
            [ -f "$tar" ] || continue
            SIZE_MB=$(($(stat --format=%s "$tar") / 1024 / 1024))
            if [ "$SIZE_MB" -gt "$LIMIT_MB" ]; then
              echo "::error::$(basename "$tar" .tar): ${SIZE_MB}MB > ${LIMIT_MB}MB"
              EXCEEDED=$((EXCEEDED+1))
            fi
          done
          [ "$EXCEEDED" -gt 0 ] && exit 1

      - name: Upload image tarballs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: images-${{ inputs.tier }}-batch-${{ matrix.batch }}
          path: /tmp/images/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

      - name: Upload built image references
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: built-list-${{ inputs.tier }}-batch-${{ matrix.batch }}
          path: /tmp/built-images.txt
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

      - name: Build shimctl
        if: always()
        continue-on-error: true
        run: |
          echo "::group::Build shimctl"
          cargo install shimctl --git https://github.com/${{ github.repository_owner }}/EvergreenShims.git --locked 2>&1 || \
            echo "::warning::shimctl build failed (non-blocking)"
          if command -v shimctl &>/dev/null; then
            shimctl --version 2>&1 || true
          fi
          echo "::endgroup::"

      - name: Push to registry (single-arch fallback)
        if: always() && inputs.push && !inputs.multiarch
        timeout-minutes: 90
        run: |
          TAG="${{ steps.resolve-tag.outputs.TAG }}"
          IFS=',' read -ra IMAGE_LIST <<< "${{ matrix.images }}"
          PUSHED=0; FAILED=0
          for image in "${IMAGE_LIST[@]}"; do
            [ -z "$image" ] && continue
            [ ! -f "./images/${image}/Dockerfile" ] && continue
            SAFE="${image//\//-}"
            TAR="/tmp/images/${SAFE}.tar"
            REF="${REGISTRY}/${OWNER}/${image}:${TAG}"
            # Extract VERSION from Dockerfile for semantic version tag
            VERSION_TAG=$(grep -oP '(?<=^ARG VERSION=).*' "./images/${image}/Dockerfile" 2>/dev/null | head -1)
            echo "::group::Push ${image}"
            REF="${REGISTRY}/${OWNER}/${image}:${TAG}"
            # Check if image was actually built
            if ! docker image inspect "${REF}" >/dev/null 2>&1; then
              echo "::warning::${image}: image not in daemon (build failed), skipping push"
              FAILED=$((FAILED+1))
              echo "::endgroup::"
              continue
            fi
            # Image is in Docker daemon — push directly
            PUSH_OK=0
            for attempt in 1 2 3; do
              if timeout 600 docker push "${REF}" 2>&1; then
                PUSH_OK=1; break
              fi
              echo "Push attempt $attempt failed for ${image}, retrying in 15s..."
              sleep 15
            done
            if [ "$PUSH_OK" = "1" ]; then
                PUSHED=$((PUSHED+1))
                # Also push with version tag for deterministic pulls
                if [ -n "${VERSION_TAG}" ]; then
                  VERSION_REF="${REGISTRY}/${OWNER}/${image}:${VERSION_TAG}"
                  docker tag "${REF}" "${VERSION_REF}" 2>/dev/null || true
                  for attempt in 1 2 3; do
                    if timeout 300 docker push "${VERSION_REF}" 2>&1; then
                      echo "Pushed version tag: ${VERSION_TAG}"
                      break
                    fi
                    sleep 10
                  done
                  else
                    echo "::warning::${image}: version tag push failed (${VERSION_TAG})"
                  fi
                fi
                # Push :latest tag
                LATEST_REF="${REGISTRY}/${OWNER}/${image}:latest"
                docker tag "${REF}" "${LATEST_REF}" 2>/dev/null || true
                for attempt in 1 2 3; do
                  if timeout 600 docker push "${LATEST_REF}" 2>&1; then
                    echo "Pushed latest tag"
                    break
                  fi
                  sleep 10
                done
                # Set package visibility to public (GHCR lowercases names)
                SAFE_NAME=$(echo "${image}" | tr '[:upper:]' '[:lower:]')
                gh api -X PATCH "/user/packages/container/${SAFE_NAME}/visibility" \
                  -f visibility=public 2>/dev/null || true
              else
                echo "::warning::${image}: push failed"
                FAILED=$((FAILED+1))
              fi
            else
              echo "::warning::${image}: not built, skipping push"
              FAILED=$((FAILED+1))
            fi
            sleep 2
            echo "::endgroup::"
          done
          echo "Push: ${PUSHED} ok, ${FAILED} failed"
          if [ "${FAILED}" -gt 0 ]; then
            echo "::warning::${FAILED} image(s) skipped/failed push in batch ${{ matrix.batch }}"
          fi

      - name: Generate SBOMs with syft
        if: always() && inputs.push
        continue-on-error: true
        run: |
          TAG="${{ steps.resolve-tag.outputs.TAG }}"
          IFS=',' read -ra IMAGE_LIST <<< "${{ matrix.images }}"
          for image in "${IMAGE_LIST[@]}"; do
            [ -z "$image" ] && continue
            [ ! -f "./images/${image}/Dockerfile" ] && continue
            SBOM="./images/${image}/sbom.spdx.json"
            echo "::group::SBOM ${image}"
            if syft "dir:./images/${image}" -o spdx-json > "${SBOM}" 2>&1; then
              echo "Generated SBOM for ${image}"
            else
              echo "::warning::syft failed for ${image}, generating placeholder"
              python3 -c "import json,sys; json.dump({'spdxVersion':'SPDX-2.3','dataLicense':'CC0-1.0','SPDXID':'SPDXRef-DOCUMENT','name':sys.argv[1],'documentNamespace':'https://github.com/evergreen-registry/'+sys.argv[1]}, open(sys.argv[2],'w'), indent=2)" "${image}" "${SBOM}"
            fi
            echo "::endgroup::"
          done

      - name: Attest SBOMs with cosign
        if: always() && inputs.push
        continue-on-error: true
        run: |
          TAG="${{ steps.resolve-tag.outputs.TAG }}"
          IFS=',' read -ra IMAGE_LIST <<< "${{ matrix.images }}"
          for image in "${IMAGE_LIST[@]}"; do
            [ -z "$image" ] && continue
            [ ! -f "./images/${image}/Dockerfile" ] && continue
            SBOM="./images/${image}/sbom.spdx.json"
            REF="${REGISTRY}/${OWNER}/${image}:${TAG}"
            echo "::group::Attest SBOM ${image}"
            if [ -f "$SBOM" ]; then
              if cosign attest --yes \
                --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/_build-reusable.yml@refs/heads/main" \
                --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
                --predicate "$SBOM" \
                --type spdxjson "$REF" 2>&1; then
                echo "Attested SBOM for ${image}"
              else
                echo "::warning::cosign attest failed for ${image}"
              fi
            else
              echo "::warning::no SBOM file for ${image}, skipping attestation"
            fi
            echo "::endgroup::"
          done

  report:
    name: Build Report (${{ inputs.tier }})
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "# Build Report - ${{ inputs.tier }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tier** | ${{ inputs.tier }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${{ inputs.tag || github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Push** | ${{ inputs.push }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Sign** | ${{ inputs.sign }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Multi-arch** | ${{ inputs.multiarch }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Build** | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
