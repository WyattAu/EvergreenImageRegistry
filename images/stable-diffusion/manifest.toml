[metadata]
name = "stable-diffusion"
version = "2.1.0"
description = "stable-diffusion container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [7860, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/Stability-AI/stablediffusion"
"org.opencontainers.image.title" = "stable-diffusion"
"org.opencontainers.image.vendor" = "Stability AI"
"org.opencontainers.image.version" = "2.1.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

