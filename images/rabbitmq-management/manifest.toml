[metadata]
name = "rabbitmq-management"
version = "3.13.1"
description = "RabbitMQ Management - web-based management plugin for RabbitMQ"
vendor = "VMware"
source = "https://github.com/rabbitmq/rabbitmq-server"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/rabbitmq-management/rabbitmq-management/releases/download/v3.13.1/rabbitmq-management-3.13.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["rabbitmq-server"]

[ports]
expose = [5672, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened RabbitMQ Management - RabbitMQ with management UI plugin"
"org.opencontainers.image.title" = "rabbitmq-management"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "messaging"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

