# Maps EIR constraint engine (C001-C020) and policy engine rules to SOC 2 TSC.
# Used for SOC 2 Type II audit preparation.
#
# Trust Services Categories:
#   CC — Common Criteria (security, availability, processing integrity, confidentiality, privacy)
#   A — Availability
#   PI — Processing Integrity
#   C — Confidentiality
#   P — Privacy
# =============================================================================

metadata:
  version: "1.0.0"
  framework: "SOC 2 Type II"
  generated: "2026-08-22"
  description: "Mapping from EIR constraint engine to SOC 2 Trust Services Criteria"

# ---------------------------------------------------------------------------
# Common Criteria (CC)
# ---------------------------------------------------------------------------
common_criteria:

  CC6.1:  # Logical access security
    description: "The entity implements logical access security software, infrastructure, and architectures over protected information assets"
    eir_controls:
      - constraint: C003
        name: "Non-root USER"
        evidence: "All images run as UID 65532 (non-root)"
        automated: true
      - constraint: C016
        name: "No shell in production"
        evidence: "Distroless images have no shell"
        automated: true
      - constraint: C017
        name: "No package manager"
        evidence: "No apk/apt/yum in final stage"
        automated: true
      - policy: DOCKER-SEC-003
        name: "Non-root enforcement"
        evidence: "Rego policy blocks images without USER 65532"
        automated: true

  CC6.6:  # System boundaries
    description: "The entity implements system boundary protections"
    eir_controls:
      - constraint: C004
        name: "No Alpine base"
        evidence: "Alpine base images are BANNED per ADR-007"
        automated: true
      - constraint: C018
        name: "FROM allowlist"
        evidence: "Only approved bases: scratch, wolfi, distroless, ubi-micro"
        automated: true
      - policy: BASE-001
        name: "Base image allowlist"
        evidence: "Rego policy enforces approved base images"
        automated: true

  CC7.1:  # Vulnerability management
    description: "To meet its objectives, the entity uses detection and monitoring procedures"
    eir_controls:
      - constraint: C013
        name: "SBOM exists"
        evidence: "All images must have SPDX 2.3 SBOM"
        automated: true
      - tool: "daily-security-scan.yml"
        name: "Daily vulnerability scanning"
        evidence: "Trivy scans all images nightly"
        automated: true
      - tool: "vuln-sla-monitor.yml"
        name: "CVE SLA monitoring"
        evidence: "Tracks CVE age against defined SLAs"
        automated: true
      - tool: "scripts/vuln_sla_alert.py"
        name: "SLA breach alerting"
        evidence: "PagerDuty/Slack alerts on SLA breach"
        automated: true

  CC7.2:  # Monitoring
    description: "The entity monitors system components and the operation"
    eir_controls:
      - tool: "export_metrics.py"
        name: "Prometheus metrics"
        evidence: "20+ metrics exported for monitoring"
        automated: true
      - tool: "evergreenctl dashboard"
        name: "Compliance dashboard"
        evidence: "HTML dashboard with real-time status"
        automated: true
      - tool: "evergreenctl drift"
        name: "Drift detection"
        evidence: "Compares running images against registry"
        automated: true

  CC8.1:  # Change management
    description: "The entity authorizes, designs, develops or acquires, configures, documents, tests, approves, and implements changes"
    eir_controls:
      - tool: "pre-push-gate.sh"
        name: "Pre-push quality gate"
        evidence: "17 automated checks before any push"
        automated: true
      - tool: "pre-commit hooks"
        name: "Pre-commit validation"
        evidence: "9 hooks validate before commit"
        automated: true
      - tool: "_build-reusable.yml"
        name: "Build pipeline"
        evidence: "Automated build, test, sign, push"
        automated: true
      - constraint: C001
        name: "Manifest validation"
        evidence: "All images must have valid manifest.toml"
        automated: true
      - constraint: C002
        name: "Dockerfile validation"
        evidence: "All images must have Dockerfile"
        automated: true

  CC9.1:  # Risk management
    description: "The entity identifies, selects, and develops risk mitigation activities"
    eir_controls:
      - tool: "compliance-scan.yml"
        name: "CIS/STIG compliance"
        evidence: "Automated benchmark scanning"
        automated: true
      - tool: "cis-gate.yml"
        name: "CIS Docker Benchmark gate"
        evidence: "PR gate blocks non-compliant images"
        automated: true
      - policy: "VULN-001"
        name: "Critical CVE threshold"
        evidence: "No unpatched critical CVEs in Tier 1"
        automated: true

