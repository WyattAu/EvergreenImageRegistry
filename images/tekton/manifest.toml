[metadata]
name = "tekton"
version = "0.60.0"
description = "Tekton - cloud-native CI/CD solution for Kubernetes"
vendor = "TektonCD"
source = "https://github.com/tektoncd/pipeline"
license = "Apache-2.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/tektoncd/pipeline/releases/download/0.60.0/tekton-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/tekton"]

[ports]
expose = [9090, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/tektoncd/pipeline"
"org.opencontainers.image.title" = "tekton"
"org.opencontainers.image.vendor" = "TektonCD"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "ci"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
