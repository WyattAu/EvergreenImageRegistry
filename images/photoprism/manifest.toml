[metadata]
tier = "standard"
name = "photoprism"
version = "260305-fad9d5395"
description = "photoprism container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/photoprism"]

[ports]
expose = [2282, 9101]

[labels]
"org.opencontainers.image.title" = "photoprism"
"org.opencontainers.image.vendor" = "PhotoPrism"
"org.opencontainers.image.version" = "260305-fad9d5395"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
