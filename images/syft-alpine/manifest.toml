[metadata]
tier = "standard"
name = "syft-alpine"
version = "1.11.0"
description = "Syft - SBOM scanner (no Alpine)"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/syft"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Syft - SBOM scanner (no Alpine)"
"org.opencontainers.image.source" = "https://github.com/anchore/syft"
"org.opencontainers.image.title" = "syft-alpine"
"org.opencontainers.image.vendor" = "Anchore"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
