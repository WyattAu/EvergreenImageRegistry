[metadata]
name = "gitlab-runner-alpine"
version = "16.11.0"
description = "GitLab Runner (scratch) - CI/CD runner for GitLab, minimal scratch image"
vendor = "GitLab"
source = "https://gitlab.com/gitlab-org/gitlab-runner"
license = "MIT"
tier = "2"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://gitlab-runner-downloads.s3.amazonaws.com/v16.11.0/binaries/gitlab-runner-linux-amd64"

[runtime]
entrypoint = ["gitlab-runner"]

[ports]
expose = [8093, 9101]

[labels]
"org.opencontainers.image.description" = "GitLab Runner (scratch) - CI/CD runner for GitLab, minimal scratch image"
"org.opencontainers.image.source" = "https://gitlab.com/gitlab-org/gitlab-runner"
"org.opencontainers.image.title" = "gitlab-runner-alpine"
"org.opencontainers.image.vendor" = "GitLab"
"org.opencontainers.image.version" = "16.11.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

