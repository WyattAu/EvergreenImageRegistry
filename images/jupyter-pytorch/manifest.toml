[metadata]
tier = "standard"
name = "jupyter-pytorch"
version = "7.3.0"
description = "jupyter-pytorch container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["jupyter-lab"]

[ports]
expose = [8888, 9101]

[labels]
"org.opencontainers.image.title" = "jupyter-pytorch"
"org.opencontainers.image.vendor" = "Jupyter"
"org.opencontainers.image.version" = "7.3.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
