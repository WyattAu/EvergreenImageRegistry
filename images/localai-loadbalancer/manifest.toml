[metadata]
name = "localai-loadbalancer"
version = "v4.1.3"
description = "localai-loadbalancer container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "localai/localai:v4.1.3"

[runtime]
entrypoint = ["/usr/local/bin/localai-loadbalancer"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/mudler/LocalAI"
"org.opencontainers.image.title" = "localai-loadbalancer"
"org.opencontainers.image.vendor" = "mudler/LocalAI"
"org.opencontainers.image.version" = "v4.1.3"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

