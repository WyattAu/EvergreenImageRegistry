[metadata]
tier = "standard"
name = "tooljet-server"
version = "2.57.0"
description = "tooljet-server container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/ToolJet/ToolJet/releases"
"org.opencontainers.image.title" = "tooljet-server"
"org.opencontainers.image.vendor" = "ToolJet/ToolJet"
"org.opencontainers.image.version" = "2.57.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
