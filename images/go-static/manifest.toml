[metadata]
name = "go-static"
version = "1.22.10"
description = "Sovereign hardened go-static - Go static compilation base"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["go"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened go-static - Go static compilation base"
"org.opencontainers.image.title" = "go-static"
"org.opencontainers.image.vendor" = "Go"
"org.opencontainers.image.version" = "1.22.10"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

