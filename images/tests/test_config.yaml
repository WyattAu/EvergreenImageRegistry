# =============================================================================
# TEST CONFIGURATION - ALL 1,013 IMAGES (946 real, 67 stubs)
# =============================================================================
# Configuration for test_runner.sh
# Categories: proxy, database, monitoring, security, devops, messaging,
#             dns, vpn, search, app, runtime, official
# Stub images have: binary=none, health_port=0, functional_test=none,
#                    adversarial_test=false, startup_timeout=0, stub=true
# Real images have: binary, health_port, version_flag, category,
#                   functional_test, adversarial_test, startup_timeout
# =============================================================================
#
# STUB CLASSIFICATION (67 images with binary: none)
# --------------------------------------------------
# Category A - No Dockerfile (23): Placeholder entries with no image directory.
#   agile, approved, blazebase, bsondb, castaway, category, csam, dodb, dollar,
#   homefinance, mediadl, moneyboss, od, od-powerful, perkunadb, quickbooks,
#   source, value, vulcan, wave, webshow, wps-office, zohoinvoice
#
# Category B - FROM scratch, no testable binary (18): Compiled/static binaries
#   with no shell or testable entrypoint.
#   aarch64-unknown-linux-musl, amd64, crdb-operator, cubrid, cyberduck, gitrob,
#   graphdb-free, grub, innernet, innernet-client, nxlog, orientdb,
#   pagerduty-agent, realm-server, rethinkdb, static-c, windows-exporter, xteve
#
# Category C - FROM wolfi-base, potentially testable (22): Have a shell and
#   package manager but no configured test binary.
#   alpine, arm64, athom, courier-authlib, courier-imap, debian-slim, homekit,
#   kdb, kdb-plus, ol_fileshare, openjre, repo-security, repo-supervisor,
#   secrets-scanner, secretz, shh, sssd, standard, upstream, zeromq, zoe, zzh
#
# Category D - FROM chainguard/static (3): Minimal static base.
#   alpine-static, musl, x86_64-unknown-linux-musl
#
# Category E - FROM distroless (1): Google Distroless, no shell.
#   distroless
#
# =============================================================================

categories:
  proxy:
    description: 'Proxy, load balancer, and reverse proxy images'
  database:
    description: 'Database and data store images'
  monitoring:
    description: 'Monitoring, metrics, and observability images'
  security:
    description: 'Security tools and identity management images'
  devops:
    description: 'CI/CD, Git, and DevOps toolchain images'
  messaging:
    description: 'Message queue and event streaming images'
  dns:
    description: 'DNS server and DNS-related images'
  vpn:
    description: 'VPN and networking tunnel images'
  search:
    description: 'Search engine and vector database images'
  app:
    description: 'Application and service images'
  runtime:
    description: 'Language runtime and CLI tool images'
  official:
    description: 'Images based on official upstream distributions'

