[metadata]
name = "koel"
version = "6.10.3"
description = "koel container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/koel/koel/releases"
"org.opencontainers.image.title" = "koel"
"org.opencontainers.image.vendor" = "koel/koel"
"org.opencontainers.image.version" = "6.10.3"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

