[metadata]
tier = "standard"
name = "kibana-oss"
version = "8.12.2"
description = "Evergreen hardened Kibana OSS - open-source visualization dashboard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/kibana/bin/kibana"]

[ports]
expose = [5601, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Kibana OSS - open-source visualization dashboard"
"org.opencontainers.image.title" = "kibana-oss"
"org.opencontainers.image.vendor" = "Elastic"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "15s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "60000ms"
"evergreen.image.category" = "observability"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
