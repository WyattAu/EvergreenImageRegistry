[metadata]
name = "sonarr"
version = "4.0.10"
description = "Sonarr - PVR for Usenet and BitTorrent users"
vendor = "Sonarr"
source = "https://github.com/Sonarr/Sonarr"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/sonarr/sonarr/releases/download/v4.0.10/sonarr-4.0.10-linux-amd64.tar.gz"
binary_name = "sonarr"
filename = "sonarr-4.0.10-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 8989
metrics = 9101

[labels]
"org.opencontainers.image.title" = "sonarr"
"org.opencontainers.image.description" = "Sonarr - PVR for Usenet and BitTorrent users"
"org.opencontainers.image.version" = "4.0.10"
"org.opencontainers.image.vendor" = "Sonarr"
"org.opencontainers.image.source" = "https://github.com/Sonarr/Sonarr"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "none"
