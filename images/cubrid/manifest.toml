[metadata]
tier = "standard"
name = "cubrid"
version = "latest"
description = "Evergreen hardened CUBRID - open source SQL database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "cubrid/cubrid:${VERSION}"

[runtime]
entrypoint = ["/opt/cubrid/bin/cubrid"]

[ports]
expose = [30000, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened CUBRID - open source SQL database"
"org.opencontainers.image.title" = "cubrid"
"org.opencontainers.image.vendor" = "CUBRID"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
