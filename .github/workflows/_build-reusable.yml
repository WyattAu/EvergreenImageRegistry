# =============================================================================
# EVERGREEN BUILD PIPELINE - REUSABLE BUILD JOB
# =============================================================================
# This is a reusable workflow that provides the actual build, test, and push
# logic. It is called by build-on-push.yml, build-nightly.yml, and
# build-on-demand.yml with different image matrices.
# =============================================================================

name: _Build Images (reusable)

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON matrix of image batches'
        required: true
        type: string
      tag:
        description: 'Image tag to use'
        required: false
        type: string
        default: ''
      push:
        description: 'Whether to push to registry'
        required: false
        type: boolean
        default: true
      sign:
        description: 'Whether to sign images with Cosign'
        required: false
        type: boolean
        default: false
      multiarch:
        description: 'Build multi-arch (amd64+arm64) or amd64 only'
        required: false
        type: boolean
        default: true
      tier:
        description: 'Build tier for reporting'
        required: false
        type: string
        default: 'standard'
    secrets:
      DOCKERHUB_USERNAME:
        description: 'Docker Hub username'
        required: false
      DOCKERHUB_TOKEN:
        description: 'Docker Hub token'
        required: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

permissions: {}

jobs:
  build:
    name: 'Build ${{ inputs.tier }} Batch ${{ matrix.batch }} (${{ matrix.count }} images)'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Resolve tag
        id: resolve-tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.0
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=10

      - name: Cache BuildKit layers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: /tmp/.buildkit-cache
          key: buildkit-${{ inputs.tier }}-${{ github.sha }}
          restore-keys: |
            buildkit-${{ inputs.tier }}-

      - name: Lowercase registry owner
        run: echo "OWNER=$(echo '${{ env.OWNER }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to Registry
        if: inputs.push
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: inputs.push
        continue-on-error: true
        id: dockerhub-login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write GITHUB_TOKEN secret file
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" > /tmp/github-token

      - name: Build images (amd64 tarballs for verification)
        run: |
          TAG="${{ steps.resolve-tag.outputs.TAG }}"
          mkdir -p /tmp/images
          IFS=',' read -ra IMAGE_LIST <<< "${{ matrix.images }}"
          BUILT=0; FAILED=0; SKIPPED=0
          CURRENT_BUILDER=$(docker buildx inspect --format '{{.Name}}' 2>/dev/null | head -1)
          recreate_builder() {
            echo "::notice::Recreating BuildKit builder..."
            [ -n "$CURRENT_BUILDER" ] && docker buildx rm "$CURRENT_BUILDER" 2>/dev/null || true
            CURRENT_BUILDER="evergreen-$(date +%s)"
            docker buildx create --name "$CURRENT_BUILDER" --driver docker-container \
              --driver-opt image=moby/buildkit:v0.12.0 \
              --driver-opt env.BUILDKIT_STEP_LOG_MAX_SIZE=-1 \
              --driver-opt env.BUILDKIT_STEP_LOG_MAX_SPEED=10 \
              --use 2>/dev/null || true
          }
          build_image() {
            local image="$1"
            local REF="${REGISTRY}/${OWNER}/${image}:${TAG}"
            local SAFE="${image//\//-}"
            echo "::group::Build ${image}"
            if timeout 900 docker buildx build \
                --builder "$CURRENT_BUILDER" \
                --platform linux/amd64 \
                -t "${REF}" \
                --output "type=docker,dest=/tmp/images/${SAFE}.tar" \
                --cache-from "type=local,src=/tmp/.buildkit-cache" \
                --cache-to "type=local,dest=/tmp/.buildkit-cache-new,mode=max" \
                --secret id=github-token,src=/tmp/github-token \
                --build-arg "BUILD_DATE=${TAG}" \
                --build-arg "VCS_REF=${TAG}" \
                --build-arg "TARGETARCH=amd64" \
                --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                --label "org.opencontainers.image.revision=${{ github.sha }}" \
                "./images/${image}"; then
              echo "${REF}" >> /tmp/built-images.txt
              return 0
            else
              return 1
            fi
          }
          for image in "${IMAGE_LIST[@]}"; do
            [ -z "$image" ] && continue
            [ ! -f "./images/${image}/Dockerfile" ] && { echo "::warning::${image}: no Dockerfile"; SKIPPED=$((SKIPPED+1)); continue; }
            if [ $((BUILT + FAILED)) -gt 0 ] && [ $(( (BUILT + FAILED) % 5 )) -eq 0 ]; then
              recreate_builder
            fi
            if build_image "${image}"; then
              BUILT=$((BUILT+1)); sleep 1
            else
              echo "::warning::${image}: build failed, retrying..."
              sleep 5
              if build_image "${image}"; then
                BUILT=$((BUILT+1)); sleep 1
              else
                echo "::error::${image}: build failed after 2 attempts"
                FAILED=$((FAILED+1)); sleep 3
              fi
            fi
            echo "::endgroup::"
          done
          echo "Batch ${{ matrix.batch }}: ${BUILT} built, ${FAILED} failed, ${SKIPPED} skipped"
          echo "BUILDER_NAME=${CURRENT_BUILDER}" >> "$GITHUB_ENV"
          if [ "${FAILED}" -gt 0 ]; then
            echo "::warning::${FAILED} image(s) failed to build in batch ${{ matrix.batch }}"
          fi

      - name: Cleanup secret file
        if: always()
        run: rm -f /tmp/github-token

      - name: Update BuildKit cache
        if: always()
        run: |
          if [ -d /tmp/.buildkit-cache-new ]; then
            rm -rf /tmp/.buildkit-cache
            mv /tmp/.buildkit-cache-new /tmp/.buildkit-cache
          fi

      - name: Enforce image size limit
        if: always()
        continue-on-error: true
        run: |
          LIMIT_MB=${IMAGE_SIZE_LIMIT:-2048}
          EXCEEDED=0
          for tar in /tmp/images/*.tar; do
            [ -f "$tar" ] || continue
            SIZE_MB=$(($(stat --format=%s "$tar") / 1024 / 1024))
            if [ "$SIZE_MB" -gt "$LIMIT_MB" ]; then
              echo "::error::$(basename "$tar" .tar): ${SIZE_MB}MB > ${LIMIT_MB}MB"
              EXCEEDED=$((EXCEEDED+1))
            fi
          done
          [ "$EXCEEDED" -gt 0 ] && exit 1

      - name: Upload image tarballs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: images-${{ inputs.tier }}-batch-${{ matrix.batch }}
          path: /tmp/images/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

      - name: Upload built image references
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: built-list-${{ inputs.tier }}-batch-${{ matrix.batch }}
          path: /tmp/built-images.txt
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

      - name: Push to registry
        if: always() && inputs.push
        timeout-minutes: 90
        run: |
          TAG="${{ steps.resolve-tag.outputs.TAG }}"
          IFS=',' read -ra IMAGE_LIST <<< "${{ matrix.images }}"
          PUSHED=0; FAILED=0
          for image in "${IMAGE_LIST[@]}"; do
            [ -z "$image" ] && continue
            [ ! -f "./images/${image}/Dockerfile" ] && continue
            SAFE="${image//\//-}"
            TAR="/tmp/images/${SAFE}.tar"
            REF="${REGISTRY}/${OWNER}/${image}:${TAG}"
            # Extract VERSION from Dockerfile for semantic version tag
            VERSION_TAG=$(grep -oP '(?<=^ARG VERSION=).*' "./images/${image}/Dockerfile" 2>/dev/null | head -1)
            echo "::group::Push ${image}"
            if [ -f "$TAR" ]; then
              # Load the pre-built tarball and push (avoids rebuild COPY eval bugs)
              docker load -i "$TAR" 2>/dev/null || true
              docker tag "${REF}" "${REF}" 2>/dev/null || true
              if timeout 300 docker push "${REF}" 2>&1; then
                PUSHED=$((PUSHED+1))
                # Also push with version tag for deterministic pulls
                if [ -n "${VERSION_TAG}" ]; then
                  VERSION_REF="${REGISTRY}/${OWNER}/${image}:${VERSION_TAG}"
                  docker tag "${REF}" "${VERSION_REF}" 2>/dev/null || true
                  if timeout 300 docker push "${VERSION_REF}" 2>&1; then
                    echo "Pushed version tag: ${VERSION_TAG}"
                  else
                    echo "::warning::${image}: version tag push failed (${VERSION_TAG})"
                  fi
                fi
                # Set package visibility to public (GHCR lowercases names)
                SAFE_NAME=$(echo "${image}" | tr '[:upper:]' '[:lower:]')
                gh api -X PATCH "/user/packages/container/${SAFE_NAME}/visibility" \
                  -f visibility=public 2>/dev/null || true
              else
                echo "::warning::${image}: push failed"
                FAILED=$((FAILED+1))
              fi
            else
              echo "::warning::${image}: no tarball (build failed), skipping push"
              FAILED=$((FAILED+1))
            fi
            sleep 2
            echo "::endgroup::"
          done
          echo "Push: ${PUSHED} ok, ${FAILED} failed"
          if [ "${FAILED}" -gt 0 ]; then
            echo "::warning::${FAILED} image(s) skipped/failed push in batch ${{ matrix.batch }}"
          fi

  sign:
    name: Sign Images
    needs: build
    if: always() && inputs.push && inputs.sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      packages: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all built image references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: built-list-${{ inputs.tier }}-batch-*
          path: /tmp/batches

      - name: Sign all images
        run: |
          TAG="${{ inputs.tag || github.sha }}"
          cat /tmp/batches/built-list-*/built-images.txt 2>/dev/null | sort -u | while read -r ref; do
            [ -z "$ref" ] && continue
            echo "::group::Sign ${ref}"
            cosign sign --yes \
              --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/_build-reusable.yml@refs/heads/main" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              "${ref}" 2>&1 || echo "::warning::Sign failed for ${ref}"
            echo "::endgroup::"
          done

      - name: Generate SLSA provenance attestations
        run: |
          cat /tmp/batches/built-list-*/built-images.txt 2>/dev/null | sort -u | while read -r ref; do
            [ -z "$ref" ] && continue
            echo "::group::SLSA Provenance ${ref}"
            cosign attest --yes \
              --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/_build-reusable.yml@refs/heads/main" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              --predicate - \
              --type slsaprovenance \
              "${ref}" <<EOF
          {
            "_type": "https://in-toto.io/Statement/v0.1",
            "predicateType": "https://slsa.dev/provenance/v0.2",
            "predicate": {
              "builder": { "id": "https://github.com/${{ github.repository }}" },
              "buildType": "evergreen-image-registry/build-on-push",
              "invocation": {
                "configSource": {
                  "uri": "${{ github.server_url }}/${{ github.repository }}",
                  "digest": { "sha1": "${{ github.sha }}" },
                  "entryPoint": ".github/workflows/build-on-push.yml"
                }
              },
              "materials": [{ "uri": "${{ github.server_url }}/${{ github.repository }}", "digest": { "sha1": "${{ github.sha }}" } }]
            }
          }
          EOF
            echo "::endgroup::"
          done

      - name: Attest SBOMs to images
        run: |
          cat /tmp/batches/built-list-*/built-images.txt 2>/dev/null | sort -u | while read -r ref; do
            [ -z "$ref" ] && continue
            IMAGE=$(echo "$ref" | sed 's|.*\/||; s|:.*||')
            SBOM="images/${IMAGE}/sbom.spdx.json"
            if [ ! -f "$SBOM" ]; then
              echo "::warning::No SBOM for ${IMAGE}, skipping attestation"
              continue
            fi
            echo "::group::SBOM Attest ${IMAGE}"
            cosign attest --yes \
              --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/_build-reusable.yml@refs/heads/main" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              --predicate "$SBOM" \
              --type spdxjson \
              "${ref}" 2>&1 || echo "::warning::SBOM attestation failed for ${ref}"
            echo "::endgroup::"
          done

  report:
    name: Build Report (${{ inputs.tier }})
    needs: [build, sign]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "# Build Report - ${{ inputs.tier }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tier** | ${{ inputs.tier }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${{ inputs.tag || github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Push** | ${{ inputs.push }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Sign** | ${{ inputs.sign }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Multi-arch** | ${{ inputs.multiarch }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Build** | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Sign** | ${{ needs.sign.result }} |" >> "$GITHUB_STEP_SUMMARY"
