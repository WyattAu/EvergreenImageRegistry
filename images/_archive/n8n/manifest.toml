[metadata]
name = "n8n"
version = "1.41.0"
description = "n8n - workflow automation platform"
vendor = "n8n"
source = "https://github.com/n8n-io/n8n"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "node"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/n8n/n8n/releases/download/v1.41.0/n8n-1.41.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["node"]

[ports]
expose = [5678, 9101]

[labels]
"org.opencontainers.image.title" = "n8n"
"org.opencontainers.image.vendor" = "n8n"
"org.opencontainers.image.version" = "1.41.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
