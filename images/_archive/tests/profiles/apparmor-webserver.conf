#include <tunables/global>

profile evergreen-webserver flags=(attach_disconnected,mediate_deleted) {
  #include <abstractions/base>
  #include <abstractions/nameservice>

  capability,
  file,
  umount,

  deny capability all,

  network inet tcp,
  network inet6 tcp,
  network inet udp,
  network inet6 udp,

  deny network raw,
  deny network packet,

  network inet tcp bind port 80,
  network inet tcp bind port 443,
  network inet tcp bind port 8080,
  network inet tcp bind port 8443,

  network inet6 tcp bind port 80,
  network inet6 tcp bind port 443,
  network inet6 tcp bind port 8080,
  network inet6 tcp bind port 8443,

  deny mount,
  deny remount,
  deny mount options=(bind, ro, rw, suid, nosuid, exec, noexec, recursive, private, slave, shared, unbindable, run, make-private, make-slave, make-shared, make-unbindable, make-rprivate, make-rslave, make-rshared, make-runbindable),

  deny signal send peer=/usr/bin/dockerd,
  deny signal send peer=/usr/bin/containerd,
  deny signal send peer=/usr/bin/crio,

  deny ptrace,

  deny /var/run/docker.sock rw,
  deny /run/docker.sock rw,
  deny /var/run/containerd/containerd.sock rw,
  deny /run/containerd/containerd.sock rw,

  /etc/ r,
  /etc/** r,

  /usr/ r,
  /usr/** r,

  /app/ rw,
  /app/** rw,

  /tmp/ rw,
  /tmp/** rw,

  /var/log/ rw,
  /var/log/** rw,

  /var/cache/ rw,
  /var/cache/** rw,

  /var/www/ r,
  /var/www/** r,

  /var/lib/nginx/ rw,
  /var/lib/nginx/** rw,

  /var/lib/traefik/ rw,
  /var/lib/traefik/** rw,

  /var/lib/caddy/ rw,
  /var/lib/caddy/** rw,

  /var/lib/haproxy/ rw,
  /var/lib/haproxy/** rw,

  /var/lib/envoy/ rw,
  /var/lib/envoy/** rw,

  deny /proc/ r,
  deny /proc/** r,
  deny /sys/ r,
  deny /sys/** r,

  /proc/self/ r,
  /proc/self/** r,
  /proc/*/status r,
  /proc/*/cmdline r,
  /proc/*/comm r,
  /proc/meminfo r,

  /sys/fs/cgroup/ r,
  /sys/fs/cgroup/** r,

  deny /sys/kernel/ r,
  deny /sys/kernel/** r,
  deny /sys/firmware/ r,
  deny /sys/firmware/** r,
  deny /sys/module/ r,
  deny /sys/module/** r,

  deny /etc/shadow r,
  deny /etc/gshadow r,
  deny /etc/ssh/ r,
  deny /etc/ssh/** r,
  deny /root/ r,
  deny /root/** r,

  deny /etc/ssl/private/** rw,
  deny /etc/ssl/private/ rw,

  signal (receive) peer=unconfined,
}
