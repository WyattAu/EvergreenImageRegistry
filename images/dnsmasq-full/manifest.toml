[metadata]
name = "dnsmasq-full"
version = "2.90"
description = "dnsmasq with full feature set (DNS, DHCP, TFTP, PXE, DNSSEC)"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/sbin/dnsmasq"]
cmd = ["--keep-in-foreground", "--no-daemon"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.description" = "dnsmasq with full feature set (DNS, DHCP, TFTP, PXE, DNSSEC)"
"org.opencontainers.image.source" = "https://thekelleys.org.uk/dnsmasq/"
"org.opencontainers.image.title" = "dnsmasq-full"
"org.opencontainers.image.vendor" = "The Kelleys"
"org.opencontainers.image.version" = "2.90"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "networking"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

