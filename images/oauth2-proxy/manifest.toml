[metadata]
name = "oauth2-proxy"
version = "7.15.2"
description = "OAuth2 Proxy - reverse proxy with authentication provider"
vendor = "OAuth2 Proxy"
source = "https://github.com/oauth2-proxy/oauth2-proxy"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/oauth2-proxy/oauth2-proxy/releases/download/v7.15.2/oauth2-proxy-7.15.2-linux-amd64.tar.gz"
binary_name = "oauth2-proxy"
filename = "oauth2-proxy-7.15.2-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 80
metrics = 9101

[labels]
"org.opencontainers.image.title" = "oauth2-proxy"
"org.opencontainers.image.description" = "OAuth2 Proxy - reverse proxy with authentication provider"
"org.opencontainers.image.version" = "7.15.2"
"org.opencontainers.image.vendor" = "OAuth2 Proxy"
"org.opencontainers.image.source" = "https://github.com/oauth2-proxy/oauth2-proxy"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
