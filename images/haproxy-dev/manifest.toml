[metadata]
tier = "standard"
name = "haproxy-dev"
version = "2.8.5"
description = "Evergreen hardened HAProxy dev - experimental development configuration variant"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/sbin/haproxy", "-f", "/dev/stdin"]

[ports]
expose = [8404, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened HAProxy dev - experimental development configuration variant"
"org.opencontainers.image.title" = "haproxy-dev"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "proxy"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
