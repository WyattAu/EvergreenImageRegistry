[metadata]
tier = "standard"
name = "gitrob"
version = "latest"
description = "GitRob - sensitive file finder"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "michenriksen/gitrob:${VERSION}"

[runtime]
entrypoint = ["/gitrob"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "GitRob - sensitive file finder"
"org.opencontainers.image.source" = "https://github.com/michenriksen/gitrob"
"org.opencontainers.image.title" = "gitrob"
"org.opencontainers.image.vendor" = "michenriksen"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
