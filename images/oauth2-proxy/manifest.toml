[metadata]
name = "oauth2-proxy"
version = "7.15.2"
description = "OAuth2 Proxy - reverse proxy with authentication provider"
vendor = "OAuth2 Proxy"
source = "https://github.com/oauth2-proxy/oauth2-proxy"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/oauth2-proxy/oauth2-proxy/releases/download/v7.15.2/oauth2-proxy-7.15.2-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/oauth2-proxy"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.title" = "oauth2-proxy"
"org.opencontainers.image.vendor" = "OAuth2"
"org.opencontainers.image.version" = "7.15.2"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

