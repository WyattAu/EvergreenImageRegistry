name: Build FIPS Variants

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - postgres
          - mysql
          - redis
          - nginx
          - envoy
          - vault
          - consul
          - cosign

concurrency:
  group: fips-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-go-fips:
    if: |
      github.event_name == 'schedule' ||
      inputs.image == 'all' ||
      contains('vault consul cosign traefik coredns step-ca prometheus grafana loki alertmanager trivy dex cockroachdb tidb', inputs.image)
    strategy:
      fail-fast: false
      matrix:
        image:
          - vault
          - consul
          - cosign
          - traefik
          - coredns
          - step-ca
          - prometheus
          - grafana
          - loki
          - alertmanager
          - trivy
          - dex
          - cockroachdb
          - tidb
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image prefix (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(grep '^version' images/${{ matrix.image }}/manifest.toml | head -1 | sed 's/.*= *"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Go FIPS variant
        run: |
          IMAGE_TAG="${REGISTRY}/${IMAGE_PREFIX}/${{ matrix.image }}:${{ steps.meta.outputs.version }}-fips"
          docker buildx build \
            --build-arg VERSION=${{ steps.meta.outputs.version }} \
            --build-arg CGO_ENABLED=1 \
            --build-arg GOEXPERIMENT=boringcrypto \
            --build-arg BUILDER_IMAGE=golang:1.24-bookworm \
            --build-arg FINAL_BASE=cgr.dev/chainguard/wolfi-base \
            -t "${IMAGE_TAG}" \
            --push \
            images/${{ matrix.image }}/

      - name: Sign FIPS image
        run: |
          IMAGE_TAG="${REGISTRY}/${IMAGE_PREFIX}/${{ matrix.image }}:${{ steps.meta.outputs.version }}-fips"
          cosign sign --yes "${IMAGE_TAG}"

  # build-openssl-fips DISABLED (2026-10-07):
  # Wolfi removed openssl-provider-fips from apk.cgr.dev/chainguard
  # (verified: only openssl-hardened-* and provider-legacy remain).
  # Building would silently produce images without the FIPS provider.
  # Restore only with a real FIPS path: Chainguard FIPS images, or an
  # honest openssl-hardened rebuild under a non-FIPS name (needs decision).
  build-envoy-fips:
    if: |
      github.event_name == 'schedule' ||
      inputs.image == 'all' ||
      inputs.image == 'envoy'
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image prefix (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(grep '^version' images/envoy/manifest.toml | head -1 | sed 's/.*= *"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Envoy FIPS variant
        run: |
          IMAGE_TAG="${REGISTRY}/${IMAGE_PREFIX}/envoy:${{ steps.meta.outputs.version }}-fips"
          docker buildx build \
            --build-arg VERSION=${{ steps.meta.outputs.version }} \
            -f images/envoy/Dockerfile.fips \
            -t "${IMAGE_TAG}" \
            --push \
            images/envoy/

      - name: Sign FIPS image
        run: |
          IMAGE_TAG="${REGISTRY}/${IMAGE_PREFIX}/envoy:${{ steps.meta.outputs.version }}-fips"
          cosign sign --yes "${IMAGE_TAG}"
