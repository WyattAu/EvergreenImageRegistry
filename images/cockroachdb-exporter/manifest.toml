[metadata]
name = "cockroachdb-exporter"
version = "23.2.3"
description = "CockroachDB Exporter - Prometheus exporter for CockroachDB"
vendor = "Cockroach Labs"
source = "https://github.com/cockroachdb/cockroach"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/cockroachdb-exporter/cockroachdb-exporter/releases/download/v24.3.3/cockroachdb-exporter-24.3.3-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/cockroach"]
cmd = ["start", "--insecure", "--http-port=8080", "--prometheus-port=8080"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened CockroachDB Prometheus exporter - database metrics via built-in endpoint"
"org.opencontainers.image.title" = "cockroachdb-exporter"
"org.opencontainers.image.vendor" = "Cockroach Labs"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "5000ms"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
