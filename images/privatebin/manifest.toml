[metadata]
name = "privatebin"
version = "1.6.0"
description = "privatebin container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "www-data"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.title" = "privatebin"
"org.opencontainers.image.vendor" = "PrivateBin"
"org.opencontainers.image.version" = "1.6.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

