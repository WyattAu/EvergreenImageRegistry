[metadata]
tier = "standard"
name = "gradle"
version = "8.10.2"
description = "Evergreen hardened gradle - Java build tool"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["gradle"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened gradle - Java build tool"
"org.opencontainers.image.title" = "gradle"
"org.opencontainers.image.vendor" = "Gradle"
"org.opencontainers.image.version" = "8.10.2"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "30s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

