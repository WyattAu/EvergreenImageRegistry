[metadata]
name = "memgraph"
version = "latest"
description = "Sovereign hardened Memgraph - in-memory graph database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "memgraph/memgraph:${VERSION}"

[runtime]
entrypoint = ["/opt/memgraph/bin/memgraph", "--data-directory=/var/lib/memgraph"]

[ports]
expose = [7687, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Memgraph - in-memory graph database"
"org.opencontainers.image.title" = "memgraph"
"org.opencontainers.image.vendor" = "Memgraph"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

