[metadata]
name = "aarch64-unknown-linux-musl"
version = "unknown"
description = "Sovereign hardened aarch64-unknown-linux-musl - ARM64 musl static base"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "base-image"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened aarch64-unknown-linux-musl - ARM64 musl static base"
"org.opencontainers.image.title" = "aarch64-unknown-linux-musl"
"sovereign.base.image" = "scratch"
"sovereign.health.type" = "none"
"sovereign.image.note" = "Placeholder base image for ARM64 musl static binaries. Extend with application binaries."
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

