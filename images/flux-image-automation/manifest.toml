[metadata]
name = "flux-image-automation"
version = "1.1.2"
description = "Flux Image Automation Controller - automated container image updates for GitOps"
vendor = "fluxcd"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/fluxcd/image-automation-controller:v1.1.2"

[runtime]
entrypoint = ["/usr/local/bin/image-automation-controller"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Flux Image Automation Controller - automated container image updates for GitOps"
"org.opencontainers.image.source" = "https://github.com/fluxcd/image-automation-controller"
"org.opencontainers.image.title" = "flux-image-automation"
"org.opencontainers.image.vendor" = "Flux CD"
"org.opencontainers.image.version" = "1.1.2"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "http"
"sovereign.image.category" = "gitops"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

