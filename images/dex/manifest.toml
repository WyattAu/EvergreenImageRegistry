[metadata]
name = "dex"
version = "2.45.1"
description = "Dex - federated OpenID Connect provider"
vendor = "Dex"
source = "https://github.com/dexidp/dex"
license = "Apache-2.0"
tier = "1"

[build]
base_image = "golang:1.23-bookworm"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/dex/dex/releases/download/v2.45.1/dex-2.45.1-linux-amd64.tar.gz"
binary_name = "dex"
filename = "dex-2.45.1-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 5556
metrics = 9101

[labels]
"org.opencontainers.image.title" = "dex"
"org.opencontainers.image.description" = "Dex - federated OpenID Connect provider"
"org.opencontainers.image.version" = "2.45.1"
"org.opencontainers.image.vendor" = "Dex"
"org.opencontainers.image.source" = "https://github.com/dexidp/dex"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
