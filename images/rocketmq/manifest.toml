[metadata]
tier = "standard"
name = "rocketmq"
version = "5.1.4"
description = "rocketmq container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/rocketmq/bin/mqnamesrv"]

[ports]
expose = [9876, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/apache/rocketmq"
"org.opencontainers.image.title" = "rocketmq"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "5.1.4"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.distrole" = "debian-slim"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
