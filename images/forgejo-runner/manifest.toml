[metadata]
name = "forgejo-runner"
version = "12.10.1"
description = "Forgejo Act Runner - CI/CD runner for Forgejo"
vendor = "Forgejo"
license = "MIT"
tier = "critical"
source = "https://github.com/forgejo/runner"
upstream_version = "12.8.2"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://code.forgejo.org/forgejo/runner/releases/download/v${version}/forgejo-runner-${version}-linux-amd64"

[runtime]
entrypoint = ["/usr/local/bin/forgejo-runner"]
cmd = ["daemon"]

[ports]
expose = [8088, 9101]

[labels]
"org.opencontainers.image.description" = "Forgejo Act Runner - CI/CD runner for Forgejo"
"org.opencontainers.image.source" = "https://code.forgejo.org/forgejo/runner"
"org.opencontainers.image.title" = "forgejo-runner"
"org.opencontainers.image.vendor" = "Forgejo"
"org.opencontainers.image.version" = "12.8.2"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "tcp"
"evergreen.image.category" = "ci"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
