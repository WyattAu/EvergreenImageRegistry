global:
  resolve_timeout: 5m
  smtp_from: alerts@evergreen.local

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h
    - match:
        component: image-build
      receiver: 'build-team'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://alertmanager-webhook:9093/alerts'
  - name: 'critical'
    webhook_configs:
      - url: 'http://alertmanager-webhook:9093/alerts/critical'
  - name: 'build-team'
    webhook_configs:
      - url: 'http://alertmanager-webhook:9093/alerts/build'
