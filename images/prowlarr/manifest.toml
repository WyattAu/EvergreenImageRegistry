[metadata]
name = "prowlarr"
version = "1.27.0"
description = "Prowlarr - indexer manager and proxy for PVR software"
vendor = "Prowlarr"
source = "https://github.com/Prowlarr/Prowlarr"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/prowlarr/prowlarr/releases/download/v1.27.0/prowlarr-1.27.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/app/Prowlarr"]

[ports]
expose = [9696, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/Prowlarr/Prowlarr"
"org.opencontainers.image.title" = "prowlarr"
"org.opencontainers.image.vendor" = "Prowlarr"
"org.opencontainers.image.version" = "latest"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.official" = "true"
"sovereign.health.type" = "none"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

