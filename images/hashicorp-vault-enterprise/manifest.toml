[metadata]
name = "hashicorp-vault-enterprise"
version = "1.18.5"
description = "hashicorp-vault-enterprise container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/vault"]
cmd = ["server", "-dev"]

[ports]
expose = [8200, 9101]

[labels]
"org.opencontainers.image.source" = "https://www.hashicorp.com/products/vault/enterprise"
"org.opencontainers.image.title" = "hashicorp-vault-enterprise"
"org.opencontainers.image.vendor" = "HashiCorp"
"org.opencontainers.image.version" = "1.18.5"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "10000ms"
"sovereign.image.category" = "secrets"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

