[metadata]
name = "perscache"
version = "1.0.0"
description = "Evergreen hardened PersCache - persistent cache library binary"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"
multiarch = false

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/perscache"]

[ports]
expose = [8429, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened PersCache - persistent cache library binary"
"org.opencontainers.image.title" = "perscache"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
