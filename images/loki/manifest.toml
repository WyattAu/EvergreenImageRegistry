[metadata]
name = "loki"
version = "3.1.0"
description = "Loki - horizontally-scalable log aggregation system"
vendor = "Grafana Labs"
source = "https://github.com/grafana/loki"
license = "AGPL-3.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/grafana/loki/releases/download/v3.1.0/loki-linux-amd64.zip"
binary_name = "loki"
filename = "loki-linux-amd64.zip"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 3100
metrics = 9101

[labels]
"org.opencontainers.image.title" = "loki"
"org.opencontainers.image.description" = "Loki - horizontally-scalable log aggregation system"
"org.opencontainers.image.version" = "3.1.0"
"org.opencontainers.image.vendor" = "Grafana Labs"
"org.opencontainers.image.source" = "https://github.com/grafana/loki"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
