[metadata]
name = "zipkin"
version = "3.4.2"
description = "Zipkin - distributed tracing system"
vendor = "Zipkin"
source = "https://github.com/openzipkin/zipkin"
license = "Apache-2.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/openzipkin/zipkin/releases/download/3.4.2/zipkin.jar"
binary_name = "zipkin"
filename = "zipkin.jar"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 9411
metrics = 9101

[labels]
"org.opencontainers.image.title" = "zipkin"
"org.opencontainers.image.description" = "Zipkin - distributed tracing system"
"org.opencontainers.image.version" = "3.4.2"
"org.opencontainers.image.vendor" = "Zipkin"
"org.opencontainers.image.source" = "https://github.com/openzipkin/zipkin"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
