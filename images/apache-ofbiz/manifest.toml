[metadata]
name = "apache-ofbiz"
version = "24.09.05"
description = "apache-ofbiz container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["java", "-jar", "/opt/apache-ofbiz/apache-ofbiz"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/apache/ofbiz-framework"
"org.opencontainers.image.title" = "apache-ofbiz"
"org.opencontainers.image.vendor" = "Apache OFBiz"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "30s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "60000ms"
"sovereign.image.category" = "crm-erp"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

