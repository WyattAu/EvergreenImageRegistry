[metadata]
tier = "standard"
name = "jitsu"
version = "2.55.0"
description = "jitsu container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/jitsucom/jitsu/releases"
"org.opencontainers.image.title" = "jitsu"
"org.opencontainers.image.vendor" = "jitsucom/jitsu"
"org.opencontainers.image.version" = "2.55.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

