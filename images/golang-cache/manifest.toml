[metadata]
name = "golang-cache"
version = "ARG"
description = "Sovereign hardened Golang-Cache - in-memory cache service"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/go-1.23-cache"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Golang-Cache - in-memory cache service"
"org.opencontainers.image.title" = "go-1.23-cache"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

