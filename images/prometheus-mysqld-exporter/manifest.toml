[metadata]
name = "prometheus-mysqld-exporter"
version = "0.19.0"
description = "MySQL Prometheus Exporter - metrics exporter for MySQL"
vendor = "Prometheus"
source = "https://github.com/prometheus/mysqld_exporter"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/prometheus-mysqld-exporter/prometheus-mysqld-exporter/releases/download/v0.19.0/prometheus-mysqld-exporter-0.19.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/mysqld_exporter"]

[ports]
expose = [9104, 9101]

[labels]
"org.opencontainers.image.description" = "Prometheus exporter for MySQL server metrics"
"org.opencontainers.image.title" = "Prometheus MySQL Exporter"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.version" = "0.19.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-5"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-stateful"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
