[metadata]
name = "hive-metastore"
version = "4.0.0"
description = "Sovereign hardened Hive Metastore - metadata service for Apache Hive"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/hive/bin/hive", "--service", "metastore"]

[ports]
expose = [9083, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Hive Metastore - metadata service for Apache Hive"
"org.opencontainers.image.title" = "hive-metastore"
"org.opencontainers.image.vendor" = "Apache Software Foundation"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

