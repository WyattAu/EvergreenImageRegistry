[metadata]
name = "flame"
version = "latest"
description = "Flame - Self-hosted start page"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/pawelmalak/flame:${VERSION}"

[runtime]
entrypoint = ["/flame"]

[ports]
expose = [5005, 9101]

[labels]
"org.opencontainers.image.description" = "Flame - Self-hosted start page"
"org.opencontainers.image.source" = "https://github.com/pawelmalak/flame"
"org.opencontainers.image.title" = "flame"
"org.opencontainers.image.vendor" = "pawelmalak"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

