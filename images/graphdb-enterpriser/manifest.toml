[metadata]
tier = "standard"
name = "graphdb-enterpriser"
version = "10.8.14"
description = "Evergreen hardened GraphDB Enterprise - semantic graph database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ontotext/graphdb:${VERSION}"

[runtime]
entrypoint = ["/opt/graphdb/bin/graphdb"]

[ports]
expose = [7200, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened GraphDB Enterprise - semantic graph database"
"org.opencontainers.image.title" = "graphdb-enterpriser"
"org.opencontainers.image.vendor" = "Ontotext"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
