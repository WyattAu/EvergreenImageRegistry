[metadata]
name = "gitea"
version = "1.21.10"
description = "Gitea - lightweight self-hosted Git service"
vendor = "Gitea"
source = "https://github.com/go-gitea/gitea"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "cgr.dev/chainguard/wolfi-base:latest"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/gitea/gitea/releases/download/v1.21.10/gitea-1.21.10-linux-amd64.tar.gz"
binary_name = "gitea"
filename = "gitea-1.21.10-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 3000
metrics = 9101

[labels]
"org.opencontainers.image.title" = "gitea"
"org.opencontainers.image.description" = "Gitea - lightweight self-hosted Git service"
"org.opencontainers.image.version" = "1.21.10"
"org.opencontainers.image.vendor" = "Gitea"
"org.opencontainers.image.source" = "https://github.com/go-gitea/gitea"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
