[metadata]
name = "nginx"
version = "1.27.1"
description = "Nginx - HTTP and reverse proxy server"
vendor = "Nginx Inc"
source = "https://github.com/nginx/nginx"
license = "BSD-2-Clause"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/nginx/nginx/releases/download/v1.27.1/nginx-1.27.1-linux-amd64.tar.gz"
binary_name = "nginx"
filename = "nginx-1.27.1-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 80
metrics = 9101

[labels]
"org.opencontainers.image.title" = "nginx"
"org.opencontainers.image.description" = "Nginx - HTTP and reverse proxy server"
"org.opencontainers.image.version" = "1.27.1"
"org.opencontainers.image.vendor" = "Nginx Inc"
"org.opencontainers.image.source" = "https://github.com/nginx/nginx"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
