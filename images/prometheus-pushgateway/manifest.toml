[metadata]
name = "prometheus-pushgateway"
version = "1.8.0"
description = "Prometheus Pushgateway - intermediary service for metrics push"
vendor = "Prometheus"
source = "https://github.com/prometheus/pushgateway"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/prometheus-pushgateway/prometheus-pushgateway/releases/download/v1.8.0/prometheus-pushgateway-1.8.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/pushgateway"]

[ports]
expose = [9091, 9101]

[labels]
"org.opencontainers.image.title" = "prometheus-pushgateway"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.version" = "1.8.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "false"
"evergreen.hft.cpu-pins" = "6-7"
"evergreen.hft.cpu-pins-mode" = "shared"
"evergreen.hft.deploy-strategy" = "standard-rolling"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-hook" = "false"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

