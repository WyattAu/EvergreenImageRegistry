[metadata]
name = "photoprism-frontend"
version = "240427"
description = "photoprism-frontend container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]

[ports]
expose = [2283, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/photoprism/photoprism/releases"
"org.opencontainers.image.title" = "photoprism-frontend"
"org.opencontainers.image.vendor" = "PhotoPrism"
"org.opencontainers.image.version" = "240427"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.hardened" = "true"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

