[metadata]
name = "tweed"
version = "latest"
description = "VPN mesh networking tool"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/vmware-tanzu/tweed:${VERSION}"

[runtime]
entrypoint = ["/tweed"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.description" = "VPN mesh networking tool"
"org.opencontainers.image.source" = "https://github.com/vmware-tanzu/tweed"
"org.opencontainers.image.title" = "tweed"
"org.opencontainers.image.vendor" = "VMware Tanzu"
"org.opencontainers.image.version" = "0.1.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "networking"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

