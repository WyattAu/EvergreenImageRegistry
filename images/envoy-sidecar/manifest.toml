[metadata]
tier = "standard"
name = "envoy-sidecar"
version = "1.38.0"
description = "Evergreen hardened Envoy sidecar - service mesh sidecar proxy"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/envoy", "--mode", "sidecar"]

[ports]
expose = [15001, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Envoy sidecar - service mesh sidecar proxy"
"org.opencontainers.image.title" = "envoy-sidecar"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "sidecar"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

