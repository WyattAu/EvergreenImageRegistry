[metadata]
name = "elasticsearch"
version = "8.14.0"
description = "Elasticsearch - distributed search and analytics engine"
vendor = "Elastic"
source = "https://github.com/elastic/elasticsearch"
license = "Elastic-2.0"
tier = "1"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "elasticsearch"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/elasticsearch/elasticsearch/releases/download/v8.14.0/elasticsearch-8.14.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["sh", "-c", "elasticsearch"]

[ports]
expose = [9200, 9101]

[labels]
"org.opencontainers.image.title" = "elasticsearch"
"org.opencontainers.image.vendor" = "Elastic"
"org.opencontainers.image.version" = "8.14.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "http"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "true"

