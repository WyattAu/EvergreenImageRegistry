[metadata]
name = "elasticsearch"
version = "8.14.0"
description = "Elasticsearch - distributed search and analytics engine"
vendor = "Elastic"
source = "https://github.com/elastic/elasticsearch"
license = "Elastic-2.0"
tier = "1"

[build]
base_image = "cgr.dev/chainguard/wolfi-base:latest"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/elasticsearch/elasticsearch/releases/download/v8.14.0/elasticsearch-8.14.0-linux-amd64.tar.gz"
binary_name = "elasticsearch"
filename = "elasticsearch-8.14.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9200
metrics = 9101

[labels]
"org.opencontainers.image.title" = "elasticsearch"
"org.opencontainers.image.description" = "Elasticsearch - distributed search and analytics engine"
"org.opencontainers.image.version" = "8.14.0"
"org.opencontainers.image.vendor" = "Elastic"
"org.opencontainers.image.source" = "https://github.com/elastic/elasticsearch"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "true"
"sovereign.health.type" = "http"
