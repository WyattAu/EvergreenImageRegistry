[metadata]
tier = "standard"
name = "mailhog"
version = "1.0.1"
description = "MailHog - email testing tool with web UI"
vendor = "mailhog"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/mailhog/MailHog/releases/download/v1.0.1/MailHog_linux_amd64"

[runtime]
entrypoint = ["/usr/local/bin/MailHog"]

[ports]
expose = [8025, 9101]

[labels]
"org.opencontainers.image.description" = "MailHog - email testing tool"
"org.opencontainers.image.source" = "https://github.com/mailhog/MailHog"
"org.opencontainers.image.title" = "mailhog"
"org.opencontainers.image.vendor" = "MailHog"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "http"
"evergreen.image.category" = "email"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
