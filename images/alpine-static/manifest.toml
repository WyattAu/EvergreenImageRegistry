[metadata]
name = "alpine-static"
version = "unknown"
description = "Sovereign reference for static base (chainguard/static). Alpine is banned for application images."

[build]
base = "cgr.dev/chainguard/static:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "base-image"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign reference for static base (chainguard/static). Alpine is banned for application images."
"org.opencontainers.image.title" = "alpine-static"
"sovereign.base.image" = "wolfi"
"sovereign.health.type" = "none"
"sovereign.image.category" = "base"
"sovereign.image.note" = "Alpine is banned for application images. Use chainguard/static for static builds."
"sovereign.image.status" = "reference"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

