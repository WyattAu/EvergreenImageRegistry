[metadata]
tier = "standard"
name = "seafile-pro"
version = "11.0.14"
description = "seafile-pro container image"

[build]
base = "debian:bookworm-slim"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/seafileltd-seafile-mc"
[runtime]
entrypoint = ["python", "-m", "seafile-pro"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"evergreen.image.tier" = "standard"
