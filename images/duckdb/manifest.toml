[metadata]
name = "duckdb"
version = "1.1.3"
description = "DuckDB - in-process SQL OLAP database management system"
vendor = "DuckDB Labs"
source = "https://github.com/duckdb/duckdb"
license = "Apache-2.0"
tier = "2"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip"

[runtime]
entrypoint = ["/usr/local/bin/duckdb"]

[ports]
expose = [5432, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened DuckDB - in-process analytical database"
"org.opencontainers.image.title" = "duckdb"
"org.opencontainers.image.vendor" = "DuckDB Labs"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

