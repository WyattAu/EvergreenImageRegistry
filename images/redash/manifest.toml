[metadata]
tier = "standard"
name = "redash"
version = "10.0.0"
description = "Redash - Open Source Data Visualization and Dashboards"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["redash", "server"]

[ports]
expose = [5000, 9101]

[labels]
"org.opencontainers.image.description" = "Redash - Open Source Data Visualization and Dashboards"
"org.opencontainers.image.source" = "https://github.com/getredash/redash"
"org.opencontainers.image.title" = "redash"
"org.opencontainers.image.vendor" = "Redash"
"org.opencontainers.image.version" = "10.0.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
