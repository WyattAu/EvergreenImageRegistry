[metadata]
name = "kubectl"
version = "1.30.1"
description = "kubectl - command line tool for controlling Kubernetes clusters"
vendor = "Kubernetes"
source = "https://github.com/kubernetes/kubernetes"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://dl.k8s.io/release/v1.30.1/bin/linux/amd64/kubectl"

[runtime]
entrypoint = ["/kubectl"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "kubectl"
"org.opencontainers.image.vendor" = "Kubernetes"
"org.opencontainers.image.version" = "1.30.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

