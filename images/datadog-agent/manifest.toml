[metadata]
tier = "standard"
name = "datadog-agent"
version = "7.67.1"
description = "Datadog Agent for infrastructure monitoring"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "gcr.io/datadoghq/agent:${VERSION}"

[runtime]
entrypoint = ["/agent"]

[ports]
expose = [8125, 9101]

[labels]
"org.opencontainers.image.description" = "Datadog Agent for infrastructure monitoring"
"org.opencontainers.image.title" = "datadog-agent"
"org.opencontainers.image.vendor" = "Datadog"
"org.opencontainers.image.version" = "7.78.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-5"
"evergreen.hft.cpu-pins-mode" = "shared"
"evergreen.hft.deploy-strategy" = "standard-rolling"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "10s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.runtime" = "go"
"evergreen.hft.runtime-hints" = "GOMAXPROCS=<cores>"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "15000ms"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
