[metadata]
name = "consul-exporter"
version = "0.4.0"
description = "Consul Exporter - Prometheus exporter for Consul"
vendor = "Prometheus"
source = "https://github.com/prometheus/consul_exporter"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/consul-exporter/consul-exporter/releases/download/v0.4.0/consul-exporter-0.4.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/consul_exporter"]

[ports]
expose = [9107, 9101]

[labels]
"org.opencontainers.image.title" = "consul-exporter"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.version" = "0.4.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
