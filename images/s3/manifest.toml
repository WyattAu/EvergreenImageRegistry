[metadata]
name = "s3"
version = "RELEASE.2025-10-15T17-29-55Z"
description = "S3 - AWS S3 compatible object storage client"
vendor = "AWS"
source = "https://github.com/aws/aws-cli"
license = "Apache-2.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/s3/s3/releases/download/vRELEASE.2025-10-15T17-29-55Z/s3-RELEASE.2025-10-15T17-29-55Z-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/s3-server"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.title" = "s3"
"org.opencontainers.image.vendor" = "MinIO"
"org.opencontainers.image.version" = "RELEASE.2025-10-15T17-29-55Z"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "critical""evergreen.metrics.native" = "ztunnel"
