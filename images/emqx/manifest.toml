[metadata]
name = "emqx"
version = "5.8.0"
description = "EMQX - massively scalable MQTT message broker"
vendor = "EMQX"
source = "https://github.com/emqx/emqx"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/emqx/emqx/releases/download/v5.8.0/emqx-5.8.0-linux-amd64.tar.gz"
binary_name = "emqx"
filename = "emqx-5.8.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 1883
metrics = 9101

[labels]
"org.opencontainers.image.title" = "emqx"
"org.opencontainers.image.description" = "EMQX - massively scalable MQTT message broker"
"org.opencontainers.image.version" = "5.8.0"
"org.opencontainers.image.vendor" = "EMQX"
"org.opencontainers.image.source" = "https://github.com/emqx/emqx"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
