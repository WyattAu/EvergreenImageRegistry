[metadata]
name = "milvus-etcd"
version = "3.5.17"
description = "Milvus etcd sidecar - delegates to etcd"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["etcd"]

[ports]
expose = [2379, 9101]

[labels]
"org.opencontainers.image.description" = "Milvus etcd sidecar - delegates to etcd"
"org.opencontainers.image.title" = "milvus-etcd"
"org.opencontainers.image.vendor" = "etcd"
"org.opencontainers.image.version" = "3.5.17"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.status" = "reference"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

