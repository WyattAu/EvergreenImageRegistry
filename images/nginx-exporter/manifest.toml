[metadata]
name = "nginx-exporter"
version = "1.1.0"
description = "Nginx Exporter - Prometheus metrics exporter for Nginx"
vendor = "Prometheus"
source = "https://github.com/nginxinc/nginx-prometheus-exporter"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/nginx-exporter/nginx-exporter/releases/download/v1.1.0/nginx-exporter-1.1.0-linux-amd64.tar.gz"
binary_name = "nginx-exporter"
filename = "nginx-exporter-1.1.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9113
metrics = 9101

[labels]
"org.opencontainers.image.title" = "nginx-exporter"
"org.opencontainers.image.description" = "Nginx Exporter - Prometheus metrics exporter for Nginx"
"org.opencontainers.image.version" = "1.1.0"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.source" = "https://github.com/nginxinc/nginx-prometheus-exporter"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
