[metadata]
tier = "standard"
name = "rss2"
version = "2025-08-05"
description = "RSS-Bridge - generate RSS/Atom feeds for websites that don't have them"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "github-release"
url = "https://github.com/RSS-Bridge/rss-bridge"

[runtime]
entrypoint = ["php", "-S", "0.0.0.0:8080", "-t", "/app"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "RSS-Bridge - generate RSS/Atom feeds for websites that don't have them"
"org.opencontainers.image.title" = "rss2"
"org.opencontainers.image.vendor" = "RSS-Bridge"
"org.opencontainers.image.version" = "2025-08-05"
"org.opencontainers.image.source" = "https://github.com/RSS-Bridge/rss-bridge"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.image.status" = "functional"
"evergreen.metrics.native" = "ztunnel"
