[metadata]
name = "openhab"
version = "4.2.0"
description = "openhab container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/openhab/start.sh"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/openhab/openhab-distro"
"org.opencontainers.image.title" = "openhab"
"org.opencontainers.image.vendor" = "OpenHAB"
"org.opencontainers.image.version" = "4.2.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.official" = "true"
"sovereign.health.type" = "none"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

