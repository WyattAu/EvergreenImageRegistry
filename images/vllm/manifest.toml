[metadata]
name = "vllm"
version = "0.6.6"
description = "vllm container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/vllm-project/vllm"
"org.opencontainers.image.title" = "vllm"
"org.opencontainers.image.vendor" = "vLLM"
"org.opencontainers.image.version" = "0.6.6"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

