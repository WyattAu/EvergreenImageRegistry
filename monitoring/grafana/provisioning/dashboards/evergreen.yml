---
apiVersion: 1

providers:
  - name: Evergreen Image Registry
    orgId: 1
    folder: Evergreen
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
