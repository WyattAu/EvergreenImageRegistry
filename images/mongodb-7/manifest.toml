[metadata]
tier = "standard"
name = "mongodb-7"
version = "7.0.9"
description = "Evergreen hardened MongoDB 7.0 - document database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["mongod"]

[ports]
expose = [27017, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened MongoDB 7.0 - document database"
"org.opencontainers.image.title" = "mongodb-7"
"org.opencontainers.image.vendor" = "MongoDB"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
