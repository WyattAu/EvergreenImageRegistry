[metadata]
name = "scylla-operator"
version = "1.14.0"
description = "Evergreen hardened ScyllaDB Operator - Kubernetes operator for ScyllaDB"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "docker.io/scylladb/scylla-operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/scylla-operator"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened ScyllaDB Operator - Kubernetes operator for ScyllaDB"
"org.opencontainers.image.title" = "scylla-operator"
"org.opencontainers.image.vendor" = "ScyllaDB"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

