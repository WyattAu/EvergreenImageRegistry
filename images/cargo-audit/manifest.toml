[metadata]
tier = "standard"
name = "cargo-audit"
version = "0.20.0"
description = "Cargo audit - Rust dependency security scanner"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "source-build"
url = "https://github.com/rustsec/rustsec-audit"
language = "rust"
target = "x86_64-unknown-linux-musl"

[runtime]
entrypoint = ["/cargo-audit"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "cargo-audit"
"org.opencontainers.image.vendor" = "rustsec"
"org.opencontainers.image.source" = "https://github.com/rustsec/rustsec-audit"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
