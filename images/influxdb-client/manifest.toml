[metadata]
tier = "standard"
name = "influxdb-client"
version = "2.7.5"
description = "influxdb-client container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/influxdb"
[runtime]
entrypoint = ["/influx"]

[ports]
expose = [8086, 9101]

[labels]
"org.opencontainers.image.title" = "influxdb-client"
"org.opencontainers.image.vendor" = "InfluxData"
"org.opencontainers.image.version" = "2.7.5"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "tsdb-client"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
