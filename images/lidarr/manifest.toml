[metadata]
name = "lidarr"
version = "2.4.3"
description = "Lidarr - music collection manager for Usenet and BitTorrent"
vendor = "Lidarr"
source = "https://github.com/Lidarr/Lidarr"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/lidarr/lidarr/releases/download/v2.4.3/lidarr-2.4.3-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/app/Lidarr"]

[ports]
expose = [8686, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/Lidarr/Lidarr"
"org.opencontainers.image.title" = "lidarr"
"org.opencontainers.image.vendor" = "Lidarr"
"org.opencontainers.image.version" = "latest"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.official" = "true"
"evergreen.health.type" = "none"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

