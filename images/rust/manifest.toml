[metadata]
tier = "standard"
name = "rust"
version = "1.78.0"
description = "rust container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/rust"
[runtime]
entrypoint = ["rust"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "rust"
"org.opencontainers.image.vendor" = "Rust"
"org.opencontainers.image.version" = "1.78.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
