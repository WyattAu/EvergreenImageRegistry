[metadata]
tier = "standard"
name = "mongodb-6"
version = "6.0.14"
description = "MongoDB 6 - document-oriented NoSQL database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "mongo:${version}"

[runtime]
entrypoint = ["mongod"]

[ports]
expose = [27017, 9101]

[labels]
"org.opencontainers.image.title" = "mongodb-6"
"org.opencontainers.image.vendor" = "MongoDB"
"org.opencontainers.image.version" = "6.0.14"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
