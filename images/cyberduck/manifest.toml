[metadata]
tier = "standard"
name = "cyberduck"
version = "latest"
description = "cyberduck container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "iterate-ch/cyberduck:${VERSION}"

[runtime]
entrypoint = ["/opt/cyberduck/Cyberduck"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/iterate-ch/cyberduck"
"org.opencontainers.image.title" = "cyberduck"
"org.opencontainers.image.vendor" = "iterate-ch"
"org.opencontainers.image.version" = "9.1.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "15000ms"
"evergreen.image.category" = "storage"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
