[metadata]
name = "rmilter"
version = "1.0.0"
description = "Rmilter - milter filter for mail servers"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/rmilter"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.description" = "Rmilter - milter filter for mail servers"
"org.opencontainers.image.source" = "https://github.com/vstakhov/rmilter"
"org.opencontainers.image.title" = "rmilter"
"org.opencontainers.image.vendor" = "vstakhov"
"org.opencontainers.image.version" = "1.0.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.debian-slim" = "true"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

