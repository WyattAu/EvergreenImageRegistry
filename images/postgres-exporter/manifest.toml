[metadata]
name = "postgres-exporter"
version = "0.15.0"
description = "Postgres Exporter - Prometheus exporter for PostgreSQL"
vendor = "Prometheus"
source = "https://github.com/prometheus-community/postgres_exporter"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/postgres-exporter/postgres-exporter/releases/download/v0.15.0/postgres-exporter-0.15.0-linux-amd64.tar.gz"
binary_name = "postgres-exporter"
filename = "postgres-exporter-0.15.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9187
metrics = 9101

[labels]
"org.opencontainers.image.title" = "postgres-exporter"
"org.opencontainers.image.description" = "Postgres Exporter - Prometheus exporter for PostgreSQL"
"org.opencontainers.image.version" = "0.15.0"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.source" = "https://github.com/prometheus-community/postgres_exporter"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
