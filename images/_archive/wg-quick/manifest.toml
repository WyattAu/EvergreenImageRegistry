[metadata]
tier = "standard"
name = "wg-quick"
version = "1.0.20210914"
description = "WireGuard quick setup wrapper with wireguard-tools"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/bin/wg-quick"]

[ports]
expose = ["51820/udp", 9101]

[labels]
"org.opencontainers.image.description" = "WireGuard quick setup wrapper with wireguard-tools"
"org.opencontainers.image.source" = "https://www.wireguard.com"
"org.opencontainers.image.title" = "wg-quick"
"org.opencontainers.image.vendor" = "WireGuard"
"org.opencontainers.image.version" = "1.0.20210914"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
