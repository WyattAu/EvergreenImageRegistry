[metadata]
name = "wg-cloud"
version = "latest"
description = "WireGuard cloud management plane"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/david415/wg-cloud:${VERSION}"

[runtime]
entrypoint = ["/wg-cloud"]

[ports]
expose = [51820/udp, 9101]

[labels]
"org.opencontainers.image.description" = "WireGuard cloud management plane"
"org.opencontainers.image.source" = "https://github.com/david415/WireGuard-Go-VPN"
"org.opencontainers.image.title" = "wg-cloud"
"org.opencontainers.image.vendor" = "WireGuard-Go-VPN"
"org.opencontainers.image.version" = "0.1.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "networking"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

