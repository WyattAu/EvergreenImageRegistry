[metadata]
name = "cinny"
version = "4.2.2"
description = "Cinny - lightweight Matrix web client"
vendor = "cinnyapp"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/cinnyapp/cinny/releases/download/v4.2.2/cinny-v4.2.2.tar.gz"

[runtime]
entrypoint = ["httpd"]
cmd = ["-f", "-p", "80", "-h", "/var/www/html"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "Cinny - lightweight Matrix web client"
"org.opencontainers.image.source" = "https://github.com/cinnyapp/cinny"
"org.opencontainers.image.title" = "cinny"
"org.opencontainers.image.vendor" = "Cinny"
"org.opencontainers.image.version" = "4.2.2"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "http"
"evergreen.image.category" = "chat"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

