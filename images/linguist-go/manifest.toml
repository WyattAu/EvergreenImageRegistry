[metadata]
name = "linguist-go"
version = "latest"
description = "Linguist - Go variant"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/linguist"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Linguist - Go variant"
"org.opencontainers.image.source" = "https://github.com/github/linguist"
"org.opencontainers.image.title" = "linguist-go"
"org.opencontainers.image.vendor" = "GitHub"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

