[metadata]
tier = "standard"
name = "awslogs"
version = "0.16.0"
description = "AWS CloudWatch Logs CLI client"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/amazon-cloudwatch-agent-latest"
[runtime]
entrypoint = ["awslogs"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "AWS CloudWatch Logs CLI client"
"org.opencontainers.image.title" = "awslogs"
"org.opencontainers.image.vendor" = "AWS"
"org.opencontainers.image.version" = "0.16.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "false"
"evergreen.hft.cpu-pins" = "2-3"
"evergreen.hft.cpu-pins-mode" = "shared"
"evergreen.hft.deploy-strategy" = "standard-rolling"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-hook" = "false"
"evergreen.hft.runtime" = "python"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "5000ms"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
