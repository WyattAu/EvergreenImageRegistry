name: Lint & Format Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Check for consistent formatting with Prettier
  prettier-check:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Prettier
        run: npm install --global prettier
      - name: Run Prettier Check
        run: prettier --check .

  # Check Dockerfiles with hadolint (advisory only - many images use complex
  # shell constructs that hadolint cannot parse but Docker builds successfully)
  hadolint:
    name: Hadolint (Dockerfile Linter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install hadolint
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint && chmod +x /usr/local/bin/hadolint
      - name: Run hadolint
        continue-on-error: true
        run: |
          find images/ -name 'Dockerfile' -not -path 'images/_wip/*' -not -path 'images/_archive/*' -print0 | \
            xargs -0 hadolint --failure-threshold error

  # Check Markdown files for style issues
  markdownlint:
    name: MarkdownLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd
        with:
          globs: '**/*.md'

  # Check YAML files for syntax and style issues
  yamllint:
    name: YAMLLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run yamllint
        uses: karancode/yamllint-github-action@4052d365f09b8d34eb552c363d1141fd60e2aeb2
        with:
          yamllint_file_or_dir: '.'
          yamllint_config_filepath: '.yamllint.yml'

  # Rust code quality: clippy, fmt, audit, test
  rust-quality:
    name: Rust Quality (clippy + fmt + audit + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            evergreenctl/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('evergreenctl/Cargo.lock') }}
      - name: Run cargo fmt check
        run: cargo fmt --manifest-path evergreenctl/Cargo.toml -- --check
      - name: Run cargo clippy
        run: cargo clippy --manifest-path evergreenctl/Cargo.toml -- -D warnings
      - name: Run cargo audit
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cd evergreenctl && cargo audit
      - name: Run cargo test
        run: cargo test --manifest-path evergreenctl/Cargo.toml
      - name: Run cargo build --release
        run: cargo build --release --manifest-path evergreenctl/Cargo.toml

  # Python code quality: syntax + ruff lint
  python-quality:
    name: Python Quality (ruff + syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check scripts/ generate_manifests.py
      - name: Run ruff format check
        run: ruff format --check scripts/ generate_manifests.py
      - name: Validate Python syntax
        run: |
          for f in scripts/*.py generate_manifests.py; do
            [ -f "$f" ] || continue
            python -m py_compile "$f" || exit 1
          done

  # Shell script quality: syntax + shellcheck
  shell-quality:
    name: Shell Quality (shellcheck + syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -type f -print0 | \
            xargs -0 shellcheck --severity=error
      - name: Validate shell syntax
        run: |
          find . -name '*.sh' -not -path './.git/*' -type f -print0 | \
            xargs -0 -I{} bash -n {}

  # Check for unpinned FROM lines in Dockerfiles (supply chain integrity)
  digest-pin-check:
    name: Digest Pin Check (unpinned FROM lines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Check for unpinned FROM lines
        run: |
          UNPINNED=$(grep -rn '^FROM ' images/*/Dockerfile 2>/dev/null | grep -v '@sha256:' | grep -v 'FROM scratch' | grep -v 'FROM SCRATCH' || true)
          if [ -n "$UNPINNED" ]; then
            COUNT=$(echo "$UNPINNED" | wc -l)
            echo "::warning::$COUNT unpinned FROM lines found (supply chain integrity)"
            echo "$UNPINNED"
          else
            echo "All FROM lines are pinned or scratch"
          fi

  # Go code quality
  go-quality:
    name: Go Quality (vet + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.23'
      - name: Run go vet
        working-directory: images/health-shim
        run: go vet ./...
      - name: Run go build
        working-directory: images/health-shim
        run: go build ./...

  # Lint GitHub Actions workflow files
  actionlint:
    name: Actionlint (Workflow Linter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /usr/local/bin
      - name: Run actionlint
        continue-on-error: true
        run: actionlint .github/workflows/*.yml

  # Validate all manifest.toml files
  manifest-validation:
    name: Manifest TOML Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Validate manifest.toml files
        run: |
          python3 -c "
          import tomllib, sys
          from pathlib import Path
          total = 0
          errors = 0
          for m in sorted(Path('images').rglob('manifest.toml')):
              total += 1
              try:
                  with open(m, 'rb') as f:
                      tomllib.load(f)
              except Exception as e:
                  print(f'FAIL: {m}: {e}', file=sys.stderr)
                  errors += 1
          print(f'Manifest TOML: {total - errors}/{total} valid')
          if errors > 0:
              sys.exit(1)
          "

  # Validate all SBOM files
  sbom-validation:
    name: SBOM JSON Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Validate SBOM files
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path
          total = 0
          errors = 0
          for s in sorted(Path('images').rglob('sbom.spdx.json')):
              total += 1
              try:
                  with open(s) as f:
                      data = json.load(f)
                  if 'spdxVersion' not in data:
                      print(f'FAIL: {s}: missing spdxVersion', file=sys.stderr)
                      errors += 1
              except Exception as e:
                  print(f'FAIL: {s}: {e}', file=sys.stderr)
                  errors += 1
          print(f'SBOM validation: {total - errors}/{total} valid')
          if errors > 0:
              sys.exit(1)
          "

  # Enforce Alpine ban in CI
  no-alpine:
    name: No Alpine Base Images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Check for Alpine base images
        run: |
          ALPINE=$(grep -rni '^FROM.*alpine' images/*/Dockerfile 2>/dev/null || true)
          if [ -n "$ALPINE" ]; then
            echo "::error::Alpine base images detected (BANNED):"
            echo "$ALPINE"
            exit 1
          else
            echo "No Alpine base images found"
          fi

  # Detect version drift between Dockerfile and manifest.toml
  version-drift:
    name: Version Drift Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Build evergreenctl
        run: cargo build --release
        working-directory: evergreenctl
      - name: Check version mismatches
        run: |
          MISMATCHES=$(./evergreenctl/target/release/evergreenctl validate-strict 2>&1 | grep -c "mismatch" || echo "0")
          if [ "$MISMATCHES" -gt 0 ]; then
            echo "::error::${MISMATCHES} version mismatches detected between Dockerfile and manifest.toml"
            ./evergreenctl/target/release/evergreenctl validate-strict 2>&1 | grep "mismatch"
            exit 1
          else
            echo "No version drift detected"
          fi

  # Detect empty builder stages (FROM ... AS name with no COPY --from=name)
  # This catches the class of bug where a builder stage is declared but
  # its artifacts are never copied to the final image (silent empty image).
  empty-builder-detection:
    name: Empty Builder Stage Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Detect empty builder stages
        run: |
          python3 -c "
          import re, sys
          from pathlib import Path
          errors = []
          for df in sorted(Path('images').rglob('Dockerfile')):
              if '_wip' in str(df) or '_archive' in str(df):
                  continue
              content = df.read_text()
              # Find named stages: FROM <image> AS <name> (only from FROM lines)
              stages = re.findall(r'^FROM\s+\S+\s+AS\s+([a-zA-Z][a-zA-Z0-9_-]*)', content, re.MULTILINE | re.IGNORECASE)
              if not stages:
                  continue
              for stage in stages:
                  stage_lower = stage.lower()
                  # Check for COPY --from=<stage> (case-insensitive)
                  copy_re = re.compile(r'(?i)COPY\s+--from=' + re.escape(stage_lower) + r'\b')
                  # Check for FROM <stage> (multi-stage reference)
                  from_re = re.compile(r'(?i)^FROM\s+' + re.escape(stage_lower) + r'\b', re.MULTILINE)
                  if not copy_re.search(content) and not from_re.search(content):
                      errors.append(f'{df}: stage \"{stage}\" declared but never consumed')
          for e in errors:
              print(f'::error::{e}')
          if errors:
              print(f'::error::{len(errors)} empty builder stage(s) detected')
              sys.exit(1)
          print('No empty builder stages detected')
          "
