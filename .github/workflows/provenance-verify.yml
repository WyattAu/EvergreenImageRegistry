name: Provenance Verification
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Run evergreenctl verify-all
        run: |
          cd evergreenctl && cargo build --release && \
          ./target/release/evergreenctl verify-all ../images/
      - name: Verify SLSA provenance for sample images
        run: |
          SAMPLE_IMAGES=$(find images -maxdepth 1 -mindepth 1 -type d \
            -not -path 'images/_*' -not -path 'images/tests' \
            -not -path 'images/health-shim' \
            | head -5 | sed 's|images/||' | tr '\n' ' ')
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          CERT_IDENTITY="https://github.com/${{ github.repository }}"
          for img in $SAMPLE_IMAGES; do
            FULL_REF="ghcr.io/${OWNER}/${img}:latest"
            echo "Verifying provenance for $FULL_REF..."
            cosign verify-attestation --type slsaprovenance \
              --certificate-identity "${CERT_IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$FULL_REF" 2>&1 || echo "WARNING: Could not verify $img (image may not be published yet)" >&2
          done
