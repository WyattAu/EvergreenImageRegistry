[metadata]
tier = "standard"
name = "tts"
version = "0.22.0"
description = "tts container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [5002, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/coqui-ai/TTS"
"org.opencontainers.image.title" = "tts"
"org.opencontainers.image.vendor" = "Coqui"
"org.opencontainers.image.version" = "0.22.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
