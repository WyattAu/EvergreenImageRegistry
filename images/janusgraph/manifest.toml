[metadata]
name = "janusgraph"
version = "1.0.0"
description = "Sovereign hardened JanusGraph - distributed graph database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/janusgraph/bin/gremlin.sh"]

[ports]
expose = [8182, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened JanusGraph - distributed graph database"
"org.opencontainers.image.title" = "janusgraph"
"org.opencontainers.image.vendor" = "JanusGraph"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

