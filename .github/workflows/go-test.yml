name: Go Tests
on:
  push:
    branches: [main]
    paths:
      - 'images/health-shim/**'
  pull_request:
    paths:
      - 'images/health-shim/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/health-shim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -race -count=1 ./...
      - name: Build (static)
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o /dev/null .
