[metadata]
tier = "standard"
name = "zeromq"
version = "4.3.5"
description = "zeromq container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/zeromq/libzmq"
"org.opencontainers.image.title" = "zeromq"
"org.opencontainers.image.vendor" = "ZeroMQ"
"org.opencontainers.image.version" = "4.3.5"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.distrole" = "debian-slim"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
