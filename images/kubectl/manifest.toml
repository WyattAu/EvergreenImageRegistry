[metadata]
name = "kubectl"
version = "1.30.1"
description = "kubectl - command line tool for controlling Kubernetes clusters"
vendor = "Kubernetes"
source = "https://github.com/kubernetes/kubernetes"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://dl.k8s.io/release/v1.30.1/bin/linux/amd64/kubectl"
binary_name = "kubectl"
filename = "kubectl"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
metrics = 9101

[labels]
"org.opencontainers.image.title" = "kubectl"
"org.opencontainers.image.description" = "kubectl - command line tool for controlling Kubernetes clusters"
"org.opencontainers.image.version" = "1.30.1"
"org.opencontainers.image.vendor" = "Kubernetes"
"org.opencontainers.image.source" = "https://github.com/kubernetes/kubernetes"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
