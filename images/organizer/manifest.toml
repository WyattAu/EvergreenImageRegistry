[metadata]
tier = "standard"
name = "organizer"
version = "unknown"
description = "Organizr - HTPC/Homelab dashboard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php-fpm83"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "Organizr - HTPC/Homelab dashboard"
"org.opencontainers.image.source" = "https://github.com/causefx/Organizr"
"org.opencontainers.image.title" = "organizer"
"org.opencontainers.image.vendor" = "CauseFX"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
