[metadata]
name = "grafana-image-renderer"
version = "5.8.2"
description = "Grafana Image Renderer - server-side image rendering for Grafana"
vendor = "Grafana Labs"
source = "https://github.com/grafana/grafana-image-renderer"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/grafana-image-renderer/grafana-image-renderer/releases/download/v5.8.2/grafana-image-renderer-5.8.2-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/grafana-image-renderer/build/grafana-image-renderer"]

[ports]
expose = [8081, 9101]

[labels]
"org.opencontainers.image.description" = "Grafana image renderer plugin with headless Chromium"
"org.opencontainers.image.title" = "grafana-image-renderer"
"org.opencontainers.image.vendor" = "Grafana Labs"
"org.opencontainers.image.version" = "5.8.2"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-5"
"evergreen.hft.cpu-pins-mode" = "shared"
"evergreen.hft.deploy-strategy" = "standard-rolling"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "10s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.runtime" = "node"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "20000ms"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
