[metadata]
name = "chartdb"
version = "latest"
description = "Sovereign hardened ChartDB - database schema visualization tool"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/chart-db/chartdb:${VERSION}"

[runtime]
entrypoint = ["java", "-jar", "/opt/chartdb/chartdb.jar"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened ChartDB - database schema visualization tool"
"org.opencontainers.image.title" = "chartdb"
"org.opencontainers.image.vendor" = "ChartDB"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

