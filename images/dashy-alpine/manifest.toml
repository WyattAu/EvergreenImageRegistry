[metadata]
tier = "standard"
name = "dashy-alpine"
version = "unknown"
description = "Dashy - Dashboard (debian-slim, no Alpine)"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node", "server.js"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "Dashy - Dashboard (debian-slim, no Alpine)"
"org.opencontainers.image.source" = "https://github.com/lissy93/dashy"
"org.opencontainers.image.title" = "dashy-alpine"
"org.opencontainers.image.vendor" = "lissy93"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.no_alpine" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
