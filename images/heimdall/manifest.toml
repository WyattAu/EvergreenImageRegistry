[metadata]
name = "heimdall"
version = "2.6.1"
description = "Heimdall - application dashboard and launcher"
vendor = "Heimdall"
source = "https://github.com/linuxserver/heimdall"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/heimdall/heimdall/releases/download/v2.6.1/heimdall-2.6.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["node"]
cmd = ["/app/src/server.js"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "Heimdall - Application dashboard"
"org.opencontainers.image.source" = "https://github.com/linuxserver/Heimdall"
"org.opencontainers.image.title" = "heimdall"
"org.opencontainers.image.vendor" = "LinuxServer.io"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
