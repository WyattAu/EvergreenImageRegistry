[metadata]
tier = "standard"
name = "crane"
version = "0.21.5"
description = "Evergreen hardened crane - container registry client"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/crane"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened crane - container registry client"
"org.opencontainers.image.title" = "crane"
"org.opencontainers.image.vendor" = "Google"
"org.opencontainers.image.version" = "0.21.5"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

