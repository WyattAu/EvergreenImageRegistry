[metadata]
tier = "standard"
name = "mlflow-tracking"
version = "2.21.0"
description = "mlflow-tracking container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["mlflow"]

[ports]
expose = [5000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/mlflow/mlflow"
"org.opencontainers.image.title" = "mlflow-tracking"
"org.opencontainers.image.vendor" = "MLflow"
"org.opencontainers.image.version" = "2.21.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
