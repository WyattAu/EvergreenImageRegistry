[metadata]
name = "minisearch"
version = "latest"
description = "Lightweight full-text search engine"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/nicbarker/minisearch:${VERSION}"

[runtime]
entrypoint = ["/minisearch"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Lightweight full-text search engine"
"org.opencontainers.image.source" = "https://github.com/nicbarker/miniSearch"
"org.opencontainers.image.title" = "minisearch"
"org.opencontainers.image.vendor" = "nicbarker"
"org.opencontainers.image.version" = "best-effort"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "search"
"sovereign.image.status" = "best-effort"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

