[metadata]
name = "cockpit"
version = "unknown"
description = "Cockpit - Web-based server management"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["cockpit-ws"]
cmd = ["--port", "9090"]

[ports]
expose = [9090, 9101]

[labels]
"org.opencontainers.image.description" = "Cockpit - Web-based server management"
"org.opencontainers.image.title" = "cockpit"
"org.opencontainers.image.vendor" = "Red Hat"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

