[metadata]
tier = "standard"
name = "invokeai"
version = "5.5.0"
description = "invokeai container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [9090, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/invoke-ai/InvokeAI"
"org.opencontainers.image.title" = "invokeai"
"org.opencontainers.image.vendor" = "InvokeAI"
"org.opencontainers.image.version" = "5.5.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
