[metadata]
name = "redisearch"
version = "2.8.13"
description = "Sovereign hardened RediSearch - full-text search module for Redis"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["redis-server", "--loadmodule", "/opt/redis/modules/redisearch.so"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened RediSearch - full-text search module for Redis"
"org.opencontainers.image.title" = "redisearch"
"org.opencontainers.image.vendor" = "Redis"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

