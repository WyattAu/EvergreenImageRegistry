[metadata]
name = "golang-alpine"
version = "1.22.10"
description = "Sovereign hardened go-1.23-alpine - Go build base (no Alpine, scratch)"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["go"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened go-1.23-alpine - Go build base (no Alpine, scratch)"
"org.opencontainers.image.title" = "go-1.23-alpine"
"org.opencontainers.image.vendor" = "Go"
"org.opencontainers.image.version" = "1.22.10"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

