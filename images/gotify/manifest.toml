[metadata]
name = "gotify"
version = "2.9.1"
description = "Gotify - simple push notification server"
vendor = "gotify"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/gotify/server/releases/download/v2.9.1/gotify-linux-amd64"

[runtime]
entrypoint = ["/usr/local/bin/gotify"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Gotify - simple push notification server"
"org.opencontainers.image.source" = "https://github.com/gotify/server"
"org.opencontainers.image.title" = "gotify"
"org.opencontainers.image.vendor" = "Gotify"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "http"
"evergreen.image.category" = "notifications"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

