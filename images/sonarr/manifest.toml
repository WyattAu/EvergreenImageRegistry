[metadata]
name = "sonarr"
version = "4.0.10"
description = "Sonarr - PVR for Usenet and BitTorrent users"
vendor = "Sonarr"
source = "https://github.com/Sonarr/Sonarr"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/sonarr/sonarr/releases/download/v4.0.10/sonarr-4.0.10-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/app/Sonarr"]

[ports]
expose = [8989, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/Sonarr/Sonarr"
"org.opencontainers.image.title" = "sonarr"
"org.opencontainers.image.vendor" = "Sonarr"
"org.opencontainers.image.version" = "4.0.10"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.official" = "true"
"sovereign.health.type" = "none"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

