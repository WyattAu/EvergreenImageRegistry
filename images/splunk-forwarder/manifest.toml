[metadata]
tier = "standard"
name = "splunk-forwarder"
version = "9.2.1"
description = "Evergreen hardened Splunk Universal Forwarder - log data shipper"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/splunk/splunk"
[runtime]
entrypoint = ["/opt/splunkforwarder/bin/splunk"]
cmd = ["start", "--accept-license", "--no-prompt"]

[ports]
expose = [8089, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Splunk Universal Forwarder - log data shipper"
"org.opencontainers.image.title" = "splunk-forwarder"
"org.opencontainers.image.vendor" = "Splunk"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "15s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "observability"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
