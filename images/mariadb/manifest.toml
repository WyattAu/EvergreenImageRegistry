[metadata]
name = "mariadb"
version = "11.4.2"
description = "MariaDB - community-developed fork of MySQL"
vendor = "MariaDB Foundation"
source = "https://github.com/MariaDB/server"
license = "Apache-2.0"
tier = "2"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/mariadb/mariadb/releases/download/v11.4.2/mariadb-11.4.2-linux-amd64.tar.gz"

[runtime]
entrypoint = ["sh", "-c", "mariadbd"]

[ports]
expose = [3306, 9101]

[labels]
"org.opencontainers.image.title" = "mariadb"
"org.opencontainers.image.vendor" = "MariaDB"
"org.opencontainers.image.version" = "11.4.2"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "http"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "true"

