[metadata]
name = "immudb"
version = "1.10.0"
description = "Evergreen hardened immudb - immutable database with cryptographic verification"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/immudb"]

[ports]
expose = [3322, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened immudb - immutable database with cryptographic verification"
"org.opencontainers.image.title" = "immudb"
"org.opencontainers.image.vendor" = "Codenotary"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "security"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

