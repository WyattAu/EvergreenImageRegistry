[metadata]
name = "maven"
version = "3.9.15"
description = "Sovereign hardened maven - Java build tool"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["mvn"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened maven - Java build tool"
"org.opencontainers.image.title" = "maven"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "3.9.15"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "30s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

