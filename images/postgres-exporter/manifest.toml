[metadata]
name = "postgres-exporter"
version = "0.15.0"
description = "Postgres Exporter - Prometheus exporter for PostgreSQL"
vendor = "Prometheus"
source = "https://github.com/prometheus-community/postgres_exporter"
license = "Apache-2.0"
tier = "2"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/postgres-exporter/postgres-exporter/releases/download/v0.15.0/postgres-exporter-0.15.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/postgres_exporter"]

[ports]
expose = [9187, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Postgres Exporter - Prometheus exporter for PostgreSQL"
"org.opencontainers.image.title" = "postgres-exporter"
"org.opencontainers.image.vendor" = "Prometheus Community"
"org.opencontainers.image.version" = "0.15.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.connection-drain" = "false"
"sovereign.hft.cpu-pins" = "6-7"
"sovereign.hft.cpu-pins-mode" = "shared"
"sovereign.hft.deploy-strategy" = "standard-rolling"
"sovereign.hft.init-system" = "none"
"sovereign.hft.pre-stop-hook" = "false"
"sovereign.hft.sched-policy" = "SCHED_OTHER"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "database"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

