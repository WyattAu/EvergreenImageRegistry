[metadata]
tier = "standard"
name = "weaviate"
version = "1.25.4"
description = "weaviate container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "weaviate"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/weaviate"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.title" = "weaviate"
"org.opencontainers.image.vendor" = "Weaviate"
"org.opencontainers.image.version" = "1.25.4"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

