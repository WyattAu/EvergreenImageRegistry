[metadata]
name = "docker-clean"
version = "0.3.0"
description = "Docker cleanup and pruning tool"
vendor = "zzehring"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["docker-clean"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Docker cleanup and pruning tool"
"org.opencontainers.image.source" = "https://github.com/zzehring/docker-cleanup"
"org.opencontainers.image.title" = "docker-clean"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "devops"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

