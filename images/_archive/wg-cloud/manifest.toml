[metadata]
tier = "critical"
name = "wg-cloud"
version = "latest"
description = "WireGuard cloud management plane"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/david415/wg-cloud:${VERSION}"

[runtime]
entrypoint = ["/wg-cloud"]

[ports]
expose = ["51820/udp", 9101]

[labels]
"org.opencontainers.image.description" = "WireGuard cloud management plane"
"org.opencontainers.image.source" = "https://github.com/david415/WireGuard-Go-VPN"
"org.opencontainers.image.title" = "wg-cloud"
"org.opencontainers.image.vendor" = "WireGuard-Go-VPN"
"org.opencontainers.image.version" = "0.1.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical""evergreen.metrics.native" = "ztunnel"
