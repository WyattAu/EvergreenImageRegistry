[metadata]
name = "oauth2-proxy-alpine"
version = "7.6.0"
description = "OAuth2 reverse proxy (alpine variant, built without Alpine)"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/oauth2-proxy"]

[ports]
expose = [4180, 9101]

[labels]
"org.opencontainers.image.description" = "OAuth2 reverse proxy (alpine variant, built without Alpine)"
"org.opencontainers.image.source" = "https://github.com/oauth2-proxy/oauth2-proxy"
"org.opencontainers.image.title" = "oauth2-proxy-alpine"
"org.opencontainers.image.vendor" = "OAuth2 Proxy"
"org.opencontainers.image.version" = "7.6.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "security"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

