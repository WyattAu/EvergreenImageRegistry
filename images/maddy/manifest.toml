[metadata]
name = "maddy"
version = "0.9.3"
description = "Maddy - composable all-in-one mail server written in Go"
vendor = "foxcpp"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/foxcpp/maddy/releases/download/v0.9.3/maddy-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/maddy"]
cmd = ["run"]

[ports]
expose = [25, 9101]

[labels]
"org.opencontainers.image.description" = "Maddy - composable all-in-one mail server written in Go"
"org.opencontainers.image.source" = "https://github.com/foxcpp/maddy"
"org.opencontainers.image.title" = "maddy"
"org.opencontainers.image.vendor" = "foxcpp"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "tcp"
"sovereign.image.category" = "email"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

