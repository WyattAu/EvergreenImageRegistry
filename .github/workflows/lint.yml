name: Lint & Format Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Check for consistent formatting with Prettier
  prettier-check:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Prettier
        run: npm install --global prettier
      - name: Run Prettier Check
        run: prettier --check .

  # Check Dockerfiles with hadolint (advisory only - many images use complex
  # shell constructs that hadolint cannot parse but Docker builds successfully)
  hadolint:
    name: Hadolint (Dockerfile Linter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
      - name: Run hadolint
        run: |
          find images/ -name 'Dockerfile' -not -path 'images/_wip/*' -not -path 'images/_archive/*' -print0 | \
            xargs -0 hadolint --failure-threshold error

  # Check Markdown files for style issues
  markdownlint:
    name: MarkdownLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd
        with:
          globs: '**/*.md'

  # Check YAML files for syntax and style issues
  yamllint:
    name: YAMLLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run yamllint
        uses: karancode/yamllint-github-action@fdef6bc189425ecc84cc4543b2674566c0827053
        with:
          yamllint_file_or_dir: '.'
          yamllint_config_filepath: '.yamllint.yml'

  # Rust code quality: clippy, fmt, audit, test
  rust-quality:
    name: Rust Quality (clippy + fmt + audit + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            evergreenctl/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('evergreenctl/Cargo.lock') }}
      - name: Run cargo fmt check
        run: cargo fmt --manifest-path evergreenctl/Cargo.toml -- --check
      - name: Run cargo clippy
        run: cargo clippy --manifest-path evergreenctl/Cargo.toml -- -D warnings
      - name: Run cargo audit
        run: |
          cargo install cargo-audit --locked
          cd evergreenctl && cargo audit
      - name: Run cargo test
        run: cargo test --manifest-path evergreenctl/Cargo.toml
      - name: Run cargo build --release
        run: cargo build --release --manifest-path evergreenctl/Cargo.toml

  # Python code quality: syntax + ruff lint
  python-quality:
    name: Python Quality (ruff + syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check scripts/ generate_manifests.py
      - name: Run ruff format check
        run: ruff format --check scripts/ generate_manifests.py
      - name: Validate Python syntax
        run: |
          for f in scripts/*.py generate_manifests.py; do
            [ -f "$f" ] || continue
            python -m py_compile "$f" || exit 1
          done

  # Shell script quality: syntax + shellcheck
  shell-quality:
    name: Shell Quality (shellcheck + syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -type f -print0 | \
            xargs -0 shellcheck --severity=error
      - name: Validate shell syntax
        run: |
          find . -name '*.sh' -not -path './.git/*' -type f -print0 | \
            xargs -0 -I{} bash -n {}

  # Check for unpinned FROM lines in Dockerfiles (supply chain integrity)
  digest-pin-check:
    name: Digest Pin Check (unpinned FROM lines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Check for unpinned FROM lines
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
          unpinned = []
          for manifest in sorted(Path('images').glob('*/manifest.toml')):
              directory = manifest.parent
              dockerfile = directory / 'Dockerfile'
              if not dockerfile.exists():
                  continue
              tier_match = re.search(r'^tier\\s*=\\s*["\\']([^"\\']+)', manifest.read_text(), re.M)
              raw_tier = tier_match.group(1) if tier_match else 'standard'
              tier = {'1': 'critical', '2': 'standard', '3': 'standard'}.get(raw_tier.lower(), raw_tier.lower())
              dockerfile_text = dockerfile.read_text(errors='replace')
              label_tiers = re.findall(r'evergreen\\.image\\.tier\\s*=\\s*["\\']([^"\\']+)', dockerfile_text, re.I)
              if label_tiers and {'1': 'critical', '2': 'standard', '3': 'standard'}.get(label_tiers[-1].lower(), label_tiers[-1].lower()) != tier:
                  print(f'::error::Tier metadata conflict in {directory}')
                  sys.exit(1)
              for number, line in enumerate(dockerfile.read_text(errors='replace').splitlines(), 1):
                  if line.strip().upper().startswith('FROM ') and '@sha256:' not in line and line.strip().lower() != 'from scratch':
                      unpinned.append((tier, f'{dockerfile}:{number}: {line}'))
          critical = [entry for tier, entry in unpinned if tier == 'critical']
          standard = [entry for tier, entry in unpinned if tier != 'critical']
          if critical:
              print('::error::Unpinned FROM lines in critical-tier images:')
              print('\\n'.join(critical))
              sys.exit(1)
          if standard:
              print(f'::warning::{len(standard)} unpinned FROM lines remain in standard-tier images')
              print('\\n'.join(standard))
          else:
              print('All FROM lines are pinned or scratch')
          PY

  # Canonical repository inventory
  inventory-validation:
    name: Canonical Inventory Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Generate canonical inventory
        run: python3 scripts/inventory_report.py --json /tmp/inventory.json
      - name: Generate critical pinning worklist
        run: python3 scripts/critical_pinning_worklist.py --json /tmp/critical-pinning-worklist.json
      - name: Upload critical pinning worklist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: critical-pinning-worklist
          path: /tmp/critical-pinning-worklist.json
          retention-days: 30
      - name: Resolve eligible critical references (read-only)
        run: python3 scripts/resolve_critical_digests.py /tmp/critical-pinning-worklist.json --json /tmp/critical-digest-resolutions.json
      - name: Upload digest resolution report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: critical-digest-resolutions
          path: /tmp/critical-digest-resolutions.json
          retention-days: 30
      - name: Validate inventory invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/inventory.json').read_text())
          total = report['total_images']
          assert total == len(report['images'])
          assert report['with_valid_sbom'] <= report['with_sbom'] <= total
          for key in ('with_user', 'with_healthcheck', 'all_from_pinned', 'critical_total', 'critical_from_pinned', 'standard_unpinned'):
              assert 0 <= report[key] <= total
          assert report['critical_from_pinned'] <= report['critical_total']
          assert report['critical_unpinned'] == report['critical_total'] - report['critical_from_pinned']
          assert report['tier_conflicts'] == 0
          assert report['invalid_tiers'] == 0
          print(f"Critical pinning: {report['critical_from_pinned']}/{report['critical_total']} fully pinned")
          print(f"Canonical inventory: {total} active images")
          print(f"SBOM: {report['with_valid_sbom']}/{total} valid")
          PY

  # Go code quality
  go-quality:
    name: Go Quality (vet + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.23'
      - name: Run go vet
        working-directory: images/health-shim
        run: go vet ./...
      - name: Run go build
        working-directory: images/health-shim
        run: go build ./...

  # Lint GitHub Actions workflow files
  actionlint:
    name: Actionlint (Workflow Linter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /usr/local/bin
      - name: Run actionlint
        run: actionlint .github/workflows/*.yml

  # Validate all manifest.toml files
  manifest-validation:
    name: Manifest TOML Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Validate manifest.toml files
        run: |
          python3 -c "
          import tomllib, sys
          from pathlib import Path
          total = 0
          errors = 0
          for m in sorted(Path('images').rglob('manifest.toml')):
              total += 1
              try:
                  with open(m, 'rb') as f:
                      tomllib.load(f)
              except Exception as e:
                  print(f'FAIL: {m}: {e}', file=sys.stderr)
                  errors += 1
          print(f'Manifest TOML: {total - errors}/{total} valid')
          if errors > 0:
              sys.exit(1)
          "

  # Validate all SBOM files
  sbom-validation:
    name: SBOM JSON Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Validate SBOM files
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path
          total = 0
          errors = 0
          for s in sorted(Path('images').rglob('sbom.spdx.json')):
              total += 1
              try:
                  with open(s) as f:
                      data = json.load(f)
                  if 'spdxVersion' not in data:
                      print(f'FAIL: {s}: missing spdxVersion', file=sys.stderr)
                      errors += 1
              except Exception as e:
                  print(f'FAIL: {s}: {e}', file=sys.stderr)
                  errors += 1
          print(f'SBOM validation: {total - errors}/{total} valid')
          if errors > 0:
              sys.exit(1)
          "

  # Enforce Alpine ban in CI
  no-alpine:
    name: No Alpine Base Images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Check for Alpine base images
        run: |
          ALPINE=$(grep -rni '^FROM alpine' images/*/Dockerfile 2>/dev/null | grep -v 'mirror-' || true)
          ALPINE2=$(grep -rni '^FROM .*alpine:' images/*/Dockerfile 2>/dev/null | grep -v 'mirror-' || true)
          ALPINE="${ALPINE}${ALPINE2}"
          if [ -n "$ALPINE" ]; then
            echo "::error::Alpine base images detected (BANNED):"
            echo "$ALPINE"
            exit 1
          else
            echo "No Alpine base images found"
          fi

  # Detect version drift between Dockerfile and manifest.toml
  version-drift:
    name: Version Drift Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build evergreenctl
        run: cargo build --release
        working-directory: evergreenctl
      - name: Check version mismatches
        run: |
          # Use 'drift' command per-image (validate-strict doesn't exist)
          MISMATCHES=0
          for img_dir in images/*/; do
            [ -f "${img_dir}Dockerfile" ] || continue
            [[ "$(basename $img_dir)" == _* ]] && continue
            [[ "$(basename $img_dir)" == "clawdius" ]] && continue
            result=$(./evergreenctl/target/release/evergreenctl drift "${img_dir}" 2>&1 || true)
            if echo "$result" | grep -qi "mismatch\|drift"; then
              MISMATCHES=$((MISMATCHES+1))
              echo "::warning::$(basename $img_dir): version drift detected"
            fi
          done
          if [ "$MISMATCHES" -gt 0 ]; then
            echo "::warning::${MISMATCHES} version mismatches detected (non-blocking)"
          else
            echo "No version drift detected"
          fi

  # Detect empty builder stages (FROM ... AS name with no COPY --from=name)
  # This catches the class of bug where a builder stage is declared but
  # its artifacts are never copied to the final image (silent empty image).
  empty-builder-detection:
    name: Empty Builder Stage Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Detect empty builder stages
        run: |
          python3 -c "
          import re, sys
          from pathlib import Path
          errors = []
          for df in sorted(Path('images').rglob('Dockerfile')):
              if '_wip' in str(df) or '_archive' in str(df) or 'clawdius' in str(df):
                  continue
              content = df.read_text()
              stages = re.findall(r'^FROM\s+\S+\s+AS\s+([a-zA-Z][a-zA-Z0-9_-]*)', content, re.MULTILINE | re.IGNORECASE)
              if not stages:
                  continue
              for stage in stages:
                  stage_lower = stage.lower()
                  copy_re = re.compile(r'(?i)COPY\s+--from=' + re.escape(stage_lower) + r'\b')
                  from_re = re.compile(r'(?i)^FROM\s+' + re.escape(stage_lower) + r'\b', re.MULTILINE)
                  if not copy_re.search(content) and not from_re.search(content):
                      errors.append(f'{df}: stage \"{stage}\" declared but never consumed')
          for e in errors:
              print(f'::error::{e}')
          if errors:
              print(f'::error::{len(errors)} empty builder stage(s) detected')
              sys.exit(1)
          print('No empty builder stages detected')
          "
