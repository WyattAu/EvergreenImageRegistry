[metadata]
name = "drone"
version = "1.9.0"
description = "Drone CLI - cloud-native continuous integration and delivery platform"
vendor = "Harness"
source = "https://github.com/harness/drone-cli"
license = "Apache-2.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/harness/drone-cli/releases/download/v1.9.0/drone_linux_amd64.tar.gz"

[runtime]
entrypoint = ["/drone"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/harness/drone-cli"
"org.opencontainers.image.title" = "drone"
"org.opencontainers.image.vendor" = "Harness"
"org.opencontainers.image.version" = "1.9.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
