[metadata]
tier = "standard"
name = "duplicati"
version = "2.1.0.1"
description = "duplicati container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/linuxserver/duplicati"
[runtime]
entrypoint = ["dotnet", "/opt/duplicati/Duplicati.Server.exe"]

[ports]
expose = [8200, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/duplicati/duplicati"
"org.opencontainers.image.title" = "duplicati"
"org.opencontainers.image.vendor" = "Duplicati"
"org.opencontainers.image.version" = "2.1.0.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "cloud-storage"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
