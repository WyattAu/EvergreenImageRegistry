# =============================================================================
# EVERGREEN SIGN PIPELINE - Standalone Image Signing
# =============================================================================
# Triggered on workflow_run completion of build-on-push or build-nightly.
# Downloads built-list artifacts from the triggering run and signs all images.
# Separated from _build-reusable.yml to avoid 30+ minute timeout issues.
# =============================================================================

name: Sign Images

on:
  workflow_run:
    workflows: ['Build on Push', 'Nightly Full Rebuild']
    types: [completed]

permissions:
  contents: read
  id-token: write
  packages: write
  actions: read

jobs:
  sign:
    name: Sign Images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install cosign v2.2.4
        run: |
          curl -sLO "https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-amd64"
          chmod +x cosign-linux-amd64
          sudo mv cosign-linux-amd64 /usr/local/bin/cosign
          cosign version

      - name: Login to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built artifacts from triggering run
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          mkdir -p /tmp/batches

          echo "Listing artifacts from run ${RUN_ID}..."
          ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("built-list-")) | .name' 2>/dev/null) || true

          if [ -z "$ARTIFACTS" ]; then
            echo "::warning::No built-list artifacts found in run ${RUN_ID}"
            echo "AVAILABLE_ARTIFACTS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Found artifacts:"
          echo "$ARTIFACTS"

          for artifact_name in $ARTIFACTS; do
            echo "Downloading ${artifact_name}..."
            gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"${artifact_name}\") | .archive_download_url" | \
              xargs -I {} gh api {} -H "Accept: application/vnd.github+json" > "/tmp/batches/${artifact_name}.zip" 2>/dev/null || true
            if [ -f "/tmp/batches/${artifact_name}.zip" ]; then
              cd /tmp/batches && unzip -o "${artifact_name}.zip" 2>/dev/null; cd -
            fi
          done

          # Merge all built image references
          cat /tmp/batches/built-list-*/built-images.txt 2>/dev/null | sort -u > /tmp/all-images.txt || true
          echo "Found $(wc -l < /tmp/all-images.txt) unique images to sign"

          if [ ! -s /tmp/all-images.txt ]; then
            echo "::warning::No images found to sign"
            echo "NO_IMAGES=true" >> "$GITHUB_ENV"
          else
            echo "NO_IMAGES=false" >> "$GITHUB_ENV"
          fi

      - name: Wait for registry propagation
        if: env.NO_IMAGES != 'true'
        run: sleep 30

      - name: Sign all images
        if: env.NO_IMAGES != 'true'
        run: |
          while read -r ref; do
            [ -z "$ref" ] && continue
            if ! docker manifest inspect "${ref}" >/dev/null 2>&1; then
              echo "::warning::Image not found in registry, skipping sign: ${ref}"
              continue
            fi
            for attempt in 1 2 3 4 5; do
              echo "::group::Sign ${ref} (attempt ${attempt})"
              if cosign sign --yes \
                --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/sign-images.yml@refs/heads/main" \
                --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
                "${ref}" 2>&1; then
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              if [ "$attempt" -lt 5 ]; then
                echo "::warning::Sign attempt ${attempt} failed for ${ref}, retrying in 30s..."
                sleep 30
              else
                echo "::warning::Sign failed for ${ref} after 5 attempts"
              fi
            done
          done < /tmp/all-images.txt

      - name: Generate SLSA provenance attestations
        if: env.NO_IMAGES != 'true'
        run: |
          sleep 10
          while read -r ref; do
            [ -z "$ref" ] && continue
            if ! docker manifest inspect "${ref}" >/dev/null 2>&1; then
              echo "::warning::Image not found in registry, skipping attestation: ${ref}"
              continue
            fi
            echo "::group::SLSA Provenance ${ref}"
            cosign attest --yes \
              --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/sign-images.yml@refs/heads/main" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              --predicate - \
              --type slsaprovenance \
              "${ref}" <<EOF
          {
            "_type": "https://in-toto.io/Statement/v0.1",
            "predicateType": "https://slsa.dev/provenance/v0.2",
            "predicate": {
              "builder": { "id": "https://github.com/${{ github.repository }}" },
              "buildType": "evergreen-image-registry/build-on-push",
              "invocation": {
                "configSource": {
                  "uri": "${{ github.server_url }}/${{ github.repository }}",
                  "digest": { "sha1": "${{ github.event.workflow_run.head_sha }}" },
                  "entryPoint": ".github/workflows/sign-images.yml"
                }
              },
              "materials": [{ "uri": "${{ github.server_url }}/${{ github.repository }}", "digest": { "sha1": "${{ github.event.workflow_run.head_sha }}" } }]
            }
          }
          EOF
            echo "::endgroup::"
          done < /tmp/all-images.txt

      - name: Attest SBOMs to images
        if: env.NO_IMAGES != 'true'
        run: |
          while read -r ref; do
            [ -z "$ref" ] && continue
            IMAGE=$(echo "$ref" | sed 's|.*\/||; s|:.*||')
            SBOM="images/${IMAGE}/sbom.spdx.json"
            if [ ! -f "$SBOM" ]; then
              echo "::warning::No SBOM for ${IMAGE}, skipping attestation"
              continue
            fi
            echo "::group::SBOM Attest ${IMAGE}"
            cosign attest --yes \
              --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/sign-images.yml@refs/heads/main" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              --predicate "$SBOM" \
              --type spdxjson \
              "${ref}" 2>&1 || echo "::warning::SBOM attestation failed for ${ref}"
            echo "::endgroup::"
          done < /tmp/all-images.txt
