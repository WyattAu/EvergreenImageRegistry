[metadata]
tier = "standard"
name = "node-alpine"
version = "22.12.0"
description = "Evergreen hardened node-alpine - Node.js runtime (no Alpine, scratch)"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened node-alpine - Node.js runtime (no Alpine, scratch)"
"org.opencontainers.image.title" = "node-alpine"
"org.opencontainers.image.vendor" = "Node.js"
"org.opencontainers.image.version" = "22.12.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
