[metadata]
name = "dex"
version = "2.45.1"
description = "Dex - federated OpenID Connect provider"
vendor = "Dex"
source = "https://github.com/dexidp/dex"
license = "Apache-2.0"
tier = "1"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/dex/dex/releases/download/v2.45.1/dex-2.45.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/dex"]

[ports]
expose = [5556, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/dexidp/dex"
"org.opencontainers.image.title" = "dex"
"org.opencontainers.image.vendor" = "DexIDP"
"org.opencontainers.image.version" = "2.45.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "identity"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

