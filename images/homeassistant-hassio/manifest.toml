[metadata]
tier = "standard"
name = "homeassistant-hassio"
version = "unknown"
description = "homeassistant-hassio container image"
deprecated = true
upstream_note = "Hass.io is not a standalone pip package. It is part of the Home Assistant Supervisor container distribution."

[build]
base = "debian:bookworm-slim"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python", "-m", "homeassistant"]
cmd = ["--help"]

[ports]
expose = [9101]
