[metadata]
name = "pulsar"
version = "3.3.0"
description = "pulsar container image"

[build]
base = "scratch"
user = "pulsar"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "apachepulsar/pulsar:${VERSION}"

[ports]
expose = [6650, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/apache/pulsar"
"org.opencontainers.image.title" = "pulsar"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "3.3.0"
"evergreen.base.image" = "rewrap"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.official" = "true"
"evergreen.health.type" = "none"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

