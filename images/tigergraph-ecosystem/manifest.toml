[metadata]
name = "tigergraph-ecosystem"
version = "3.10.0"
description = "Sovereign hardened TigerGraph Ecosystem - extracted from official Docker image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "docker.io/tigergraph/tigergraph:latest"

[runtime]
entrypoint = ["/opt/tigergraph/bin/gadmin", "start", "all"]

[ports]
expose = [14240, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened TigerGraph Ecosystem - extracted from official Docker image"
"org.opencontainers.image.title" = "tigergraph-ecosystem"
"org.opencontainers.image.vendor" = "TigerGraph"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.note" = "Extracted from docker.io/tigergraph/tigergraph:latest. CloudFront download URL is defunct."
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

