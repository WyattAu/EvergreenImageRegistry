[metadata]
name = "filestash"
version = "v0.4"
description = "filestash container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "mickaelkerjean/filestash:latest"

[runtime]
entrypoint = ["/filestash"]

[ports]
expose = [8334, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/mickael-kerjean/filestash"
"org.opencontainers.image.title" = "filestash"
"org.opencontainers.image.vendor" = "Filestash"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "10000ms"
"sovereign.image.category" = "cloud-storage"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

