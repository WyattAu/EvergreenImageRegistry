[metadata]
tier = "standard"
name = "bazarr"
version = "1.5.2"
description = "bazarr container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3", "/opt/bazarr/bazarr.py"]

[ports]
expose = [6767, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/morpheus65535/bazarr.git"
"org.opencontainers.image.title" = "bazarr"
"org.opencontainers.image.vendor" = "Bazarr"
"org.opencontainers.image.version" = "1.5.2"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
