[metadata]
tier = "standard"
name = "qbittorrent"
version = "4.6.5"
description = "qbittorrent container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "qbittorrent"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["qbittorrent-nox"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.title" = "qbittorrent"
"org.opencontainers.image.vendor" = "QBitTorrent"
"org.opencontainers.image.version" = "4.6.5"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
