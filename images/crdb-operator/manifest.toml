[metadata]
tier = "standard"
name = "crdb-operator"
version = "1.11.0"
description = "Evergreen hardened CockroachDB Operator - Kubernetes operator for CockroachDB"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "cockroachdb/cockroach-operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/cockroach-operator"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened CockroachDB Operator - Kubernetes operator for CockroachDB"
"org.opencontainers.image.title" = "crdb-operator"
"org.opencontainers.image.vendor" = "Cockroach Labs"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
