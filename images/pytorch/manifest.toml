[metadata]
tier = "standard"
name = "pytorch"
version = "2.6.0"
description = "pytorch container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/pytorch/pytorch"
"org.opencontainers.image.title" = "pytorch"
"org.opencontainers.image.vendor" = "PyTorch"
"org.opencontainers.image.version" = "2.6.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
