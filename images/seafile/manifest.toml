[metadata]
name = "seafile"
version = "11.0.14"
description = "seafile container image"

[build]
base = "debian:bookworm-slim"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python", "-m", "seafile"]
cmd = ["--help"]

[ports]
expose = [9101]

