[metadata]
name = "httpd"
version = "latest"
description = "httpd - Evergreen hardened image"
vendor = "Evergreen"
source = "https://github.com/httpd"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "binary-download"
url = "https://github.com/httpd"

[runtime]
entrypoint = []

[ports]
expose = [8080, 9101]
