[metadata]
name = "coredns-alpine"
version = "1.11.1"
description = "CoreDNS Alpine - lightweight DNS server based on Alpine"
vendor = "CNCF"
source = "https://github.com/coredns/coredns"
license = "Apache-2.0"
tier = "community"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/coredns-alpine/coredns-alpine/releases/download/v1.11.1/coredns-alpine-1.11.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/coredns"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.description" = "CoreDNS DNS server (alpine variant, built without Alpine)"
"org.opencontainers.image.source" = "https://github.com/coredns/coredns"
"org.opencontainers.image.title" = "coredns-alpine"
"org.opencontainers.image.vendor" = "CoreDNS"
"org.opencontainers.image.version" = "1.11.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

