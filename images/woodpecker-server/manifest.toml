[metadata]
name = "woodpecker-server"
version = "2.7.0"
description = "Woodpecker Server - CI/CD server for Woodpecker CI"
vendor = "Woodpecker CI"
source = "https://github.com/woodpecker-ci/woodpecker"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/woodpecker-ci/woodpecker/releases/download/v2.7.0/woodpecker-server_linux_amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/woodpecker-server"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.description" = "Woodpecker Server - CI/CD server for Woodpecker CI"
"org.opencontainers.image.source" = "https://github.com/woodpecker-ci/woodpecker"
"org.opencontainers.image.title" = "woodpecker-server"
"org.opencontainers.image.vendor" = "Woodpecker CI"
"org.opencontainers.image.version" = "2.7.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
