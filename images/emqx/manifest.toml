[metadata]
name = "emqx"
version = "5.8.0"
description = "EMQX - massively scalable MQTT message broker"
vendor = "EMQX"
source = "https://github.com/emqx/emqx"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/emqx/emqx/releases/download/v5.8.0/emqx-5.8.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/emqx/bin/emqx"]
cmd = ["foreground"]

[ports]
expose = [1883, 9101]

[labels]
"org.opencontainers.image.description" = "EMQX - High-performance MQTT broker"
"org.opencontainers.image.source" = "https://github.com/emqx/emqx"
"org.opencontainers.image.title" = "emqx"
"org.opencontainers.image.vendor" = "EMQ"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

