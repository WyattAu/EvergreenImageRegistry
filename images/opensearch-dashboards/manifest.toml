[metadata]
name = "opensearch-dashboards"
version = "2.14.0"
description = "opensearch-dashboards container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "opensearch-dashboards"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["opensearch-dashboards"]

[ports]
expose = [5601, 9101]

[labels]
"org.opencontainers.image.title" = "opensearch-dashboards"
"org.opencontainers.image.vendor" = "OpenSearch"
"org.opencontainers.image.version" = "2.14.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

