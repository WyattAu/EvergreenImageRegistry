[image]
name = "kaniko"
version = "1.24.0"
description = "Kaniko - build container images in Kubernetes without privileged access"
vendor = "Google"
homepage = "https://github.com/GoogleContainerTools/kaniko"
category = "devops"
tier = 3

[source]
type = "container-image"
url = "gcr.io/kaniko-project/executor:v1.24.0"
upstream = "https://github.com/GoogleContainerTools/kaniko"

[build]
base = "gcr.io/kaniko-project/executor:v1.24.0"
target_base = "cgr.dev/chainguard/wolfi-base:latest"

[constraints]
nonroot = true
base = "wolfi"

[hft]
signal-handling = "native"
shutdown-timeout = "10s"

[ports]
metrics = 9101

[health]
type = "exec"
