[metadata]
name = "akaunting"
version = "3.1.21-v"
description = "akaunting container image"
tier = "critical"
upstream_version = "3.1.21-v"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php-fpm"]

[ports]
expose = [80, 443, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/akaunting/akaunting"
"org.opencontainers.image.title" = "akaunting"
"org.opencontainers.image.vendor" = "Akaunting"
"org.opencontainers.image.version" = "3.1.21-v"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "business-finance"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
