# =============================================================================
# EVERGREEN BUILD PIPELINE - NIGHTLY FULL REBUILD
# =============================================================================
# Runs daily at 03:00 UTC. Builds ALL images, tier by tier:
#   1. Critical (signed, multi-arch, SBOM)
#   2. Standard (multi-arch, SBOM)
#   3. Community (amd64 only, SBOM)
#
# Each tier builds as a separate job so failures in lower tiers
# don't block higher tiers. Critical tier failure triggers a warning.
#
# Also supports manual dispatch with optional tier filter.
# =============================================================================

name: Nightly Full Rebuild

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Build only this tier (leave empty for all)'
        required: false
        type: choice
        options:
          - all
          - critical
          - standard
          - community
      sign:
        description: 'Sign images with Cosign'
        required: false
        type: string
        default: 'true'

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # DISCOVER - Build matrix for each tier
  # ---------------------------------------------------------------------------
  discover-critical:
    name: Discover Critical
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ !inputs.tier || inputs.tier == 'critical' || inputs.tier == 'all' }}
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      total: ${{ steps.discover.outputs.total }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: |
          chmod +x scripts/discover-images.sh
          scripts/discover-images.sh tier critical
        env:
          GITHUB_OUTPUT: $GITHUB_OUTPUT
        id: discover

  discover-standard:
    name: Discover Standard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ !inputs.tier || inputs.tier == 'standard' || inputs.tier == 'all' }}
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      total: ${{ steps.discover.outputs.total }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: |
          chmod +x scripts/discover-images.sh
          scripts/discover-images.sh tier standard
        env:
          GITHUB_OUTPUT: $GITHUB_OUTPUT
        id: discover

  discover-community:
    name: Discover Community
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ !inputs.tier || inputs.tier == 'community' || inputs.tier == 'all' }}
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      total: ${{ steps.discover.outputs.total }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: |
          chmod +x scripts/discover-images.sh
          scripts/discover-images.sh tier community
        env:
          GITHUB_OUTPUT: $GITHUB_OUTPUT
        id: discover

  # ---------------------------------------------------------------------------
  # LINT - Gate check (fast)
  # ---------------------------------------------------------------------------
  gates:
    name: CI Gate Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: |
          set +e  # Don't exit on grep failures in the gate check loop
          PASS=0; FAIL=0
          for dockerfile in images/*/Dockerfile; do
            name=$(basename $(dirname "$dockerfile"))
            # Skip non-image directories
            [[ "$name" == _* ]] && continue
            [ "$name" = "tests" ] || [ "$name" = "health-shim" ] && continue
            grep -q '^HEALTHCHECK' "$dockerfile" 2>/dev/null || { echo "FAIL: $name missing HEALTHCHECK"; FAIL=$((FAIL+1)); }
            for label in "evergreen.security.cap-drop" "evergreen.security.no-new-privileges" "evergreen.security.read-only-rootfs" "evergreen.security.seccomp"; do
              grep -q "$label" "$dockerfile" 2>/dev/null || { echo "FAIL: $name missing $label"; FAIL=$((FAIL+1)); }
            done
            PASS=$((PASS+1))
          done
          echo "Gates: ${PASS} checked, ${FAIL} failures"
          if [ "$FAIL" -gt 0 ]; then exit 1; fi

  # ---------------------------------------------------------------------------
  # PERF REGRESSION - Non-blocking performance regression gate
  # ---------------------------------------------------------------------------
  perf-regression:
    name: Performance Regression Check
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Benchmark critical image builds
        run: |
          mkdir -p .specs/06_5_regression
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          CRITICAL_IMAGES="nginx redis grafana"
          BUILD_TIMES="{}"
          for image in $CRITICAL_IMAGES; do
            echo "::group::Benchmark ${image}"
            START=$(date +%s%N)
            docker buildx build \
              --builder "$(docker buildx inspect --format '{{.Name}}' 2>/dev/null | head -1)" \
              --platform linux/amd64 \
              --load \
              -t "bench-${image}:latest" \
              "./images/${image}" 2>&1 || true
            END=$(date +%s%N)
            ELAPSED=$(( (END - START) / 1000000 ))
            echo "${image}: ${ELAPSED}ms"
            BUILD_TIMES=$(echo "$BUILD_TIMES" | jq --arg img "$image" --arg t "$ELAPSED" '. + {($img): ($t | tonumber)}')
            echo "::endgroup::"
          done
          echo "$BUILD_TIMES" | tee .specs/06_5_regression/build_times.json
      - name: Compare against baseline
        run: |
          BASELINE=".specs/06_5_regression/baseline.json"
          CURRENT=".specs/06_5_regression/build_times.json"
          if [ ! -f "$BASELINE" ]; then
            echo "::notice::No baseline found, saving current as baseline"
            cp "$CURRENT" "$BASELINE"
            exit 0
          fi
          echo "## Performance Regression Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Baseline (ms) | Current (ms) | Change |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------------|--------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          REGRESSED=0
          for key in $(jq -r 'keys[]' "$CURRENT"); do
            BASE=$(jq -r --arg k "$key" '.[$k] // 0' "$BASELINE")
            CUR=$(jq -r --arg k "$key" '.[$k] // 0' "$CURRENT")
            if [ "$BASE" -gt 0 ]; then
              CHANGE=$(echo "scale=1; (($CUR - $BASE) / $BASE) * 100" | bc)
              echo "| $key | $BASE | $CUR | ${CHANGE}% |" >> "$GITHUB_STEP_SUMMARY"
              OVER=$(echo "$CHANGE > 50" | bc -l)
              if [ "$OVER" = "1" ]; then
                echo "::warning::${key} regressed by ${CHANGE}% (threshold: 50%)"
                REGRESSED=$((REGRESSED+1))
              fi
            else
              echo "| $key | $BASE | $CUR | N/A |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          cp "$CURRENT" "$BASELINE"
          if [ "$REGRESSED" -gt 0 ]; then
            echo "::warning::${REGRESSED} image(s) exceeded 50% regression threshold (non-blocking)"
          fi

  # ---------------------------------------------------------------------------
  # BINARY TYPE CHECK - Non-blocking: verify scratch images are statically linked
  # ---------------------------------------------------------------------------
  binary-type-check:
    name: Binary Type Check
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Check binary types in scratch images
        run: |
          chmod +x scripts/check_binary_type.sh
          scripts/check_binary_type.sh

  # ---------------------------------------------------------------------------
  # BUILD CRITICAL - Highest priority, signed, multi-arch
  # ---------------------------------------------------------------------------
  build-critical:
    name: Build Critical
    needs: [discover-critical, gates]
    if: needs.discover-critical.result == 'success' && needs.discover-critical.outputs.total != '0'
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.discover-critical.outputs.matrix }}
      tag: ${{ github.sha }}
      push: true
      sign: ${{ inputs.sign == 'true' }}
      multiarch: true
      tier: critical
    secrets: inherit

  # ---------------------------------------------------------------------------
  # BUILD STANDARD - Multi-arch, unsigned
  # ---------------------------------------------------------------------------
  build-standard:
    name: Build Standard
    needs: [discover-standard, gates]
    if: needs.discover-standard.result == 'success' && needs.discover-standard.outputs.total != '0'
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.discover-standard.outputs.matrix }}
      tag: ${{ github.sha }}
      push: true
      sign: false
      multiarch: true
      tier: standard
    secrets: inherit

  # ---------------------------------------------------------------------------
  # BUILD COMMUNITY - amd64 only, unsigned
  # ---------------------------------------------------------------------------
  build-community:
    name: Build Community
    needs: [discover-community, gates]
    if: needs.discover-community.result == 'success' && needs.discover-community.outputs.total != '0'
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.discover-community.outputs.matrix }}
      tag: ${{ github.sha }}
      push: true
      sign: false
      multiarch: false
      tier: community
    secrets: inherit

  # ---------------------------------------------------------------------------
  # REPORT - Aggregate results
  # ---------------------------------------------------------------------------
  report:
    name: Nightly Report
    needs:
      [discover-critical, discover-standard, discover-community, build-critical, build-standard, build-community, gates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "# Nightly Build Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tier | Images | Build |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Gates** | - | ${{ needs.gates.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Critical** | ${{ needs.discover-critical.outputs.total || 0 }} | ${{ needs.build-critical.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Standard** | ${{ needs.discover-standard.outputs.total || 0 }} | ${{ needs.build-standard.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Community** | ${{ needs.discover-community.outputs.total || 0 }} | ${{ needs.build-community.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
