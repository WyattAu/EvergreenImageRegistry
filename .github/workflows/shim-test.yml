# =============================================================================
# SHIM FUNCTIONALITY TESTS
# =============================================================================
# Builds 3 sample images and validates shim health check + metrics endpoints.
# Triggers on push to main when images/ or crates/ change.
# =============================================================================

name: Shim Functionality Tests

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '../EvergreenShims/crates/**'
  pull_request:
    branches: [main]
    paths:
      - 'images/**'
      - '../EvergreenShims/crates/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io/wyattau/evergreenimageregistry

jobs:
  # ---------------------------------------------------------------------------
  # Build and test 3 sample images
  # ---------------------------------------------------------------------------
  shim-test:
    name: Shim Functionality Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nginx
            port: 80
          - image: redis
            port: 6379
          - image: grafana
            port: 3000

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ matrix.image }}:test \
            images/${{ matrix.image }}/

      - name: Start container
        run: |
          docker run -d \
            --name test-${{ matrix.image }} \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            -p 9101:9101 \
            ${{ env.REGISTRY }}/${{ matrix.image }}:test
          sleep 10

      - name: Verify container is running
        run: |
          docker ps --format '{{.Names}}' | grep -q "test-${{ matrix.image }}"
          echo "Container test-${{ matrix.image }} is running"

      - name: Test healthcheck
        run: |
          docker exec test-${{ matrix.image }} /shim healthcheck \
            --tcp 127.0.0.1:${{ matrix.port }} && echo "Healthcheck PASSED" || \
          docker exec test-${{ matrix.image }} /usr/local/bin/shim healthcheck \
            --tcp 127.0.0.1:${{ matrix.port }} && echo "Healthcheck PASSED"

      - name: Test metrics endpoint
        run: |
          RESPONSE=$(curl -sf http://localhost:9101/metrics 2>/dev/null || echo "")
          if [ -n "${RESPONSE}" ]; then
            echo "Metrics endpoint PASSED"
            echo "${RESPONSE}" | head -20
          else
            echo "Metrics endpoint FAILED"
            exit 1
          fi

      - name: Test liveness endpoint
        run: |
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:9101/livez 2>/dev/null || echo "000")
          if [ "${STATUS}" = "200" ]; then
            echo "Liveness endpoint PASSED (HTTP ${STATUS})"
          else
            echo "Liveness endpoint FAILED (HTTP ${STATUS})"
            exit 1
          fi

      - name: Collect logs on failure
        if: failure()
        run: docker logs test-${{ matrix.image }} 2>&1 | tail -50

      - name: Cleanup
        if: always()
        run: docker rm -f test-${{ matrix.image }} 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Aggregate result
  # ---------------------------------------------------------------------------
  all-pass:
    name: All Shim Tests Passed
    needs: shim-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.shim-test.result }}" = "success" ]; then
            echo "All shim functionality tests passed"
          else
            echo "Some shim tests failed"
            exit 1
          fi
