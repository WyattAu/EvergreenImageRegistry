[metadata]
name = "restic"
version = "0.18.1"
description = "Restic - fast, secure, efficient backup program"
vendor = "restic"
license = "BSD-2-Clause"
tier = "critical"
source = "https://github.com/restic/restic"
upstream_version = "0.17.3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/restic/restic/releases/download/v0.17.3/restic_0.17.3_linux_amd64.bz2"

[runtime]
entrypoint = ["/restic"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/restic/restic"
"org.opencontainers.image.title" = "restic"
"org.opencontainers.image.vendor" = "restic"
"org.opencontainers.image.version" = "0.17.3"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "backup"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
