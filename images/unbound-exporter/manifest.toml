[metadata]
tier = "standard"
name = "unbound-exporter"
version = "0.6.0"
description = "unbound-exporter container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/unbound_exporter"]

[ports]
expose = [9167, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/letsencrypt/unbound_exporter"
"org.opencontainers.image.title" = "unbound-exporter"
"org.opencontainers.image.vendor" = "Let's Encrypt"
"org.opencontainers.image.version" = "0.6.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
