[metadata]
name = "drone"
version = "2.28.1"
description = "Drone - cloud-native continuous integration and delivery platform"
vendor = "Harness"
source = "https://github.com/harness/drone"
license = "Apache-2.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/drone/drone/releases/download/v2.28.1/drone-2.28.1-linux-amd64.tar.gz"
binary_name = "drone"
filename = "drone-2.28.1-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 80
metrics = 9101

[labels]
"org.opencontainers.image.title" = "drone"
"org.opencontainers.image.description" = "Drone - cloud-native continuous integration and delivery platform"
"org.opencontainers.image.version" = "2.28.1"
"org.opencontainers.image.vendor" = "Harness"
"org.opencontainers.image.source" = "https://github.com/harness/drone"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
