[metadata]
tier = "standard"
name = "pip-audit"
version = "unknown"
description = "pip audit - Python dependency security scanner"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["pip-audit"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "pip audit - Python dependency security scanner"
"org.opencontainers.image.title" = "pip-audit"
"org.opencontainers.image.vendor" = "pypa"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

