[metadata]
name = "airbyte"
version = "0.65.22"
description = "Evergreen hardened airbyte - ELT platform"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["java", "-jar", "/app/airbyte.jar"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened airbyte - ELT platform"
"org.opencontainers.image.title" = "airbyte"
"org.opencontainers.image.vendor" = "Airbyte"
"org.opencontainers.image.version" = "0.65.22"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "30s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

