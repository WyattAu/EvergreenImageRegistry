[metadata]
name = "dendrite-pot"
version = "0.13.1"
description = "Dendrite POT - Polylith OUTBOX Trusted worker for Dendrite"
vendor = "Element"
source = "https://github.com/element-hq/dendrite"
tier = "2"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/element-hq/dendrite/releases/download/v0.13.1/dendrite-monolith-linux-amd64"

[runtime]
entrypoint = ["/usr/local/bin/dendrite"]
cmd = ["--config=/app/dendrite.yaml"]

[ports]
expose = [8008, 9101]

[labels]
"org.opencontainers.image.description" = "Dendrite POT - Polylith OUTBOX Trusted worker for Dendrite"
"org.opencontainers.image.source" = "https://github.com/element-hq/dendrite"
"org.opencontainers.image.title" = "dendrite-pot"
"org.opencontainers.image.vendor" = "Element"
"org.opencontainers.image.version" = "0.13.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

