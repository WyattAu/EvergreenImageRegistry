[metadata]
tier = "standard"
name = "cockpit"
version = "unknown"
description = "Cockpit - Web-based server management"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/cockpitproject/cockpit"
[runtime]
entrypoint = ["cockpit-ws"]
cmd = ["--port", "9090"]

[ports]
expose = [9090, 9101]

[labels]
"org.opencontainers.image.description" = "Cockpit - Web-based server management"
"org.opencontainers.image.title" = "cockpit"
"org.opencontainers.image.vendor" = "Red Hat"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
