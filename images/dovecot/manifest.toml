[metadata]
name = "dovecot"
version = "2.3.21"
description = "dovecot container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["dovecot"]
cmd = ["-F"]

[ports]
expose = [143, 9101]

[labels]
"sovereign.base.image" = "wolfi"
"sovereign.health.type" = "exec"
"sovereign.metrics.native" = "ztunnel"

