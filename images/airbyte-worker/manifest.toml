[metadata]
name = "airbyte-worker"
version = "0.65.22"
description = "Sovereign hardened airbyte-worker - Airbyte worker process"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["java", "-jar", "/app/worker.jar"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened airbyte-worker - Airbyte worker process"
"org.opencontainers.image.title" = "airbyte-worker"
"org.opencontainers.image.vendor" = "Airbyte"
"org.opencontainers.image.version" = "0.65.22"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "30s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

