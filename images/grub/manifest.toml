[metadata]
tier = "standard"
name = "grub"
version = "unknown"
description = "Meta directory for GRUB bootloader configuration. Not a runnable container."

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "base-image"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Meta directory for GRUB bootloader configuration. Not a runnable container."
"org.opencontainers.image.title" = "grub"
"evergreen.base.image" = "scratch"
"evergreen.health.type" = "none"
"evergreen.image.category" = "meta"
"evergreen.image.note" = "Bootloader config directory, not a container image."
"evergreen.image.status" = "reference"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
