[metadata]
tier = "standard"
name = "kafka-manager"
version = "3.0.0.5"
description = "Evergreen hardened CMAK (Kafka Manager) - Apache Kafka management tool"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "hlebalbau/kafka-manager:${VERSION}"

[runtime]
entrypoint = ["/opt/cmak/bin/cmak"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened CMAK (Kafka Manager) - Apache Kafka management tool"
"org.opencontainers.image.title" = "kafka-manager"
"org.opencontainers.image.vendor" = "Yahoo"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "15s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "messaging"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
