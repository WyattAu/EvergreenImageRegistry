name: Provenance Verification
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Run evergreenctl verify-all
        run: |
          cd evergreenctl && cargo build --release && \
          ./target/release/evergreenctl verify-all images/
      - name: Verify SLSA provenance for sample images
        run: |
          SAMPLE_IMAGES=$(ls images/ | head -5 | tr '\n' ' ')
          CERT_IDENTITY="${{ github.repository_owner }}"
          for img in $SAMPLE_IMAGES; do
            FULL_REF="ghcr.io/${{ github.repository }}/$img:latest"
            echo "Verifying provenance for $FULL_REF..."
            cosign verify-attestation --type slsaprovenance \
              --certificate-identity "${CERT_IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$FULL_REF" 2>&1 || echo "WARNING: Could not verify $img (image may not be published yet)" >&2
          done
