name: SBOM Attestation
on:
  workflow_run:
    workflows: ['Build Hardened Images']
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download image references
        uses: actions/download-artifact@v4
        with:
          name: built-image-references
          path: /tmp/references/
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true
      - name: Attest SBOMs
        run: |
          if [ ! -f /tmp/references/images.txt ]; then
            echo "No image references found, skipping attestation"
            exit 0
          fi
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            echo "Attesting SBOM for ${ref}..."
            cosign attest --yes \
              --predicate sbom.spdx.json \
              --type spdxjson \
              "${ref}" 2>&1 || echo "WARN: SBOM attestation failed for ${ref}"
          done < /tmp/references/images.txt
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
