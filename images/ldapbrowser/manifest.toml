[metadata]
tier = "standard"
name = "ldapbrowser"
version = "latest"
description = "ldapbrowser container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/ltiam/apachedirectorystudio:${VERSION}"

[runtime]
entrypoint = ["/opt/ApacheDirectoryStudio/ApacheDirectoryStudio"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/ltiam/APacheDirectoryStudio"
"org.opencontainers.image.title" = "ldapbrowser"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "2.0.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "15000ms"
"evergreen.image.category" = "identity"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

