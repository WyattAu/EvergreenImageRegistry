[metadata]
name = "kafka-ui"
version = "0.7.2"
description = "Kafka UI - open source web UI for Apache Kafka"
vendor = "Kafka UI"
source = "https://github.com/provectus/kafka-ui"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/kafka-ui/kafka-ui/releases/download/v0.7.2/kafka-ui-0.7.2-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/kafka-ui/kafka-ui"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Kafka UI - web-based Kafka management interface"
"org.opencontainers.image.title" = "kafka-ui"
"org.opencontainers.image.vendor" = "Provectus"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "messaging"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

