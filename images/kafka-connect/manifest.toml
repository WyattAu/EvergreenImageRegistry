[metadata]
name = "kafka-connect"
version = "3.6.1"
description = "Kafka Connect - scalable and reliable data streaming integration"
vendor = "Apache"
source = "https://github.com/apache/kafka"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/kafka-connect/kafka-connect/releases/download/v3.6.1/kafka-connect-3.6.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/kafka/bin/connect-distributed.sh"]

[ports]
expose = [8083, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Kafka Connect - distributed data integration platform"
"org.opencontainers.image.title" = "kafka-connect"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "15s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "30000ms"
"sovereign.image.category" = "messaging"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

