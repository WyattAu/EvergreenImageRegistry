[metadata]
name = "hledger"
version = "1.52"
description = "hledger container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/hledger"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/simonmichael/hledger"
"org.opencontainers.image.title" = "hledger"
"org.opencontainers.image.vendor" = "hledger"
"org.opencontainers.image.version" = "1.52"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "5000ms"
"sovereign.image.category" = "business-finance"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

