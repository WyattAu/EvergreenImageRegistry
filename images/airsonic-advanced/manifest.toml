[metadata]
tier = "standard"
name = "airsonic-advanced"
version = "10.6.0"
description = "airsonic-advanced container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["java", "-jar", "/app/airsonic-advanced-11.1.5.war"]

[ports]
expose = [4040, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/airsonic-advanced/airsonic-advanced/releases"
"org.opencontainers.image.title" = "airsonic-advanced"
"org.opencontainers.image.vendor" = "Airsonic-Advanced"
"org.opencontainers.image.version" = "11.1.5"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
