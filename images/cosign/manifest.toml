[metadata]
name = "cosign"
version = "3.0.6"
description = "Cosign - container signing and verification tool"
vendor = "Sigstore"
source = "https://github.com/sigstore/cosign"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/sigstore/cosign/releases/download/v3.0.6/cosign-linux-amd64"

[runtime]
entrypoint = ["/cosign"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/sigstore/cosign"
"org.opencontainers.image.title" = "cosign"
"org.opencontainers.image.vendor" = "sigstore"
"org.opencontainers.image.version" = "3.0.6"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "security"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
