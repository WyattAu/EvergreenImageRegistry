[metadata]
name = "kibana"
version = "8.12.2"
description = "Kibana - data visualization dashboard for Elasticsearch"
vendor = "Elastic"
source = "https://github.com/elastic/kibana"
license = "Elastic-2.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/kibana/kibana/releases/download/v8.12.2/kibana-8.12.2-linux-amd64.tar.gz"
binary_name = "kibana"
filename = "kibana-8.12.2-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 5601
metrics = 9101

[labels]
"org.opencontainers.image.title" = "kibana"
"org.opencontainers.image.description" = "Kibana - data visualization dashboard for Elasticsearch"
"org.opencontainers.image.version" = "8.12.2"
"org.opencontainers.image.vendor" = "Elastic"
"org.opencontainers.image.source" = "https://github.com/elastic/kibana"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "15s"
