[metadata]
name = "rclone"
version = "v1.69.1"
description = "rclone container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/rclone"]

[ports]
expose = [5572, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/rclone/rclone"
"org.opencontainers.image.title" = "rclone"
"org.opencontainers.image.vendor" = "Rclone"
"org.opencontainers.image.version" = "v1.69.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "10000ms"
"sovereign.image.category" = "cloud-storage"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

