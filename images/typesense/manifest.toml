[metadata]
name = "typesense"
version = "30.2"
description = "Fast, typo-tolerant search engine"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "typesense/typesense:30.2"

[runtime]
entrypoint = ["/typesense-server"]

[ports]
expose = [8108, 9101]

[labels]
"org.opencontainers.image.description" = "Fast, typo-tolerant search engine"
"org.opencontainers.image.source" = "https://github.com/typesense/typesense"
"org.opencontainers.image.title" = "typesense"
"org.opencontainers.image.vendor" = "Typesense"
"org.opencontainers.image.version" = "30.2"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "5000ms"
"sovereign.image.category" = "search"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

