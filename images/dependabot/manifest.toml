[image]
name = "dependabot"
version = "0.275.1"
description = "GitHub Dependabot - automated dependency updates for your codebase"
vendor = "GitHub"
homepage = "https://github.com/github/dependabot-cli"
category = "devops"
tier = 3

[source]
type = "container-image"
url = "ghcr.io/github/dependabot-updater-internal:latest"
upstream = "https://github.com/dependabot/dependabot-core"

[build]
base = "ghcr.io/github/dependabot-updater-internal:latest"
target_base = "cgr.dev/chainguard/wolfi-base:latest"

[constraints]
nonroot = true
base = "wolfi"

[hft]
signal-handling = "native"
shutdown-timeout = "10s"

[ports]
metrics = 9101

[health]
type = "exec"
