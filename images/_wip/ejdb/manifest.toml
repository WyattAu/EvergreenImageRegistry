[metadata]
name = "ejdb"
version = "2.2.3"
description = "Evergreen hardened EJDB - embedded JSON database engine"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/ejdb/bin/ejdb"]

[ports]
expose = [9191, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened EJDB - embedded JSON database engine"
"org.opencontainers.image.title" = "ejdb"
"org.opencontainers.image.vendor" = "Softmotions"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

