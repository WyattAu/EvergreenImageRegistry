[metadata]
name = "singer"
version = "0.1.0"
description = "singer container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/singer-io/singer-python"
"org.opencontainers.image.title" = "singer"
"org.opencontainers.image.vendor" = "Singer"
"org.opencontainers.image.version" = "0.1.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

