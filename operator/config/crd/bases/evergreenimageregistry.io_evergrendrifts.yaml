apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: evergrendrifts.evergreenimageregistry.io
spec:
  group: evergreenimageregistry.io
  names:
    kind: EvergreenDrift
    listKind: EvergreenDriftList
    plural: evergrendrifts
    singular: evergrendrift
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.scope
      name: Scope
      type: string
    - jsonPath: .spec.intervalMinutes
      name: Interval
      type: integer
    - jsonPath: .status.driftDetected
      name: Drifts
      type: integer
    - jsonPath: .status.lastCheck
      name: Last Check
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: EvergreenDrift is the Schema for the evergrendrifts API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: EvergreenDriftSpec defines the desired state of EvergreenDrift
            properties:
              alerting:
                description: Alerting configuration
                properties:
                  pagerduty:
                    type: boolean
                  slack:
                    type: string
                  webhook:
                    type: string
                type: object
              autoRollback:
                default: false
                description: Auto-rollback on drift detection
                type: boolean
              intervalMinutes:
                default: 60
                description: Check interval in minutes
                minimum: 5
                type: integer
              scope:
                default: namespace
                description: Scope: namespace or cluster
                enum:
                - namespace
                - cluster
                type: string
              thresholds:
                description: Drift thresholds by tier
                properties:
                  critical:
                    default: 0
                    description: Hours before alerting on Tier 1 drift
                    type: integer
                  standard:
                    default: 3
                    description: Hours before alerting on Tier 2 drift
                    type: integer
                type: object
            type: object
          status:
            description: EvergreenDriftStatus defines the observed state of EvergreenDrift
            properties:
              alerts:
                description: Alert messages
                items:
                  type: string
                type: array
              conditions:
                description: Conditions
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this resource."
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 256
                      minimum: 1
                      type: string
                    status:
                      type: string
                    type:
                      maxLength: 317
                      minimum: 1
                      pattern: ^[a-z]([a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              driftDetected:
                description: Number of drifts detected
                type: integer
              lastCheck:
                description: Last check timestamp
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
