[metadata]
name = "coredns-alpine"
version = "1.11.1"
description = "CoreDNS Alpine - lightweight DNS server based on Alpine"
vendor = "CNCF"
source = "https://github.com/coredns/coredns"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/coredns-alpine/coredns-alpine/releases/download/v1.11.1/coredns-alpine-1.11.1-linux-amd64.tar.gz"
binary_name = "coredns-alpine"
filename = "coredns-alpine-1.11.1-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 53
metrics = 9101

[labels]
"org.opencontainers.image.title" = "coredns-alpine"
"org.opencontainers.image.description" = "CoreDNS Alpine - lightweight DNS server based on Alpine"
"org.opencontainers.image.version" = "1.11.1"
"org.opencontainers.image.vendor" = "CNCF"
"org.opencontainers.image.source" = "https://github.com/coredns/coredns"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
