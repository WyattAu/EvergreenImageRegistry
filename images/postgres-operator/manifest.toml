[metadata]
name = "postgres-operator"
version = "1.12.0"
description = "Postgres Operator - manages PostgreSQL clusters on Kubernetes"
vendor = "Zalando"
source = "https://github.com/zalando/postgres-operator"
license = "Apache-2.0"
tier = "community"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "registry.opensource.zalan.do/acid/postgres-operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/postgres-operator"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Zalando PostgreSQL Operator for Kubernetes"
"org.opencontainers.image.source" = "https://github.com/zalando/postgres-operator"
"org.opencontainers.image.title" = "postgres-operator"
"org.opencontainers.image.vendor" = "Zalando"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

