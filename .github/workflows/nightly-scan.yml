# =============================================================================
# EVERGREEN HARDENED IMAGE REGISTRY - NIGHTLY SECURITY & FRESHNESS SCAN
# =============================================================================
# Scheduled pipeline for nightly security and freshness monitoring.
# Complements daily-security-scan.yml with additional checks:
#   - Base image freshness verification
#   - Evergreen checksum verification
#   - Wolfi base image digest tracking
#
# Schedule: Daily at 03:00 UTC (before daily-security-scan at 06:00 UTC)
# Manual:   workflow_dispatch for on-demand execution
# =============================================================================

name: Nightly Security & Freshness Scan

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

jobs:
  version-check:
    name: Version & CVE Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install evergreenctl
        run: |
          cd evergreenctl && cargo build --release && sudo ln -sf $(pwd)/target/release/evergreenctl /usr/local/bin/

      - name: Check for outdated images
        run: |
          echo "=== Checking for outdated images ==="
          evergreenctl outdated --all
          echo "=== Version freshness check complete ==="

      - name: Check for new CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  checksum-freshness:
    name: Evergreen Checksum Verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install evergreenctl
        run: |
          cd evergreenctl && cargo build --release && sudo ln -sf $(pwd)/target/release/evergreenctl /usr/local/bin/

      - name: Verify all checksums
        run: |
          echo "=== Evergreen Checksum Verification ==="
          evergreenctl verify-all || true
          echo "=== Checksum verification complete ==="

  base-image-refresh:
    name: Base Image Digest Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check wolfi base image digest
        run: |
          echo "Checking current wolfi base image digest..."
          DIGEST=$(skopeo inspect docker://cgr.dev/chainguard/wolfi-base:latest --format '{{.Digest}}' 2>/dev/null || echo "skopeo not available")
          echo "Current wolfi-base digest: ${DIGEST}"
          echo "To auto-refresh: update FROM lines in affected Dockerfiles"

  sbom-generation:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
          jq --version

      - name: Make scripts executable
        run: chmod +x scripts/generate_sbom.sh scripts/generate_all_sboms.sh

      - name: Generate SBOMs for changed images
        run: SKIP_UNCHANGED=true scripts/generate_all_sboms.sh
        continue-on-error: true

      - name: Count generated SBOMs
        run: |
          COUNT=$(find images -name 'sbom.spdx.json' | wc -l)
          echo "Total SBOMs: ${COUNT}"

      - name: Commit SBOM changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/*/sbom.spdx.json
          CHANGES=$(git diff --cached --stat)
          if [ -n "${CHANGES}" ]; then
            git commit -m "chore: regenerate SBOMs for changed images

            Automated incremental SBOM generation via nightly-scan workflow.
            Only images with changed Dockerfiles/manifests were regenerated.

            ${CHANGES}"
            git push
          else
            echo "No SBOM changes to commit"
          fi

  sbom-drift-detection:
    name: SBOM Drift Detection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: sbom-generation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Run SBOM drift detection
        run: |
          echo "=== SBOM Drift Detection ==="
          python3 scripts/sbom_drift_detect.py --threshold 0 --json > sbom-drift-report.json || true
          python3 scripts/sbom_drift_detect.py --threshold 0 || DRIFT_EXIT=$?
          echo "=== SBOM drift detection complete ==="

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-drift-report
          path: sbom-drift-report.json
          retention-days: 30
