[metadata]
name = "homeassistant"
version = "2024.4.2"
description = "Home Assistant - open source home automation platform"
vendor = "Home Assistant"
source = "https://github.com/home-assistant/core"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "homeassistant"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/homeassistant/homeassistant/releases/download/v2024.4.2/homeassistant-2024.4.2-linux-amd64.tar.gz"

[runtime]
entrypoint = ["python"]

[ports]
expose = [8123, 9101]

[labels]
"org.opencontainers.image.title" = "homeassistant"
"org.opencontainers.image.vendor" = "Home Assistant"
"org.opencontainers.image.version" = "2024.4.2"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

