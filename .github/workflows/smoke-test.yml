name: Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/smoke_test.sh'
  pull_request:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/smoke_test.sh'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [critical]
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh --tier ${{ matrix.tier }}
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-results-${{ matrix.tier }}
          path: smoke-test-results/
          retention-days: 7

  static-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Validate all Dockerfiles
        run: |
          echo "Validating all Dockerfiles..."
          PASS=0
          FAIL=0
          
          for df in images/*/Dockerfile; do
            [[ -f "$df" ]] || continue
            [[ "$df" == *"_wip"* || "$df" == *"_archive"* ]] && continue
            
            name=$(basename "$(dirname "$df")")
            content=$(cat "$df")
            errors=""
            
            # Check FROM
            if ! echo "$content" | grep -q "^FROM "; then
              errors="$errors No FROM"
            fi
            
            # Check USER — CC003 scope is the critical tier only; root-start
            # and inherited-nonroot images are exempt via
            # scripts/effective-user-exceptions.json (audit:
            # .docs/eir-non-root-audit.md in SIS).
            tier=$(grep -m1 '^tier' "$(dirname "$df")/manifest.toml" 2>/dev/null | sed 's/.*= *"\([^"]*\)".*/\1/')
            if [ "$tier" = "critical" ] && ! echo "$content" | grep -q "USER 65532\|USER 65534\|USER nobody"; then
              if ! grep -qE "\"$name\"" scripts/effective-user-exceptions.json; then
                errors="$errors No USER"
              fi
            fi
            
            # Check HEALTHCHECK (skip scratch)
            if ! echo "$content" | grep -q "FROM scratch" && ! echo "$content" | grep -q "HEALTHCHECK"; then
              errors="$errors No HEALTHCHECK"
            fi
            
            # Check ENTRYPOINT/CMD
            if ! echo "$content" | grep -q "ENTRYPOINT\|CMD "; then
              errors="$errors No ENTRYPOINT/CMD"
            fi
            
            if [[ -n "$errors" ]]; then
              echo "FAIL: $name -$errors"
              FAIL=$((FAIL + 1))
            else
              PASS=$((PASS + 1))
            fi
          done
          
          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          
          if [[ $FAIL -gt 0 ]]; then
            exit 1
          fi

  constraint-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (defaults, matches repo-wide pin)
      
      - name: Run constraint validation
        run: |
          cargo run --manifest-path evergreenctl/Cargo.toml -- validate images
      
      - name: Verify critical-image contract (CC001-CC012)
        run: |
          # Single source of truth: scripts/critical_image_governance.py
          # (evidence-backed CC003 via effective-user-exceptions.json).
          # Replaces four divergent text-grep implementations that kept
          # this job permanently red — the last one is retired here.
          python3 scripts/critical_image_governance.py

      - name: Validate wolfi variants
        run: |
          echo "Validating all wolfi variants..."
          PASS=0
          FAIL=0
          
          for df in images/*/Dockerfile.wolfi; do
            [[ -f "$df" ]] || continue
            name=$(basename "$(dirname "$df")")
            content=$(cat "$df")
            errors=""
            
            if ! echo "$content" | grep -q "^FROM "; then
              errors="$errors No FROM"
            fi
            tier=$(grep -m1 '^tier' "$(dirname "$df")/manifest.toml" 2>/dev/null | sed 's/.*= *"\([^"]*\)".*/\1/')
            if [ "$tier" = "critical" ] && ! echo "$content" | grep -q "USER 65532\|USER 65534\|USER nobody"; then
              if ! grep -qE "\"$name\"" scripts/effective-user-exceptions.json; then
                errors="$errors No USER"
              fi
            fi
            if ! echo "$content" | grep -q "HEALTHCHECK"; then
              errors="$errors No HEALTHCHECK"
            fi
            if ! echo "$content" | grep -q "ENTRYPOINT\|CMD "; then
              errors="$errors No ENTRYPOINT/CMD"
            fi
            
            if [[ -n "$errors" ]]; then
              echo "FAIL: $name -$errors"
              FAIL=$((FAIL + 1))
            else
              PASS=$((PASS + 1))
            fi
          done
          
          echo "Wolfi variants: $PASS passed, $FAIL failed"
          if [[ $FAIL -gt 0 ]]; then
            exit 1
          fi
