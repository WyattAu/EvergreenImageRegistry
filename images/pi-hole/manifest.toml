[metadata]
name = "pi-hole"
version = "5.18.2"
description = "Pi-hole - network-level ad blocking via your own Linux hardware"
vendor = "Pi-hole"
source = "https://github.com/pi-hole/pi-hole"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/pi-hole/pi-hole/releases/download/v5.18.2/pi-hole-5.18.2-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/pihole"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.description" = "Network-level ad blocking via DNS"
"org.opencontainers.image.source" = "https://github.com/pi-hole/pi-hole"
"org.opencontainers.image.title" = "pi-hole"
"org.opencontainers.image.vendor" = "Pi-hole"
"org.opencontainers.image.version" = "bookworm"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "15000ms"
"evergreen.image.category" = "dns"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
