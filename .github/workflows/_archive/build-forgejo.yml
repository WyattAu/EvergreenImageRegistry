name: Build forgejo (melange/apko)
on:
  push:
    paths:
      - images/forgejo/**
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'forgejo version (e.g. 15.0.2)'
        required: false

permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: forgejo
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner /forgejo

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest 
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || $(grep 'version:' images/forgejo/melange.yaml | head -1 | sed 's/.*version: //') "
          echo "version=${VERSION" >> "$GITHUB_OUTPUT"

      - name: Build APK package with melange
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace :/work" \
            -w /work \
            cgr.dev/chainguard/melange build \
            images/forgejo/melange.yaml \
            --arch x86_64 --arch aarch64 \
            --out-dir /work/packages \
            --sbom-path /work/sbom

      - name: Build OCI image with apko
        run: |
          docker run --rm \
            -v "${{ github.workspace :/work" \
            -w /work \
            cgr.dev/chainguard/apko build \
            images/forgejo/apko.yaml \
            "ghcr.io/${{ github.repository_owner /forgejo:${{ steps.version.outputs.version " \
            forgejo-image.tar \
            --repository-append /work/packages \
            --sbom-path /work/sbom

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN " | docker login ghcr.io -u "${{ github.actor " --password-stdin

      - name: Load and push image
        id: push
        run: |
          docker load -i forgejo-image.tar
          FULL_TAG="ghcr.io/${{ github.repository_owner /forgejo:${{ steps.version.outputs.version "
          docker tag "ghcr.io/${{ github.repository_owner /forgejo:${{ steps.version.outputs.version " "$FULL_TAG"
          docker push "$FULL_TAG"

          docker tag "$FULL_TAG" "ghcr.io/${{ github.repository_owner /forgejo:latest"
          docker push "ghcr.io/${{ github.repository_owner /forgejo:latest"

          DIGEST=$(docker inspect --format '{{index .RepoDigests 0' "$FULL_TAG")
          echo "digest=${DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed: $FULL_TAG ($DIGEST)"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign version tag
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner /forgejo:${{ steps.version.outputs.version "

      - name: Sign latest tag
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner /forgejo:latest"

      - name: Upload melange SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-forgejo
          path: sbom/
          retention-days: 90

  provenance:
    needs: build
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner /forgejo
      digest: ${{ needs.build.outputs.digest 
    permissions:
      id-token: write
      contents: read
      packages: write
