[metadata]
name = "dotdns"
version = "0.1.0"
description = "DotDNS - DNS-over-TLS proxy server (stub - upstream repo not found)"
vendor = "nicich"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/dotdns"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened DotDNS - DNS-over-TLS proxy server"
"org.opencontainers.image.title" = "dotdns"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.category" = "dns"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

