[metadata]
tier = "standard"
name = "janusgraph"
version = "1.0.0"
description = "Evergreen hardened JanusGraph - distributed graph database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/janusgraph/bin/gremlin.sh"]

[ports]
expose = [8182, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened JanusGraph - distributed graph database"
"org.opencontainers.image.title" = "janusgraph"
"org.opencontainers.image.vendor" = "JanusGraph"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
