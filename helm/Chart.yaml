# =============================================================================
# Evergreen Image Registry — Helm Chart Library
# =============================================================================
# Reusable Helm chart templates for deploying EIR hardened images
# to Kubernetes with security best practices baked in.
#
# Usage:
#   helm install redis ./helm --set image.name=redis --set image.tag=latest
#   helm install postgres ./helm --set image.name=postgresql --set tier=critical
# =============================================================================

