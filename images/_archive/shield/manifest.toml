[metadata]
tier = "standard"
name = "shield"
version = "8.6.0"
description = "shield container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/shield"]
cmd = ["server", "-c", "/app/shield.yml"]

[ports]
expose = [8443, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/starkandwayne/shield"
"org.opencontainers.image.title" = "shield"
"org.opencontainers.image.vendor" = "Stark & Wayne"
"org.opencontainers.image.version" = "8.6.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "security"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
