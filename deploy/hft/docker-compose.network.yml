version: "3.9"

services:
  nginx:
    image: sovereign-registry.local/nginx:latest
    container_name: nginx-hft
    restart: unless-stopped
    cpuset: "0-1"
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /var/run:noexec,nosuid,size=8m
      - /var/cache/nginx:noexec,nosuid,size=64m
    stop_grace_period: 3s
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SOVEREIGN_SHUTDOWN_TIMEOUT=3
    networks:
      - hft-frontend

  envoy:
    image: sovereign-registry.local/envoy:latest
    container_name: envoy-hft
    restart: unless-stopped
    cpuset: "2-3"
    mem_limit: 1g
    memswap_limit: 1g
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /var/run:noexec,nosuid,size=8m
    stop_grace_period: 3s
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9900:9900"
    environment:
      - SOVEREIGN_SHUTDOWN_TIMEOUT=3
    networks:
      - hft-frontend
      - hft-backend

  traefik:
    image: sovereign-registry.local/traefik:latest
    container_name: traefik-hft
    restart: unless-stopped
    cpuset: "4-5"
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    stop_grace_period: 3s
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    ports:
      - "9080:80"
      - "9443:443"
      - "9090:8080"
    environment:
      - SOVEREIGN_SHUTDOWN_TIMEOUT=3
    networks:
      - hft-frontend
      - hft-backend

  haproxy:
    image: sovereign-registry.local/haproxy:latest
    container_name: haproxy-hft
    restart: unless-stopped
    cpuset: "6-7"
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /var/run:noexec,nosuid,size=8m
    stop_grace_period: 3s
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    ports:
      - "10080:80"
      - "10443:443"
    environment:
      - SOVEREIGN_SHUTDOWN_TIMEOUT=3
    networks:
      - hft-frontend
      - hft-backend

  caddy:
    image: sovereign-registry.local/caddy:latest
    container_name: caddy-hft
    restart: unless-stopped
    cpuset: "8-9"
    mem_limit: 256m
    memswap_limit: 256m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /var/run:noexec,nosuid,size=8m
    stop_grace_period: 3s
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    ports:
      - "11080:80"
      - "11443:443"
      - "12019:2019"
    environment:
      - SOVEREIGN_SHUTDOWN_TIMEOUT=3
    networks:
      - hft-frontend
      - hft-backend

networks:
  hft-frontend:
    driver: bridge
    internal: false
  hft-backend:
    driver: bridge
    internal: true
