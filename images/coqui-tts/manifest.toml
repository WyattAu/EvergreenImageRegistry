[metadata]
name = "coqui-tts"
version = "0.22.0"
description = "coqui-tts container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [5002, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/coqui-ai/TTS"
"org.opencontainers.image.title" = "coqui-tts"
"org.opencontainers.image.vendor" = "Coqui"
"org.opencontainers.image.version" = "0.22.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

