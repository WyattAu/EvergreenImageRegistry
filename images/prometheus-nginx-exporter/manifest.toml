[metadata]
name = "prometheus-nginx-exporter"
version = "1.1.0"
description = "Nginx Prometheus Exporter - metrics exporter for Nginx"
vendor = "Prometheus"
source = "https://github.com/nginxinc/nginx-prometheus-exporter"
license = "Apache-2.0"
tier = "2"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/prometheus-nginx-exporter/prometheus-nginx-exporter/releases/download/v1.1.0/prometheus-nginx-exporter-1.1.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/nginx-prometheus-exporter"]

[ports]
expose = [9113, 9101]

[labels]
"org.opencontainers.image.description" = "Prometheus exporter for NGINX stub_status metrics"
"org.opencontainers.image.title" = "prometheus-nginx-exporter"
"org.opencontainers.image.vendor" = "NGINX Inc"
"org.opencontainers.image.version" = "1.1.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.connection-drain" = "true"
"sovereign.hft.cpu-pins" = "4-5"
"sovereign.hft.cpu-pins-mode" = "exclusive"
"sovereign.hft.deploy-strategy" = "hft-stateful"
"sovereign.hft.init-system" = "none"
"sovereign.hft.pre-stop-delay" = "5s"
"sovereign.hft.pre-stop-hook" = "true"
"sovereign.hft.sched-policy" = "SCHED_OTHER"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

