[metadata]
tier = "standard"
name = "openjdk"
version = "21.0.3"
description = "openjdk container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["java"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "openjdk"
"org.opencontainers.image.vendor" = "OpenJDK"
"org.opencontainers.image.version" = "21.0.3"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
