[metadata]
name = "coredns"
version = "1.12.0"
description = "CoreDNS - DNS server and service discovery for Kubernetes"
vendor = "CNCF"
source = "https://github.com/coredns/coredns"
license = "Apache-2.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/coredns/coredns/releases/download/v1.12.0/coredns-1.12.0-linux-amd64.tar.gz"
binary_name = "coredns"
filename = "coredns-1.12.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 53
metrics = 9101

[labels]
"org.opencontainers.image.title" = "coredns"
"org.opencontainers.image.description" = "CoreDNS - DNS server and service discovery for Kubernetes"
"org.opencontainers.image.version" = "1.12.0"
"org.opencontainers.image.vendor" = "CNCF"
"org.opencontainers.image.source" = "https://github.com/coredns/coredns"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
