[metadata]
name = "postgresql-init"
version = "17"
description = "PostgreSQL Initialization Container"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/app/init.sh"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "PostgreSQL Initialization Container"
"org.opencontainers.image.title" = "postgresql-init"
"org.opencontainers.image.vendor" = "PostgreSQL"
"org.opencontainers.image.version" = "17"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

