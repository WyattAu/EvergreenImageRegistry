[metadata]
name = "step-ca"
version = "0.30.2"
description = "Step CA - private certificate authority for automated PKI"
vendor = "Smallstep"
source = "https://github.com/smallstep/certificates"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/smallstep/certificates/releases/download/v0.30.2/step-ca_0.30.2_linux_amd64.tar.gz"

[runtime]
entrypoint = ["/step-ca"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/smallstep/certificates"
"org.opencontainers.image.title" = "step-ca"
"org.opencontainers.image.vendor" = "Smallstep"
"org.opencontainers.image.version" = "0.30.2"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "security"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
