[metadata]
tier = "standard"
name = "nheko"
version = "v0.12.1"
description = "Nheko - desktop Matrix client (Qt/C++)"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/nheko-reborn/nheko:v0.12.1"

[runtime]
entrypoint = ["nheko"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Nheko - desktop Matrix client (Qt/C++)"
"org.opencontainers.image.source" = "https://github.com/Nheko-Reborn/nheko"
"org.opencontainers.image.title" = "nheko"
"org.opencontainers.image.vendor" = "Nheko"
"org.opencontainers.image.version" = "2.4.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.debian-slim" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

