name: Build Test Subset
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  TAG: ${{ github.sha }}
jobs:
  discover:
    name: Discover Images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total: ${{ steps.count.outputs.total }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Find all Dockerfiles
      id: find
      run: "find images -name Dockerfile \\\n  -not -path '*/__pycache__/*' \\\n \
        \ -not -path '*/tests/*' \\\n  | sed 's|images/||' | sed 's|/Dockerfile||'\
        \ | sort > images.txt\nTOTAL=$(wc -l < images.txt)\necho \"total=${TOTAL}\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"Found ${TOTAL} images to build\"\n"
    - name: Validate image count
      run: "TOTAL=$(wc -l < images.txt)\nif [ \"$TOTAL\" -eq 0 ]; then\n  echo \"\
        ::error::No Dockerfiles found in images/ directory\"\n  exit 1\nfi\n"
    - name: Create batched matrix
      id: set-matrix
      run: "python3 << 'PYEOF'\nimport json, os\n\nbatch_size = 50\nwith open(\"images.txt\"\
        ) as f:\n    images = [line.strip() for line in f if line.strip()]\n\nif not\
        \ images:\n    raise SystemExit(\"No images found\")\n\nbatches = []\nfor\
        \ i in range(0, len(images), batch_size):\n    chunk = images[i:i + batch_size]\n\
        \    batches.append({\n        \"batch\": i // batch_size,\n        \"images\"\
        : \",\".join(chunk),\n        \"count\": len(chunk),\n    })\n\nmatrix_json\
        \ = json.dumps({\"include\": batches})\nwith open(os.environ[\"GITHUB_OUTPUT\"\
        ], \"a\") as f:\n    f.write(f\"matrix={matrix_json}\\n\")\nprint(f\"Created\
        \ {len(batches)} batches for {len(images)} images\")\nPYEOF\n"
    - name: Upload images list
      uses: actions/upload-artifact@v4
      with:
        name: images-list
        path: images.txt
        retention-days: 1
  build:
    name: Build Batch ${{ matrix.batch }} (${{ matrix.count }} images)
    needs:
    - discover
    - lint
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        batch:
        - 1
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Lowercase registry owner
      run: echo "OWNER=$(echo '${{ env.OWNER }}' | tr '[:upper:]' '[:lower:]')" >>
        "$GITHUB_ENV"
    - name: Check GITHUB_TOKEN availability
      run: "TOKEN=\"${{ secrets.GITHUB_TOKEN }}\"\nif [ -z \"$TOKEN\" ]; then\n  echo\
        \ \"::warning::GITHUB_TOKEN is empty. GitHub API downloads will be rate-limited\
        \ to 60/hour.\"\nelse\n  echo \"::notice::GITHUB_TOKEN is set (${#TOKEN} chars).\
        \ GitHub API rate limit: 5000/hour.\"\nfi\n"
    - name: Login to Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build images (amd64 tarballs for verification)
      run: "mkdir -p /tmp/images\nIFS=',' read -ra IMAGE_LIST <<< \"${{ matrix.images\
        \ }}\"\nBUILT=0\nFAILED=0\nSKIPPED=0\nbuild_image() {\n  local image=\"$1\"\
        \n  local CONTEXT=\"./images/${image}\"\n  local REF=\"${REGISTRY}/${OWNER}/${image}:${TAG}\"\
        \n  local SAFE=\"${image//\\//-}\"\n  echo \"::group::Build ${image}\"\n \
        \ if timeout 900 docker buildx build \\\n      --platform linux/amd64 \\\n\
        \      -t \"${REF}\" \\\n      --output \"type=docker,dest=/tmp/images/${SAFE}.tar\"\
        \ \\\n      --cache-from \"type=gha,scope=${image}\" \\\n      --cache-to\
        \ \"type=gha,scope=${image},mode=max\" \\\n      --build-arg \"BUILD_DATE=${TAG}\"\
        \ \\\n      --build-arg \"VCS_REF=${TAG}\" \\\n      --build-arg \"GITHUB_TOKEN=${{\
        \ secrets.GITHUB_TOKEN }}\" \\\n      --label \"org.opencontainers.image.source=${{\
        \ github.server_url }}/${{ github.repository }}\" \\\n      --label \"org.opencontainers.image.revision=${{\
        \ github.sha }}\" \\\n      \"${CONTEXT}\"; then\n    echo \"${REF}\" >> /tmp/built-images.txt\n\
        \    return 0\n  else\n    return 1\n  fi\n}\nfor image in \"${IMAGE_LIST[@]}\"\
        ; do\n  [ -z \"$image\" ] && continue\n  CONTEXT=\"./images/${image}\"\n \
        \ if [ ! -f \"${CONTEXT}/Dockerfile\" ]; then\n    echo \"::warning::${image}:\
        \ Dockerfile not found, skipping\"\n    SKIPPED=$((SKIPPED + 1))\n    continue\n\
        \  fi\n  if build_image \"${image}\"; then\n    BUILT=$((BUILT + 1))\n   \
        \ sleep 1\n  else\n    echo \"::warning::${image}: build failed, retrying\
        \ in 5s...\"\n    sleep 5\n    if build_image \"${image}\"; then\n      BUILT=$((BUILT\
        \ + 1))\n      sleep 1\n    else\n      echo \"::error::${image}: build failed\
        \ after 2 attempts\"\n      FAILED=$((FAILED + 1))\n      sleep 3\n    fi\n\
        \  fi\n  echo \"::endgroup::\"\ndone\necho \"Batch ${{ matrix.batch }} complete:\
        \ ${BUILT} built, ${FAILED} failed, ${SKIPPED} skipped\"\n"
    - name: Push multi-arch to registry
      if: github.event_name != 'pull_request'
      timeout-minutes: 90
      run: "IFS=',' read -ra IMAGE_LIST <<< \"${{ matrix.images }}\"\nPUSHED=0\nFAILED=0\n\
        for image in \"${IMAGE_LIST[@]}\"; do\n  [ -z \"$image\" ] && continue\n \
        \ CONTEXT=\"./images/${image}\"\n  [ ! -f \"${CONTEXT}/Dockerfile\" ] && continue\n\
        \  REF=\"${REGISTRY}/${OWNER}/${image}:${TAG}\"\n  echo \"::group::Push ${image}\
        \ (linux/amd64,linux/arm64)\"\n  if timeout 900 docker buildx build \\\n \
        \   --platform linux/amd64,linux/arm64 \\\n    --push \\\n    -t \"${REF}\"\
        \ \\\n    --cache-from \"type=gha,scope=${image}\" \\\n    --attest \"type=provenance,mode=max\"\
        \ \\\n    --build-arg \"BUILD_DATE=${TAG}\" \\\n    --build-arg \"VCS_REF=${TAG}\"\
        \ \\\n    --build-arg \"GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}\" \\\n  \
        \  \"${CONTEXT}\"; then\n    PUSHED=$((PUSHED + 1))\n  else\n    echo \"::warning::${image}:\
        \ push failed (may not support arm64)\"\n    FAILED=$((FAILED + 1))\n  fi\n\
        \  # Rate-limit backoff between GitHub downloads\n  sleep 2\n  echo \"::endgroup::\"\
        \ndone\necho \"Push: ${PUSHED} succeeded, ${FAILED} failed\"\nif [ \"$FAILED\"\
        \ -gt 0 ]; then echo \"::warning::${FAILED} image(s) failed to push (arm64\
        \ incompatible?)\"; fi\n"
    - name: Enforce image size limits
      if: always()
      run: "{\n  echo \"## Image Sizes - Batch ${{ matrix.batch }}\"\n  echo \"\"\n\
        \  echo \"| Image | Size | Tier Limit | Status |\"\n  echo \"|-------|------|------------|--------|\"\
        \n} >> \"$GITHUB_STEP_SUMMARY\"\n\nIFS=',' read -ra IMAGE_LIST <<< \"${{ matrix.images\
        \ }}\"\nfor image in \"${IMAGE_LIST[@]}\"; do\n  [ -z \"$image\" ] && continue\n\
        \  SAFE=\"${image//\\//-}\"\n  TAR=\"/tmp/images/${SAFE}.tar\"\n  [ ! -f \"\
        $TAR\" ] && continue\n\n  SIZE_MB=$(($(stat --format=%s \"$TAR\") / 1024 /\
        \ 1024))\n  DOCKERFILE=\"./images/${image}/Dockerfile\"\n\n  if grep -q 'FROM\
        \ scratch' \"$DOCKERFILE\" 2>/dev/null; then\n    LIMIT=50\n    TIER=\"Tier\
        \ 1 (scratch/distroless)\"\n  else\n    LIMIT=200\n    TIER=\"Tier 2 (wolfi/debian-slim)\"\
        \n  fi\n\n  if [ \"$SIZE_MB\" -gt \"$LIMIT\" ]; then\n    STATUS=\":warning:\
        \ OVER (${SIZE_MB}MB > ${LIMIT}MB)\"\n  else\n    STATUS=\":white_check_mark:\
        \ OK (${SIZE_MB}MB)\"\n  fi\n  echo \"| ${image} | ${SIZE_MB}MB | ${TIER}\
        \ | ${STATUS} |\" >> \"$GITHUB_STEP_SUMMARY\"\ndone\n"
    - name: Upload built image tarballs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: images-batch-${{ matrix.batch }}
        path: /tmp/images/
        retention-days: 7
        overwrite: true
    - name: Upload built image references
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: built-list-batch-${{ matrix.batch }}
        path: /tmp/built-images.txt
        retention-days: 7
        overwrite: true
        if-no-files-found: ignore
  report:
    name: Build Report
    needs:
    - discover
    - lint
    - build
    - health-check
    - security-scan
    - sbom
    - verify
    - sign-push
    - build-multiarch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Generate summary report
      run: "{\n  echo \"# Build Report\"\n  echo \"\"\n  echo \"| Metric | Value |\"\
        \n  echo \"|--------|-------|\"\n  echo \"| **Total Images** | ${{ needs.discover.outputs.total\
        \ }} |\"\n  echo \"| **Commit** | \\`${{ github.sha }}\\` |\"\n  echo \"|\
        \ **Branch** | \\`${{ github.ref_name }}\\` |\"\n  echo \"| **Trigger** |\
        \ ${{ github.event_name }} |\"\n  echo \"| **Discover** | ${{ needs.discover.result\
        \ }} |\"\n  echo \"| **Lint** | ${{ needs.lint.result }} |\"\n  echo \"| **Build**\
        \ | ${{ needs.build.result }} |\"\n  echo \"| **Health Check** | ${{ needs.health-check.result\
        \ }} |\"\n  echo \"| **Security Scan** | ${{ needs.security-scan.result }}\
        \ |\"\n  echo \"| **SBOM** | ${{ needs.sbom.result }} |\"\n  echo \"| **Verify**\
        \ | ${{ needs.verify.result }} |\"\n  echo \"| **Sign & Push** | ${{ needs.sign-push.result\
        \ }} |\"\n  echo \"| **Multi-Arch Build** | ${{ needs.build-multiarch.result\
        \ }} |\"\n  echo \"\"\n\n  OVERALL=\"success\"\n  for job in discover lint\
        \ build verify; do\n    RESULT=\"${{ needs[job].result }}\"\n    if [ \"$RESULT\"\
        \ = \"failure\" ]; then\n      OVERALL=\"failure\"\n      break\n    fi\n\
        \  done\n\n  if [ \"$OVERALL\" = \"failure\" ]; then\n    echo \"## :x: Pipeline\
        \ Failed\"\n  else\n    echo \"## :white_check_mark: Pipeline Passed\"\n \
        \ fi\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
