name: Provenance Verification
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run evergreenctl verify-all
        run: |
          cd evergreenctl && cargo build --release && \
          ./target/release/evergreenctl verify-all images/
      - name: Verify SLSA provenance for sample images
        run: |
          SAMPLE_IMAGES="redis nginx postgres vault grafana prometheus"
          CERT_IDENTITY="${{ github.repository_owner }}"
          for img in $SAMPLE_IMAGES; do
            FULL_REF="ghcr.io/${{ github.repository }}/$img:latest"
            echo "Verifying provenance for $FULL_REF..."
            cosign verify \
              --certificate-identity "${CERT_IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$FULL_REF" 2>&1 || echo "WARNING: Could not verify $img (image may not be published yet)" >&2
          done
