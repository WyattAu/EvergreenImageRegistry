[metadata]
name = "k3s"
version = "1.33.6+k3s1"
description = "K3s - lightweight Kubernetes distribution"
vendor = "SUSE"
source = "https://github.com/k3s-io/k3s"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/k3s/k3s/releases/download/v1.33.6+k3s1/k3s-1.33.6+k3s1-linux-amd64.tar.gz"
binary_name = "k3s"
filename = "k3s-1.33.6+k3s1-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
metrics = 9101

[labels]
"org.opencontainers.image.title" = "k3s"
"org.opencontainers.image.description" = "K3s - lightweight Kubernetes distribution"
"org.opencontainers.image.version" = "1.33.6+k3s1"
"org.opencontainers.image.vendor" = "SUSE"
"org.opencontainers.image.source" = "https://github.com/k3s-io/k3s"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "15s"
