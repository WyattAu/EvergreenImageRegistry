[metadata]
tier = "standard"
name = "fluxcd-helm"
version = "2.8.6"
description = "Evergreen hardened fluxcd-helm - Helm controller for Flux"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/flux", "bootstrap", "helm-release"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened fluxcd-helm - Helm controller for Flux"
"org.opencontainers.image.title" = "fluxcd-helm"
"org.opencontainers.image.vendor" = "Flux CD"
"org.opencontainers.image.version" = "2.8.6"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
