[metadata]
name = "surrealdb-python"
version = "1.0.0"
description = "Sovereign hardened SurrealDB Python - Python SDK for SurrealDB"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3", "-m", "surrealdb"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened SurrealDB Python - Python SDK for SurrealDB"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

