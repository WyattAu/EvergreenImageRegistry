[metadata]
tier = "standard"
name = "zerotier"
version = "1.12.2"
description = "zerotier container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "zerotier/zerotier:${VERSION}"

[runtime]
entrypoint = ["/usr/sbin/zerotier-one"]
cmd = ["-p9993"]

[ports]
expose = ["9993/udp", 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/zerotier/ZeroTierOne"
"org.opencontainers.image.title" = "zerotier"
"org.opencontainers.image.vendor" = "ZeroTier"
"org.opencontainers.image.version" = "1.12.2"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.distrole" = "debian-slim"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
