[metadata]
tier = "standard"
name = "helmsman"
version = "4.0.5"
description = "Evergreen hardened helmsman - Helm charts as code"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/helmsman"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened helmsman - Helm charts as code"
"org.opencontainers.image.title" = "helmsman"
"org.opencontainers.image.vendor" = "Praqma"
"org.opencontainers.image.version" = "4.0.5"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
