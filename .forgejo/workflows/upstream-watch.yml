# =============================================================================
# EIR - CRITICAL IMAGE UPSTREAM VERSION WATCH (Forgejo Actions)
# =============================================================================
# Daily check of critical images for upstream version updates.
# Detects new versions from multiple sources (GitHub, codeberg, custom URLs).
# Creates an issue/PR when updates are found. Manual trigger for rebuilds.
#
# Runs on self-hosted runner (CachyOS) with DOCKER_BUILDKIT=0.
# =============================================================================

name: Critical Version Watch

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild outdated images after detection'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Critical images to watch - these are the ones running in SIS production
  CRITICAL_IMAGES: >-
    traefik keycloak forgejo vaultwarden oauth2-proxy ocis grafana

jobs:
  check:
    name: Check Upstream Versions
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      updates: ${{ steps.detect.outputs.updates }}
      update_count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect upstream updates
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          
          # Source detection maps: image -> (source_type, repo_or_url, current_version_field)
          # We read upstream_version from manifest.toml as the current version
          
          declare -A SOURCE_TYPE
          declare -A SOURCE_REPO
          
          # GitHub releases
          SOURCE_TYPE[traefik]="github"
          SOURCE_REPO[traefik]="traefik/traefik"
          
          SOURCE_TYPE[keycloak]="github"
          SOURCE_REPO[keycloak]="keycloak/keycloak"
          
          SOURCE_TYPE[oauth2-proxy]="github"
          SOURCE_REPO[oauth2-proxy]="oauth2-proxy/oauth2-proxy"
          
          SOURCE_TYPE[ocis]="github"
          SOURCE_REPO[ocis]="owncloud/ocis"
          
          SOURCE_TYPE[grafana]="github"
          SOURCE_REPO[grafana]="grafana/grafana"
          
          SOURCE_TYPE[vaultwarden]="github"
          SOURCE_REPO[vaultwarden]="dani-garcia/vaultwarden"
          
          # Codeberg (Forgejo)
          SOURCE_TYPE[forgejo]="codeberg"
          SOURCE_REPO[forgejo]="forgejo/forgejo"
          
          UPDATES=""
          COUNT=0
          
          for img in ${{ env.CRITICAL_IMAGES }}; do
            MANIFEST="images/${img}/manifest.toml"
            if [ ! -f "$MANIFEST" ]; then
              echo "::warning::${img}: no manifest.toml found"
              continue
            fi
            
            # Get current upstream_version from manifest
            CURRENT=$(grep '^upstream_version' "$MANIFEST" | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/')
            if [ -z "$CURRENT" ]; then
              echo "::warning::${img}: no upstream_version in manifest"
              continue
            fi
            
            TYPE="${SOURCE_TYPE[$img]:-github}"
            REPO="${SOURCE_REPO[$img]:-}"
            
            echo "--- Checking ${img} (current: ${CURRENT}, source: ${TYPE}) ---"
            
            case "$TYPE" in
              github)
                # Query GitHub releases API
                LATEST=$(curl -sfL "https://api.github.com/repos/${REPO}/releases/latest" \
                  -H "Accept: application/vnd/github+json" \
                  | python3 -c "import json,sys; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo "")
                # Strip leading 'v' for comparison
                LATEST_CLEAN=$(echo "$LATEST" | sed 's/^v//')
                CURRENT_CLEAN=$(echo "$CURRENT" | sed 's/^v//')
                ;;
              codeberg)
                # Query Codeberg/Forgejo API
                LATEST=$(curl -sfL "https://codeberg.org/api/v1/repos/${REPO}/releases?limit=1&pre-release=false" \
                  | python3 -c "import json,sys; releases=json.load(sys.stdin); print(releases[0]['tag_name'] if releases else '')" 2>/dev/null || echo "")
                LATEST_CLEAN=$(echo "$LATEST" | sed 's/^v//')
                CURRENT_CLEAN=$(echo "$CURRENT" | sed 's/^v//')
                ;;
              *)
                echo "::warning::${img}: unknown source type ${TYPE}"
                continue
                ;;
            esac
            
            if [ -z "$LATEST_CLEAN" ]; then
              echo "::warning::${img}: could not fetch latest version from ${TYPE}"
              continue
            fi
            
            if [ "$CURRENT_CLEAN" != "$LATEST_CLEAN" ]; then
              echo "::notice::${img}: ${CURRENT} -> ${LATEST_CLEAN}"
              if [ -n "$UPDATES" ]; then
                UPDATES="${UPDATES}\n"
              fi
              UPDATES="${UPDATES}${img}|${CURRENT}|${LATEST_CLEAN}"
              COUNT=$((COUNT + 1))
            else
              echo "${img}: up to date (${CURRENT})"
            fi
          done
          
          # Output for next step
          echo "updates<<EOF" >> $GITHUB_OUTPUT
          echo -e "$UPDATES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=${COUNT}" >> $GITHUB_OUTPUT
          
          echo "Found ${COUNT} updates"

      - name: Create issue for updates
        if: steps.detect.outputs.update_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const updates = `${{ steps.detect.outputs.updates }}`;
            const count = `${{ steps.detect.outputs.count }}`;
            const lines = updates.trim().split('\n').filter(l => l);
            
            let body = '## Outdated Critical Images\n\n';
            body += '| Image | Current | Latest |\n';
            body += '|-------|---------|--------|\n';
            for (const line of lines) {
              const [img, current, latest] = line.split('|');
              body += `| ${img} | ${current} | ${latest} |\n`;
            }
            body += '\nTo rebuild, run the workflow with `rebuild: true`.\n';
            
            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'outdated-images',
              per_page: 1
            });
            
            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issues.data[0].number,
                body: body,
              });
              core.info(`Updated issue #${issues.data[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                ...context.repo,
                title: `[Version Watch] ${count} critical images need updates`,
                body: body,
                labels: ['outdated-images', 'automated'],
              });
            }

  rebuild:
    name: Rebuild Outdated Images
    needs: check
    if: github.event.inputs.rebuild == 'true' && needs.check.outputs.update_count != '0'
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Bump and rebuild images
        shell: bash
        run: |
          set -euo pipefail
          
          UPDATES='${{ needs.check.outputs.updates }}'
          
          # Read Dockerfile ARG VERSION for each image to get the v-prefix style
          echo "$UPDATES" | while IFS='|' read -r img current latest; do
            if [ -z "$img" ]; then continue; fi
            
            echo "=== Bumping ${img}: ${current} -> ${latest} ==="
            
            # Determine version prefix style from Dockerfile
            DOCKERFILE="images/${img}/Dockerfile"
            if grep -q 'ARG VERSION=v' "$DOCKERFILE" 2>/dev/null; then
              NEW_VERSION="v${latest}"
            else
              NEW_VERSION="${latest}"
            fi
            
            # Update manifest.toml
            sed -i "s/^version = .*/version = \"${NEW_VERSION}\"/" "images/${img}/manifest.toml"
            sed -i "s/^upstream_version = .*/upstream_version = \"${latest}\"/" "images/${img}/manifest.toml"
            
            # Update Dockerfile ARG VERSION
            sed -i "s/^ARG VERSION=.*/ARG VERSION=${NEW_VERSION}/" "$DOCKERFILE"
            
            # Update Dockerfile label
            sed -i "s/org.opencontainers.image.version=\"[^\"]*\"/org.opencontainers.image.version=\"${NEW_VERSION}\"/" "$DOCKERFILE"
            
            # Skip collabora (rootfs tar, needs manual extraction)
            if [ "$img" = "collabora" ]; then
              echo "  SKIP: collabora needs manual rootfs extraction"
              continue
            fi
            
            # Build
            echo "  Building..."
            DOCKER_BUILDKIT=0 docker build \
              --build-arg TARGETARCH=amd64 \
              -t "ghcr.io/wyattau/evergreenimageregistry/${img}:latest" \
              -t "ghcr.io/wyattau/evergreenimageregistry/${img}:${NEW_VERSION}" \
              "images/${img}/" || {
                echo "  BUILD FAILED for ${img}"
                continue
              }
            
            # Push
            echo "  Pushing..."
            docker push "ghcr.io/wyattau/evergreenimageregistry/${img}:latest" || true
            docker push "ghcr.io/wyattau/evergreenimageregistry/${img}:${NEW_VERSION}" || true
            
            echo "  Done: ${img} ${NEW_VERSION}"
          done
          
          echo "=== Rebuild complete ==="

      - name: Commit changes
        run: |
          git config user.name "EIR Version Watch"
          git config user.email "actions@forgejo.local"
          git add images/
          git diff --staged --quiet || {
            git commit -m "auto: bump critical image versions

            Detected by upstream-watch workflow.
            
            Co-authored-by: ${{ github.actor }}"
            git push
          }
