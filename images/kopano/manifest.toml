[metadata]
name = "kopano"
version = "12.1.0"
description = "kopano container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/Kopano-dev/kopano-core/releases"
"org.opencontainers.image.title" = "kopano"
"org.opencontainers.image.vendor" = "Kopano-dev/kopano-core"
"org.opencontainers.image.version" = "12.1.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

