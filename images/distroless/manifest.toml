[metadata]
tier = "standard"
name = "distroless"
version = "unknown"
description = "Evergreen reference to gcr.io/distroless/static-debian12 for static binary containers"

[build]
base = "gcr.io/distroless/static-debian12:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "base-image"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen reference to gcr.io/distroless/static-debian12 for static binary containers"
"org.opencontainers.image.title" = "distroless"
"evergreen.base.image" = "distroless"
"evergreen.health.type" = "none"
"evergreen.image.category" = "base"
"evergreen.image.note" = "Reference image. Use as FROM base for static Go/Rust binaries."
"evergreen.image.status" = "reference"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
