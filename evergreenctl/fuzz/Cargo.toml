[package]
name = "evergreenctl-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.evergreenctl]
path = ".."

# Prevent this from interfering with workspaces.
[workspace]
members = ["."]

[[bin]]
name = "fuzz_dockerfile_parsing"
path = "fuzz_targets/fuzz_dockerfile_parsing.rs"
test = false
doc = false

[[bin]]
name = "fuzz_manifest_parsing"
path = "fuzz_targets/fuzz_manifest_parsing.rs"
test = false
doc = false

[[bin]]
name = "fuzz_version_comparison"
path = "fuzz_targets/fuzz_version_comparison.rs"
test = false
doc = false

[[bin]]
name = "fuzz_constraint_validation"
path = "fuzz_targets/fuzz_constraint_validation.rs"
test = false
doc = false
