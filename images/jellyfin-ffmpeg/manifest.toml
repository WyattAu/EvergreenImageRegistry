[metadata]
name = "jellyfin-ffmpeg"
version = "7.1"
description = "jellyfin-ffmpeg container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/ffmpeg"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/jellyfin/jellyfin-ffmpeg"
"org.opencontainers.image.title" = "jellyfin-ffmpeg"
"org.opencontainers.image.vendor" = "Jellyfin"
"org.opencontainers.image.version" = "7.1"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "30000ms"
"sovereign.image.category" = "media-streaming"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

