[metadata]
name = "kubescape-operator"
version = "latest"
description = "kubescape-operator container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/kubescape/kubescape-operator:${VERSION}"

[runtime]
entrypoint = ["/kubescape"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"evergreen.base.image" = "scratch"
"evergreen.health.type" = "exec"
"evergreen.metrics.native" = "ztunnel"

