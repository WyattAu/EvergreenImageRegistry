[metadata]
name = "neo4j"
version = "5.20.0"
description = "Neo4j - native graph database"
vendor = "Neo4j"
source = "https://github.com/neo4j/neo4j"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "neo4j"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/neo4j/neo4j/releases/download/v5.20.0/neo4j-5.20.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["neo4j"]

[ports]
expose = [7474, 9101]

[labels]
"org.opencontainers.image.title" = "neo4j"
"org.opencontainers.image.vendor" = "Neo4j"
"org.opencontainers.image.version" = "5.20.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

