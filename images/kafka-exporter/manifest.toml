[metadata]
name = "kafka-exporter"
version = "1.8.0"
description = "Kafka Exporter - Prometheus exporter for Apache Kafka"
vendor = "Prometheus"
source = "https://github.com/danielqsj/kafka_exporter"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/kafka-exporter/kafka-exporter/releases/download/v1.8.0/kafka-exporter-1.8.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/kafka_exporter"]

[ports]
expose = [9308, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Kafka Exporter - Prometheus metrics for Apache Kafka"
"org.opencontainers.image.title" = "kafka-exporter"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "messaging"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

