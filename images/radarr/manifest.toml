[metadata]
name = "radarr"
version = "5.14.0"
description = "Radarr - movie collection manager for Usenet and BitTorrent"
vendor = "Radarr"
source = "https://github.com/Radarr/Radarr"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/radarr/radarr/releases/download/v5.14.0/radarr-5.14.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/app/Radarr"]

[ports]
expose = [7878, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/Radarr/Radarr"
"org.opencontainers.image.title" = "radarr"
"org.opencontainers.image.vendor" = "Radarr"
"org.opencontainers.image.version" = "5.14.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.official" = "true"
"sovereign.health.type" = "none"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

