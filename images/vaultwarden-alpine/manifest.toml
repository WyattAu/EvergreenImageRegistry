[metadata]
tier = "standard"
name = "vaultwarden-alpine"
version = "1.35.8"
description = "vaultwarden-alpine container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "vaultwarden/server:1.35.8"

[runtime]
entrypoint = ["/vaultwarden"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/dani-garcia/vaultwarden"
"org.opencontainers.image.title" = "vaultwarden-alpine"
"org.opencontainers.image.vendor" = "dani-garcia"
"org.opencontainers.image.version" = "1.35.8"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "secrets"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
