[image]
name = "chat-relay"
type = "container-image"
tier = 2
version = "0.5.0"
description = "Matrix chat relay (complement) - testing tool for Matrix homeservers"
vendor = "matrix-org"
source_url = "https://github.com/matrix-org/complement"
category = "chat"

[source]
type = "container-image"
url = "docker.io/matrixdotorg/complement:latest"
upstream = "https://github.com/matrix-org/complement"

[build]
base = "docker.io/matrixdotorg/complement:latest"
target_base = "cgr.dev/chainguard/wolfi-base:latest"

[constraints]
nonroot = true
base = "wolfi"

[hft]
signal-handling = "native"
shutdown-timeout = "10s"

[ports]
app = 9004
metrics = 9101

[health]
type = "tcp"
