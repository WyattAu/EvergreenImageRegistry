[metadata]
name = "opengpts"
version = "0.1.0"
description = "opengpts container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/langchain-ai/open-gpts"
"org.opencontainers.image.title" = "opengpts"
"org.opencontainers.image.vendor" = "OpenGPTS"
"org.opencontainers.image.version" = "0.1.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

