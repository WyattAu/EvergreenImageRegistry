[metadata]
name = "rainloop"
version = "1.17.0"
description = "RainLoop - lightweight webmail client (archived)"
vendor = "rainloop"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/RainLoop/rainloop-webmail/archive/refs/tags/v1.17.0.tar.gz"

[runtime]
entrypoint = ["httpd"]
cmd = ["-f", "-p", "8888", "-h", "/var/www/html"]

[ports]
expose = [8888, 9101]

[labels]
"org.opencontainers.image.description" = "RainLoop - lightweight webmail client"
"org.opencontainers.image.source" = "https://github.com/RainLoop/rainloop-webmail"
"org.opencontainers.image.title" = "rainloop"
"org.opencontainers.image.vendor" = "RainLoop"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "http"
"sovereign.image.category" = "email"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

