[metadata]
tier = "standard"
name = "mongodb-opsmanager"
version = "2.5.0"
description = "MongoDB Ops Manager - mongosh CLI tool for MongoDB administration"
vendor = "mongodb"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://fastdl.mongodb.org/tools/mongodb-mongosh/2.5.0/mongosh-2.5.0-linux-x64.tgz"

[runtime]
entrypoint = ["/opt/mongosh/bin/mongosh"]

[ports]
expose = [27017, 9101]

[labels]
"org.opencontainers.image.description" = "MongoDB Ops Manager - mongosh CLI tool"
"org.opencontainers.image.source" = "https://www.mongodb.com/docs/mongodb-shell/"
"org.opencontainers.image.title" = "mongodb-opsmanager"
"org.opencontainers.image.vendor" = "MongoDB"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "tcp"
"evergreen.image.category" = "database"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
