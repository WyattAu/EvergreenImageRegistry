[metadata]
name = "tweed"
version = "latest"
description = "VPN mesh networking tool"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/vmware-tanzu/tweed:${VERSION}"

[runtime]
entrypoint = ["/tweed"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.description" = "VPN mesh networking tool"
"org.opencontainers.image.source" = "https://github.com/vmware-tanzu/tweed"
"org.opencontainers.image.title" = "tweed"
"org.opencontainers.image.vendor" = "VMware Tanzu"
"org.opencontainers.image.version" = "0.1.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

