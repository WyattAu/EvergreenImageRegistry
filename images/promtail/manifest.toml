[metadata]
name = "promtail"
version = "3.6.11"
upstream_version = "3.5.12"
description = "Evergreen hardened Promtail - log collection agent for Grafana Loki"
vendor = "Grafana Labs"
source = "https://github.com/grafana/loki"
license = "AGPL-3.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "binary-release"
url = "https://github.com/grafana/loki/releases/download/v3.5.12/promtail-linux-amd64.zip"

[runtime]
entrypoint = ["/usr/bin/promtail"]

[ports]
expose = [9080, 3100, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Promtail - log collection agent for Grafana Loki"
"org.opencontainers.image.title" = "promtail"
"org.opencontainers.image.vendor" = "Grafana Labs"
"org.opencontainers.image.version" = "3.5.12"
"evergreen.base.image" = "scratch"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "logging"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
