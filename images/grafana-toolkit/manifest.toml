[metadata]
name = "grafana-toolkit"
version = "10.4.1"
description = "Grafana plugin toolkit CLI for building and testing plugins"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["npx", "grafana-toolkit"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Grafana plugin toolkit CLI for building and testing plugins"
"org.opencontainers.image.title" = "grafana-toolkit"
"org.opencontainers.image.vendor" = "Grafana Labs"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

