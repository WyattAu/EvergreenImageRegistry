[metadata]
tier = "standard"
name = "rate-limiter"
version = "latest"
description = "rate-limiter container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"
multiarch = false

[source]
type = "package-manager"

[runtime]
entrypoint = ["/ratelimiter"]

[ports]
expose = [9090, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/kuqoi/ratelimiter"
"org.opencontainers.image.title" = "rate-limiter"
"org.opencontainers.image.vendor" = "kuqoi"
"org.opencontainers.image.version" = "latest"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
