apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: evergreenimages.evergreenimageregistry.io
spec:
  group: evergreenimageregistry.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["image"]
              properties:
                image:
                  type: string
                  description: "Image reference (e.g., ghcr.io/wyattau/evergreenimageregistry/redis)"
                tag:
                  type: string
                  default: "latest"
                  description: "Image tag to track"
                autoUpdate:
                  type: boolean
                  default: false
                  description: "Enable automatic updates on new versions"
                updateStrategy:
                  type: string
                  enum: ["rolling", "recreate"]
                  default: "rolling"
                  description: "Kubernetes update strategy"
                compliance:
                  type: object
                  properties:
                    requireSBOM:
                      type: boolean
                      default: true
                    requireVEX:
                      type: boolean
                      default: false
                    fipsRequired:
                      type: boolean
                      default: false
                notifications:
                  type: object
                  properties:
                    slack:
                      type: string
                      description: "Slack channel for notifications"
                    pagerduty:
                      type: boolean
                      default: false
            status:
              type: object
              properties:
                currentTag:
                  type: string
                lastUpdated:
                  type: string
                  format: date-time
                sbomStatus:
                  type: string
                  enum: ["valid", "missing", "stale"]
                complianceStatus:
                  type: string
                  enum: ["passing", "failing", "unknown"]
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: evergreenimages
    singular: evergreenimage
    kind: EvergreenImage
    shortNames:
      - ei
      - eimg
