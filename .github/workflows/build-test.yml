name: Build Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "test"
  
  build:
    needs: [discover]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - run: echo "batch ${{ matrix.batch }}"
  
  report:
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "report done"
