[metadata]
tier = "standard"
name = "ignite"
version = "2.16.0"
description = "Evergreen hardened Apache Ignite - distributed database and in-memory computing"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/apacheignite-ignite"
[runtime]
entrypoint = ["/opt/ignite/bin/ignite.sh"]

[ports]
expose = [10800, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Apache Ignite - distributed database and in-memory computing"
"org.opencontainers.image.title" = "ignite"
"org.opencontainers.image.vendor" = "Apache Software Foundation"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
