[metadata]
name = "mysql-exporter"
version = "0.15.0"
description = "MySQL Exporter - Prometheus exporter for MySQL server"
vendor = "Prometheus"
source = "https://github.com/prometheus/mysqld_exporter"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/mysql-exporter/mysql-exporter/releases/download/v0.15.0/mysql-exporter-0.15.0-linux-amd64.tar.gz"
binary_name = "mysql-exporter"
filename = "mysql-exporter-0.15.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9104
metrics = 9101

[labels]
"org.opencontainers.image.title" = "mysql-exporter"
"org.opencontainers.image.description" = "MySQL Exporter - Prometheus exporter for MySQL server"
"org.opencontainers.image.version" = "0.15.0"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.source" = "https://github.com/prometheus/mysqld_exporter"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
