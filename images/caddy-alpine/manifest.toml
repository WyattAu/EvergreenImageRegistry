[metadata]
tier = "standard"
name = "caddy-alpine"
version = "2.8.4"
description = "Caddy web server with automatic HTTPS"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/caddy"]
cmd = ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "Caddy web server with automatic HTTPS"
"org.opencontainers.image.source" = "https://github.com/caddyserver/caddy"
"org.opencontainers.image.title" = "caddy-alpine"
"org.opencontainers.image.vendor" = "Caddy Server"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "webserver"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

