[metadata]
name = "singlestore"
version = "8.5.0"
description = "SingleStore (formerly MemSQL) local development compatibility - distributed SQL database"
vendor = "SingleStore"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://www.singlestore.com/"

[runtime]
entrypoint = ["/app/singlestore"]

[ports]
expose = [3306, 9101]

[labels]
"org.opencontainers.image.description" = "SingleStore local development compatibility - commercial distributed SQL database"
"org.opencontainers.image.source" = "https://www.singlestore.com/"
"org.opencontainers.image.title" = "singlestore"
"org.opencontainers.image.vendor" = "SingleStore"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.note" = "SingleStore requires a license. Download from https://www.singlestore.com/ for production."
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

