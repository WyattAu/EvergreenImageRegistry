[metadata]
tier = "standard"
name = "rowy"
version = "2.0.0"
description = "rowy container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/rowy/rowy"
[runtime]
entrypoint = ["node"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/rowyio/rowy/releases"
"org.opencontainers.image.title" = "rowy"
"org.opencontainers.image.vendor" = "rowyio/rowy"
"org.opencontainers.image.version" = "2.0.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
