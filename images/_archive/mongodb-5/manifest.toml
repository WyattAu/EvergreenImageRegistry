[metadata]
tier = "standard"
name = "mongodb-5"
version = "5.0.18"
description = "Evergreen hardened MongoDB 5.0 - document database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "mongo:${VERSION}"

[runtime]
entrypoint = ["mongod"]

[ports]
expose = [27017, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened MongoDB 5.0 - document database"
"org.opencontainers.image.title" = "mongodb-5"
"org.opencontainers.image.vendor" = "MongoDB"
"org.opencontainers.image.version" = "5.0.18"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
