repos:
  # Standard hooks for file cleanup
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^deploy/helm/
      - id: check-json
      - id: check-merge-conflict

  # Prettier for auto-formatting MD and YAML files
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: [--config, .prettierrc.yml, --ignore-path, 'images/', --ignore-path, 'node_modules/', --ignore-path, 'deploy/']

  # Linters for style and correctness
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        args: [--config, .markdownlint.yml, '**/*.md']

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--config-file, .yamllint.yml]

  # =============================================================================
  # Evergreen Hardened Image Registry - Custom Pre-commit Hooks
  # =============================================================================
  # Validates Dockerfiles against security constraints BEFORE build
  # Checks: C001, C003, C004, C010, base image priority, NO ALPINE
  # =============================================================================

  # Hadolint via Docker (standard Dockerfile linting)
  - repo: local
    hooks:
      - id: hadolint
        name: Hadolint (Dockerfile Linter)
        language: docker_image
        entry: hadolint/hadolint:v2.12.0 hadolint
        types: [dockerfile]

  # Custom constraint validator (runs locally)
  - repo: local
    hooks:
      - id: evergreen-constraints
        name: Evergreen Constraints (C001-C020)
        description: Validate Dockerfiles against security constraints
        entry: python3 scripts/pre_commit_validator.py
        language: system
        types: [dockerfile]
        stages: [pre-commit, pre-push]
        pass_filenames: true

  # Check for forbidden base images (Alpine)
  - repo: local
    hooks:
      - id: no-alpine
        name: NO ALPINE (CRITICAL RULE)
        description: Ensures no Alpine base images are used
        entry: python3 scripts/check_alpine.py
        language: system
        types: [dockerfile]
        stages: [pre-commit, pre-push]
        pass_filenames: true

  # Fast pre-commit tests (Rust clippy/fmt, Python syntax, Shell syntax)
  - repo: local
    hooks:
      - id: evergreen-fast-tests
        name: Evergreen Fast Tests (pre-commit)
        description: Runs Rust clippy, Rust fmt, Python syntax, Shell syntax
        entry: bash scripts/pre-commit-test.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

  # =============================================================================
  # Pre-push Quality Gate (11 gates, comprehensive validation)
  # =============================================================================
  # Gates: Rust unit tests, Rust integration tests, clippy, fmt, Python syntax,
  #        Python ruff lint, Shell syntax, Manifest TOML, SBOM JSON,
  #        Dockerfile constraints, cargo audit, Release build
  # =============================================================================
  - repo: local
    hooks:
      - id: evergreen-pre-push-gate
        name: Evergreen Pre-push Gate (11 Gates)
        description: Runs all 11 quality gates before push (tests, lint, validation)
        entry: bash scripts/pre-push-gate.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
