[metadata]
tier = "standard"
name = "nifi-registry"
version = "1.26.0"
description = "Evergreen hardened NiFi Registry - versioned flow management for Apache NiFi"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/nifi-registry/bin/nifi-registry.sh", "run"]

[ports]
expose = [18080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened NiFi Registry - versioned flow management for Apache NiFi"
"org.opencontainers.image.title" = "nifi-registry"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "1.26.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "data-flow"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
