[metadata]
name = "victoriametrics"
version = "1.140.0"
description = "VictoriaMetrics - fast, cost-effective time series database"
vendor = "VictoriaMetrics"
license = "Apache-2.0"
source = "https://github.com/VictoriaMetrics/VictoriaMetrics"
upstream_version = "1.140.0"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.140.0/victoria-metrics-linux-amd64-v1.140.0-cluster.tar.gz"

[runtime]
entrypoint = ["/victoria-metrics"]

[ports]
expose = [8428, 9101]

[labels]
"org.opencontainers.image.title" = "victoriametrics"
"org.opencontainers.image.vendor" = "VictoriaMetrics"
"org.opencontainers.image.version" = "1.140.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "monitoring"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
