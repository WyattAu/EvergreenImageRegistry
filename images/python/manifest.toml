[metadata]
tier = "standard"
name = "python"
version = "3.12.3"
description = "python container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "python"
"org.opencontainers.image.vendor" = "Python"
"org.opencontainers.image.version" = "3.12.3"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
