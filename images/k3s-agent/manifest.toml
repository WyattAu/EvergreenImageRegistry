[metadata]
tier = "standard"
name = "k3s-agent"
version = "1.33.6+k3s1"
description = "Evergreen hardened k3s-agent - K3s agent mode"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/k3s", "agent"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened k3s-agent - K3s agent mode"
"org.opencontainers.image.title" = "k3s-agent"
"org.opencontainers.image.vendor" = "SUSE"
"org.opencontainers.image.version" = "1.33.6+k3s1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "15s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
