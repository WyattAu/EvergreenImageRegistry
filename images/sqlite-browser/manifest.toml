[metadata]
name = "sqlite-browser"
version = "bookworm"
description = "GUI-based SQLite database editor"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/sqlitebrowser"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "GUI-based SQLite database editor"
"org.opencontainers.image.source" = "https://github.com/sqlitebrowser/sqlitebrowser"
"org.opencontainers.image.title" = "sqlite-browser"
"org.opencontainers.image.vendor" = "sqlitebrowser"
"org.opencontainers.image.version" = "bookworm"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

