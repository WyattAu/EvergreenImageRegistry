[metadata]
name = "gitbucket"
version = "4.40.0"
description = "GitBucket - Scala-based Git platform with GitHub-like features"
vendor = "GitBucket"
source = "https://github.com/gitbucket/gitbucket"
license = "Apache-2.0"
tier = "2"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/gitbucket/gitbucket/releases/download/4.40.0/gitbucket.war"

[runtime]
entrypoint = ["java", "-jar", "/opt/gitbucket/gitbucket.war"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "GitBucket - Scala-based Git platform"
"org.opencontainers.image.source" = "https://github.com/gitbucket/gitbucket"
"org.opencontainers.image.title" = "gitbucket"
"org.opencontainers.image.vendor" = "GitBucket"
"org.opencontainers.image.version" = "4.40.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.debian-slim" = "true"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

