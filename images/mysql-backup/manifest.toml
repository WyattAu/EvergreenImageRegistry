[metadata]
name = "mysql-backup"
version = "8.0"
description = "MySQL Backup - automated backup solution for MySQL"
vendor = "Community"
source = "https://github.com/databack/mysql-backup4sh"
license = "Apache-2.0"
tier = "standard"
[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/mysql-backup/mysql-backup/releases/download/v8.0/mysql-backup-8.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/app/backup.sh"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "MySQL Backup Container with mysqldump + xz compression"
"org.opencontainers.image.title" = "mysql-backup"
"org.opencontainers.image.vendor" = "Oracle"
"org.opencontainers.image.version" = "8.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
