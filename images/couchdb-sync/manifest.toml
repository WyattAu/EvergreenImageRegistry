[metadata]
tier = "standard"
name = "couchdb-sync"
version = "3.3.3"
description = "CouchDB with sync/replication entrypoint for multi-master deployments"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/couchdb/bin/couchdb", "--with-sync-design-doc"]

[ports]
expose = [5984, 9101]

[labels]
"org.opencontainers.image.description" = "CouchDB with sync/replication entrypoint for multi-master deployments"
"org.opencontainers.image.title" = "couchdb-sync"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "3.3.3"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-5"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-stateful"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
