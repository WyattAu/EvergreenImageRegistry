[metadata]
name = "tautulli-py"
version = "2.14.5"
description = "tautulli-py container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3", "/opt/tautulli/Tautulli.py"]

[ports]
expose = [8181, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/Tautulli/Tautulli"
"org.opencontainers.image.title" = "tautulli-py"
"org.opencontainers.image.vendor" = "Tautulli"
"org.opencontainers.image.version" = "2.14.5"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "media-streaming"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

