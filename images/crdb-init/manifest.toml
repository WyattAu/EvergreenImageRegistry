[metadata]
name = "crdb-init"
version = "23.2.3"
description = "Sovereign hardened CockroachDB init entrypoint"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/cockroach", "init"]

[ports]
expose = [26257, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened CockroachDB init entrypoint"
"org.opencontainers.image.title" = "crdb-init"
"org.opencontainers.image.vendor" = "Cockroach Labs"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

