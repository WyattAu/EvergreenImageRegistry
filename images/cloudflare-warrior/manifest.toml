[metadata]
name = "cloudflare-warrior"
version = "2024.4.1"
description = "Cloudflare Tunnel client (cloudflared)"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/cloudflared"]
cmd = ["tunnel", "--no-autoupdate"]

[ports]
expose = [7844, 9101]

[labels]
"org.opencontainers.image.description" = "Cloudflare Tunnel client (cloudflared)"
"org.opencontainers.image.source" = "https://github.com/cloudflare/cloudflared"
"org.opencontainers.image.title" = "cloudflare-warrior"
"org.opencontainers.image.vendor" = "Cloudflare"
"org.opencontainers.image.version" = "2024.4.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "networking"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

