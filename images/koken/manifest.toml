[metadata]
name = "koken"
version = "0.22.0"
description = "koken container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/koken/Koken-Platform/releases"
"org.opencontainers.image.title" = "koken"
"org.opencontainers.image.vendor" = "koken/Koken-Platform"
"org.opencontainers.image.version" = "0.22.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

