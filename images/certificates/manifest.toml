[metadata]
tier = "standard"
name = "certificates"
version = "1.6.5"
description = "certificates container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/smallstep/step-ca"
[runtime]
entrypoint = ["/cfssl"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/cloudflare/cfssl"
"org.opencontainers.image.title" = "certificates"
"org.opencontainers.image.vendor" = "Cloudflare"
"org.opencontainers.image.version" = "1.6.5"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "security"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
