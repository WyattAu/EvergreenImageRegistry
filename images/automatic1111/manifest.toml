[metadata]
name = "automatic1111"
version = "1.9.3"
description = "automatic1111 container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3", "/opt/automatic1111/launch.py", "--listen", "--port", "7860"]

[ports]
expose = [7860, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/AUTOMATIC1111/stable-diffusion-webui.git"
"org.opencontainers.image.title" = "automatic1111"
"org.opencontainers.image.vendor" = "AUTOMATIC1111"
"org.opencontainers.image.version" = "1.9.3"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

