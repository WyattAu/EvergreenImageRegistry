[metadata]
name = "etcd-operator"
version = "3.6.10"
description = "Evergreen hardened etcd operator tools - etcdctl from etcd-io/etcd"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/etcdctl"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened etcd operator tools - etcdctl from etcd-io/etcd"
"org.opencontainers.image.title" = "etcd-operator"
"org.opencontainers.image.vendor" = "etcd"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

