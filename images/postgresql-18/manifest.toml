[metadata]
name = "postgresql-18"
version = "18.4"
upstream_version = "18.4"
description = "PostgreSQL 18 Database Server"
vendor = "PostgreSQL Global Development Group"
source = "https://www.postgresql.org/"
license = "unknown"
tier = "standard"

[build]
base = "wolfi"
user = "65532:65532"
stopsignal = "SIGTERM"

[runtime]
entrypoint = ["postgresql-18"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "postgresql-18"
"org.opencontainers.image.vendor" = "PostgreSQL Global Development Group"
"org.opencontainers.image.version" = "18.4"
"evergreen.image.tier" = "standard"
"evergreen.image.category" = "database"
"evergreen.constraint.nonroot" = "true"
"evergreen.base.image" = "wolfi"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.init-system" = "none"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.metrics.native" = "ztunnel"
"evergreen.health.type" = "exec"
"evergreen.security.cap-drop" = "ALL"
"evergreen.security.no-new-privileges" = "true"
"evergreen.security.read-only-rootfs" = "true"
"evergreen.security.seccomp" = "runtime-default"
