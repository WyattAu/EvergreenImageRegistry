[metadata]
name = "mysql-init"
version = "8.0"
description = "MySQL Initialization Container"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/app/init.sh"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "MySQL Initialization Container"
"org.opencontainers.image.title" = "mysql-init"
"org.opencontainers.image.vendor" = "Oracle"
"org.opencontainers.image.version" = "8.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

