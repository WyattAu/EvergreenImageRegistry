[metadata]
name = "s3"
version = "RELEASE.2025-10-15T17-29-55Z"
description = "S3 - AWS S3 compatible object storage client"
vendor = "AWS"
source = "https://github.com/aws/aws-cli"
license = "Apache-2.0"
tier = "1"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/s3/s3/releases/download/vRELEASE.2025-10-15T17-29-55Z/s3-RELEASE.2025-10-15T17-29-55Z-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/s3-server"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.title" = "s3"
"org.opencontainers.image.vendor" = "MinIO"
"org.opencontainers.image.version" = "RELEASE.2025-10-15T17-29-55Z"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

