[metadata]
name = "mongodb-6"
version = "6.0.14"
description = "mongodb-6 container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["mongod"]

[ports]
expose = [27017, 9101]

[labels]
"org.opencontainers.image.title" = "mongodb-6"
"org.opencontainers.image.vendor" = "MongoDB"
"org.opencontainers.image.version" = "6.0.14"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.hardened" = "true"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

