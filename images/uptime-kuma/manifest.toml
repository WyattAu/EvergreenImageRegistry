[metadata]
name = "uptime-kuma"
version = "1.23.16"
description = "uptime-kuma container image"
tier = "critical"
upstream_version = "1.23.16"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]

[ports]
expose = [3001, 9101]

[labels]
"org.opencontainers.image.title" = "uptime-kuma"
"org.opencontainers.image.vendor" = "Uptime Kuma"
"org.opencontainers.image.version" = "1.23.16"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
