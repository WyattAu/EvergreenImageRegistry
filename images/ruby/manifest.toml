[metadata]
tier = "standard"
name = "ruby"
version = "3.3.1"
description = "ruby container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/ruby"
[runtime]
entrypoint = ["ruby"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "ruby"
"org.opencontainers.image.vendor" = "Ruby"
"org.opencontainers.image.version" = "3.3.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
