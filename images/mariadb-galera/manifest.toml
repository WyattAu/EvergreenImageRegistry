[metadata]
tier = "standard"
name = "mariadb-galera"
version = "11.4.2"
description = "Evergreen hardened MariaDB Galera - multi-master cluster"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["mariadbd", "--wsrep_new_cluster"]

[ports]
expose = [3306, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened MariaDB Galera - multi-master cluster"
"org.opencontainers.image.title" = "mariadb-galera"
"org.opencontainers.image.vendor" = "MariaDB"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

