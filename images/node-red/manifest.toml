[metadata]
tier = "standard"
name = "node-red"
version = "unknown"
description = "Node-RED - Flow-based programming for IoT"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node", "/app/src/packages/node_modules/node-red/red.js"]
cmd = ["--userDir", "/data"]

[ports]
expose = [1880, 9101]

[labels]
"org.opencontainers.image.description" = "Node-RED - Flow-based programming for IoT"
"org.opencontainers.image.source" = "https://github.com/node-red/node-red"
"org.opencontainers.image.title" = "node-red"
"org.opencontainers.image.vendor" = "Node-RED"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
