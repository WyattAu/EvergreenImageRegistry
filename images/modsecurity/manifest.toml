[metadata]
name = "modsecurity"
version = "2.4.59"
description = "modsecurity container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "appuser"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["apache2"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.title" = "modsecurity"
"org.opencontainers.image.vendor" = "OWASP"
"org.opencontainers.image.version" = "2.4.59"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

