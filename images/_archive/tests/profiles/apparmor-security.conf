#include <tunables/global>

profile evergreen-security flags=(attach_disconnected,mediate_deleted) {
  #include <abstractions/base>
  #include <abstractions/nameservice>

  capability,
  file,
  umount,

  deny capability all,

  network inet tcp,
  network inet6 tcp,

  deny network raw,
  deny network packet,

  network inet tcp bind port 8200,
  network inet tcp bind port 8201,
  network inet tcp bind port 8080,
  network inet tcp bind port 8443,
  network inet tcp bind port 5556,
  network inet tcp bind port 9090,
  network inet tcp bind port 9091,

  network inet6 tcp bind port 8200,
  network inet6 tcp bind port 8201,
  network inet6 tcp bind port 8080,
  network inet6 tcp bind port 8443,
  network inet6 tcp bind port 5556,
  network inet6 tcp bind port 9090,
  network inet6 tcp bind port 9091,

  deny mount,
  deny remount,
  deny mount options=(bind, ro, rw, suid, nosuid, exec, noexec, recursive, private, slave, shared, unbindable, run, make-private, make-slave, make-shared, make-unbindable, make-rprivate, make-rslave, make-rshared, make-runbindable),

  deny signal send peer=/usr/bin/dockerd,
  deny signal send peer=/usr/bin/containerd,
  deny signal send peer=/usr/bin/crio,

  deny ptrace,

  deny /var/run/docker.sock rw,
  deny /run/docker.sock rw,
  deny /var/run/containerd/containerd.sock rw,
  deny /run/containerd/containerd.sock rw,

  /etc/ r,
  /etc/** r,

  /usr/ r,
  /usr/** r,

  /app/ rw,
  /app/** rw,

  /tmp/ rw,
  /tmp/** rw,

  /var/log/ rw,
  /var/log/** rw,

  /var/cache/ rw,
  /var/cache/** rw,

  /var/lib/vault/ rw,
  /var/lib/vault/** rw,

  /var/lib/keycloak/ rw,
  /var/lib/keycloak/** rw,

  /var/lib/dex/ rw,
  /var/lib/dex/** rw,

  /data/ rw,
  /data/** rw,

  /etc/tls/ r,
  /etc/tls/** r,
  /etc/ssl/certs/ r,
  /etc/ssl/certs/** r,

  deny /proc/ r,
  deny /proc/** r,
  deny /sys/ r,
  deny /sys/** r,

  /proc/self/ r,
  /proc/self/** r,
  /proc/*/status r,
  /proc/*/cmdline r,
  /proc/*/comm r,
  /proc/meminfo r,

  /sys/fs/cgroup/ r,
  /sys/fs/cgroup/** r,

  deny /sys/kernel/ r,
  deny /sys/kernel/** r,
  deny /sys/firmware/ r,
  deny /sys/firmware/** r,
  deny /sys/module/ r,
  deny /sys/module/** r,
  deny /sys/fs/selinux/ r,
  deny /sys/fs/selinux/** r,

  deny /etc/shadow r,
  deny /etc/gshadow r,
  deny /etc/ssh/ r,
  deny /etc/ssh/** r,
  deny /root/ r,
  deny /root/** r,
  deny /home/ r,
  deny /home/** r,

  signal (receive) peer=unconfined,
}
