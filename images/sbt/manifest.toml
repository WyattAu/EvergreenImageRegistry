[metadata]
name = "sbt"
version = "1.12.10"
description = "Sovereign hardened sbt - Scala build tool"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["sbt"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened sbt - Scala build tool"
"org.opencontainers.image.title" = "sbt"
"org.opencontainers.image.vendor" = "Scala"
"org.opencontainers.image.version" = "1.12.10"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "30s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

