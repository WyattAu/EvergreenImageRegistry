[metadata]
name = "homepage"
version = "latest"
description = "Homepage - Application dashboard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/gethomepage/homepage:${VERSION}"

[runtime]
entrypoint = ["/homepage"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "Homepage - Application dashboard"
"org.opencontainers.image.source" = "https://github.com/benphelps/homepage"
"org.opencontainers.image.title" = "homepage"
"org.opencontainers.image.vendor" = "benphelps"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

