[metadata]
name = "redismodules"
version = "2.0.0"
description = "Sovereign hardened Redis Modules - bundled Redis extension modules"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["redis-server"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Redis Modules - bundled Redis extension modules"
"org.opencontainers.image.title" = "redismodules"
"org.opencontainers.image.vendor" = "Redis"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

