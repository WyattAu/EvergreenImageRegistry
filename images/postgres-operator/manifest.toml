[metadata]
name = "postgres-operator"
version = "1.12.0"
description = "Postgres Operator - manages PostgreSQL clusters on Kubernetes"
vendor = "Zalando"
source = "https://github.com/zalando/postgres-operator"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "registry.opensource.zalan.do/acid/postgres-operator:v${VERSION}"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/postgres-operator/postgres-operator/releases/download/v1.12.0/postgres-operator-1.12.0-linux-amd64.tar.gz"
binary_name = "postgres-operator"
filename = "postgres-operator-1.12.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 8080
metrics = 9101

[labels]
"org.opencontainers.image.title" = "postgres-operator"
"org.opencontainers.image.description" = "Postgres Operator - manages PostgreSQL clusters on Kubernetes"
"org.opencontainers.image.version" = "1.12.0"
"org.opencontainers.image.vendor" = "Zalando"
"org.opencontainers.image.source" = "https://github.com/zalando/postgres-operator"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
