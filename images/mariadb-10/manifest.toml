[metadata]
name = "mariadb-10"
version = "10.11.6"
description = "Sovereign hardened MariaDB 10.x - LTS SQL database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["mariadbd"]

[ports]
expose = [3306, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened MariaDB 10.x - LTS SQL database"
"org.opencontainers.image.title" = "mariadb-10"
"org.opencontainers.image.vendor" = "MariaDB"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

