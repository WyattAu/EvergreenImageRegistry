[metadata]
name = "alpine"
version = "unknown"
description = "Evergreen reference wrapper for Alpine-compatible base (wolfi). Alpine is banned for application images."
tier = "critical"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen reference wrapper for Alpine-compatible base (wolfi). Alpine is banned for application images."
"org.opencontainers.image.title" = "alpine"
"evergreen.base.image" = "wolfi"
"evergreen.health.type" = "none"
"evergreen.image.category" = "base"
"evergreen.image.note" = "Alpine is banned for application images. This is a wolfi wrapper for build-time reference only."
"evergreen.image.status" = "reference"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
