[metadata]
tier = "standard"
name = "it-tools"
version = "2024.10.22-7ca5933"
description = "it-tools container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/corentinth-it-tools-latest"
[runtime]
entrypoint = ["/it-tools"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.title" = "it-tools"
"org.opencontainers.image.vendor" = "IT-Tools"
"org.opencontainers.image.version" = "2024.10.22-7ca5933"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
