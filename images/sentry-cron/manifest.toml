[metadata]
tier = "standard"
name = "sentry-cron"
version = "nightly"
description = "sentry-cron container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "getsentry/sentry:${VERSION}"

[runtime]
entrypoint = ["sentry"]
cmd = ["cron"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/getsentry/self-hosted"
"org.opencontainers.image.title" = "sentry-cron"
"org.opencontainers.image.vendor" = "Sentry"
"org.opencontainers.image.version" = "26.4.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "30s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "60000ms"
"evergreen.image.category" = "monitoring"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

