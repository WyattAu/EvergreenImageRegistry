[metadata]
name = "keycloak-operator"
version = "24.0.2"
description = "keycloak-operator container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "quay.io/keycloak/keycloak-operator:${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/keycloak-operator"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/keycloak/keycloak-operator"
"org.opencontainers.image.title" = "keycloak-operator"
"org.opencontainers.image.vendor" = "Keycloak"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "identity"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

