[metadata]
name = "thanos-bucket"
version = "unknown"
description = "thanos-bucket container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/thanos"]
cmd = ["bucket"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/thanos-io/thanos"
"org.opencontainers.image.title" = "thanos-bucket"
"org.opencontainers.image.vendor" = "Thanos"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "observability"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

