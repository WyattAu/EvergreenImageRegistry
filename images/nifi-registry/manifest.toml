[metadata]
name = "nifi-registry"
version = "1.26.0"
description = "Sovereign hardened NiFi Registry - versioned flow management for Apache NiFi"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/nifi-registry/bin/nifi-registry.sh", "run"]

[ports]
expose = [18080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened NiFi Registry - versioned flow management for Apache NiFi"
"org.opencontainers.image.title" = "nifi-registry"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "1.26.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "data-flow"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

