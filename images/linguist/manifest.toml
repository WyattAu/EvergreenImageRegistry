[metadata]
name = "linguist"
version = "unknown"
description = "GitHub Linguist - language detection"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["linguist"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "GitHub Linguist - language detection"
"org.opencontainers.image.source" = "https://github.com/github/linguist"
"org.opencontainers.image.title" = "linguist"
"org.opencontainers.image.vendor" = "GitHub"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

