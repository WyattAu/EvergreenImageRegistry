[metadata]
name = "spamassassin"
version = "4.0.0"
description = "spamassassin container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["spamassassin"]
cmd = ["-d"]

[ports]
expose = [783, 9101]

[labels]
"sovereign.base.image" = "wolfi"
"sovereign.health.type" = "exec"
"sovereign.metrics.native" = "ztunnel"

