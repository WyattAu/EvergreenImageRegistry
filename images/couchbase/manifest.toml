[metadata]
name = "couchbase"
version = "7.6.1"
description = "Couchbase - distributed NoSQL cloud database"
vendor = "Couchbase"
source = "https://github.com/couchbase/couchbase-cli"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/couchbase/couchbase/releases/download/v7.6.1/couchbase-7.6.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/couchbase/bin/couchbase-server"]

[ports]
expose = [8091, 9101]

[labels]
"org.opencontainers.image.title" = "couchbase"
"org.opencontainers.image.vendor" = "Couchbase"
"org.opencontainers.image.version" = "7.6.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "4-5"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-stateful"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.sched-policy" = "SCHED_OTHER"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
