[metadata]
name = "prometheus-mysqld-exporter"
version = "0.19.0"
description = "MySQL Prometheus Exporter - metrics exporter for MySQL"
vendor = "Prometheus"
source = "https://github.com/prometheus/mysqld_exporter"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/prometheus-mysqld-exporter/prometheus-mysqld-exporter/releases/download/v0.19.0/prometheus-mysqld-exporter-0.19.0-linux-amd64.tar.gz"
binary_name = "prometheus-mysqld-exporter"
filename = "prometheus-mysqld-exporter-0.19.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9104
metrics = 9101

[labels]
"org.opencontainers.image.title" = "prometheus-mysqld-exporter"
"org.opencontainers.image.description" = "MySQL Prometheus Exporter - metrics exporter for MySQL"
"org.opencontainers.image.version" = "0.19.0"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.source" = "https://github.com/prometheus/mysqld_exporter"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
