[metadata]
name = "helm"
version = "3.15.1"
description = "Helm - package manager for Kubernetes"
vendor = "Helm"
source = "https://github.com/helm/helm"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://get.helm.sh/helm-v3.15.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/helm"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.title" = "helm"
"org.opencontainers.image.vendor" = "Helm"
"org.opencontainers.image.version" = "3.15.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

