[metadata]
name = "cachet"
version = "2.5.1"
description = "Cachet - open source status page system"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "cachethq/docker:${VERSION}"

[runtime]
entrypoint = ["/usr/sbin/php-fpm8.4", "-F"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.description" = "Cachet - open source status page system"
"org.opencontainers.image.title" = "cachet"
"org.opencontainers.image.vendor" = "CachetHQ"
"org.opencontainers.image.version" = "2.5.1"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.connection-drain" = "true"
"sovereign.hft.cpu-pins" = "2-3"
"sovereign.hft.cpu-pins-mode" = "shared"
"sovereign.hft.deploy-strategy" = "standard-rolling"
"sovereign.hft.init-system" = "none"
"sovereign.hft.pre-stop-delay" = "10s"
"sovereign.hft.pre-stop-hook" = "true"
"sovereign.hft.runtime" = "php"
"sovereign.hft.sched-policy" = "SCHED_OTHER"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "30000ms"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

