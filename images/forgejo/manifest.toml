[metadata]
name = "forgejo"
version = "14.0.4"
description = "Forgejo - community-owned lightweight software forge"
vendor = "Forgejo"
source = "https://github.com/forgejo/forgejo"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "git"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/forgejo/forgejo/releases/download/v14.0.4/forgejo-14.0.4-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/forgejo"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.title" = "forgejo"
"org.opencontainers.image.vendor" = "Forgejo"
"org.opencontainers.image.version" = "14.0.4"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.wolfi" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

