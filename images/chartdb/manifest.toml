[metadata]
tier = "standard"
name = "chartdb"
version = "v1.20.1"
description = "Evergreen hardened ChartDB - database schema visualization tool"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/chart-db/chartdb:${VERSION}"

[runtime]
entrypoint = ["java", "-jar", "/opt/chartdb/chartdb.jar"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened ChartDB - database schema visualization tool"
"org.opencontainers.image.title" = "chartdb"
"org.opencontainers.image.vendor" = "ChartDB"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
