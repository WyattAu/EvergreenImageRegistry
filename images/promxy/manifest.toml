[metadata]
tier = "standard"
name = "promxy"
version = "0.0.93"
description = "Evergreen hardened promxy - Prometheus proxy"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/promxy"]

[ports]
expose = [8082, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened promxy - Prometheus proxy"
"org.opencontainers.image.title" = "promxy"
"org.opencontainers.image.vendor" = "prymitive"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
