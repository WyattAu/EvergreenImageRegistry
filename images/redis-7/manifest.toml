[metadata]
tier = "standard"
name = "redis-7"
version = "7.4.1"
description = "redis-7 container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["redis"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.title" = "redis-7"
"org.opencontainers.image.vendor" = "Redis"
"org.opencontainers.image.version" = "7.4.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
