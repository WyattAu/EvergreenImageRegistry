[metadata]
name = "wireguard"
version = "0.0.20230223"
description = "WireGuard - fast, modern, secure VPN tunnel"
vendor = "WireGuard"
source = "https://github.com/WireGuard/wireguard-go"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/wireguard/wireguard/releases/download/v0.0.20230223/wireguard-0.0.20230223-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/wireguard-go"]
cmd = ["-f", "wg0"]

[ports]
expose = [51820/udp, 9101]

[labels]
"org.opencontainers.image.source" = "https://git.zx2c4.com/wireguard-go"
"org.opencontainers.image.title" = "wireguard"
"org.opencontainers.image.vendor" = "WireGuard"
"org.opencontainers.image.version" = "0.0.20230223"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "networking"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

