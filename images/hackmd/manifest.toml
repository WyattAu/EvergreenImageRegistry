[metadata]
name = "hackmd"
version = "2.6.0"
description = "HackMD CE - collaborative markdown notes"
vendor = "HackMD"
source = "https://github.com/hackmdio/hackmd-ce"
category = "productivity"
tier = "2"

[build]
base = "wolfi"
arch = "amd64"

[download]
url = "https://github.com/hackmdio/hackmd-ce/releases/download/v2.6.0/hackmd-ce-v2.6.0.tar.gz"
filename = "hackmd-ce-v2.6.0.tar.gz"
strip_components = 1
binary_name = ""

[container]
port = 3000
metrics_port = 9101
user = "65532:65532"
workdir = "/app"
entrypoint = ["node", "app.js"]
stop_signal = "SIGTERM"
nonroot = true

[labels]
"org.opencontainers.image.title" = "hackmd"
"org.opencontainers.image.description" = "HackMD CE - collaborative markdown notes"
"org.opencontainers.image.vendor" = "HackMD"
"org.opencontainers.image.source" = "https://github.com/hackmdio/hackmd-ce"
"org.opencontainers.image.version" = "2.6.0"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.base.image" = "wolfi"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
