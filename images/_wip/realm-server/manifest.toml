[metadata]
name = "realm-server"
version = "latest"
description = "Evergreen hardened MongoDB Realm Server - application backend platform"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "realm/mongodb-realm:${VERSION}"

[runtime]
entrypoint = ["/opt/realm/bin/realm-server"]

[ports]
expose = [9090, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened MongoDB Realm Server - application backend platform"
"org.opencontainers.image.title" = "realm-server"
"org.opencontainers.image.vendor" = "MongoDB"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

