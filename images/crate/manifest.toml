[metadata]
tier = "standard"
name = "crate"
version = "5.9.0"
description = "Evergreen hardened CrateDB - distributed SQL database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/crate/bin/crate"]

[ports]
expose = [4200, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened CrateDB - distributed SQL database"
"org.opencontainers.image.title" = "crate"
"org.opencontainers.image.vendor" = "Crate.io"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

