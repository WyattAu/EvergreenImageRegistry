[metadata]
name = "mailtrain"
version = "1.38.0"
description = "Mailtrain - self-hosted newsletter and mailing list manager"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node", "dist/index.js"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "Mailtrain - self-hosted newsletter and mailing list manager"
"org.opencontainers.image.source" = "https://github.com/Mailtrain/mailtrain"
"org.opencontainers.image.title" = "mailtrain"
"org.opencontainers.image.vendor" = "Mailtrain"
"org.opencontainers.image.version" = "1.38.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.debian-slim" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

status = "wip"
