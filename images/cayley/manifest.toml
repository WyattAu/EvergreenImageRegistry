[metadata]
name = "cayley"
version = "0.7.7"
description = "Sovereign hardened Cayley - graph database with query language"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/cayley"]

[ports]
expose = [64210, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Cayley - graph database with query language"
"org.opencontainers.image.title" = "cayley"
"org.opencontainers.image.vendor" = "CayleyGraph"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

