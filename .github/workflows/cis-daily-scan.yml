name: CIS/STIG Daily Scan

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  cis-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [critical]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Run CIS scan
        run: |
          chmod +x compliance/cis/run_cis_scan.sh
          ./compliance/cis/run_cis_scan.sh --tier ${{ matrix.tier }} --output cis-results-${{ matrix.tier }}.json

      - name: Generate XCCDF report
        if: false  # generate_xccdf.sh interface does not match this pipeline yet

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cis-scan-results-${{ matrix.tier }}
          path: |
            cis-results-*.json
            xccdf-report.xml
          retention-days: 30

      - name: Summarize scores
        run: |
          # Per-image .txt reports carry a 'Score: N%' line; aggregate + report.
          if ls cis-results-${{ matrix.tier }}/*.txt >/dev/null 2>&1; then
            grep -h 'Score:' cis-results-${{ matrix.tier }}/*.txt | grep -oE '[0-9]+%' | tr -d '%' | \
              awk '{s+=$1; n+=1} END {if (n>0) printf "Average CIS score across %d image(s): %.0f%%\n", n, s/n}'
            echo "Reports:" && ls cis-results-${{ matrix.tier }}/
          else
            echo "No CIS reports produced"
          fi
