[metadata]
name = "couchbase"
version = "7.6.1"
description = "Couchbase - distributed NoSQL cloud database"
vendor = "Couchbase"
source = "https://github.com/couchbase/couchbase-cli"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/couchbase/couchbase/releases/download/v7.6.1/couchbase-7.6.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/couchbase/bin/couchbase-server"]

[ports]
expose = [8091, 9101]

[labels]
"org.opencontainers.image.title" = "couchbase"
"org.opencontainers.image.vendor" = "Couchbase"
"org.opencontainers.image.version" = "7.6.1"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.connection-drain" = "true"
"sovereign.hft.cpu-pins" = "4-5"
"sovereign.hft.cpu-pins-mode" = "exclusive"
"sovereign.hft.deploy-strategy" = "hft-stateful"
"sovereign.hft.init-system" = "none"
"sovereign.hft.pre-stop-delay" = "5s"
"sovereign.hft.pre-stop-hook" = "true"
"sovereign.hft.sched-policy" = "SCHED_OTHER"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

