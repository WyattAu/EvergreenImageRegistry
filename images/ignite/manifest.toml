[metadata]
name = "ignite"
version = "2.16.0"
description = "Sovereign hardened Apache Ignite - distributed database and in-memory computing"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/ignite/bin/ignite.sh"]

[ports]
expose = [10800, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Apache Ignite - distributed database and in-memory computing"
"org.opencontainers.image.title" = "ignite"
"org.opencontainers.image.vendor" = "Apache Software Foundation"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

