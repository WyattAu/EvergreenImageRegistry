[metadata]
name = "headscale"
version = "0.16.0"
description = "Headscale - open source implementation of the Tailscale control server"
vendor = "Headscale"
source = "https://github.com/juanfont/headscale"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/headscale/headscale/releases/download/v0.16.0/headscale-0.16.0-linux-amd64.tar.gz"
binary_name = "headscale"
filename = "headscale-0.16.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 8080
metrics = 9101

[labels]
"org.opencontainers.image.title" = "headscale"
"org.opencontainers.image.description" = "Headscale - open source implementation of the Tailscale control server"
"org.opencontainers.image.version" = "0.16.0"
"org.opencontainers.image.vendor" = "Headscale"
"org.opencontainers.image.source" = "https://github.com/juanfont/headscale"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
