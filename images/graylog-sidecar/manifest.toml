[metadata]
tier = "standard"
name = "graylog-sidecar"
version = "1.5.2"
description = "Evergreen hardened Graylog Sidecar - log collector management agent"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/sidecar/collector_sidecar"]

[ports]
expose = [8989, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Graylog Sidecar - log collector management agent"
"org.opencontainers.image.title" = "graylog-sidecar"
"org.opencontainers.image.vendor" = "Graylog"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "observability"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
