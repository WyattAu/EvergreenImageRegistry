[metadata]
tier = "standard"
name = "node-red-admin"
version = "unknown"
description = "Node-RED admin CLI tool"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node-red-admin"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Node-RED admin CLI tool"
"org.opencontainers.image.source" = "https://github.com/node-red/node-red"
"org.opencontainers.image.title" = "node-red-admin"
"org.opencontainers.image.vendor" = "Node-RED"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
