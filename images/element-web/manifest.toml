[metadata]
name = "element-web"
version = "1.11.14"
description = "Element Web - web client for Matrix"
vendor = "Element"
source = "https://github.com/element-hq/element-web"
tier = "2"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/element-hq/element-web/releases/download/v1.11.14/element-v1.11.14.tar.gz"

[runtime]
entrypoint = ["busybox", "httpd", "-f", "-p", "80", "-h", "/app"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "Element Web - web client for Matrix"
"org.opencontainers.image.source" = "https://github.com/element-hq/element-web"
"org.opencontainers.image.title" = "element-web"
"org.opencontainers.image.vendor" = "Element"
"org.opencontainers.image.version" = "1.11.14"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

