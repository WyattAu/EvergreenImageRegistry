[metadata]
name = "dagster"
version = "1.10.0"
description = "Dagster - data orchestration platform"
vendor = "Dagster"
source = "https://github.com/dagster-io/dagster"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "cgr.dev/chainguard/wolfi-base:latest"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/dagster/dagster/releases/download/v1.10.0/dagster-1.10.0-linux-amd64.tar.gz"
binary_name = "dagster"
filename = "dagster-1.10.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 3000
metrics = 9101

[labels]
"org.opencontainers.image.title" = "dagster"
"org.opencontainers.image.description" = "Dagster - data orchestration platform"
"org.opencontainers.image.version" = "1.10.0"
"org.opencontainers.image.vendor" = "Dagster"
"org.opencontainers.image.source" = "https://github.com/dagster-io/dagster"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
