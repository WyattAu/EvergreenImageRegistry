[metadata]
name = "mqtt"
version = "2.0.18"
description = "mqtt container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "mosquitto"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["mosquitto"]

[ports]
expose = [1883, 9101]

[labels]
"org.opencontainers.image.title" = "mqtt"
"org.opencontainers.image.vendor" = "Eclipse"
"org.opencontainers.image.version" = "2.0.18"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

