[metadata]
name = "gitea-editor"
version = "1.26.1"
description = "Gitea Web Editor - Git hosting with integrated web editor"
vendor = "Gitea"
source = "https://github.com/go-gitea/gitea"
license = "MIT"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/go-gitea/gitea/releases/download/v1.26.1/gitea-1.26.1-linux-amd64"

[runtime]
entrypoint = ["gitea"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "Gitea Web Editor - Git hosting with integrated web editor"
"org.opencontainers.image.source" = "https://github.com/go-gitea/gitea"
"org.opencontainers.image.title" = "gitea-editor"
"org.opencontainers.image.vendor" = "Gitea"
"org.opencontainers.image.version" = "1.26.1"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

