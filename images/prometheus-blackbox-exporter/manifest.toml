[metadata]
name = "prometheus-blackbox-exporter"
version = "0.28.0"
description = "Blackbox Exporter - probing endpoints for Prometheus"
vendor = "Prometheus"
source = "https://github.com/prometheus/blackbox_exporter"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/prometheus-blackbox-exporter/prometheus-blackbox-exporter/releases/download/v0.28.0/prometheus-blackbox-exporter-0.28.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/blackbox_exporter"]

[ports]
expose = [9115, 9101]

[labels]
"org.opencontainers.image.description" = "Prometheus exporter for endpoint probing"
"org.opencontainers.image.title" = "Prometheus Blackbox Exporter"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.version" = "0.28.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.connection-drain" = "true"
"sovereign.hft.cpu-pins" = "4-5"
"sovereign.hft.cpu-pins-mode" = "exclusive"
"sovereign.hft.deploy-strategy" = "hft-stateful"
"sovereign.hft.init-system" = "none"
"sovereign.hft.pre-stop-delay" = "5s"
"sovereign.hft.pre-stop-hook" = "true"
"sovereign.hft.sched-policy" = "SCHED_OTHER"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

