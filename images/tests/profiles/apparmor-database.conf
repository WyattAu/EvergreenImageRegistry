#include <tunables/global>

profile evergreen-database flags=(attach_disconnected,mediate_deleted) {
  #include <abstractions/base>
  #include <abstractions/nameservice>

  capability,
  file,
  umount,

  deny capability all,

  network inet tcp,
  network inet6 tcp,

  deny network raw,
  deny network packet,

  network inet tcp bind port 5432,
  network inet tcp bind port 3306,
  network inet tcp bind port 6379,
  network inet tcp bind port 27017,
  network inet tcp bind port 27018,
  network inet tcp bind port 27019,
  network inet tcp bind port 28017,
  network inet tcp bind port 9200,
  network inet tcp bind port 9300,
  network inet tcp bind port 1521,
  network inet tcp bind port 1433,
  network inet tcp bind port 26257,
  network inet tcp bind port 8529,

  network inet6 tcp bind port 5432,
  network inet6 tcp bind port 3306,
  network inet6 tcp bind port 6379,
  network inet6 tcp bind port 27017,
  network inet6 tcp bind port 27018,
  network inet6 tcp bind port 27019,
  network inet6 tcp bind port 28017,
  network inet6 tcp bind port 9200,
  network inet6 tcp bind port 9300,

  deny mount,
  deny remount,
  deny mount options=(bind, ro, rw, suid, nosuid, exec, noexec, recursive, private, slave, shared, unbindable, run, make-private, make-slave, make-shared, make-unbindable, make-rprivate, make-rslave, make-rshared, make-runbindable),

  deny signal send peer=/usr/bin/dockerd,
  deny signal send peer=/usr/bin/containerd,
  deny signal send peer=/usr/bin/crio,

  deny ptrace,

  deny /var/run/docker.sock rw,
  deny /run/docker.sock rw,
  deny /var/run/containerd/containerd.sock rw,
  deny /run/containerd/containerd.sock rw,

  /etc/ r,
  /etc/** r,

  /usr/ r,
  /usr/** r,

  /app/ rw,
  /app/** rw,

  /tmp/ rw,
  /tmp/** rw,

  /var/log/ rw,
  /var/log/** rw,

  /var/cache/ rw,
  /var/cache/** rw,

  /var/lib/postgresql/ rw,
  /var/lib/postgresql/** rw,

  /var/lib/mysql/ rw,
  /var/lib/mysql/** rw,

  /var/lib/redis/ rw,
  /var/lib/redis/** rw,

  /var/lib/mongodb/ rw,
  /var/lib/mongodb/** rw,

  /var/lib/mysql-files/ rw,
  /var/lib/mysql-files/** rw,

  /data/ rw,
  /data/** rw,

  deny /proc/ r,
  deny /proc/** r,
  deny /sys/ r,
  deny /sys/** r,

  /proc/self/ r,
  /proc/self/** r,
  /proc/*/status r,
  /proc/*/cmdline r,
  /proc/*/comm r,
  /proc/meminfo r,
  /proc/sys/vm/overcommit_memory r,
  /proc/sys/net/core/somaxconn r,

  /sys/fs/cgroup/ r,
  /sys/fs/cgroup/** r,

  deny /sys/kernel/ r,
  deny /sys/kernel/** r,
  deny /sys/firmware/ r,
  deny /sys/firmware/** r,
  deny /sys/module/ r,
  deny /sys/module/** r,

  deny /etc/shadow r,
  deny /etc/gshadow r,
  deny /etc/ssh/ r,
  deny /etc/ssh/** r,
  deny /root/ r,
  deny /root/** r,

  signal (receive) peer=unconfined,
}
