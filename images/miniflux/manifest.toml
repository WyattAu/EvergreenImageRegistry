[metadata]
name = "miniflux"
version = "2.2.19"
description = "Miniflux - minimalist RSS/Atom feed reader"
vendor = "Miniflux"
source = "https://github.com/miniflux/v2"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/miniflux/miniflux/releases/download/v2.2.19/miniflux-2.2.19-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/miniflux"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.title" = "miniflux"
"org.opencontainers.image.vendor" = "Miniflux"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

