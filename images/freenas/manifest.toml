[metadata]
name = "freenas"
version = "0.1.0"
description = "Placeholder - OS image, not containerizable"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["true"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Placeholder - OS image, not containerizable"
"org.opencontainers.image.title" = "freenas"
"org.opencontainers.image.vendor" = "FreeNAS"
"org.opencontainers.image.version" = "0.1.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

