# =============================================================================
# EVERGREEN IMAGE REGISTRY - VULNERABILITY SLA MONITOR
# =============================================================================
# Monitors CVE remediation SLAs and creates issues when violations occur.
#
# SLA Policy:
#   - CRITICAL: Must be fixed within 7 days
#   - HIGH: Must be fixed within 30 days
#   - MEDIUM: Must be fixed within 90 days
#
# Schedule: Daily at 08:00 UTC
# Manual:   workflow_dispatch
# =============================================================================

name: Vulnerability SLA Monitor

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 08:00 UTC
  workflow_dispatch:

concurrency:
  group: vuln-sla-monitor
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  CRITICAL_SLA_DAYS: 7
  HIGH_SLA_DAYS: 30
  MEDIUM_SLA_DAYS: 90

jobs:
  check-sla:
    name: Check Vulnerability SLAs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Check existing CVE issues
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN 
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from datetime import datetime, timezone, timedelta

          # SLA thresholds
          CRITICAL_SLA = int(os.environ.get("CRITICAL_SLA_DAYS", 7))
          HIGH_SLA = int(os.environ.get("HIGH_SLA_DAYS", 30))
          MEDIUM_SLA = int(os.environ.get("MEDIUM_SLA_DAYS", 90))

          # Get current date
          now = datetime.now(timezone.utc)

          # Check for open CVE issues
          import subprocess
          result = subprocess.run(
              ["gh", "issue", "list", "--label", "cve,automated", "--state", "open",
               "--json", "number,title,createdAt,labels", "--limit", "100"],
              capture_output=True, text=True
          )

          if result.returncode != 0:
              print("Failed to list issues")
              issues = []
          else:
              issues = json.loads(result.stdout)

          violations = []
          for issue in issues:
              title = issue.get("title", "")
              created = issue.get("createdAt", "")
              labels = [l.get("name", "") for l in issue.get("labels", [])]

              if not created:
                  continue

              # Parse creation date
              try:
                  created_dt = datetime.fromisoformat(created.replace("Z", "+00:00"))
              except Exception:
                  continue

              age_days = (now - created_dt).days

              # Determine severity from title
              severity = None
              sla_days = None
              if "CRITICAL" in title.upper():
                  severity = "CRITICAL"
                  sla_days = CRITICAL_SLA
              elif "HIGH" in title.upper():
                  severity = "HIGH"
                  sla_days = HIGH_SLA
              elif "MEDIUM" in title.upper():
                  severity = "MEDIUM"
                  sla_days = MEDIUM_SLA

              if severity and age_days > sla_days:
                  violations.append({
                      "number": issue["number"],
                      "title": title,
                      "severity": severity,
                      "age_days": age_days,
                      "sla_days": sla_days,
                      "overdue_days": age_days - sla_days,
                  )

          # Output results
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"violation_count={len(violations)\n")
              if violations:
                  # Sort by overdue days (most overdue first)
                  violations.sort(key=lambda x: x["overdue_days"], reverse=True)
                  f.write(f"violations={json.dumps(violations)\n")

          print(f"Found {len(violations) SLA violations")
          for v in violations:
              print(f"  #{v['number']: {v['severity'] - {v['age_days'] days old (SLA: {v['sla_days'])")

          PYEOF

      - name: Create SLA violation issue
        if: steps.check.outputs.violation_count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const violations = JSON.parse(process.env.VIOLATIONS || '[]');
            const date = new Date().toISOString().split('T')[0];

            if (violations.length === 0) {
              console.log('No violations to report');
              return;
            

            // Check if we already have an open SLA issue for today
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'sla-violation,automated',
              state: 'open',
            );

            const todayIssue = existing.data.find(i =>
              i.title.includes(date) && i.title.includes('SLA')
            );

            if (todayIssue) {
              console.log(`SLA issue already exists: #${todayIssue.number`);
              return;
            

            // Build issue body
            const rows = violations.map(v =>
              `| #${v.number | ${v.severity | ${v.age_days days | ${v.sla_days days | **${v.overdue_days days overdue** |`
            ).join('\n');

            const criticalCount = violations.filter(v => v.severity === 'CRITICAL').length;
            const highCount = violations.filter(v => v.severity === 'HIGH').length;

            const body = [
              `## Vulnerability SLA Violations - ${date`,
              '',
              `**${violations.length** open CVE issues have exceeded their remediation SLA.`,
              '',
              '| Issue | Severity | Age | SLA | Status |',
              '|-------|----------|-----|-----|--------|',
              rows,
              '',
              '### SLA Policy',
              '',
              '| Severity | SLA |',
              '|----------|-----|',
              '| CRITICAL | 7 days |',
              '| HIGH | 30 days |',
              '| MEDIUM | 90 days |',
              '',
              '### Action Required',
              '',
              '- Review and remediate overdue vulnerabilities',
              '- Update CVE issues with fix status',
              '- Rebuild affected images after remediation',
              '',
              `### Details`,
              '',
              `- **Workflow Run**: [${context.runNumber](${context.serverUrl/${context.repository/actions/runs/${context.runId)`,
              `- **Check Date**: ${date`,
              `- **CRITICAL violations**: ${criticalCount`,
              `- **HIGH violations**: ${highCount`,
              '',
              '_This issue was automatically created by the Vulnerability SLA Monitor workflow._'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[SLA-VIOLATION] ${violations.length CVE issues exceed remediation SLA - ${date`,
              body: body,
              labels: ['sla-violation', 'security', 'automated'],
            );

      - name: Generate summary
        if: always()
        run: |
          {
            echo "## Vulnerability SLA Check"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| SLA Violations | ${{ steps.check.outputs.violation_count  |"
            echo ""
            if [ "${{ steps.check.outputs.violation_count " = "0" ]; then
              echo "No SLA violations detected."
            else
              echo "Issues exceeding SLA thresholds have been reported."
            fi
           >> "$GITHUB_STEP_SUMMARY"
