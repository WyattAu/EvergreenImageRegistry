[metadata]
tier = "standard"
name = "pulsar-proxy"
version = "3.2.0"
description = "Evergreen hardened Pulsar Proxy - multi-tenant message routing proxy"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/pulsar/bin/pulsar"]
cmd = ["proxy"]

[ports]
expose = [6650, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Pulsar Proxy - multi-tenant message routing proxy"
"org.opencontainers.image.title" = "pulsar-proxy"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "15s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "messaging"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
