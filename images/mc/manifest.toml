[metadata]
name = "mc"
version = "RELEASE.2025-04-08T16-46-15Z"
description = "mc container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/mc"]

[ports]
expose = [0, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/minio/mc"
"org.opencontainers.image.title" = "mc"
"org.opencontainers.image.vendor" = "MinIO"
"org.opencontainers.image.version" = "RELEASE.2025-04-08T16-46-15Z"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "10000ms"
"sovereign.image.category" = "cloud-storage"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

