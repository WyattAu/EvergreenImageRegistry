[metadata]
tier = "standard"
name = "redismodules"
version = "2.0.0"
description = "Evergreen hardened Redis Modules - bundled Redis extension modules"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["redis-server"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Redis Modules - bundled Redis extension modules"
"org.opencontainers.image.title" = "redismodules"
"org.opencontainers.image.vendor" = "Redis"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
