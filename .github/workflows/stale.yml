name: Stale Issues & PRs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had any activity for 60 days.
            It will be closed in 14 days if no further activity occurs.
            If this issue is still relevant, please comment to keep it open.
          stale-pr-message: |
            This PR has been automatically marked as stale because it has not had any activity for 60 days.
            It will be closed in 14 days if no further activity occurs.
            If this PR is still being worked on, please comment to keep it open.
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,do-not-merge-automatically'
          exempt-pr-labels: 'pinned,security,do-not-merge-automatically'
          remove-stale-when-updated: true
          delete-branch: false
