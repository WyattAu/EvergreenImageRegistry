[metadata]
name = "nginx"
version = "1.27.1"
description = "Nginx - HTTP and reverse proxy server"
vendor = "Nginx Inc"
source = "https://github.com/nginx/nginx"
license = "BSD-2-Clause"
tier = "1"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/nginx/nginx/releases/download/v1.27.1/nginx-1.27.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/nginx"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.title" = "nginx"
"org.opencontainers.image.vendor" = "Nginx Inc"
"org.opencontainers.image.version" = "1.27.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.connection-drain" = "true"
"sovereign.hft.cpu-pins" = "0-1"
"sovereign.hft.cpu-pins-mode" = "exclusive"
"sovereign.hft.deploy-strategy" = "hft-rolling"
"sovereign.hft.init-system" = "none"
"sovereign.hft.pre-stop-delay" = "5s"
"sovereign.hft.pre-stop-hook" = "true"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.hft.xdp-capable" = "true"
"sovereign.hft.xdp-mode" = "generic"
"sovereign.hft.xdp-notes" = "Requires custom nginx module or eBPF loader"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

