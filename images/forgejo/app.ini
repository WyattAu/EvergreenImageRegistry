; =============================================================================
; Evergreen Hardened Forgejo - Default Configuration
; =============================================================================
; Environment variables (FORGEJO__*) override these values.
; Format: FORGEJO__section__key=value
; =============================================================================

[database]
DB_TYPE = sqlite3
HOST = 127.0.0.1:3306
NAME = forgejo
USER = root
PASSWD =
SSL_MODE = disable
PATH = data/forgejo.db

[repository]
ROOT = /data/git/repositories

[server]
DOMAIN = localhost
SSH_DOMAIN = localhost
SSH_PORT = 22
SSH_LISTEN_PORT = 2522
ROOT_URL = http://localhost:3000
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
DISABLE_SSH = false
START_SSH_SERVER = true
ENABLE_SSH_SERVER = true
LFS_START_SERVER = false
OFFLINE_MODE = false

[service]
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = false
REQUIRE_SIGNIN_CONFIRM = false
ENABLE_NOTIFY_MAIL = false
SHOW_REGISTRATION_BUTTON = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
DEFAULT_ENABLE_TIMETRACKING = true

[oauth2_client]
ENABLED = false

[mailer]
ENABLED = false
PROTOCOL = smtp+starttls

[log]
MODE = console
LEVEL = info
ROOT_PATH = /data/log

[actions]
ENABLED = false
DEFAULT_ACTIONS_URL = https://code.forgejo.org

[container]
ENABLE = false

[security]
INSTALL_LOCK = true
SECRET_KEY =
INTERNAL_TOKEN =
DISABLE_GIT_HOOKS = false
DISABLE_WEBHOOKS = false
