[metadata]
name = "blackbox-exporter"
version = "v0.28.0"
upstream_version = "v0.26.0"
description = "Blackbox Exporter - endpoint probing for Prometheus"
vendor = "Prometheus"
source = "https://github.com/prometheus/blackbox_exporter"
license = "Apache-2.0"
tier = "critical"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "binary-release"
url = "https://github.com/prometheus/blackbox_exporter/releases/download/v0.26.0/blackbox_exporter-0.26.0.linux-amd64.tar.gz"

[runtime]
entrypoint = ["/blackbox_exporter"]

[ports]
expose = [9115, 9101]

[labels]
"org.opencontainers.image.title" = "blackbox-exporter"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.version" = "v0.26.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.connection-drain" = "true"
"evergreen.hft.cpu-pins" = "0-1"
"evergreen.hft.cpu-pins-mode" = "exclusive"
"evergreen.hft.deploy-strategy" = "hft-rolling"
"evergreen.hft.init-system" = "none"
"evergreen.hft.pre-stop-delay" = "5s"
"evergreen.hft.pre-stop-hook" = "true"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
