[metadata]
name = "graphdb-free"
version = "latest"
description = "Evergreen hardened GraphDB Free - semantic graph database"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ontotext/graphdb-free:${VERSION}"

[runtime]
entrypoint = ["/opt/graphdb/bin/graphdb"]

[ports]
expose = [7200, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened GraphDB Free - semantic graph database"
"org.opencontainers.image.title" = "graphdb-free"
"org.opencontainers.image.vendor" = "Ontotext"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

