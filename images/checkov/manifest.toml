[metadata]
tier = "standard"
name = "checkov"
version = "unknown"
description = "Checkov - Infrastructure as Code scanner"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["checkov"]
cmd = ["-d", "."]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Checkov - Infrastructure as Code scanner"
"org.opencontainers.image.source" = "https://github.com/bridgecrewio/checkov"
"org.opencontainers.image.title" = "checkov"
"org.opencontainers.image.vendor" = "Bridgecrew"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
