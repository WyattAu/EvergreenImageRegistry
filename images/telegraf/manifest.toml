[metadata]
name = "telegraf"
version = "1.30.3"
description = "Telegraf - metrics collection agent"
vendor = "InfluxData"
source = "https://github.com/influxdata/telegraf"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/telegraf/telegraf/releases/download/v1.30.3/telegraf-1.30.3-linux-amd64.tar.gz"
binary_name = "telegraf"
filename = "telegraf-1.30.3-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 8125
metrics = 9101

[labels]
"org.opencontainers.image.title" = "telegraf"
"org.opencontainers.image.description" = "Telegraf - metrics collection agent"
"org.opencontainers.image.version" = "1.30.3"
"org.opencontainers.image.vendor" = "InfluxData"
"org.opencontainers.image.source" = "https://github.com/influxdata/telegraf"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
