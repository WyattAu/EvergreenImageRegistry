[metadata]
name = "redis-exporter"
version = "v1.83.0"
description = "Redis Exporter - Prometheus exporter for Redis"
vendor = "Prometheus"
source = "https://github.com/oliver006/redis_exporter"
license = "Apache-2.0"
tier = "critical"
upstream_version = "1.68.0"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/oliver006/redis_exporter/releases/download/v1.68.0/redis_exporter-v1.68.0.linux-amd64.tar.gz"

[runtime]
entrypoint = ["/redis_exporter"]

[ports]
expose = [9121, 9101]

[labels]
"org.opencontainers.image.title" = "redis-exporter"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.version" = "1.68.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "monitoring"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
