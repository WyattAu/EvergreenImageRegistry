[metadata]
name = "postgres"
version = "17.4"
description = "PostgreSQL - advanced open source relational database"
vendor = "PostgreSQL"
source = "https://github.com/postgres/postgres"
license = "PostgreSQL"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/postgres/postgres/releases/download/v17.4/postgres-17.4-linux-amd64.tar.gz"
binary_name = "postgres"
filename = "postgres-17.4-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 5432
metrics = 9101

[labels]
"org.opencontainers.image.title" = "postgres"
"org.opencontainers.image.description" = "PostgreSQL - advanced open source relational database"
"org.opencontainers.image.version" = "17.4"
"org.opencontainers.image.vendor" = "PostgreSQL"
"org.opencontainers.image.source" = "https://github.com/postgres/postgres"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
