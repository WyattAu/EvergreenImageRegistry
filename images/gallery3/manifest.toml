[metadata]
name = "gallery3"
version = "3.0.0"
description = "gallery3 container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3", "/opt/gallery3/manage.py", "runserver", "0.0.0.0:8000"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/gallery/gallery3.git"
"org.opencontainers.image.title" = "gallery3"
"org.opencontainers.image.vendor" = "Gallery"
"org.opencontainers.image.version" = "3.0.0"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

