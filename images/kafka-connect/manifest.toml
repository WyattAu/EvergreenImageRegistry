[metadata]
name = "kafka-connect"
version = "3.6.1"
description = "Kafka Connect - scalable and reliable data streaming integration"
vendor = "Apache"
source = "https://github.com/apache/kafka"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/kafka-connect/kafka-connect/releases/download/v3.6.1/kafka-connect-3.6.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/kafka/bin/connect-distributed.sh"]

[ports]
expose = [8083, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Kafka Connect - distributed data integration platform"
"org.opencontainers.image.title" = "kafka-connect"
"org.opencontainers.image.vendor" = "Apache"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "15s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "messaging"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"
