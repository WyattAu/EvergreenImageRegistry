[metadata]
tier = "standard"
name = "keynuker"
version = "latest"
description = "KeyNuker - key detection"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/clonezilla/keynuker:${VERSION}"

[runtime]
entrypoint = ["/keynuker"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "KeyNuker - key detection"
"org.opencontainers.image.source" = "https://github.com/clonezilla/keynuker"
"org.opencontainers.image.title" = "keynuker"
"org.opencontainers.image.vendor" = "clonezilla"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"


status = "wip"
