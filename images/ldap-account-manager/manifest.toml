[metadata]
tier = "standard"
name = "ldap-account-manager"
version = "0.9.0"
description = "ldap-account-manager container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "osixia/phpldapadmin:${VERSION}"

[runtime]
entrypoint = ["php-fpm"]
cmd = ["-F"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/leenooks/phpLDAPadmin"
"org.opencontainers.image.title" = "ldap-account-manager"
"org.opencontainers.image.vendor" = "leenooks"
"org.opencontainers.image.version" = "1.2.6"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "10000ms"
"evergreen.image.category" = "identity"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
