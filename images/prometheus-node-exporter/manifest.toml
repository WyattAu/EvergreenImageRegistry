[metadata]
name = "prometheus-node-exporter"
version = "1.8.0"
description = "Node Exporter - hardware and OS metrics exporter for Prometheus"
vendor = "Prometheus"
source = "https://github.com/prometheus/node_exporter"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/prometheus-node-exporter/prometheus-node-exporter/releases/download/v1.8.0/prometheus-node-exporter-1.8.0-linux-amd64.tar.gz"
binary_name = "prometheus-node-exporter"
filename = "prometheus-node-exporter-1.8.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9100
metrics = 9101

[labels]
"org.opencontainers.image.title" = "prometheus-node-exporter"
"org.opencontainers.image.description" = "Node Exporter - hardware and OS metrics exporter for Prometheus"
"org.opencontainers.image.version" = "1.8.0"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.source" = "https://github.com/prometheus/node_exporter"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
