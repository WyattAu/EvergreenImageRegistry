[metadata]
tier = "standard"
name = "nextpvr"
version = "0.1.0"
description = "WIP - proprietary DVR binary, cannot redistribute"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "proprietary"

[runtime]
entrypoint = ["true"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "WIP - proprietary DVR binary, cannot redistribute. Use nextpvr/nextpvr_amd64 on Docker Hub."
"org.opencontainers.image.title" = "nextpvr"
"org.opencontainers.image.vendor" = "NextPVR"
"org.opencontainers.image.version" = "0.1.0"
"org.opencontainers.image.source" = "https://nextpvr.com"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"


status = "wip"
