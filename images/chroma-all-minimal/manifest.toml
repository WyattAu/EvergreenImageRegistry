[metadata]
tier = "standard"
name = "chroma-all-minimal"
version = "0.5.23"
description = "chroma-all-minimal container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/chromadb-chroma"
[runtime]
entrypoint = ["python3"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/chroma-core/chroma"
"org.opencontainers.image.title" = "chroma-all-minimal"
"org.opencontainers.image.vendor" = "Chroma"
"org.opencontainers.image.version" = "0.5.23"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
