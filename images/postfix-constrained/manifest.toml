[metadata]
tier = "standard"
name = "postfix-constrained"
version = "3.7.6"
description = "Postfix Constrained - mail transfer agent with resource limits"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["postfix", "-c", "/etc/postfix", "start-fg"]

[ports]
expose = [25, 9101]

[labels]
"org.opencontainers.image.description" = "Postfix Constrained - mail transfer agent with resource limits"
"org.opencontainers.image.source" = "https://www.postfix.org"
"org.opencontainers.image.title" = "postfix-constrained"
"org.opencontainers.image.vendor" = "Wietse Venema"
"org.opencontainers.image.version" = "3.7.6"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.debian-slim" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.image.variant" = "constrained"
"evergreen.metrics.native" = "ztunnel"
