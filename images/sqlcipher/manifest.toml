[metadata]
name = "sqlcipher"
version = "4.5.6"
description = "SQLite extension providing AES-256 encryption"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/sqlcipher"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "SQLite extension providing AES-256 encryption"
"org.opencontainers.image.source" = "https://github.com/sqlcipher/sqlcipher"
"org.opencontainers.image.title" = "sqlcipher"
"org.opencontainers.image.vendor" = "sqlcipher"
"org.opencontainers.image.version" = "4.5.6"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "2000ms"
"sovereign.image.category" = "security"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

