[metadata]
name = "cosign"
version = "3.0.6"
description = "Cosign - container signing and verification tool"
vendor = "Sigstore"
source = "https://github.com/sigstore/cosign"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/sigstore/cosign/releases/download/v3.0.6/cosign-linux-amd64"

[runtime]
entrypoint = ["/cosign"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/sigstore/cosign"
"org.opencontainers.image.title" = "cosign"
"org.opencontainers.image.vendor" = "sigstore"
"org.opencontainers.image.version" = "3.0.6"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "security"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

