[metadata]
tier = "standard"
name = "eqonomize"
version = "0.10.1"
description = "eqonomize container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["eqonomize"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/Eqonomize/Eqonomize"
"org.opencontainers.image.title" = "eqonomize"
"org.opencontainers.image.vendor" = "Eqonomize"
"org.opencontainers.image.version" = "0.10.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "10000ms"
"evergreen.image.category" = "business-finance"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
