[metadata]
name = "couchbase-operator"
version = "2.7.0"
description = "Sovereign hardened Couchbase Operator - Kubernetes operator for Couchbase"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/couchbase/couchbase-operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/couchbase-operator"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Couchbase Operator - Kubernetes operator for Couchbase"
"org.opencontainers.image.title" = "couchbase-operator"
"org.opencontainers.image.vendor" = "Couchbase"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

