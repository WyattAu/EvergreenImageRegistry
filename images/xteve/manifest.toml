[metadata]
tier = "standard"
name = "xteve"
version = "2.2.0.200"
description = "xteve container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/dnsforge-xteve-latest"
[runtime]
entrypoint = ["/xteve"]

[ports]
expose = [34400, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/xteve-project/xTeVe"
"org.opencontainers.image.title" = "xteve"
"org.opencontainers.image.vendor" = "xteve"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
