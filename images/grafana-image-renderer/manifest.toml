[metadata]
name = "grafana-image-renderer"
version = "5.8.2"
description = "Grafana Image Renderer - server-side image rendering for Grafana"
vendor = "Grafana Labs"
source = "https://github.com/grafana/grafana-image-renderer"
license = "Apache-2.0"
tier = "2"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/grafana-image-renderer/grafana-image-renderer/releases/download/v5.8.2/grafana-image-renderer-5.8.2-linux-amd64.tar.gz"
binary_name = "grafana-image-renderer"
filename = "grafana-image-renderer-5.8.2-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 8081
metrics = 9101

[labels]
"org.opencontainers.image.title" = "grafana-image-renderer"
"org.opencontainers.image.description" = "Grafana Image Renderer - server-side image rendering for Grafana"
"org.opencontainers.image.version" = "5.8.2"
"org.opencontainers.image.vendor" = "Grafana Labs"
"org.opencontainers.image.source" = "https://github.com/grafana/grafana-image-renderer"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "5s"
