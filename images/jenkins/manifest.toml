[metadata]
name = "jenkins"
version = "2.462.1"
description = "Jenkins - open source automation server for CI/CD"
vendor = "Jenkins"
source = "https://github.com/jenkinsci/jenkins"
license = "MIT"
tier = "1"

[build]
base_image = "cgr.dev/chainguard/wolfi-base:latest"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/jenkins/jenkins/releases/download/v2.462.1/jenkins-2.462.1-linux-amd64.tar.gz"
binary_name = "jenkins"
filename = "jenkins-2.462.1-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 8080
metrics = 9101

[labels]
"org.opencontainers.image.title" = "jenkins"
"org.opencontainers.image.description" = "Jenkins - open source automation server for CI/CD"
"org.opencontainers.image.version" = "2.462.1"
"org.opencontainers.image.vendor" = "Jenkins"
"org.opencontainers.image.source" = "https://github.com/jenkinsci/jenkins"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
