[metadata]
tier = "standard"
name = "codimd"
version = "2.6.1"
description = "CodiMD - collaborative markdown editor (now HedgeDoc)"
vendor = "hackmdio"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/hackmdio/codimd/releases/download/2.6.1/codimd-2.6.1.tar.gz"

[runtime]
entrypoint = ["node"]
cmd = ["./app.js"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.description" = "CodiMD - collaborative markdown editor"
"org.opencontainers.image.source" = "https://github.com/hackmdio/codimd"
"org.opencontainers.image.title" = "codimd"
"org.opencontainers.image.vendor" = "hackmdio"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "http"
"evergreen.image.category" = "collaboration"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
