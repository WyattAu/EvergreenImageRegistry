"org.opencontainers.image.version" = "RELEASE.2025-10-15T17-29-55Z"
"org.opencontainers.image.vendor" = "AWS"
"org.opencontainers.image.source" = "https://github.com/aws/aws-cli"
"sovereign.image.tier" = "1"
