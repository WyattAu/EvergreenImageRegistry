[metadata]
tier = "standard"
name = "sssd"
version = "unknown"
description = "Evergreen SSSD - System Security Services Daemon for LDAP/Kerberos auth"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/cgr.dev/chainguard/wolfi-base"
[ports]
expose = [0, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen SSSD - System Security Services Daemon for LDAP/Kerberos auth"
"org.opencontainers.image.title" = "sssd"
"evergreen.base.image" = "wolfi"
"evergreen.health.type" = "none"
"evergreen.image.category" = "auth"
"evergreen.image.note" = "SSSD requires privileged mode for PAM/NSS integration. Runs as root for PAM module access."
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
