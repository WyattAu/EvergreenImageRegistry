[metadata]
tier = "critical"
name = "govulncheck"
version = "v1.1.4"
description = "Go vulnerability checker"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"
multiarch = false

[source]
type = "docker-image"
url = "golang:1.24"

[runtime]
entrypoint = ["/govulncheck"]
cmd = ["--help"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Go vulnerability checker"
"org.opencontainers.image.source" = "https://github.com/golang/vuln"
"org.opencontainers.image.title" = "govulncheck"
"org.opencontainers.image.vendor" = "golang"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
