[metadata]
tier = "standard"
name = "weights-biases"
version = "0.19.0"
description = "weights-biases container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/wandb/wandb"
"org.opencontainers.image.title" = "weights-biases"
"org.opencontainers.image.vendor" = "Weights & Biases"
"org.opencontainers.image.version" = "0.19.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

