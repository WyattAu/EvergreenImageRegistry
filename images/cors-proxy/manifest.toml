[metadata]
name = "cors-proxy"
version = "1.25.5"
description = "cors-proxy container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/opt/nginx/sbin/nginx"]
cmd = ["-c", "/app/conf/nginx.conf", "-g", "daemon off;"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://nginx.org"
"org.opencontainers.image.title" = "cors-proxy"
"org.opencontainers.image.vendor" = "nginx"
"org.opencontainers.image.version" = "1.25.5"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.distrole" = "debian-slim"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "networking"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

