# =============================================================================
# EVERGREEN BUILD PIPELINE - ON PUSH (Path-Filtered)
# =============================================================================
# Triggered by pushes to main. Uses git diff to discover which image
# directories changed, and only builds those images.
#
# If shared infrastructure changed (scripts/, manifest.toml, CI workflows)
# but no specific images, falls back to building critical tier only.
#
# This is the FAST path. Typical runtime: <30 minutes for a few images.
# =============================================================================

name: Build on Push

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/**'
      - 'manifest.toml'
      - '.github/workflows/_build-reusable.yml'
      - '.github/workflows/build-on-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/**'
      - 'manifest.toml'

concurrency:
  group: build-on-push-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: DISCOVER - Find changed images via git diff
  # ---------------------------------------------------------------------------
  discover:
    name: Discover Changed Images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      total: ${{ steps.discover.outputs.total }}
      mode: ${{ steps.discover.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Discover changed images
        id: discover
        run: |
          chmod +x scripts/discover-images.sh
          scripts/discover-images.sh changed 2>&1
        env:
          GITHUB_OUTPUT: $GITHUB_OUTPUT

      - name: Skip if no changes
        if: steps.discover.outputs.total == '0'
        run: |
          echo "::notice::No images changed in this push. Skipping build."
          echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # STAGE 2: LINT - Fast lint check on changed images only
  # ---------------------------------------------------------------------------
  lint:
    name: Lint Changed Images
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.total != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
      - name: Install shimctl
        run: cargo install shimctl --git https://github.com/${{ github.repository_owner }}/EvergreenShims.git --locked
      - name: Verify shimctl version
        run: shimctl --version
      - name: Get changed image list
        id: images
        run: |
          MATRIX='${{ needs.discover.outputs.matrix }}'
          IMAGES=$(echo "$MATRIX" | python3 -c "import json,sys; d=json.load(sys.stdin); print(','.join(b['images'] for b in d['include']))" 2>/dev/null)
          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"
      - name: Run hadolint
        run: |
          IFS=',' read -ra IMAGE_LIST <<< "${{ steps.images.outputs.images }}"
          FAILURES=0
          for img in "${IMAGE_LIST[@]}"; do
            [ -z "$img" ] && continue
            DF="images/${img}/Dockerfile"
            if [ ! -f "$DF" ]; then
              echo "::error::Missing Dockerfile for ${img}"
              FAILURES=$((FAILURES+1))
              continue
            fi
            if hadolint --failure-threshold error "$DF" \
              --ignore DL3018 --ignore DL3008 --ignore DL3016 --ignore DL3059 \
              --ignore DL3048 --ignore DL3021 --ignore DL3045 --ignore DL3007 \
              --ignore DL1000 --ignore DL4006 --ignore DL4005 --ignore DL4004 \
              --ignore DL4001 --ignore DL3003 --ignore DL3025 --ignore DL3023; then
              echo "PASS: ${img}"
            else
              echo "::error::${img} has lint issues"
              FAILURES=$((FAILURES+1))
            fi
          done
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::${FAILURES} changed image(s) failed hadolint"
            exit 1
          fi

      - name: Validate entrypoint patterns (BLOCKING)
        run: |
          IFS=',' read -ra IMAGE_LIST <<< "${{ steps.images.outputs.images }}"
          FAILURES=0
          for img in "${IMAGE_LIST[@]}"; do
            [ -z "$img" ] && continue
            echo "::group::Validate ${img}"
            if python3 scripts/validate_entrypoint_pattern.py --image "$img"; then
              echo "PASS: ${img}"
            else
              echo "::error::${img}: entrypoint validation FAILED"
              FAILURES=$((FAILURES+1))
            fi
            echo "::endgroup::"
          done
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::${FAILURES} image(s) failed entrypoint validation"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # STAGE 3: BUILD - Build only changed images
  # ---------------------------------------------------------------------------
  build:
    name: Build Changed Images
    needs: [discover, lint]
    if: needs.discover.result == 'success' && needs.discover.outputs.total != '0'
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: read
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.discover.outputs.matrix }}
      tag: ${{ github.sha }}
      push: ${{ github.event_name != 'pull_request' }}
      sign: false
      multiarch: true
      tier: changed
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
