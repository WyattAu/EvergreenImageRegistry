[metadata]
name = "qdrant-cpu"
version = "1.17.1"
description = "qdrant-cpu container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/qdrant"]

[ports]
expose = [6333, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/qdrant/qdrant/releases/download/v1.17.1"
"org.opencontainers.image.title" = "qdrant-cpu"
"org.opencontainers.image.vendor" = "qdrant/qdrant"
"org.opencontainers.image.version" = "1.17.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

