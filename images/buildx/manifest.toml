[metadata]
tier = "standard"
name = "buildx"
version = "0.33.0"
description = "Evergreen hardened buildx - Docker multi-platform build"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/buildx"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened buildx - Docker multi-platform build"
"org.opencontainers.image.title" = "buildx"
"org.opencontainers.image.vendor" = "Docker"
"org.opencontainers.image.version" = "0.33.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
