[metadata]
name = "kafka-manager"
version = "latest"
description = "Sovereign hardened CMAK (Kafka Manager) - Apache Kafka management tool"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "hlebalbau/kafka-manager:${VERSION}"

[runtime]
entrypoint = ["/opt/cmak/bin/cmak"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened CMAK (Kafka Manager) - Apache Kafka management tool"
"org.opencontainers.image.title" = "kafka-manager"
"org.opencontainers.image.vendor" = "Yahoo"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "15s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "30000ms"
"sovereign.image.category" = "messaging"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

