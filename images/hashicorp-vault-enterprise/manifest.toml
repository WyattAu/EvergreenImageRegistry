[metadata]
tier = "standard"
name = "hashicorp-vault-enterprise"
version = "1.18.5"
description = "hashicorp-vault-enterprise container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/hashicorp-vault-1.15"
[runtime]
entrypoint = ["/usr/local/bin/vault"]
cmd = ["server", "-dev"]

[ports]
expose = [8200, 9101]

[labels]
"org.opencontainers.image.source" = "https://www.hashicorp.com/products/vault/enterprise"
"org.opencontainers.image.title" = "hashicorp-vault-enterprise"
"org.opencontainers.image.vendor" = "HashiCorp"
"org.opencontainers.image.version" = "1.18.5"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "10000ms"
"evergreen.image.category" = "secrets"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"


status = "wip"
