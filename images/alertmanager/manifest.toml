[metadata]
name = "alertmanager"
version = "0.32.1"
description = "Alertmanager - handles alerts sent by Prometheus"
vendor = "Prometheus"
source = "https://github.com/prometheus/alertmanager"
license = "Apache-2.0"
tier = "1"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/prometheus/alertmanager/releases/download/v0.32.1/alertmanager-0.32.1.linux-amd64.tar.gz"
binary_name = "alertmanager"
filename = "alertmanager-0.32.1.linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 9093
metrics = 9101

[labels]
"org.opencontainers.image.title" = "alertmanager"
"org.opencontainers.image.description" = "Alertmanager - handles alerts sent by Prometheus"
"org.opencontainers.image.version" = "0.32.1"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.source" = "https://github.com/prometheus/alertmanager"
"sovereign.image.tier" = "1"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
