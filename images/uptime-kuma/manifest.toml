[metadata]
name = "uptime-kuma"
version = "1.23.1"
description = "uptime-kuma container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "node"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node"]

[ports]
expose = [3001, 9101]

[labels]
"org.opencontainers.image.title" = "uptime-kuma"
"org.opencontainers.image.vendor" = "Uptime Kuma"
"org.opencontainers.image.version" = "1.23.1"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

