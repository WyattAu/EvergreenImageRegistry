[metadata]
name = "woodpecker-ci"
version = "2.7.0"
description = "Woodpecker CI Server - CI/CD server (woodpecker-ci is the server binary)"
vendor = "Woodpecker CI"
source = "https://github.com/woodpecker-ci/woodpecker"
tier = "2"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/woodpecker-ci/woodpecker/releases/download/v2.7.0/woodpecker-server_linux_amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/woodpecker-server"]

[ports]
expose = [8000, 9101]

[labels]
"org.opencontainers.image.description" = "Woodpecker CI Server - CI/CD server for Woodpecker CI"
"org.opencontainers.image.source" = "https://github.com/woodpecker-ci/woodpecker"
"org.opencontainers.image.title" = "woodpecker-ci"
"org.opencontainers.image.vendor" = "Woodpecker CI"
"org.opencontainers.image.version" = "2.7.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

