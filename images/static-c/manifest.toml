[metadata]
name = "static-c"
version = "1.0.0"
description = "Sovereign hardened static-c - Static C binary compilation base"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened static-c - Static C binary compilation base"
"org.opencontainers.image.title" = "static-c"
"org.opencontainers.image.version" = "1.0.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

