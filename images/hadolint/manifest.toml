[metadata]
tier = "standard"
name = "hadolint"
version = "2.14.0"
description = "hadolint container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/hadolint"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/hadolint/hadolint"
"org.opencontainers.image.title" = "hadolint"
"org.opencontainers.image.vendor" = "hadolint"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "none"
"evergreen.image.category" = "ci"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
