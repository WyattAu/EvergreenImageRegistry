[metadata]
name = "jenkins-plugin"
version = "2.462.1"
description = "Evergreen hardened jenkins-plugin - Jenkins plugin manager"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["java", "-jar", "/app/jenkins.war"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened jenkins-plugin - Jenkins plugin manager"
"org.opencontainers.image.title" = "jenkins-plugin"
"org.opencontainers.image.vendor" = "Jenkins"
"org.opencontainers.image.version" = "2.462.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "30s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

