[metadata]
name = "cockroachdb-exporter"
version = "24.3.3"
description = "CockroachDB Exporter - Prometheus exporter for CockroachDB"
vendor = "Cockroach Labs"
source = "https://github.com/cockroachdb/cockroach"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/cockroachdb-exporter/cockroachdb-exporter/releases/download/v24.3.3/cockroachdb-exporter-24.3.3-linux-amd64.tar.gz"
binary_name = "cockroachdb-exporter"
filename = "cockroachdb-exporter-24.3.3-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 8080
metrics = 9101

[labels]
"org.opencontainers.image.title" = "cockroachdb-exporter"
"org.opencontainers.image.description" = "CockroachDB Exporter - Prometheus exporter for CockroachDB"
"org.opencontainers.image.version" = "24.3.3"
"org.opencontainers.image.vendor" = "Cockroach Labs"
"org.opencontainers.image.source" = "https://github.com/cockroachdb/cockroach"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
