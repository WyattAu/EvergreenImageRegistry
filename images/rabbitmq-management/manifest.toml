[metadata]
name = "rabbitmq-management"
version = "3.13.1"
description = "RabbitMQ Management - web-based management plugin for RabbitMQ"
vendor = "VMware"
source = "https://github.com/rabbitmq/rabbitmq-server"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "cgr.dev/chainguard/wolfi-base:latest"
arch = "amd64"

[download]
url = "https://github.com/rabbitmq-management/rabbitmq-management/releases/download/v3.13.1/rabbitmq-management-3.13.1-linux-amd64.tar.gz"
binary_name = "rabbitmq-management"
filename = "rabbitmq-management-3.13.1-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = false

[ports]
application = 5672
metrics = 9101

[labels]
"org.opencontainers.image.title" = "rabbitmq-management"
"org.opencontainers.image.description" = "RabbitMQ Management - web-based management plugin for RabbitMQ"
"org.opencontainers.image.version" = "3.13.1"
"org.opencontainers.image.vendor" = "VMware"
"org.opencontainers.image.source" = "https://github.com/rabbitmq/rabbitmq-server"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "false"
"sovereign.base.image" = "cgr.dev/chainguard/wolfi-base:latest"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
