[metadata]
name = "portainer"
version = "2.20.1"
description = "Portainer - container management UI"
vendor = "Portainer"
source = "https://github.com/portainer/portainer"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/portainer/portainer/releases/download/v2.20.1/portainer-2.20.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/portainer"]

[ports]
expose = [9000, 9101]

[labels]
"org.opencontainers.image.title" = "portainer"
"org.opencontainers.image.vendor" = "Portainer"
"org.opencontainers.image.version" = "2.20.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

