[metadata]
name = "mkcert"
version = "1.4.4"
description = "mkcert - Evergreen hardened image"
vendor = "Evergreen"
source = "https://github.com/FiloSottile/mkcert"
license = "Apache-2.0"
tier = "standard"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "upstream-repack"
url = "https://github.com/FiloSottile/mkcert"

[runtime]
entrypoint = []

[ports]
expose = [9101]
