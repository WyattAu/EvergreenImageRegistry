[metadata]
name = "tigergraph"
version = "4.2.2"
description = "Evergreen hardened TigerGraph - extracted from official Docker image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "docker.io/tigergraph/tigergraph:latest"

[runtime]
entrypoint = ["/opt/tigergraph/bin/gadmin", "start", "all"]

[ports]
expose = [14240, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened TigerGraph - extracted from official Docker image"
"org.opencontainers.image.title" = "tigergraph"
"org.opencontainers.image.vendor" = "TigerGraph"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.note" = "Extracted from docker.io/tigergraph/tigergraph:latest. CloudFront download URL is defunct."
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

