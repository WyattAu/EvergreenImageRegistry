[metadata]
tier = "standard"
name = "docker-bench"
version = "unknown"
description = "Docker Bench for Security"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/docker-docker-bench-security-latest"
[runtime]
entrypoint = ["sh"]
cmd = ["docker-bench-security.sh"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Docker Bench for Security"
"org.opencontainers.image.source" = "https://github.com/docker/docker-bench-security"
"org.opencontainers.image.title" = "docker-bench"
"org.opencontainers.image.vendor" = "Docker"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
