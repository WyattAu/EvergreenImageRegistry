[metadata]
name = "keycloak"
version = "26.6.1"
description = "Keycloak - identity and access management"
vendor = "Red Hat"
source = "https://github.com/keycloak/keycloak"
license = "Apache-2.0"
tier = "1"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/keycloak/keycloak/releases/download/v26.6.1/keycloak-26.6.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/keycloak/bin/kc.sh"]
cmd = ["start-dev"]

[ports]
expose = [8080, 8443, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/keycloak/keycloak"
"org.opencontainers.image.title" = "keycloak"
"org.opencontainers.image.vendor" = "Keycloak"
"org.opencontainers.image.version" = "26.6.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "30s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "60000ms"
"evergreen.image.category" = "identity"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

