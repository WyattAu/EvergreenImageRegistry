[metadata]
tier = "standard"
name = "filebrowser"
version = "v2.32.0"
description = "filebrowser container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://hub.docker.com/_/filebrowser-filebrowser"
[runtime]
entrypoint = ["/filebrowser"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/filebrowser/filebrowser"
"org.opencontainers.image.title" = "filebrowser"
"org.opencontainers.image.vendor" = "FileBrowser"
"org.opencontainers.image.version" = "v2.32.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.base" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "10000ms"
"evergreen.image.category" = "cloud-storage"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
