[metadata]
name = "crdb-operator"
version = "1.11.0"
description = "Sovereign hardened CockroachDB Operator - Kubernetes operator for CockroachDB"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "cockroachdb/cockroach-operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/cockroach-operator"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened CockroachDB Operator - Kubernetes operator for CockroachDB"
"org.opencontainers.image.title" = "crdb-operator"
"org.opencontainers.image.vendor" = "Cockroach Labs"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

