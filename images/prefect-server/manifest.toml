[metadata]
tier = "standard"
name = "prefect-server"
version = "3.7.1"
description = "prefect-server container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["prefect"]

[ports]
expose = [4200, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/PrefectHQ/prefect"
"org.opencontainers.image.title" = "prefect-server"
"org.opencontainers.image.vendor" = "Prefect"
"org.opencontainers.image.version" = "3.7.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
