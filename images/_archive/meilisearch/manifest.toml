[metadata]
tier = "standard"
name = "meilisearch"
version = "1.12.3"
description = "Meilisearch - fast, relevant, and typo-tolerant search engine"
vendor = "Meilisearch"
source = "https://github.com/meilisearch/meilisearch"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "source-build"
url = "https://github.com/meilisearch/meilisearch"
language = "rust"
target = "x86_64-unknown-linux-musl"

[runtime]
entrypoint = ["/meilisearch"]

[ports]
expose = [7700, 9101]

[labels]
"org.opencontainers.image.title" = "meilisearch"
"org.opencontainers.image.vendor" = "Meilisearch"
"org.opencontainers.image.version" = "1.12.3"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
