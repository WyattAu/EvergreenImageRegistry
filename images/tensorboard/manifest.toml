[metadata]
tier = "standard"
name = "tensorboard"
version = "2.18.0"
description = "tensorboard container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["tensorboard"]

[ports]
expose = [6006, 9101]

[labels]
"org.opencontainers.image.title" = "tensorboard"
"org.opencontainers.image.vendor" = "TensorFlow"
"org.opencontainers.image.version" = "2.18.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

