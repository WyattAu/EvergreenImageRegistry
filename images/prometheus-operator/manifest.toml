[metadata]
name = "prometheus-operator"
version = "0.90.1"
description = "Prometheus Operator - manages Prometheus monitoring instances"
vendor = "Prometheus"
source = "https://github.com/prometheus-operator/prometheus-operator"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "quay.io/prometheus-operator/prometheus-operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/prometheus-operator"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened prometheus-operator - Kubernetes Prometheus operator"
"org.opencontainers.image.title" = "prometheus-operator"
"org.opencontainers.image.vendor" = "Prometheus"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "10s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

