---
package:
  name: forgejo
  version: 15.0.2
  epoch: 0
  description: "Self-hosted lightweight software forge"
  copyright:
    - attestation: |
        Copyright 2026 Forgejo
      license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git
      - openssh

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: fetch
    with:
      uri: >-
        https://code.forgejo.org/forgejo/forgejo/releases/download/
        v${{package.version}}/forgejo-${package.version}-linux-${{package.target.arch}}

  - runs: |
      # Verify checksum (amd64: d0e6f83e... arm64: ba8184bf...)
      ARCH=${{package.target.arch}}
      case $ARCH in
        x86_64) EXPECTED=d0e6f83ec24bc84eba90fdab48ad08b16f61e6b1e5095bf8483be849d860fdc8 ;;
        aarch64) EXPECTED=ba8184bf8bd7aa25357fe4315000a4cea33d28e29ecb852823e9dbfeb38562f7 ;;
      esac
      ACTUAL=$(sha256sum forgejo-${{package.version}}-linux-${ARCH} | cut -d' ' -f1)
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        echo "SHA256 mismatch: expected $EXPECTED got $ACTUAL"
        exit 1
      fi
      chmod +x forgejo-${{package.version}}-linux-${ARCH}
      mv forgejo-${{package.version}}-linux-${ARCH} /usr/bin/forgejo

  - uses: strip

test:
  pipeline:
    - runs: |
        forgejo --version
