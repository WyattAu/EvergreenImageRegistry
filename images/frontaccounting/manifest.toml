[metadata]
tier = "standard"
name = "frontaccounting"
version = "2.4.14"
description = "frontaccounting container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["php-fpm8.4"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.source" = "https://sourceforge.net/projects/frontaccounting/"
"org.opencontainers.image.title" = "frontaccounting"
"org.opencontainers.image.vendor" = "FrontAccounting"
"org.opencontainers.image.version" = "2.4.14"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.base" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "10s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "30000ms"
"evergreen.image.category" = "business-finance"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"
