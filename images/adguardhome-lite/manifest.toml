[metadata]
tier = "standard"
name = "adguardhome-lite"
version = "0.107.50"
description = "AdGuard Home with lite/minimal config entrypoint"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/AdGuardHome"]
cmd = ["-c", "/opt/AdGuardHome/data/AdGuardHome.yaml", "--no-check-update"]

[ports]
expose = [53, 9101]

[labels]
"org.opencontainers.image.description" = "AdGuard Home with lite/minimal config entrypoint"
"org.opencontainers.image.source" = "https://github.com/AdguardTeam/AdGuardHome"
"org.opencontainers.image.title" = "adguardhome-lite"
"org.opencontainers.image.vendor" = "AdGuard"
"org.opencontainers.image.version" = "0.107.50"
"evergreen.base.image" = "scratch"
"evergreen.constraint.base" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "5000ms"
"evergreen.image.category" = "dns"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
