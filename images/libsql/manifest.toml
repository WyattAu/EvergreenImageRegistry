[metadata]
tier = "standard"
name = "libsql"
version = "0.24.32"
description = "Turso libSQL server - open-source SQLite fork with networking"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "source-build"
url = "https://github.com/tursodatabase/libsql"
language = "rust"
target = "x86_64-unknown-linux-musl"

[runtime]
entrypoint = ["/libsql-server"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.title" = "libsql-server"
"org.opencontainers.image.source" = "https://github.com/tursodatabase/libsql"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "prometheus"
