[metadata]
name = "logstash"
version = "8.12.2"
description = "Logstash - server-side data processing pipeline"
vendor = "Elastic"
source = "https://github.com/elastic/logstash"
license = "Apache-2.0"
tier = "2"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/logstash/logstash/releases/download/v8.12.2/logstash-8.12.2-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/opt/logstash/bin/logstash"]

[ports]
expose = [5044, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened Logstash - Elastic data processing pipeline"
"org.opencontainers.image.title" = "logstash"
"org.opencontainers.image.vendor" = "Elastic"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "15s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "60000ms"
"sovereign.image.category" = "observability"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

