[metadata]
name = "consul-template"
version = "0.37.0"
description = "Consul Template - template rendering with Consul data"
vendor = "HashiCorp"
source = "https://github.com/hashicorp/consul-template"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/consul-template/consul-template/releases/download/v0.37.0/consul-template-0.37.0-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/consul-template"]

[ports]
expose = [8500, 9101]

[labels]
"org.opencontainers.image.title" = "consul-template"
"org.opencontainers.image.vendor" = "HashiCorp"
"org.opencontainers.image.version" = "0.37.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.cap-drop" = "ALL"
"sovereign.hft.cap-required" = "CAP_SYS_NICE"
"sovereign.hft.fips-required" = "true"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "5000ms"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

