[metadata]
tier = "standard"
name = "litellm-proxy"
version = "1.60.0"
description = "litellm-proxy container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["litellm"]

[ports]
expose = [4000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/BerriAI/litellm"
"org.opencontainers.image.title" = "litellm-proxy"
"org.opencontainers.image.vendor" = "LiteLLM"
"org.opencontainers.image.version" = "1.60.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
