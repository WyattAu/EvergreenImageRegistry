[metadata]
name = "unbound"
version = "1.20.0"
description = "Unbound - validating, recursive, and caching DNS resolver"
vendor = "NLnet Labs"
source = "https://github.com/NLnetLabs/unbound"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/unbound/unbound/releases/download/v1.20.0/unbound-1.20.0-linux-amd64.tar.gz"
binary_name = "unbound"
filename = "unbound-1.20.0-linux-amd64.tar.gz"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 53
metrics = 9101

[labels]
"org.opencontainers.image.title" = "unbound"
"org.opencontainers.image.description" = "Unbound - validating, recursive, and caching DNS resolver"
"org.opencontainers.image.version" = "1.20.0"
"org.opencontainers.image.vendor" = "NLnet Labs"
"org.opencontainers.image.source" = "https://github.com/NLnetLabs/unbound"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
