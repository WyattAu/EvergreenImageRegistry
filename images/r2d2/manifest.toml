[metadata]
name = "r2d2"
version = "0.8.10"
description = "Sovereign hardened R2D2 - generic connection pool wrapper"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/r2d2"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened R2D2 - generic connection pool wrapper"
"org.opencontainers.image.title" = "r2d2"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.category" = "database"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

