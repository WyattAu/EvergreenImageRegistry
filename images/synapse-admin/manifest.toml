[metadata]
tier = "standard"
name = "synapse-admin"
version = "0.11.4"
description = "Synapse Admin - web admin panel for Synapse Matrix homeserver"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["node", "dist/index.js"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Synapse Admin - web admin panel for Synapse Matrix homeserver"
"org.opencontainers.image.source" = "https://github.com/awesome-anton/synapse-admin"
"org.opencontainers.image.title" = "synapse-admin"
"org.opencontainers.image.vendor" = "Community"
"org.opencontainers.image.version" = "0.10.3"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.debian-slim" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
