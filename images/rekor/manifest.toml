[metadata]
name = "rekor"
version = "1.5.1"
description = "Rekor - transparency log for supply chain security"
vendor = "Sigstore"
source = "https://github.com/sigstore/rekor"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/sigstore/rekor/releases/download/v1.5.1/rekor-linux-amd64"

[runtime]
entrypoint = ["/rekor-server"]

[ports]
expose = [3000, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/sigstore/rekor"
"org.opencontainers.image.title" = "rekor"
"org.opencontainers.image.vendor" = "sigstore"
"org.opencontainers.image.version" = "1.5.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "security"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

