[metadata]
tier = "standard"
name = "vector-init"
version = "0.38.0"
description = "Evergreen hardened Vector init - high-performance observability data pipeline"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/bin/vector"]

[ports]
expose = [8686, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Vector init - high-performance observability data pipeline"
"org.opencontainers.image.title" = "vector-init"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "observability"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

