[metadata]
name = "argo-rollouts"
version = "1.9.0"
description = "Sovereign hardened argo-rollouts - progressive delivery"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/kubectl-argo-rollouts"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened argo-rollouts - progressive delivery"
"org.opencontainers.image.title" = "argo-rollouts"
"org.opencontainers.image.vendor" = "Argo Project"
"org.opencontainers.image.version" = "1.9.0"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.image.tier" = "3"
"sovereign.metrics.native" = "ztunnel"

