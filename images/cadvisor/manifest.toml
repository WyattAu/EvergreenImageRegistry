[metadata]
name = "cadvisor"
version = "0.49.1"
description = "cAdvisor - container resource usage and performance analysis"
vendor = "Google"
source = "https://github.com/google/cadvisor"
license = "Apache-2.0"
tier = "3"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/cadvisor/cadvisor/releases/download/v0.49.1/cadvisor-0.49.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/cadvisor"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Sovereign hardened cAdvisor - container resource usage analysis and metrics"
"org.opencontainers.image.title" = "cadvisor"
"org.opencontainers.image.vendor" = "Google"
"org.opencontainers.image.version" = "0.49.1"
"sovereign.base.image" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.connection-drain" = "false"
"sovereign.hft.cpu-pins" = "6-7"
"sovereign.hft.cpu-pins-mode" = "shared"
"sovereign.hft.deploy-strategy" = "standard-rolling"
"sovereign.hft.init-system" = "none"
"sovereign.hft.pre-stop-hook" = "false"
"sovereign.hft.sched-policy" = "SCHED_OTHER"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "observability"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

