[metadata]
name = "zipkin"
version = "3.4.2"
description = "Zipkin - distributed tracing system"
vendor = "Zipkin"
source = "https://github.com/openzipkin/zipkin"
license = "Apache-2.0"
tier = "1"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/openzipkin/zipkin/releases/download/3.4.2/zipkin.jar"

[runtime]
entrypoint = ["java"]
cmd = ["-jar", "/opt/zipkin/zipkin.jar"]

[ports]
expose = [9411, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/openzipkin/zipkin"
"org.opencontainers.image.title" = "zipkin"
"org.opencontainers.image.vendor" = "OpenZipkin"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "observability"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

