[metadata]
tier = "standard"
name = "kube-hunter"
version = "unknown"
description = "KubeHunter - Kubernetes security scanner"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["kube-hunter"]
cmd = ["--remote"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "KubeHunter - Kubernetes security scanner"
"org.opencontainers.image.source" = "https://github.com/aquasecurity/kube-hunter"
"org.opencontainers.image.title" = "kube-hunter"
"org.opencontainers.image.vendor" = "Aqua Security"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
