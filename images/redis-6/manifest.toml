[metadata]
tier = "standard"
name = "redis-6"
version = "6.2.16"
description = "Redis 6 - in-memory data structure store and cache"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "redis:${version}"

[runtime]
entrypoint = ["redis"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.title" = "redis-6"
"org.opencontainers.image.vendor" = "Redis"
"org.opencontainers.image.version" = "6.2.16"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.hardened" = "true"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
