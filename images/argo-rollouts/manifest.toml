[metadata]
tier = "standard"
name = "argo-rollouts"
version = "1.9.0"
description = "Evergreen hardened argo-rollouts - progressive delivery"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/kubectl-argo-rollouts"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened argo-rollouts - progressive delivery"
"org.opencontainers.image.title" = "argo-rollouts"
"org.opencontainers.image.vendor" = "Argo Project"
"org.opencontainers.image.version" = "1.9.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "5s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

