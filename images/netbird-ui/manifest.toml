[metadata]
tier = "standard"
name = "netbird-ui"
version = "0.70.5"
description = "Evergreen hardened NetBird UI - static web dashboard assets"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["sleep", "infinity"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened NetBird UI - static web dashboard assets"
"org.opencontainers.image.title" = "netbird-ui"
"org.opencontainers.image.vendor" = "NetBird"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

