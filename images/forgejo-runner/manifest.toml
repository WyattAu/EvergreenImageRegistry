[metadata]
name = "forgejo-runner"
version = "6.3.1"
description = "Forgejo Act Runner - CI/CD runner for Forgejo"
vendor = "forgejo"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://codeberg.org/forgejo/runner/releases/download/v6.3.1/forgejo-runner-linux-amd64"

[runtime]
entrypoint = ["/usr/local/bin/forgejo-runner"]
cmd = ["daemon"]

[ports]
expose = [8088, 9101]

[labels]
"org.opencontainers.image.description" = "Forgejo Act Runner - CI/CD runner for Forgejo"
"org.opencontainers.image.source" = "https://codeberg.org/forgejo/runner"
"org.opencontainers.image.title" = "forgejo-runner"
"org.opencontainers.image.vendor" = "Forgejo"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "tcp"
"evergreen.image.category" = "ci"
"evergreen.image.tier" = "2"
"evergreen.metrics.native" = "ztunnel"

