[metadata]
name = "renovate"
version = "43.160.6"
description = "renovate container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["renovate"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/renovatebot/renovate"
"org.opencontainers.image.title" = "renovate"
"org.opencontainers.image.vendor" = "RenovateBot"
"org.opencontainers.image.version" = "43.160.6"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "30s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "30000ms"
"sovereign.image.category" = "automation"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

