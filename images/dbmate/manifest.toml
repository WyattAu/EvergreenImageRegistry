[metadata]
tier = "standard"
name = "dbmate"
version = "2.33.0"
description = "Database migration tool for PostgreSQL, MySQL, SQLite, CockroachDB"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/dbmate"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Database migration tool for PostgreSQL, MySQL, SQLite, CockroachDB"
"org.opencontainers.image.source" = "https://github.com/amacneil/dbmate"
"org.opencontainers.image.title" = "dbmate"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "none"
"evergreen.image.category" = "tooling"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "none"
