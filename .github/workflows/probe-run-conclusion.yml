name: Probe Run Conclusion

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: echo 'matrix={"batch":["a","b"]}' >> "$GITHUB_OUTPUT"

  gated:
    needs: [discover]
    runs-on: ubuntu-latest
    steps:
      - run: echo gated ok

  advisory-style:
    # Mirrors the nightly's advisory gates: job-level continue-on-error
    # expression, evaluating to false.
    continue-on-error: ${{ vars.ADVISORY_GATES_BLOCKING != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo advisory-style ok

  calls-reusable:
    needs: [discover]
    uses: ./.github/workflows/_probe-reusable.yml

  builds:
    needs: [discover]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - run: echo build ${{ matrix.batch }}
