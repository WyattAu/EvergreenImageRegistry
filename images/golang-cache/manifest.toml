[metadata]
tier = "standard"
name = "golang-cache"
version = "1.0.0"
description = "Evergreen hardened Golang-Cache - in-memory cache service"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/usr/local/bin/go-1.23-cache"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Golang-Cache - in-memory cache service"
"org.opencontainers.image.title" = "go-1.23-cache"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
