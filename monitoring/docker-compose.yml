# Evergreen Monitoring Stack
# ----------------------------------------------------------------------------
# Deploys the full Evergreen observability stack using hardened Evergreen images
# (non-root UID 65532, distroless). Designed to run on TrueNAS via docker compose.
#
#   prometheus   - metrics collection + alert rule evaluation
#   alertmanager - alert routing/dedup/dispatch
#   grafana      - dashboards + visualization
#   node-exporter- host (TrueNAS) system metrics
#
# Usage:
#   sudo docker compose -f docker-compose.yml up -d
#
# Images use Evergreen hardened builds. Entrypoints are overridden to bypass
# the health-shim (monitoring services have their own built-in health endpoints).
# The shim flag parser (v1.1.0) intercepts child-process flags; v1.2.0 will fix
# this so the override can be removed.
# ----------------------------------------------------------------------------

name: evergreen-monitoring

networks:
  monitoring:
    driver: bridge

services:
  prometheus:
    image: ghcr.io/wyattau/evergreenimageregistry/prometheus:latest
    container_name: evergreen-prometheus
    user: "65532:65532"
    restart: unless-stopped
    entrypoint: ["/prometheus"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/data"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=50GB"
      - "--rules.alert.for-outage-tolerance=1h"
      - "--web.enable-lifecycle"
      - "--web.listen-address=0.0.0.0:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts/evergreen-alerts.yml:/etc/prometheus/rules/evergreen-alerts.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - ./data/prometheus:/data
    ports:
      - "9090:9090"
    networks: [monitoring]

  alertmanager:
    image: ghcr.io/wyattau/evergreenimageregistry/alertmanager:latest
    container_name: evergreen-alertmanager
    user: "65532:65532"
    restart: unless-stopped
    entrypoint: ["/alertmanager"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/data"
      - "--web.listen-address=0.0.0.0:9093"
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./data/alertmanager:/data
    ports:
      - "9093:9093"
    networks: [monitoring]

  grafana:
    image: ghcr.io/wyattau/evergreenimageregistry/grafana:latest
    container_name: evergreen-grafana
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      - prometheus
    entrypoint: ["/grafana-bin/grafana-server"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-evergreen}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_PORT: "3030"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_HOME: /usr/share/grafana
      GF_PATHS_LOGS: /var/log/grafana
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3030:3030"
    networks: [monitoring]

  node-exporter:
    # Official image — Evergreen node-exporter not yet published to GHCR
    image: prom/node-exporter:latest
    container_name: evergreen-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=0.0.0.0:9100"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    pid: host
    ports:
      - "9100:9100"
    networks: [monitoring]
