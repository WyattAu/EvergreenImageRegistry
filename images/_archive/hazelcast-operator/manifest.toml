[metadata]
tier = "standard"
name = "hazelcast-operator"
version = "5.17.0"
description = "Evergreen hardened Hazelcast Platform Operator - Kubernetes operator for Hazelcast"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "ghcr.io/hazelcast/hazelcast-platform-operator:v${VERSION}"

[runtime]
entrypoint = ["/usr/local/bin/hazelcast-platform-operator"]

[ports]
expose = [8080, 9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened Hazelcast Platform Operator - Kubernetes operator for Hazelcast"
"org.opencontainers.image.title" = "hazelcast-operator"
"org.opencontainers.image.vendor" = "Hazelcast"
"org.opencontainers.image.version" = "${VERSION}"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.category" = "database"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
