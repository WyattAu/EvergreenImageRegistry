[metadata]
name = "zerotier"
version = "latest"
description = "zerotier container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "zerotier/zerotier:${VERSION}"

[runtime]
entrypoint = ["/usr/sbin/zerotier-one"]
cmd = ["-p9993"]

[ports]
expose = [9993/udp, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/zerotier/ZeroTierOne"
"org.opencontainers.image.title" = "zerotier"
"org.opencontainers.image.vendor" = "ZeroTier"
"org.opencontainers.image.version" = "1.12.2"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.distrole" = "debian-slim"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.category" = "networking"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

