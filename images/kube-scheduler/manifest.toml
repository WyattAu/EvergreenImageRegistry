[metadata]
name = "kube-scheduler"
version = "1.30.1"
description = "Kubernetes Scheduler - control plane component"
vendor = "Kubernetes"
source = "https://github.com/kubernetes/kubernetes"
license = "Apache-2.0"
tier = "standard"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/kube-scheduler/kube-scheduler/releases/download/v1.30.1/kube-scheduler-1.30.1-linux-amd64.tar.gz"

[runtime]
entrypoint = ["kube-scheduler"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "Evergreen hardened kube-scheduler - Kubernetes scheduler"
"org.opencontainers.image.title" = "kube-scheduler"
"org.opencontainers.image.vendor" = "Kubernetes"
"org.opencontainers.image.version" = "1.30.1"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.shutdown-timeout" = "15s"
"evergreen.hft.signal-handling" = "native"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"
