[metadata]
name = "fulcio"
version = "1.8.5"
description = "Fulcio - certificate authority for Sigstore"
vendor = "Sigstore"
source = "https://github.com/sigstore/fulcio"
license = "Apache-2.0"
tier = "3"

[build]
base_image = "debian:bookworm-slim"
runtime_image = "scratch"
arch = "amd64"

[download]
url = "https://github.com/sigstore/fulcio/releases/download/v1.8.5/fulcio-linux-amd64"
binary_name = "fulcio"
filename = "fulcio-linux-amd64"
checksum = "PENDING"

[constraints]
nonroot = true
scratch = true

[ports]
application = 5555
metrics = 9101

[labels]
"org.opencontainers.image.title" = "fulcio"
"org.opencontainers.image.description" = "Fulcio - certificate authority for Sigstore"
"org.opencontainers.image.version" = "1.8.5"
"org.opencontainers.image.vendor" = "Sigstore"
"org.opencontainers.image.source" = "https://github.com/sigstore/fulcio"
"sovereign.image.tier" = "3"
"sovereign.constraint.nonroot" = "true"
"sovereign.constraint.scratch" = "true"
"sovereign.base.image" = "scratch"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.shutdown-timeout" = "3s"
