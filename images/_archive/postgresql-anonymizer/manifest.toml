[metadata]
tier = "standard"
name = "postgresql-anonymizer"
version = "1.2.0"
description = "PostgreSQL Anonymizer - Data Anonymization Extension"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["python3", "-m", "postgresql_anonymizer"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "PostgreSQL Anonymizer - Data Anonymization Extension"
"org.opencontainers.image.source" = "https://github.com/Dalibo/postgresql_anonymizer"
"org.opencontainers.image.title" = "postgresql-anonymizer"
"org.opencontainers.image.vendor" = "Dalibo"
"org.opencontainers.image.version" = "1.2.0"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard"
"evergreen.metrics.native" = "ztunnel"
