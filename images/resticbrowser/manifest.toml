[metadata]
name = "resticbrowser"
version = "0.3.0"
description = "resticbrowser container image"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "docker-image"
url = "debian:bookworm-slim"

[runtime]
entrypoint = ["/resticbrowser"]

[ports]
expose = [9876, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/emuell/resticbrowser"
"org.opencontainers.image.title" = "resticbrowser"
"org.opencontainers.image.vendor" = "ResticBrowser"
"org.opencontainers.image.version" = "${VERSION}"
"sovereign.base.image" = "scratch"
"sovereign.constraint.base" = "scratch"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "5s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "10000ms"
"sovereign.image.category" = "cloud-storage"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

