[metadata]
tier = "standard"
name = "npm-audit"
version = "unknown"
description = "npm audit wrapper"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["npm"]
cmd = ["audit"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "npm audit wrapper"
"org.opencontainers.image.title" = "npm-audit"
"org.opencontainers.image.vendor" = "npm"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "standard""evergreen.metrics.native" = "ztunnel"
