[metadata]
name = "nextcloud"
version = "30.0.5"
description = "Nextcloud - self-hosted productivity platform"
vendor = "Nextcloud"
source = "https://github.com/nextcloud/server"
license = "Apache-2.0"
tier = "3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://github.com/nextcloud/nextcloud/releases/download/v30.0.5/nextcloud-30.0.5-linux-amd64.tar.gz"

[runtime]
entrypoint = ["php-fpm8.4"]

[ports]
expose = [80, 9101]

[labels]
"org.opencontainers.image.source" = "https://github.com/nextcloud/server"
"org.opencontainers.image.title" = "nextcloud"
"org.opencontainers.image.vendor" = "Nextcloud"
"org.opencontainers.image.version" = "30.0.5"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.base" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "10s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "30000ms"
"sovereign.image.category" = "cloud-storage"
"sovereign.image.status" = "functional"
"sovereign.image.tier" = "2"
"sovereign.metrics.native" = "ztunnel"

