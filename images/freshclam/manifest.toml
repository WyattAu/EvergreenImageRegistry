[metadata]
tier = "standard"
name = "freshclam"
version = "unknown"
description = "FreshClam - ClamAV database updater"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["freshclam"]
cmd = ["--daemon"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "FreshClam - ClamAV database updater"
"org.opencontainers.image.title" = "freshclam"
"org.opencontainers.image.vendor" = "Cisco"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

