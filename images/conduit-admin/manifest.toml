[metadata]
name = "conduit-admin"
version = "0.9.5"
description = "Conduit Admin - Conduit Matrix homeserver with admin utilities"
vendor = "Famedly"
source = "https://gitlab.com/famedly/conduit"
category = "messaging"
tier = "2"

[build]
base = "wolfi"
arch = "amd64"

[download]
url = "https://gitlab.com/api/v4/projects/famedly%2Fconduit/packages/generic/conduit-v0.9.x/v0.9.5/conduit-x86_64-unknown-linux-musl"
filename = "conduit-x86_64-unknown-linux-musl"
strip_components = 0
binary_name = "conduit"

[container]
port = 6167
metrics_port = 9101
user = "65532:65532"
workdir = "/app"
entrypoint = ["/usr/local/bin/conduit"]
stop_signal = "SIGTERM"
nonroot = true

[labels]
"org.opencontainers.image.title" = "conduit-admin"
"org.opencontainers.image.description" = "Conduit Admin - Conduit Matrix homeserver with admin utilities"
"org.opencontainers.image.vendor" = "Famedly"
"org.opencontainers.image.source" = "https://gitlab.com/famedly/conduit"
"org.opencontainers.image.version" = "0.9.5"
"sovereign.image.tier" = "2"
"sovereign.constraint.nonroot" = "true"
"sovereign.base.image" = "wolfi"
"sovereign.metrics.native" = "ztunnel"
"sovereign.health.type" = "exec"
