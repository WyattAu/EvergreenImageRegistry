[metadata]
name = "rkhunter"
version = "unknown"
description = "rkhunter - rootkit hunter"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["rkhunter"]
cmd = ["--check", "--skip-keypress"]

[ports]
expose = [9101]

[labels]
"org.opencontainers.image.description" = "rkhunter - rootkit hunter"
"org.opencontainers.image.title" = "rkhunter"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "3"
"evergreen.metrics.native" = "ztunnel"

