[metadata]
name = "redis7"
version = "7.4.1"
description = "redis7 container image"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "redis:redis"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["redis"]

[ports]
expose = [6379, 9101]

[labels]
"org.opencontainers.image.title" = "redis7"
"org.opencontainers.image.vendor" = "Redis"
"org.opencontainers.image.version" = "7.4.1"
"sovereign.base.image" = "wolfi"
"sovereign.constraint.nonroot" = "true"
"sovereign.health.type" = "exec"
"sovereign.hft.init-system" = "none"
"sovereign.hft.shutdown-timeout" = "3s"
"sovereign.hft.signal-handling" = "native"
"sovereign.hft.startup-timeout" = "3000ms"
"sovereign.image.tier" = "1"
"sovereign.metrics.native" = "ztunnel"

