[metadata]
name = "forgejo"
version = "12.0.3"
description = "Forgejo - community-owned lightweight software forge"
vendor = "Forgejo"
source = "https://github.com/forgejo/forgejo"
license = "Apache-2.0"
tier = "critical"
upstream_version = "12.0.3"

[build]
base = "cgr.dev/chainguard/wolfi-base:latest"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"
url = "https://code.forgejo.org/forgejo/forgejo/releases/download/v12.0.3/forgejo-12.0.3-linux-amd64.tar.gz"

[runtime]
entrypoint = ["/usr/local/bin/forgejo"]

[ports]
expose = [3000, 22, 9101]

[labels]
"org.opencontainers.image.title" = "forgejo"
"org.opencontainers.image.vendor" = "Forgejo"
"org.opencontainers.image.version" = "12.0.3"
"evergreen.base.image" = "wolfi"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.wolfi" = "true"
"evergreen.health.type" = "exec"
"evergreen.image.tier" = "critical"
"evergreen.metrics.native" = "ztunnel"
