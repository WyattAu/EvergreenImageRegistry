[metadata]
name = "meshbird"
version = "0.4.0"
deprecated = true
description = "Distributed private networking mesh VPN"

[build]
base = "scratch"
user = "65532:65532"
stopsignal = "SIGTERM"

[source]
type = "package-manager"

[runtime]
entrypoint = ["/meshbird"]

[ports]
expose = [10500, 9101]

[labels]
"org.opencontainers.image.description" = "Distributed private networking mesh VPN"
"org.opencontainers.image.source" = "https://github.com/meshbird/meshbird"
"org.opencontainers.image.title" = "meshbird"
"org.opencontainers.image.vendor" = "Meshbird"
"org.opencontainers.image.version" = "0.4.0"
"evergreen.base.image" = "scratch"
"evergreen.constraint.nonroot" = "true"
"evergreen.constraint.scratch" = "true"
"evergreen.health.type" = "exec"
"evergreen.hft.init-system" = "none"
"evergreen.hft.shutdown-timeout" = "3s"
"evergreen.hft.signal-handling" = "native"
"evergreen.hft.startup-timeout" = "3000ms"
"evergreen.image.category" = "networking"
"evergreen.image.status" = "functional"
"evergreen.image.tier" = "1"
"evergreen.metrics.native" = "ztunnel"

